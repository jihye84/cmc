", "비발디의 협주곡집 「조화의 영감」에 실린 여덟 번째 곡으로, 두 대의 바이올린과 현악 합주를 위한 협주곡입니다. 이 달 초에 들었던 네 대의 바이올린을 위한 협주곡과 같은 곡집에 실려 있지요. 이 협주곡은 비발디의 협주곡 가운데서도 특히 극적이고 강렬한 곡으로 꼽힙니다. 1악장은 오케스트라 전체가 단조의 힘차고 날카로운 주제를 내리치며 시작하는데, 이 주제는 악장 곳곳에서 되풀이되며 곡 전체를 이끕니다. 그 사이사이 두 대의 바이올린이 번갈아 가며, 또는 함께 화려하고 빠른 독주를 펼치지요. 마치 두 검객이 날렵하게 칼을 주고받는 듯한 긴장감이 넘칩니다. 2악장은 분위기가 완전히 바뀌어, 두 대의 바이올린이 낮은 음역의 단순한 반주 위에서 고요하고 애틋한 노래를 함께 부릅니다. 3악장은 다시 강렬하고 활기찬 분위기로 돌아와, 두 바이올린이 숨 가쁘게 경쟁하며 힘차게 마무리됩니다. 바흐는 이 협주곡에 큰 감명을 받아, 이 곡을 오르간 한 대로 연주할 수 있도록 편곡하기도 했습니다. 늦여름의 무더위를 잊게 하는 강렬한 바로크의 에너지를 느껴 보세요."], ["8-29", "신포니아 콘체르탄테 K.364", "모차르트", "협주곡", "일반", "바이올린과 비올라의 대화", "모차르트가 1779년에 쓴 바이올린과 비올라, 관현악을 위한 작품입니다. '신포니아 콘체르탄테'는 교향곡처럼 오케스트라가 중심이 되면서도, 여러 독주 악기가 협주곡처럼 활약하는 형식을 말합니다. 그 전해에 모차르트는 일자리를 찾아 어머니와 함께 파리로 갔다가, 그곳에서 어머니를 잃는 큰 슬픔을 겪었습니다. 빈손으로 고향 잘츠부르크에 돌아온 뒤 쓴 이 곡에는 그 깊은 슬픔과 성숙함이 담겨 있습니다. 모차르트는 비올라를 무척 좋아해서, 실내악을 연주할 때 직접 비올라를 맡곤 했습니다. 이 곡에서 그는 비올라의 줄을 원래보다 반음 높게 조율하도록 해, 비올라가 바이올린 못지않게 밝고 또렷한 소리를 낼 수 있게 했습니다. 1악장은 오케스트라의 장엄하고 당당한 서주에 이어 바이올린과 비올라가 함께 등장해 우아한 대화를 나눕니다. 2악장은 단조로 바뀌어, 두 악기가 깊은 슬픔과 탄식을 주고받는 가슴 아픈 노래를 부르는데, 어머니를 잃은 모차르트의 마음이 담겨 있다는 해석도 있습니다. 3악장은 밝고 경쾌하게 마무리됩니다. 두 악기가 나누는 깊은 대화에 귀 기울여 보세요."], ["8-30", "환상곡 C장조 Op.17", "슈만", "독주", "일반", "클라라를 향한 낭만", "슈만이 1836년부터 1838년 사이에 쓴 피아노곡입니다. 이 무렵 슈만은 피아노 스승의 딸 클라라와 사랑에 빠졌지만, 클라라의 아버지가 두 사람의 결혼을 강하게 반대해 오랫동안 만나지도 못하고 편지조차 주고받기 어려운 고통스러운 시기를 보내고 있었습니다. 슈만은 클라라에게 보낸 편지에서 이 곡의 1악장이 그녀를 향한 깊은 탄식이라고 고백했습니다. 악보 첫머리에는 독일 시인 슐레겔의 시 \"온갖 소리 사이로, 대지의 알록달록한 꿈속에서, 은밀히 귀 기울이는 이에게 하나의 조용한 음이 울린다\"는 구절이 적혀 있는데, 그 '조용한 음'은 바로 클라라를 가리킨다고 여겨집니다. 1악장은 열정과 그리움이 격렬하게 소용돌이치며, 끝부분에서는 베토벤의 가곡 「멀리 있는 연인에게」의 선율이 살며시 인용되어 이별의 아픔을 드러냅니다. 2악장은 힘차고 당당한 행진곡이고, 3악장은 고요하고 꿈결 같은 명상 속에서 깊은 사랑의 노래로 끝을 맺습니다. 이 곡은 원래 본에 베토벤 기념비를 세우는 데 보탬이 되려는 뜻에서 구상되었으며, 리스트에게 헌정되었습니다. 사랑의 그리움이 담긴 음악을 들어 보세요."], ["8-31", "서주와 알레그로 Op.47", "엘가", "관현악", "여름", "여름의 끝", "영국의 작곡가 엘가가 1905년에 쓴 현악곡입니다. 이 곡은 현악 4중주와 현악 합주가 함께 연주하는 독특한 편성으로, 네 명의 독주자가 오케스트라와 대화를 나누며 음악을 이끌어 갑니다. 엘가는 몇 해 전 웨일스 해안에서 휴가를 보내던 중, 멀리서 사람들이 부르는 노랫소리를 들었습니다. 정확한 노래 가사도 들리지 않을 만큼 먼 곳에서 들려온 그 노래의 소박하고 애틋한 선율이 엘가의 마음에 깊이 남았고, 그는 그 선율을 바탕으로 이 곡의 중요한 주제를 만들었습니다. 그래서 이 주제는 '웨일스의 선율'이라고도 불립니다. 곡은 현악기 전체가 힘차고 웅장한 화음으로 시작하고, 이어 비올라가 그 애틋한 웨일스 선율을 처음으로 노래합니다. 이후 현악 4중주와 현악 합주가 주고받으며 다양한 주제들이 펼쳐지고, 중간에는 여러 성부가 차례로 같은 주제를 쫓아가는 활기찬 푸가가 등장합니다. 그리고 마지막에는 웨일스 선율이 오케스트라 전체의 웅장하고 벅찬 울림으로 다시 돌아와 장엄하게 끝을 맺습니다. 여름이 끝나 가는 8월의 마지막 날, 멀리서 들려오는 노랫소리를 떠올리며 들어 보세요."], ["9-1", "카논 D장조", "파헬벨", "실내악", "기념일", "파헬벨 세례일(1653.9.1)", "1653년 9월 1일 독일 뉘른베르크에서 세례를 받은 요한 파헬벨의 작품입니다. 파헬벨은 당대에 이름난 오르가니스트로, 바흐의 큰형을 가르쳐 바흐 집안에도 영향을 주었습니다. 이 곡은 원래 세 대의 바이올린과 통주저음을 위한 곡으로, 「카논과 지그」라는 짝을 이룬 작품의 앞부분입니다. '카논'은 한 성부가 시작한 선율을 다른 성부가 일정한 간격을 두고 똑같이 따라가는 돌림노래 형식입니다. 곡은 처음부터 끝까지 여덟 개의 음으로 된 짧은 저음 선율이 스물여덟 번이나 반복되는데, 그 위에서 세 대의 바이올린이 차례로 같은 선율을 이어받으며 점점 화려하고 풍성한 변주를 쌓아 갑니다. 놀랍게도 이 곡은 오랫동안 잊혀 있다가, 1960년대 말 프랑스의 한 실내악단이 녹음한 음반이 크게 인기를 끌면서 갑자기 세계적인 명곡이 되었습니다. 지금은 결혼식 음악으로 가장 사랑받는 곡이며, 수많은 대중가요가 이 곡의 화음 진행을 빌려 쓰고 있습니다. 가을의 문을 여는 9월의 첫날, 끝없이 이어지는 아름다운 돌림노래를 들어 보세요."], ["9-2", "사계 Op.37 중 「9월: 사냥」", "차이콥스키", "독주", "계절 표제", "표제 자체가 9월", "차이콥스키의 피아노 모음곡 「사계」 가운데 9월의 곡입니다. 러시아에서 가을은 귀족들이 말을 타고 사냥개를 앞세워 숲과 들판으로 사냥을 떠나는 계절이었습니다. 이 곡에는 푸시킨의 시에서 따온, 때가 되었으니 사냥 나팔이 울리고, 사냥꾼들이 이른 새벽부터 말에 오르며, 사냥개들이 줄을 당기며 뛰어오른다는 내용의 구절이 붙어 있습니다. 곡은 사냥 나팔 소리를 흉내 낸 힘차고 당당한 화음으로 시작합니다. 이어 말을 달려 숲을 가로지르는 사냥꾼들과 짖으며 앞장서 달리는 사냥개들의 모습이 경쾌하고 박력 넘치는 리듬으로 펼쳐지지요. 가운데 부분에서는 분위기가 잠시 바뀌어, 사냥감을 찾아 조용히 숲속을 살피는 듯한 긴장감이 흐릅니다. 그리고 다시 힘찬 사냥 나팔 소리와 함께 처음의 활기찬 분위기로 돌아와, 멀리 사라져 가는 사냥 행렬처럼 마무리됩니다. 「사계」 가운데 가장 씩씩하고 남성적인 곡으로 꼽힙니다. 서늘한 가을바람이 불기 시작하는 9월, 러시아의 숲으로 사냥을 떠나는 상상을 하며 들어 보세요."], ["9-3", "피아노 소나타 8번 「비창」 Op.13", "베토벤", "독주", "가을", "초가을 서정(2악장)", "베토벤이 스물일곱 살 무렵인 1798년에 쓴 피아노 소나타입니다. 「비창」이라는 제목은 '크고 비통한 소나타'라는 뜻으로, 베토벤 자신이 출판할 때 붙인 몇 안 되는 제목 가운데 하나입니다. 이 무렵 베토벤은 빈에서 뛰어난 피아니스트로 이름을 떨치고 있었지만, 이미 청력에 이상을 느끼기 시작했다고 합니다. 1악장은 무겁고 비극적인 화음이 천천히 울리는 장엄한 서주로 시작해, 곧 폭풍처럼 격렬하고 빠른 음악으로 몰아칩니다. 이 곡에서 가장 유명한 2악장 아다지오 칸타빌레는 '노래하듯 느리게'라는 뜻처럼, 피아노가 따뜻하고 고요한 선율을 깊이 있게 노래합니다. 이 선율은 수많은 영화와 광고, 대중가요에 쓰여 누구나 한 번쯤 들어 보았을 만큼 친숙하지요. 슬픔을 위로하는 듯한 이 선율은 들을 때마다 마음을 차분하게 가라앉혀 줍니다. 3악장은 다시 단조의 애수 어린 론도로 돌아와, 긴장감 넘치게 펼쳐지다가 힘차게 끝을 맺습니다. 젊은 베토벤의 열정과 깊은 서정이 함께 담긴 곡입니다. 여름이 지나고 마음이 차분해지는 초가을에 들어 보세요."], ["9-4", "교향곡 4번 「로맨틱」", "브루크너", "관현악", "기념일", "브루크너 탄생일(1824.9.4)", "1824년 9월 4일 오스트리아 린츠 근교의 작은 마을에서 태어난 안톤 브루크너의 교향곡입니다. 브루크너는 시골 학교 교사의 아들로 태어나 오랫동안 교회 오르가니스트로 일했고, 마흔이 넘어서야 본격적으로 교향곡을 쓰기 시작했습니다. 그는 소박하고 신앙심 깊은 사람이었으며, 평생 자신의 작품을 여러 번 고쳐 쓰는 것으로도 유명했습니다. 이 교향곡도 1874년에 처음 완성한 뒤 여러 차례 고쳤고, 1881년 빈에서 초연되어 그의 작품 가운데 처음으로 큰 성공을 거두었습니다. '로맨틱'이라는 부제는 브루크너 자신이 붙인 것으로, 그는 이 곡이 중세의 도시와 성, 새벽에 말을 타고 숲으로 떠나는 기사들의 모습을 그린다고 설명하기도 했습니다. 1악장은 현악기의 고요한 떨림 위로 호른이 멀리서 들려오는 나팔처럼 신비로운 선율을 울리며 시작하는데, 마치 숲속에서 새벽이 밝아 오는 듯합니다. 3악장은 사냥 나팔 소리가 울려 퍼지는 활기찬 사냥의 음악입니다. 거대한 성당처럼 웅장하고 장엄한 브루크너의 소리를 느껴 보세요."], ["9-5", "피아노 3중주 1번 d단조 Op.49", "멘델스존", "실내악", "가을", "초가을 실내악", "멘델스존이 1839년에 쓴 첫 번째 피아노 3중주곡입니다. 이 곡을 들은 슈만은 자신이 펴내던 음악 잡지에 이 곡을 \"베토벤 이후 가장 위대한 피아노 3중주\"라고 극찬하며, 멘델스존을 \"19세기의 모차르트\"라고 불렀습니다. 피아노, 바이올린, 첼로가 함께 연주하는 이 곡은 지금도 피아노 3중주 가운데 가장 사랑받는 작품입니다. 1악장은 피아노의 물결치는 반주 위로 첼로가 깊고 애수 어린 선율을 노래하며 시작하는데, 이 선율은 바이올린으로 이어지며 점점 열정적으로 고조됩니다. 2악장은 피아노가 마치 무언가처럼 소박하고 따뜻한 노래를 들려주고, 현악기들이 다정하게 이를 이어받는 고요한 악장입니다. 3악장은 멘델스존 특유의 '요정의 스케르초'로, 아주 가볍고 빠른 음표들이 속삭이듯 날아다닙니다. 4악장은 다시 단조의 정열적인 분위기로 시작해, 마지막에는 밝고 찬란한 장조로 바뀌어 힘차게 마무리됩니다. 우아함과 열정, 그리고 서정이 완벽하게 균형을 이룬 곡입니다. 가을의 문턱에서 세 악기가 나누는 아름다운 대화에 귀 기울여 보세요."], ["9-6", "피아노 4중주 1번 g단조 Op.25", "브람스", "실내악", "가을", "가을은 브람스의 계절", "브람스가 스물여덟 살이던 1861년에 완성한 피아노 4중주곡입니다. 피아노, 바이올린, 비올라, 첼로가 함께 연주하는 이 곡은 클라라 슈만의 피아노 연주로 처음 공개되었고, 이듬해 브람스가 빈에 진출하며 연 첫 연주회에서도 연주되어 그의 이름을 빈 음악계에 알렸습니다. 가을이면 유독 브람스의 음악이 생각난다는 사람이 많은데, 그의 음악에 담긴 깊은 서정과 쓸쓸함, 그리고 따뜻한 위로가 서늘한 계절과 잘 어울리기 때문일 것입니다. 1악장은 피아노가 홀로 어둡고 진지한 주제를 연주하며 시작해, 장대하고 극적으로 펼쳐집니다. 2악장은 신비롭고 불안한 분위기의 간주곡이고, 3악장은 넉넉하고 따뜻한 선율이 흐르다가 가운데 부분에서 행진곡처럼 당당해집니다. 이 곡에서 가장 유명한 것은 4악장 '집시풍 론도'입니다. 헝가리 집시 음악의 정열적이고 거친 리듬이 숨 가쁘게 몰아치며 열광적인 춤판을 벌이지요. 훗날 작곡가 쇤베르크는 이 곡을 관현악곡으로 편곡하며 '브람스의 교향곡 5번'이라는 별명을 붙였습니다. 가을의 시작, 브람스와 함께해 보세요."], ["9-7", "첼로 협주곡 e단조 Op.85", "엘가", "협주곡", "가을", "'가을빛 협주곡'으로 불리는 곡", "영국의 작곡가 엘가가 1차 세계대전이 끝난 직후인 1918년부터 이듬해 사이에 쓴 첼로 협주곡으로, 그의 마지막 대작입니다. 이 무렵 엘가는 수술을 받고 건강이 나빠져, 영국 남부 서식스의 숲속 오두막에서 요양하며 이 곡을 썼습니다. 전쟁으로 많은 젊은이를 잃은 슬픔, 사라져 버린 옛 시대에 대한 그리움, 그리고 자신의 노년에 대한 쓸쓸함이 이 곡에 짙게 배어 있습니다. 그래서 이 곡은 '가을빛 협주곡'이라 불리기도 합니다. 곡은 첼로가 홀로 비통한 화음을 힘차게 울리며 시작하고, 이어 비올라가 애수 어린 주제를 조용히 노래합니다. 첼로가 이 주제를 이어받아 깊은 슬픔을 토해 내듯 노래하는 1악장은 한 번 들으면 잊히지 않는 강렬한 인상을 남깁니다. 3악장 아다지오는 짧지만 깊고 고요한 슬픔이 담긴 노래입니다. 1919년 초연은 준비 부족으로 실패했지만, 1960년대 젊은 첼리스트 재클린 뒤 프레의 녹음으로 세계적인 명곡이 되었습니다. 뒤 프레는 이후 병으로 스물여덟 살에 연주를 그만두어야 했지요. 깊어 가는 가을의 쓸쓸함을 느껴 보세요."], ["9-8", "현악 세레나데 E장조 Op.22", "드보르자크", "관현악", "기념일", "드보르자크 탄생일(1841.9.8)", "1841년 9월 8일 체코 보헤미아에서 태어난 드보르자크가 1875년, 불과 11일 만에 완성한 현악 합주곡입니다. 이 무렵 드보르자크는 가난한 오르가니스트로 생계를 꾸리며 작곡을 하고 있었는데, 오스트리아 정부가 주는 장학금을 받게 되면서 처음으로 경제적인 여유를 얻었습니다. 이 장학금의 심사위원 가운데에는 브람스가 있었고, 드보르자크의 재능을 알아본 브람스는 이후 그를 출판사에 소개하는 등 평생 그를 도왔습니다. 결혼한 지 얼마 되지 않았고 첫아들도 태어나 행복했던 시기라, 이 곡에는 밝고 따뜻한 기운이 가득합니다. 곡은 다섯 악장으로 이루어져 있습니다. 1악장은 첼로와 바이올린이 주고받는 부드럽고 평화로운 노래로 시작하고, 2악장은 우아하고 애수 어린 왈츠입니다. 3악장은 경쾌하고 활기찬 스케르초이고, 4악장은 깊고 서정적인 느린 악장, 5악장은 보헤미아의 민속춤처럼 흥겨운 피날레입니다. 마지막에는 1악장의 주제가 다시 돌아와 곡 전체를 따뜻하게 감싸 안습니다. 드보르자크의 생일을 축하하며, 현악기가 들려주는 행복의 노래를 들어 보세요."], ["9-9", "연습곡 「이별의 곡」 Op.10-3", "쇼팽", "독주", "가을", "가을 서정", "쇼팽이 1832년에 쓴 열두 곡의 연습곡 작품 10 가운데 세 번째 곡입니다. 쇼팽의 연습곡은 손가락의 기술을 익히기 위한 곡이면서도, 그 자체로 아름다운 음악이어서 연주회 무대에서도 자주 연주됩니다. 이 곡은 오른손이 선율과 반주를 동시에 연주하며 깊은 소리를 내는 기술을 익히기 위한 곡인데, 쇼팽은 제자에게 \"이보다 더 아름다운 선율은 써 본 적이 없다\"고 말했다고 합니다. 우리나라와 일본에서는 흔히 「이별의 곡」으로 불리는데, 이 곡을 쓰던 무렵 쇼팽이 조국 폴란드와 고향의 가족, 그리고 사랑했던 이들과 이별한 지 얼마 되지 않았기 때문에 이런 별명이 붙었다고 여겨집니다. 곡은 오른손이 고요하고 애틋한 선율을 천천히 노래하며 시작하는데, 떠나온 고향을 그리워하는 듯한 깊은 슬픔과 따뜻함이 함께 담겨 있습니다. 가운데 부분에서는 분위기가 급격히 바뀌어, 격렬하고 불안한 화음이 폭풍처럼 몰아치며 고조됩니다. 그리고 다시 처음의 고요한 선율로 돌아와, 아련한 여운을 남기며 조용히 끝을 맺습니다. 그리운 사람을 떠올리며 들어 보세요."], ["9-10", "교향곡 2번 e단조 Op.27", "라흐마니노프", "관현악", "가을", "가을밤의 낭만(3악장 아다지오)", "라흐마니노프가 1906년부터 이듬해 사이, 독일 드레스덴에 머물며 쓴 교향곡입니다. 라흐마니노프는 젊은 시절 발표한 교향곡 1번이 참담하게 실패한 뒤 깊은 우울증에 빠졌고, 그 뒤로 교향곡을 쓰는 것을 오랫동안 두려워했습니다. 피아노 협주곡 2번의 성공으로 자신감을 되찾은 뒤에야 그는 다시 교향곡에 도전했고, 1908년 상트페테르부르크에서 직접 지휘해 초연한 이 곡은 큰 성공을 거두었습니다. 10여 년 만에 첫 교향곡의 상처를 씻어 낸 것이지요. 1악장은 어둡고 신비로운 서주로 시작해 낭만적이고 웅장하게 펼쳐지고, 2악장은 힘차게 질주하는 스케르초입니다. 이 교향곡에서 가장 사랑받는 것은 3악장 아다지오입니다. 현악기의 부드러운 화음에 이어 클라리넷이 홀로 길고 아름다운 선율을 꿈결처럼 노래하는데, 이 선율은 라흐마니노프가 쓴 가장 아름다운 선율 가운데 하나로 꼽히며 대중가요에도 쓰였습니다. 4악장은 축제처럼 밝고 찬란하게 마무리됩니다. 한 시간 가까운 긴 곡이지만, 가을밤 깊은 낭만에 젖어 들기에 이보다 좋은 곡은 없을 것입니다."], ["9-11", "벤저민 브리튼을 추모하는 칸투스", "패르트", "관현악", "추모", "패르트 탄생일(1935.9.11), 9·11 추모", "1935년 9월 11일 에스토니아에서 태어난 아르보 패르트가 1977년에 쓴 곡입니다. 패르트는 영국의 작곡가 벤저민 브리튼의 음악에서 드문 순수함을 느끼며 깊이 존경했지만, 그를 직접 만나지는 못했습니다. 1976년 12월 브리튼이 세상을 떠났다는 소식을 들은 패르트는 그를 만나지 못한 아쉬움과 슬픔을 담아 이 곡을 썼습니다. 곡은 종 하나가 세 번씩 조용히 울리는 것으로 시작합니다. 이어 현악기들이 같은 하강 음계를 연주하기 시작하는데, 높은 음역의 악기는 빠르게, 낮은 음역의 악기로 갈수록 점점 더 느리게 연주합니다. 서로 다른 속도로 내려가는 선율들이 겹겹이 쌓이며 거대한 소리의 물결을 이루고, 그 소리는 점점 커져 마침내 하나의 화음으로 모인 뒤 갑자기 멈춥니다. 그리고 그 침묵 속에 마지막 종소리가 여운처럼 남습니다. 7분 남짓한 짧은 곡이지만, 단순한 재료로 만들어 낸 깊은 슬픔과 숭고함이 듣는 이의 마음을 울립니다. 오늘은 2001년 미국에서 일어난 9·11 테러로 희생된 이들을 기억하는 날이기도 합니다. 고요한 마음으로 추모하며 들어 보세요."], ["9-12", "엘리제를 위하여", "베토벤", "독주", "일반", "친숙한 명곡", "베토벤이 1810년 무렵 쓴 피아노 소품으로, 그의 작품 가운데 가장 유명한 곡 가운데 하나입니다. 그런데 이 곡은 베토벤의 생전에는 출판되지 않았고, 그가 세상을 떠나고 40년이 지난 1867년에 한 음악학자가 악보를 발견해 출판하면서 세상에 알려졌습니다. 악보에는 '엘리제를 위하여, 4월 27일, 기념으로'라는 글이 적혀 있었다고 합니다. 그렇다면 엘리제는 누구일까요? 이 수수께끼는 지금도 완전히 풀리지 않았습니다. 베토벤이 청혼했던 제자 테레제 말파티의 이름을 악보를 옮겨 적던 사람이 잘못 읽어 '엘리제'가 되었다는 설이 가장 유명하고, 베토벤과 가까웠던 소프라노 가수 엘리자베트라는 설도 있습니다. 원본 악보는 사라져 확인할 길이 없지요. 곡은 오른손이 두 음을 번갈아 오가는 애틋하고 사랑스러운 선율로 시작합니다. 가운데 부분에서는 밝고 다정한 선율과 어둡고 긴장감 있는 부분이 차례로 나타났다가, 다시 처음의 사랑스러운 선율로 돌아옵니다. 피아노를 배우는 사람이라면 누구나 한 번쯤 치고 싶어 하는 곡이지요. 수수께끼의 주인공을 상상하며 들어 보세요."], ["9-13", "정화된 밤 Op.4", "쇤베르크", "실내악", "기념일", "쇤베르크 탄생일(1874.9.13)", "1874년 9월 13일 빈에서 태어난 아르놀트 쇤베르크가 스물다섯 살이던 1899년에 쓴 작품입니다. 쇤베르크는 훗날 열두 음을 모두 고르게 사용하는 '12음 기법'을 만들어 20세기 음악의 흐름을 바꾼 작곡가인데, 이 곡은 그가 아직 낭만주의의 풍성한 화음으로 곡을 쓰던 시절의 작품입니다. 이 곡은 독일 시인 데멜의 시 「정화된 밤」을 바탕으로 합니다. 달빛이 비치는 차가운 숲속을 한 남자와 여자가 함께 걷고 있습니다. 여자는 떨리는 목소리로 자신이 다른 남자의 아이를 가졌다고 고백하지요. 긴 침묵 끝에 남자는 그녀를 따뜻하게 감싸 안으며, 그 아이를 우리의 아이로 받아들이겠다고 말합니다. 그 순간 차갑던 밤은 사랑으로 변화되어 빛나는 밤이 됩니다. 곡은 이 이야기의 흐름을 따라, 여자의 고통스러운 고백을 어둡고 불안한 음악으로, 남자의 너그러운 사랑을 따뜻하고 찬란한 음악으로 그려 냅니다. 원래는 현악 6중주곡이었지만, 쇤베르크가 현악 합주곡으로 편곡한 버전도 자주 연주됩니다. 쇤베르크의 생일, 사랑으로 변화된 밤을 느껴 보세요."], ["9-14", "피아노 협주곡 20번 d단조 K.466", "모차르트", "협주곡", "가을", "어둡고 깊어지는 가을", "모차르트가 1785년 2월에 완성한 피아노 협주곡으로, 그가 남긴 스물일곱 곡의 피아노 협주곡 가운데 처음으로 단조로 쓴 곡입니다. 당시 협주곡은 주로 귀족들의 연주회에서 즐겁고 화려하게 듣는 음악이었는데, 이 곡은 처음부터 어둡고 극적인 긴장감으로 가득 차 있어 듣는 사람들을 놀라게 했습니다. 마침 아들을 만나러 빈에 온 아버지 레오폴트는 이 곡의 초연을 보았는데, 모차르트는 악보를 너무 늦게 완성해 연주자들이 제대로 연습할 시간도 없었다고 합니다. 1악장은 현악기의 낮고 불안한 떨림으로 시작해, 폭풍 전야 같은 어둡고 긴박한 분위기를 자아냅니다. 2악장 '로망스'는 분위기가 완전히 바뀌어, 피아노가 고요하고 사랑스러운 선율을 노래하는데, 이 선율은 영화 「아마데우스」의 마지막 장면에 쓰여 큰 감동을 주었습니다. 3악장은 다시 단조의 격렬한 분위기로 돌아오지만, 마지막에는 밝은 장조로 바뀌어 희망차게 끝을 맺습니다. 베토벤은 이 곡을 무척 좋아해서 이 곡을 위한 카덴차를 직접 쓰기도 했습니다. 깊어 가는 가을, 모차르트의 어두운 얼굴을 만나 보세요."], ["9-15", "교향곡 9번 「그레이트」 D.944", "슈베르트", "관현악", "일반", "슈베르트의 대작", "슈베르트가 1825년부터 이듬해 사이에 쓴 마지막 교향곡입니다. 같은 조성의 짧은 교향곡 6번과 구별하기 위해 '그레이트(위대한)'라는 별명이 붙었는데, 이 이름은 이 곡의 크고 장대한 규모와도 잘 어울립니다. 슈베르트는 이 곡을 빈 음악 협회에 보냈지만, 협회의 오케스트라는 너무 길고 어렵다며 연주를 거절했습니다. 결국 슈베르트는 이 곡이 연주되는 것을 보지 못하고 세상을 떠났습니다. 그로부터 10년이 지난 1838년, 빈을 방문한 슈만이 슈베르트의 형 집에서 먼지 쌓인 이 곡의 악보를 발견했습니다. 감격한 슈만은 악보를 친구 멘델스존에게 보냈고, 이듬해 멘델스존의 지휘로 라이프치히에서 마침내 초연되었습니다. 슈만은 이 곡을 두고 \"천국처럼 끝없는 길이\"라는 유명한 말을 남겼습니다. 1악장은 두 대의 호른이 고요하고 넉넉한 선율을 노래하며 시작해, 웅장하고 힘차게 펼쳐집니다. 2악장은 오보에가 이끄는 행진곡풍의 노래이고, 3악장은 넓은 스케르초, 4악장은 끝없는 에너지로 질주하는 거대한 피날레입니다. 한 시간 가까운 대작에 몸을 맡겨 보세요."], ["9-16", "피아노 소나타 14번 「월광」 Op.27-2", "베토벤", "독주", "가을", "한가위 보름달 무렵", "베토벤이 1801년에 쓴 피아노 소나타로, 그의 작품 가운데 가장 널리 알려진 곡입니다. 베토벤은 이 곡을 사랑하던 제자 줄리에타 귀차르디 백작 영애에게 헌정했습니다. 「월광」이라는 별명은 베토벤이 세상을 떠난 뒤, 독일의 시인이자 음악 비평가인 렐슈타프가 이 곡의 1악장을 두고 \"스위스 루체른 호수의 달빛 아래 흔들리는 작은 배 같다\"고 표현한 데서 비롯되었습니다. 베토벤 자신은 이 곡에 '환상곡풍의 소나타'라는 부제를 붙였습니다. 보통 소나타는 빠른 악장으로 시작하지만, 이 곡은 느리고 고요한 악장으로 시작하는 것이 특징입니다. 1악장은 셋잇단음표의 잔잔한 물결 같은 반주 위로, 깊은 슬픔을 머금은 선율이 천천히 떠오릅니다. 달빛 아래 홀로 생각에 잠긴 사람의 모습이 떠오르지요. 2악장은 짧고 사랑스러운 춤곡으로, 리스트는 이 악장을 두고 '두 심연 사이에 핀 꽃'이라고 표현했습니다. 3악장은 폭풍처럼 격렬하고 빠르게 몰아치며 앞의 고요함과 극적인 대비를 이룹니다. 한가위 보름달이 떠오르는 무렵, 달빛 아래에서 이 곡을 들어 보세요."], ["9-17", "예악(禮樂, Réak)", "윤이상", "관현악", "기념일", "윤이상 탄생일(1917.9.17)", "1917년 9월 17일 경상남도 통영에서 태어난 작곡가 윤이상의 관현악곡입니다. 윤이상은 독일에서 활동하며 한국의 전통 음악과 서양의 현대 음악을 결합한 독창적인 음악 세계를 펼쳐, 20세기를 대표하는 작곡가 가운데 한 명으로 평가받았습니다. 1966년 독일의 도나우에싱엔 현대 음악제에서 초연된 이 곡은 그의 이름을 유럽 음악계에 널리 알린 작품입니다. 제목 「예악」은 조선 시대 궁중에서 예법과 음악이 하나 되어 나라의 질서를 바로 세운다는 뜻으로, 윤이상은 서양의 오케스트라로 한국 궁중음악의 소리를 그려 내고자 했습니다. 그는 서양 음악처럼 여러 음으로 선율을 만드는 대신, 하나의 음을 길게 이어 가며 그 음을 떨고 꺾고 흔들어, 마치 서예가가 붓으로 획 하나에 생명을 불어넣듯 음 하나에 깊은 표정을 담는 방식을 썼습니다. 곡은 우리 궁중음악에서 시작과 끝을 알리는 악기인 '박'의 소리로 시작하고 끝납니다. 그는 고향 통영의 바다를 평생 그리워했고, 지금 통영에서는 그를 기리는 국제 음악제가 열립니다. 그의 생일, 우리의 소리가 담긴 현대 음악을 만나 보세요."], ["9-18", "엘레지 Op.24", "포레", "협주곡", "가을", "첼로의 가을 비가", "프랑스의 작곡가 포레가 1880년에 쓴 첼로곡입니다. 포레는 원래 이 곡을 첼로 소나타의 느린 악장으로 구상했지만, 소나타는 완성하지 못하고 이 악장만 독립된 곡으로 발표했습니다. 처음에는 첼로와 피아노를 위한 곡이었는데, 큰 인기를 얻자 포레는 1890년대에 첼로와 관현악을 위한 버전도 만들었습니다. '엘레지'는 죽은 이를 애도하거나 슬픔을 노래하는 '비가'를 뜻합니다. 곡은 피아노가 무겁고 느린 화음을 장례 행렬의 발걸음처럼 규칙적으로 울리는 가운데, 첼로가 낮은 음역에서 깊은 슬픔을 머금은 선율을 노래하며 시작합니다. 첼로의 굵고 따뜻한 음색이 마치 사람이 흐느끼는 목소리처럼 들리지요. 가운데 부분에서는 분위기가 바뀌어 잠시 따뜻하고 위로가 담긴 선율이 흐르다가, 이내 격정적으로 고조되어 첼로가 높은 음역에서 비통한 울부짖음을 토해 냅니다. 그리고 다시 처음의 슬픈 선율로 돌아와, 깊은 한숨처럼 조용히 잦아듭니다. 7분 남짓한 짧은 곡이지만, 절제된 아름다움 속에 깊은 슬픔이 담겨 있어 첼리스트들이 무척 사랑하는 곡입니다. 낙엽이 지기 시작하는 계절, 첼로의 노래를 들어 보세요."], ["9-19", "스코틀랜드 환상곡 Op.46", "브루흐", "협주곡", "가을", "스코틀랜드 민요의 가을빛", "독일의 작곡가 막스 브루흐가 1880년에 쓴 바이올린과 관현악을 위한 작품입니다. 이 곡은 스페인의 바이올린 거장 사라사테에게 헌정되었습니다. 19세기 유럽에서는 스코틀랜드의 시인이자 소설가인 월터 스콧의 작품들이 큰 인기를 끌면서, 스코틀랜드의 거친 자연과 역사, 민요에 대한 관심이 높아졌습니다. 브루흐도 스코틀랜드 민요의 소박하고 애틋한 선율에 매료되어, 여러 민요를 엮어 이 곡을 썼습니다. 곡은 네 악장으로 이루어져 있고, 각 악장마다 다른 스코틀랜드 민요가 등장합니다. 곡은 금관악기의 어둡고 장중한 서주에 이어, 하프의 반주 위로 바이올린이 애수 어린 민요를 노래하며 시작합니다. 마치 안개 낀 스코틀랜드 고원에서 옛 시인이 하프를 타며 옛이야기를 들려주는 듯하지요. 하프는 이 곡 전체에서 중요한 역할을 맡아, 스코틀랜드의 옛 음유시인을 떠올리게 합니다. 이어 경쾌한 춤곡과 고요한 노래가 펼쳐지고, 마지막 악장에서는 스코틀랜드 사람들의 용맹한 기상을 노래한 민요가 힘차게 울려 퍼지며 화려하게 끝을 맺습니다. 가을빛이 짙어 가는 스코틀랜드 고원을 떠올리며 들어 보세요."], ["9-20", "슬픈 왈츠 Op.44-1", "시벨리우스", "관현악", "기념일", "시벨리우스 서거일(1957.9.20)", "1957년 9월 20일 세상을 떠난 핀란드의 작곡가 시벨리우스가 1903년에 쓴 관현악곡입니다. 원래 이 곡은 그의 처남이 쓴 연극 「죽음」을 위해 작곡한 극음악의 한 곡이었습니다. 연극의 한 장면에서, 병으로 누워 있던 늙은 어머니가 꿈결에 일어나 환상 속의 손님들과 함께 왈츠를 춥니다. 그런데 춤이 점점 격렬해질 즈음, 문을 두드리는 소리가 들리고 손님들은 사라지며, 문 앞에는 죽음이 그녀의 남편 모습으로 서 있습니다. 곡은 현악기가 아주 작고 느린 소리로 쓸쓸한 왈츠를 시작합니다. 마치 꿈인지 현실인지 모를 몽롱한 분위기 속에서 어머니가 천천히 춤을 추는 듯하지요. 왈츠는 점점 빨라지고 격렬해지며 환상의 무도회가 절정에 이르다가, 갑자기 멈추고 다시 쓸쓸한 선율로 돌아와 고요히 사라집니다. 이 곡은 큰 인기를 얻었지만, 시벨리우스는 악보를 출판사에 헐값에 넘겨 큰 수익을 얻지 못했다고 합니다. 시벨리우스는 말년 30년 가까이 거의 작품을 발표하지 않은 채 숲속 집에서 조용히 지내다 세상을 떠났습니다. 북유럽의 거장을 기억하며 들어 보세요."], ["9-21", "행성 Op.32", "홀스트", "관현악", "기념일", "홀스트 탄생일(1874.9.21)", "1874년 9월 21일 영국 첼트넘에서 태어난 구스타브 홀스트가 1914년부터 1916년 사이에 쓴 관현악 모음곡입니다. 홀스트는 점성술에 깊은 관심을 가졌는데, 이 곡은 천문학적인 행성이 아니라, 점성술에서 각 행성이 상징하는 성격과 기운을 음악으로 그려 낸 것입니다. 그래서 우리가 사는 지구는 등장하지 않습니다. 곡은 일곱 곡으로 이루어져 있습니다. 첫 곡 「화성, 전쟁을 가져오는 자」는 5박자의 무겁고 위협적인 리듬이 끝없이 반복되며 전쟁의 공포를 그려 내는데, 이 곡이 1차 세계대전이 일어나기 직전에 작곡되었다는 사실이 섬뜩합니다. 이어 평화를 가져오는 「금성」, 날개 달린 전령 「수성」이 나오고, 「목성, 즐거움을 가져오는 자」에서는 가운데 부분에 장엄하고 아름다운 선율이 흐르는데, 이 선율은 영국에서 애국적인 찬송가로 널리 불리고 있습니다. 이어 노년을 가져오는 「토성」, 마술사 「천왕성」을 지나, 마지막 「해왕성, 신비로운 자」에서는 멀리서 들려오는 노랫소리와 함께 음악이 우주 저편으로 사라지듯 끝납니다. 영화 「스타워즈」의 음악에도 큰 영향을 주었습니다. 가을밤, 별을 바라보며 들어 보세요."], ["9-22", "「사계」 중 「가을」", "비발디", "협주곡", "계절 표제", "추분 무렵", "비발디의 「사계」 가운데 세 번째 곡인 「가을」입니다. 비발디가 그린 가을은 풍성한 수확과 축제, 그리고 사냥의 계절입니다. 곡에 붙은 시에 따르면, 1악장은 농부들이 풍년을 축하하며 노래하고 춤추는 흥겨운 잔치로 시작합니다. 농부들은 바쿠스의 술, 즉 포도주를 마음껏 마시며 즐기다가, 하나둘 비틀거리며 술에 취해 잠들어 버립니다. 바이올린이 술에 취해 비틀거리는 사람처럼 휘청이는 선율을 연주하는 부분은 무척 재미있지요. 2악장 '잠든 술꾼들'은 잔치가 끝나고 모두가 깊이 잠든 고요한 밤을 그립니다. 약음기를 낀 현악기가 길고 부드러운 화음을 이어 가는 가운데, 하프시코드가 잔잔한 화음을 펼치며 서늘하고 평화로운 가을밤의 공기를 전합니다. 3악장은 새벽녘 사냥꾼들이 뿔나팔을 불고 사냥개를 앞세워 사냥을 떠나는 장면입니다. 사냥감은 총소리와 개 짖는 소리에 놀라 도망치다가 결국 지쳐 쓰러지지요. 오늘은 낮과 밤의 길이가 같아지는 추분 무렵입니다. 이제부터 밤이 점점 길어지는 가을, 300년 전 이탈리아의 수확 잔치에 함께해 보세요."], ["9-23", "부에노스아이레스의 가을", "피아졸라", "실내악", "계절 표제", "표제가 가을", "아르헨티나의 작곡가 피아졸라의 「부에노스아이레스의 사계」 가운데 가을을 노래한 곡입니다. 1969년에 쓴 이 곡은 네 곡 가운데 특히 서정적이고 사색적인 분위기가 돋보입니다. 곡은 강렬하고 날카로운 탱고 리듬으로 힘차게 시작하는데, 도시의 바쁜 일상과 사람들의 분주한 발걸음이 느껴집니다. 그러다 곧 분위기가 바뀌어 첼로나 반도네온이 홀로 길고 쓸쓸한 독주를 들려주는데, 마치 가을 저녁 낙엽이 지는 거리를 홀로 걸으며 지난날을 회상하는 듯한 깊은 우수가 담겨 있습니다. 이어 바이올린이 줄 위를 미끄러지듯 연주하며 새가 우는 듯한 독특한 소리를 내기도 하고, 피아노가 애틋하고 서정적인 선율을 노래하기도 합니다. 그리고 다시 강렬한 리듬이 돌아와, 쓸쓸함을 떨쳐 내듯 힘차게 마무리됩니다. 피아졸라의 탱고는 춤을 추기 위한 음악이라기보다, 감상하기 위한 음악으로 탱고를 새롭게 바꾸어 놓았다는 평가를 받습니다. 재미있게도 남반구의 아르헨티나에서는 9월이 봄이지요. 지구 반대편의 가을을 떠올리며, 어제 들은 비발디의 가을과 비교해 들어 보세요."], ["9-24", "발레 「사계」 Op.67 중 「가을」", "글라주노프", "관현악", "계절 표제", "표제가 가을", "러시아의 작곡가 글라주노프의 발레 음악 「사계」 가운데 마지막 장면인 「가을」입니다. 겨울, 봄, 여름을 지나 마침내 찾아온 가을은 이 발레에서 가장 화려하고 흥겨운 장면입니다. 가을은 포도를 수확하는 계절이자, 포도주의 신 바쿠스를 기리는 축제의 계절입니다. 무대 위에서는 사계절의 정령들이 모두 모여 풍성한 수확을 축하하며 춤을 추지요. 이 장면에서 가장 유명한 곡은 「바카날」입니다. 바쿠스의 축제를 그린 이 곡은 힘차고 경쾌한 리듬 위로 오케스트라 전체가 화려하고 열광적인 선율을 쏟아 내며, 축제의 들뜬 기쁨을 생생하게 그려 냅니다. 이 선율은 광고와 방송에도 자주 쓰여 무척 친숙합니다. 이어 가을 잎사귀가 바람에 흩날리는 듯한 부드러운 춤이 펼쳐지고, 마지막에는 밤하늘에 별이 쏟아지며 사계절의 정령들이 모두 함께 어우러지는 장엄하고 찬란한 결말로 막을 내립니다. 글라주노프는 이 발레를 통해 계절이 순환하며 자연이 깨어나고 무르익는 모습을 아름답게 그려 냈습니다. 1월부터 이어 온 「사계」 여행의 마지막 장면을 즐겨 보세요."], ["9-25", "교향곡 5번 d단조 Op.47", "쇼스타코비치", "관현악", "기념일", "쇼스타코비치 탄생일(1906.9.25)", "1906년 9월 25일 러시아 상트페테르부르크에서 태어난 쇼스타코비치의 교향곡입니다. 1936년 소련 공산당 신문은 쇼스타코비치의 오페라를 \"음악 대신 혼란\"이라며 맹렬히 비난했습니다. 당시 스탈린의 공포 정치 아래에서 이런 비판은 목숨이 위태로울 수 있다는 뜻이었고, 실제로 그의 주변 사람들이 하나둘 체포되었습니다. 쇼스타코비치는 매일 밤 가방을 싸 두고 체포를 기다렸다고 합니다. 그런 절망 속에서 1937년 발표한 이 교향곡은 레닌그라드 초연에서 30분 넘게 박수가 이어질 만큼 열광적인 반응을 얻었고, 그는 다시 명예를 되찾았습니다. 한 기자는 이 곡에 '정당한 비판에 대한 소비에트 예술가의 창조적 답변'이라는 설명을 붙이기도 했습니다. 1악장은 비극적이고 긴장감 넘치며, 3악장은 깊은 슬픔이 담긴 느린 악장으로, 초연 때 많은 청중이 이 악장을 들으며 눈물을 흘렸다고 합니다. 4악장은 승리의 행진곡처럼 웅장하게 끝나지만, 그 환희가 진심인지 억지로 강요된 것인지는 지금도 논란이 되고 있습니다. 그의 생일, 억압 속에서 피어난 음악을 들어 보세요."], ["9-26", "피아노를 위한 3개의 전주곡", "거슈윈", "독주", "기념일", "거슈윈 탄생일(1898.9.26)", "1898년 9월 26일 뉴욕 브루클린에서 태어난 조지 거슈윈이 1926년에 발표한 피아노곡입니다. 거슈윈은 원래 스물네 곡의 전주곡을 쓰려고 계획했지만, 실제로 출판된 것은 이 세 곡뿐입니다. 짧은 세 곡은 저마다 개성이 뚜렷해서, 재즈와 클래식이 만나는 거슈윈 음악의 매력을 잘 보여 줍니다. 첫 곡은 블루스풍의 짧은 선율로 시작해, 라틴아메리카의 리듬이 생기 있게 통통 튀는 경쾌한 곡입니다. 둘째 곡은 거슈윈이 '블루스 자장가'라고 불렀던 느리고 나른한 곡으로, 왼손이 일정한 리듬으로 낮은 화음을 짚는 가운데, 오른손이 쓸쓸하고 서정적인 블루스 선율을 노래합니다. 마치 늦은 밤 뉴욕의 재즈 클럽에서 피아니스트가 홀로 연주하는 모습이 떠오르는 듯하지요. 셋째 곡은 다시 활기를 되찾아 스페인풍의 열정적인 리듬으로 힘차게 마무리됩니다. 세 곡을 모두 합쳐도 7분이 채 되지 않는 짧은 곡이지만, 1920년대 미국의 활기와 낭만이 고스란히 담겨 있습니다. 하이페츠가 바이올린으로 편곡하기도 했습니다. 거슈윈의 생일을 맞아, 재즈의 향기가 가득한 피아노곡을 즐겨 보세요."], ["9-27", "연주회용 서곡 「가을에」 Op.11", "그리그", "관현악", "계절 표제", "표제가 가을", "노르웨이의 작곡가 그리그가 젊은 시절에 쓴 연주회용 서곡입니다. 그리그는 스물두 살 무렵 이 곡을 처음 썼는데, 당시 덴마크 음악계의 거장에게 보여 주었다가 \"다시 써 오게\"라는 혹평을 들었다고 합니다. 이 곡은 처음에는 피아노 연탄곡으로 출판되었고, 그로부터 20년이 지난 1887년에야 그리그가 다시 손을 보아 지금의 관현악곡으로 완성했습니다. 젊은 날의 아픈 기억이 담긴 곡을 원숙한 작곡가가 되어 다시 다듬은 셈이지요. 곡에는 그리그가 쓴 가곡 「가을 폭풍」의 선율과 노르웨이 시골의 추수 노래가 담겨 있습니다. 곡은 고요하고 쓸쓸한 가을 풍경으로 시작해, 차가운 바람이 불어오고 낙엽이 휘날리는 가을 폭풍의 모습을 그려 냅니다. 오케스트라의 거센 울림이 북유럽의 거친 가을바람을 생생하게 전하지요. 그러다 폭풍이 지나가고 나면, 들판에 모인 사람들이 한 해의 수확을 기뻐하며 흥겨운 추수 노래를 부르고 춤을 춥니다. 마지막에는 축제의 기쁨이 화려하게 터져 나오며 끝을 맺습니다. 표제 그대로 가을을 노래한 곡입니다. 깊어 가는 가을, 북유럽의 들판을 떠올리며 들어 보세요."], ["9-28", "「새 클라브생 모음곡」 중 「암탉」", "라모", "독주", "기념일", "라모 탄생 주간(1683.9.25)", "1683년 9월 25일 프랑스 디종에서 태어난 장필리프 라모의 하프시코드 곡입니다. 라모는 젊은 시절 성당의 오르가니스트로 일하며, 음악의 화음 원리를 체계적으로 정리한 이론서 「화성론」을 써서 음악 이론가로 먼저 이름을 알렸습니다. 그는 쉰 살이 넘어서야 오페라를 쓰기 시작해, 프랑스 바로크 음악을 대표하는 작곡가가 되었습니다. 이 곡은 1720년대 후반에 출판된 「새 클라브생 모음곡」에 실린 곡으로, 제목은 '암탉'이라는 뜻입니다. 라모는 이 곡에서 암탉이 꼬꼬댁거리며 마당을 돌아다니는 모습을 재치 있게 그려 냈습니다. 곡은 같은 음을 빠르게 여러 번 두드린 뒤 다른 음으로 이어지는 짧은 음형으로 시작하는데, 이것이 바로 암탉의 울음소리입니다. 라모는 악보에 이 음형 위에 암탉의 울음소리를 글자로 직접 적어 두기도 했습니다. 이 울음소리가 곡 전체에 걸쳐 다양하게 반복되고 변형되며, 바쁘게 모이를 쪼고 날개를 퍼덕이는 암탉의 모습이 익살스럽게 펼쳐집니다. 오늘날에는 피아노로도 자주 연주되는 인기곡입니다. 아이들과 함께 암탉의 울음소리를 찾아보며 들어 보세요."], ["9-29", "교향곡 3번 F장조 Op.90", "브람스", "관현악", "가을", "사강 『브람스를 좋아하세요…』로 유명한 3악장. 가을 브람스", "브람스가 쉰 살이던 1883년 여름, 독일 비스바덴에서 쓴 교향곡입니다. 이 곡은 브람스의 교향곡 가운데 가장 짧지만, 가장 깊고 내밀한 감정이 담긴 곡으로 꼽힙니다. 1악장은 관악기가 힘차게 세 개의 화음을 울리며 시작하는데, 이 세 음은 브람스가 평생의 좌우명으로 삼은 '자유롭게, 그러나 기쁘게'라는 독일어 말의 첫 글자를 음으로 옮긴 것이라고 알려져 있습니다. 이 세 음은 곡 전체에 걸쳐 여러 번 등장합니다. 이 교향곡에서 가장 사랑받는 것은 3악장입니다. 첼로가 부드럽고 애틋한 선율을 노래하며 시작하는데, 가을날의 쓸쓸함과 그리움이 가득 담긴 이 선율은 한 번 들으면 잊을 수 없을 만큼 아름답습니다. 프랑스 작가 프랑수아즈 사강은 1959년 소설 「브람스를 좋아하세요…」를 썼고, 이 소설을 바탕으로 한 영화에서 이 선율이 주제 음악으로 쓰이면서 '가을의 음악' 하면 브람스를 떠올리게 되었습니다. 대부분의 교향곡이 웅장하게 끝나는 것과 달리, 이 곡은 고요하게 잦아들며 끝을 맺습니다. 가을의 한가운데에서, 당신도 브람스를 좋아하시나요?"], ["9-30", "피아노 협주곡 1번 e단조 Op.11", "쇼팽", "협주곡", "가을", "가을의 낭만", "쇼팽이 스무 살이던 1830년에 쓴 피아노 협주곡입니다. 3월 1일에 들었던 2번 협주곡보다 나중에 작곡되었지만 먼저 출판되어 '1번'이라는 번호가 붙었습니다. 1830년 10월, 쇼팽은 바르샤바에서 고별 연주회를 열어 이 협주곡을 직접 연주했고, 몇 주 뒤 조국 폴란드를 떠났습니다. 그리고 그는 다시는 고향에 돌아가지 못했습니다. 그래서 이 협주곡에는 젊은 날의 꿈과 사랑, 그리고 떠나야 하는 이의 아련한 그리움이 담겨 있는 듯합니다. 1악장은 오케스트라의 긴 서주에 이어 피아노가 힘차고 열정적으로 등장하며, 우수와 서정이 교차하는 아름다운 선율이 펼쳐집니다. 2악장 '로망스'는 이 곡에서 가장 아름다운 부분입니다. 쇼팽은 친구에게 보낸 편지에서 이 악장을 두고 \"아름다운 봄날 밤, 달빛 아래에서 소중한 추억을 떠올리는 듯한 분위기\"를 그리고 싶었다고 썼습니다. 3악장은 폴란드의 민속춤 '크라코비아크'의 경쾌한 리듬으로 활기차게 마무리됩니다. 지금도 쇼팽 국제 피아노 콩쿠르 결선에서 가장 많이 연주되는 곡입니다. 9월의 마지막 날, 젊은 쇼팽의 꿈을 들어 보세요."], ["10-1", "마법사의 제자", "뒤카", "관현악", "기념일", "뒤카 탄생일(1865.10.1)", "1865년 10월 1일 파리에서 태어난 폴 뒤카가 1897년에 쓴 교향시입니다. 뒤카는 지독한 완벽주의자여서, 마음에 들지 않는 작품들을 스스로 불태워 버렸기 때문에 남아 있는 작품이 아주 적습니다. 이 곡은 독일의 대문호 괴테의 시를 바탕으로 합니다. 늙은 마법사가 외출하자, 그의 어린 제자는 스승이 쓰던 주문을 흉내 내어 빗자루에게 물을 길어 오라고 시킵니다. 빗자루는 양동이를 들고 부지런히 물을 길어 오는데, 제자는 주문을 멈추는 방법을 몰라 집 안이 물바다가 됩니다. 당황한 제자가 도끼로 빗자루를 쪼개자 이번에는 빗자루가 둘이 되어 더 많은 물을 길어 오지요. 마침내 스승이 돌아와 주문을 외우자 모든 것이 원래대로 돌아옵니다. 곡에서 바순이 연주하는 익살스러운 선율은 뚜벅뚜벅 걸어가는 빗자루를 생생하게 그려 내고, 점점 거세지는 오케스트라의 소리는 불어나는 물과 제자의 공포를 나타냅니다. 디즈니 영화 「판타지아」에서 미키 마우스가 제자로 등장하는 장면으로 세계적으로 유명해졌습니다. 아이들과 함께 이야기를 따라가며 들어 보세요."], ["10-2", "사계 Op.37 중 「10월: 가을의 노래」", "차이콥스키", "독주", "계절 표제", "표제 자체가 10월", "차이콥스키의 피아노 모음곡 「사계」 가운데 10월의 곡으로, 열두 곡 가운데 가장 슬프고 아름다운 곡으로 꼽힙니다. 이 곡에는 러시아 시인 알렉세이 톨스토이의 시에서 따온, 가을이 되어 우리의 가련한 정원은 모두 시들어 버리고, 노랗게 물든 잎사귀들이 바람에 흩날린다는 쓸쓸한 구절이 붙어 있습니다. 곡은 단조의 느리고 애틋한 선율로 시작하는데, 텅 빈 정원에서 낙엽이 하나둘 떨어지는 모습을 바라보는 듯한 깊은 슬픔과 그리움이 담겨 있습니다. 오른손이 노래하는 선율에 왼손이 조용히 대답하듯 다른 선율을 겹쳐 연주하는 부분에서는, 마치 두 사람이 지나간 날들을 함께 회상하며 이야기를 나누는 듯합니다. 가운데 부분에서는 감정이 조금 더 고조되었다가, 다시 처음의 쓸쓸한 선율로 돌아와 마지막 잎새가 떨어지듯 고요하게 사라집니다. 차이콥스키 특유의 우수와 서정이 가장 잘 드러나는 곡으로, 관현악이나 첼로, 바이올린 등 다양한 악기로 편곡되어 사랑받고 있습니다. 단풍이 물들기 시작하는 10월, 깊어 가는 가을의 쓸쓸함을 음악으로 느껴 보세요."], ["10-3", "바이올린 협주곡 1번 Op.35", "시마노프스키", "협주곡", "기념일", "시마노프스키 탄생일(1882.10.3)", "1882년 10월 3일 지금의 우크라이나 지역에서 태어난 폴란드의 작곡가 카롤 시마노프스키의 바이올린 협주곡입니다. 시마노프스키는 쇼팽 이후 폴란드를 대표하는 가장 중요한 작곡가로 꼽힙니다. 1차 세계대전이 한창이던 1916년, 그는 우크라이나에 있는 가족의 영지에 머물며 이 곡을 썼습니다. 친구이자 바이올리니스트인 코한스키가 바이올린 연주에 관한 조언을 해 주었고, 이 곡은 폴란드 시인 미친스키의 시 「5월의 밤」에서 영감을 받았습니다. 시는 달빛 아래 신비롭고 관능적인 꿈결 같은 밤을 노래하는데, 협주곡도 그런 몽환적인 분위기로 가득합니다. 곡은 악장이 나뉘지 않고 하나로 이어지며, 첼레스타와 하프, 피아노가 반짝이는 신비로운 소리로 시작합니다. 그 위로 바이올린이 높은 음역에서 마치 새가 날아오르듯, 또는 별빛이 반짝이듯 황홀하고 아름다운 선율을 노래하지요. 오케스트라의 풍부하고 화려한 색채가 끊임없이 변하며, 마치 꿈속의 정원을 거니는 듯한 느낌을 줍니다. 최초의 현대적인 바이올린 협주곡 가운데 하나로 평가받는 곡입니다. 그의 생일을 맞아, 신비로운 밤의 음악을 들어 보세요."], ["10-4", "클라리넷 5중주 b단조 Op.115", "브람스", "실내악", "가을", "'가을의 브람스' 대표곡", "브람스가 1891년에 쓴 클라리넷 5중주곡입니다. 1890년 브람스는 쉰일곱의 나이로 이제 작곡을 그만두겠다고 선언하고 유언장까지 썼습니다. 그런데 이듬해 독일 마이닝겐 궁정 관현악단의 클라리넷 연주자 뮐펠트의 연주를 듣고 그 아름다운 음색에 깊이 매료되어, 다시 펜을 들었습니다. 브람스는 그를 '클라리넷 아가씨'라고 부르며, 그를 위해 이 5중주를 비롯한 네 곡의 클라리넷 작품을 남겼습니다. 이 곡은 클라리넷과 현악 4중주가 함께 연주하며, '가을의 브람스'라는 말이 가장 잘 어울리는 곡입니다. 곡 전체에 지나간 날들에 대한 그리움, 삶을 받아들이는 담담한 체념, 그리고 노년의 쓸쓸함이 짙게 배어 있습니다. 1악장은 현악기의 애틋한 선율로 시작해 클라리넷이 그 위로 부드럽게 떠오르고, 2악장에서는 클라리넷이 헝가리 집시 음악처럼 자유롭고 애절한 노래를 들려줍니다. 마지막 악장은 소박한 주제와 변주로 이어지다가, 끝부분에서 1악장의 첫 선율이 다시 돌아와 깊은 여운을 남기며 끝납니다. 낙엽이 지는 가을 오후에 들어 보세요."], ["10-5", "간주곡 A장조 Op.118-2", "브람스", "독주", "가을", "가을밤 피아노", "브람스가 1893년, 예순 살에 쓴 여섯 곡의 피아노 소품 작품 118 가운데 두 번째 곡입니다. 말년의 브람스는 교향곡이나 협주곡 같은 큰 작품 대신, 짧고 내밀한 피아노 소품들을 썼습니다. 이 곡들에는 화려함보다 깊은 사색과 고독, 그리고 따뜻한 위로가 담겨 있습니다. 브람스는 이 작품을 평생 존경하고 사랑했던 클라라 슈만에게 헌정했습니다. 클라라는 남편 슈만이 세상을 떠난 뒤 40년 동안 브람스와 깊은 우정을 나누었는데, 이 곡이 쓰이고 3년 뒤 세상을 떠났습니다. '인터메초'는 원래 '간주곡', 즉 두 곡 사이에 끼워 넣는 짧은 곡이라는 뜻이지만, 브람스는 이 이름을 붙인 곡들에 자신의 가장 깊은 감정을 담았습니다. 곡은 부드럽고 따뜻한 선율이 조용히 노래하며 시작하는데, 마치 오래된 친구에게 건네는 다정한 인사 같습니다. 가운데 부분에서는 분위기가 단조로 바뀌어 아련한 슬픔과 그리움이 흐르다가, 다시 처음의 따뜻한 선율로 돌아와 고요하게 끝을 맺습니다. 브람스의 피아노곡 가운데 가장 사랑받는 곡입니다. 가을밤 따뜻한 차 한 잔과 함께 들어 보세요."], ["10-6", "교향곡 4번 e단조 Op.98", "브람스", "관현악", "가을", "쓸쓸한 가을 정취", "브람스가 1884년과 이듬해 여름, 오스트리아의 산골 마을 뮈르추슐라크에서 쓴 마지막 교향곡입니다. 이 교향곡에는 쓸쓸하고 비장한 가을의 정취가 가득합니다. 1악장은 현악기가 마치 깊은 한숨처럼 두 음씩 내려가고 올라가는 선율을 노래하며 시작하는데, 이 탄식 같은 첫 소절은 한 번 들으면 잊히지 않습니다. 2악장은 호른의 고풍스러운 선율로 시작하는 고요한 노래이고, 3악장은 트라이앵글이 경쾌하게 울리는 힘차고 흥겨운 축제의 음악입니다. 이 교향곡의 정점은 4악장입니다. 브람스는 바흐의 칸타타에서 가져온 여덟 마디의 짧은 주제를 바탕으로, 그 주제를 서른 번이나 반복하며 변주하는 바로크 시대의 '파사칼리아' 형식으로 이 악장을 썼습니다. 엄격한 형식 속에서 슬픔과 분노, 고요와 격정이 차례로 펼쳐지며, 비극적이고 장엄한 결말로 끝을 맺습니다. 옛 시대의 형식을 존중하면서도 그 안에 낭만의 깊은 감정을 담아낸 브람스다운 걸작입니다. 1885년 브람스 자신의 지휘로 초연되었습니다. 깊은 가을의 쓸쓸함을 느껴 보세요."], ["10-7", "고요한 숲 Op.68-5", "드보르자크", "협주곡", "가을", "첼로로 그린 가을 숲", "드보르자크가 1883년에 쓴 여섯 곡의 피아노 연탄곡 「보헤미아의 숲에서」 가운데 다섯 번째 곡입니다. 원래 제목은 '고요'라는 뜻이며, 고향 보헤미아의 숲속 풍경을 그린 곡입니다. 1891년 드보르자크는 미국으로 떠나기 전 고국에서 고별 연주 여행을 하게 되었는데, 함께 다닐 첼리스트를 위해 이 곡을 첼로와 피아노를 위한 곡으로 편곡했습니다. 그리고 이후 첼로와 관현악을 위한 버전도 만들었지요. 지금은 원곡보다 첼로곡으로 훨씬 유명합니다. 곡은 현악기나 피아노의 부드러운 반주 위로, 첼로가 낮고 그윽한 음색으로 고요하고 애틋한 선율을 노래하며 시작합니다. 마치 아무도 없는 깊은 숲속에 홀로 서서, 바람에 흔들리는 나뭇잎 소리와 멀리서 들려오는 새소리에 귀 기울이는 듯한 평화로움이 느껴지지요. 가운데 부분에서는 감정이 조금 더 고조되어 애수 어린 노래가 흐르다가, 다시 처음의 고요한 선율로 돌아와 숲의 정적 속으로 스며들듯 조용히 사라집니다. 6분 남짓한 짧은 곡이지만, 드보르자크가 사랑한 고향 숲의 향기가 가득합니다. 단풍이 물드는 가을 숲을 떠올리며 들어 보세요."], ["10-8", "전주곡 c#단조 Op.3-2", "라흐마니노프", "독주", "가을", "러시아의 종소리", "라흐마니노프가 열아홉 살이던 1892년, 모스크바 음악원을 졸업한 직후에 쓴 피아노곡입니다. 이 곡은 출판되자마자 러시아와 유럽, 미국에서 엄청난 인기를 끌어, 라흐마니노프의 이름을 세계에 알렸습니다. 그런데 그는 이 곡의 판권을 아주 적은 돈을 받고 출판사에 넘겨 버려, 곡이 아무리 인기를 얻어도 큰 수익을 얻지 못했습니다. 게다가 연주회를 열 때마다 청중이 이 곡을 앙코르로 끈질기게 요청하는 바람에, 라흐마니노프는 나중에 이 곡을 지겨워하며 '그 곡'이라고 불렀다고 합니다. 곡은 낮은 음역에서 세 개의 음이 아주 강하게 내려가며 시작하는데, 마치 크렘린의 커다란 교회 종이 무겁게 울리는 듯합니다. 이 세 음은 곡 전체를 이끄는 중심 동기가 되지요. 이어 무겁고 어두운 화음이 장엄하게 이어지고, 가운데 부분에서는 빠르고 격렬한 음악이 폭풍처럼 몰아칩니다. 그리고 다시 처음의 종소리가 더욱 웅장하게 돌아와, 건반 전체를 울리는 거대한 화음으로 절정에 이른 뒤 고요하게 사라집니다. 러시아의 종소리가 울려 퍼지는 가을밤을 상상하며 들어 보세요."], ["10-9", "교향곡 3번 「오르간」 Op.78", "생상스", "관현악", "기념일", "생상스 탄생일(1835.10.9)", "1835년 10월 9일 파리에서 태어난 생상스가 1886년에 쓴 교향곡입니다. 이 곡은 런던의 필하모닉 협회의 의뢰로 쓰였고, 그해 런던에서 생상스 자신의 지휘로 초연되었습니다. 생상스는 이 곡을 두고 \"내가 줄 수 있는 모든 것을 이 곡에 쏟아부었다\"고 말했습니다. 같은 해 그를 아끼고 격려해 주었던 리스트가 세상을 떠나자, 생상스는 이 교향곡을 리스트를 추모하며 헌정했습니다. '오르간 교향곡'이라는 별명은 이 곡에 파이프 오르간이 등장하기 때문에 붙었는데, 오르간은 협주곡의 독주 악기처럼 앞에 나서기보다는 오케스트라와 하나가 되어 소리를 더욱 풍성하게 만듭니다. 피아노도 두 명이 함께 연주하며 반짝이는 색채를 더하지요. 2악장에서는 오르간이 아주 낮고 부드러운 화음으로 현악기의 고요한 선율을 감싸 안는데, 그 따뜻하고 신비로운 울림이 마음을 평화롭게 합니다. 그리고 마지막 악장은 오르간이 갑자기 거대하고 장엄한 화음을 터뜨리며 시작해, 오케스트라 전체가 웅장한 승리의 찬가를 울리며 끝을 맺습니다. 생상스의 생일, 성당을 가득 채우는 오르간의 소리를 느껴 보세요."], ["10-10", "로망스 2번 F장조 Op.50", "베토벤", "협주곡", "가을", "바이올린의 가을 서정", "베토벤이 젊은 시절에 쓴 바이올린과 관현악을 위한 두 곡의 로망스 가운데 두 번째 곡입니다. '로망스'는 원래 사랑이나 서정적인 이야기를 담은 노래를 뜻하는데, 베토벤은 이 곡에서 바이올린이 사람의 목소리처럼 부드럽고 서정적으로 노래하도록 했습니다. 이 곡은 1798년 무렵에 쓰였지만 1805년에야 출판되면서 '2번'이라는 번호가 붙었습니다. 베토벤은 이 무렵부터 바이올린 협주곡을 쓰기 위해 여러 가지를 시도했는데, 이 로망스들은 그런 과정에서 탄생한 곡으로, 훗날 그의 위대한 바이올린 협주곡의 느린 악장을 미리 예고하는 듯합니다. 곡은 바이올린이 홀로 따뜻하고 우아한 선율을 노래하며 시작하고, 오케스트라가 이를 다정하게 이어받습니다. 이 선율은 곡 전체에 걸쳐 여러 번 돌아오며, 그 사이사이 조금 더 애틋하고 극적인 선율이 나타났다가 다시 처음의 평화로운 노래로 돌아옵니다. 8분 남짓한 짧은 곡이지만, 베토벤의 다정하고 부드러운 면모를 잘 보여 줍니다. 결혼식이나 기념식 음악으로도 자주 연주됩니다. 맑은 가을 하늘 아래, 바이올린이 들려주는 따뜻한 사랑의 노래를 들어 보세요."], ["10-11", "교향곡 6번 「비창」 Op.74", "차이콥스키", "관현악", "가을", "깊어가는 가을", "차이콥스키가 1893년에 완성한 마지막 교향곡입니다. 그는 이 곡에 대해 \"내 모든 영혼을 담았다\"며 \"지금까지 쓴 곡 가운데 최고의 작품\"이라고 말했습니다. 그해 10월 차이콥스키는 상트페테르부르크에서 이 곡을 직접 지휘해 초연했는데, 불과 9일 뒤 갑자기 세상을 떠났습니다. 그래서 이 교향곡은 그의 마지막 유언처럼 여겨지게 되었지요. '비창'이라는 제목은 차이콥스키의 동생이 제안한 것으로, 러시아어로는 '열정적인', '비통한'이라는 뜻을 함께 담고 있습니다. 1악장은 바순이 아주 낮고 어두운 음역에서 탄식하듯 선율을 읊조리며 시작하고, 이어 현악기가 그리움 가득한 아름다운 선율을 노래합니다. 2악장은 한 마디에 다섯 박을 세는 독특한 왈츠로 우아하면서도 어딘가 불안하고, 3악장은 힘차고 화려한 행진곡으로 승리처럼 끝나서 청중이 곡이 끝난 줄 알고 박수를 치는 일이 많습니다. 그러나 마지막 4악장은 깊은 절망과 슬픔 속에서 천천히 가라앉으며, 아주 작은 소리로 어둠 속에 사라지듯 끝을 맺습니다. 깊어 가는 가을, 한 작곡가의 영혼이 담긴 마지막 노래를 들어 보세요."], ["10-12", "토머스 탤리스 주제에 의한 환상곡", "본 윌리엄스", "관현악", "기념일", "본 윌리엄스 탄생일(1872.10.12)", "1872년 10월 12일 영국에서 태어난 랠프 본 윌리엄스가 1910년에 쓴 현악곡입니다. 이 곡은 그해 영국 서부의 오래된 글로스터 대성당에서 열린 음악제에서 초연되었습니다. 본 윌리엄스는 16세기 영국 작곡가 토머스 탤리스가 쓴 시편 찬송가의 선율을 바탕으로 이 곡을 썼습니다. 그는 영국 교회의 찬송가집을 편집하는 일을 하면서 탤리스의 이 소박하고 경건한 선율을 발견하고 깊이 감동했습니다. 이 곡의 특별한 점은 현악기들을 세 그룹으로 나누었다는 것입니다. 큰 현악 합주단, 그보다 작은 아홉 명의 현악 합주단, 그리고 현악 4중주가 서로 다른 자리에 앉아 연주하는데, 작은 합주단은 멀리 떨어져 앉아 마치 메아리처럼 울리도록 했습니다. 그래서 이 곡을 들으면 거대한 성당 안에서 소리가 천장과 벽을 타고 울려 퍼지는 듯한 신비로운 공간감이 느껴집니다. 곡은 고요하고 신비로운 화음으로 시작해, 탤리스의 선율이 점점 풍성하고 장엄하게 피어올랐다가, 다시 고요한 기도처럼 잦아듭니다. 영국 음악의 새로운 시대를 연 작품으로 평가받습니다. 가을 성당의 고요함을 느껴 보세요."], ["10-13", "평균율 1권 1번 C장조 BWV 846", "바흐", "독주", "일반", "건반 음악의 구약성서", "바흐가 1722년에 완성한 「평균율 클라비어곡집」 제1권의 첫 곡입니다. 이 곡집은 24개의 모든 장조와 단조를 하나씩 사용해 '전주곡과 푸가'를 짝지어 놓은 곡집으로, 바흐는 이를 아들과 제자들의 교육을 위해 썼습니다. 당시에는 건반 악기를 조율하는 방식 때문에 모든 조성을 자유롭게 연주하기 어려웠는데, 바흐는 이 곡집을 통해 모든 조성을 고르게 연주할 수 있는 새로운 조율법의 가능성을 보여 주었습니다. 19세기의 지휘자 뷜로는 이 곡집을 '피아노 음악의 구약성서'라고 불렀고, 베토벤의 피아노 소나타를 '신약성서'라고 불렀습니다. 그만큼 피아노 음악의 근본이 되는 작품이라는 뜻이지요. 이 첫 곡 C장조 전주곡은 처음부터 끝까지 화음을 한 음씩 풀어 연주하는 단순한 음형으로 이루어져 있습니다. 선율도 없이 화음만 천천히 바뀌어 가는데도, 놀랍도록 깊고 평화로운 아름다움을 지니고 있습니다. 훗날 프랑스의 작곡가 구노는 이 전주곡 위에 새로운 선율을 얹어 유명한 「아베 마리아」를 만들기도 했습니다. 모든 것의 시작이 되는 단순하고 순수한 음악을 들어 보세요."], ["10-14", "피아노 협주곡 23번 A장조 K.488", "모차르트", "협주곡", "가을", "가을빛 2악장", "모차르트가 1786년 3월, 오페라 「피가로의 결혼」을 작곡하던 바쁜 시기에 완성한 피아노 협주곡입니다. 이 곡은 모차르트의 피아노 협주곡 가운데 특히 부드럽고 친밀한 분위기를 지닌 곡으로 꼽힙니다. 모차르트는 이 곡에서 보통 쓰던 오보에 대신 클라리넷을 사용해, 오케스트라의 소리를 한층 따뜻하고 부드럽게 만들었습니다. 1악장은 밝고 우아하며, 피아노와 오케스트라가 다정하게 대화를 나누듯 펼쳐집니다. 이 곡의 중심은 2악장 아다지오입니다. 이 악장은 모차르트의 작품 가운데 유일하게 올림바단조라는 독특한 조성으로 쓰였는데, 그래서인지 다른 곡에서 찾아보기 어려운 깊고 애절한 슬픔이 담겨 있습니다. 피아노가 홀로 이탈리아 시칠리아의 느린 춤곡처럼 흔들리는 리듬으로 쓸쓸한 선율을 노래하고, 클라리넷과 현악기가 이를 받아 위로하듯 감싸 안습니다. 마치 가을 저녁 홀로 창가에 앉아 지나간 날들을 떠올리는 듯한 음악이지요. 3악장은 분위기가 확 바뀌어, 밝고 경쾌하며 생기 넘치는 론도로 즐겁게 마무리됩니다. 슬픔과 기쁨이 함께 담긴 모차르트의 깊은 마음을 느껴 보세요."], ["10-15", "피아노 협주곡 3번 d단조 Op.30", "라흐마니노프", "협주곡", "가을", "가을의 대작", "라흐마니노프가 1909년, 처음으로 미국 연주 여행을 떠나기 위해 쓴 피아노 협주곡입니다. 그는 이 곡을 완성한 뒤 미국으로 가는 배 안에서, 소리가 나지 않는 연습용 건반으로 연습했다고 합니다. 그해 뉴욕에서 라흐마니노프 자신의 독주로 초연되었고, 이듬해에는 말러의 지휘로 다시 연주되었습니다. 이 협주곡은 피아니스트에게 엄청난 체력과 기교를 요구하는, 세상에서 가장 어려운 피아노 협주곡 가운데 하나로 꼽힙니다. 1996년 영화 「샤인」에서는 주인공인 호주의 피아니스트 데이비드 헬프갓이 이 곡에 매달리다 정신적으로 무너지는 모습이 그려지기도 했습니다. 하지만 곡은 놀랍도록 단순하게 시작합니다. 오케스트라의 조용한 반주 위로 피아노가 러시아 정교회의 성가처럼 소박하고 애틋한 선율을 한 음씩 노래하지요. 이 선율은 곡 전체에 걸쳐 다양한 모습으로 돌아옵니다. 1악장 중간의 거대한 카덴차, 2악장의 깊은 서정, 그리고 3악장의 폭발적인 클라이맥스까지, 러시아의 광활한 대지처럼 웅장하고 낭만적인 음악이 펼쳐집니다. 가을밤, 라흐마니노프의 대작에 빠져 보세요."], ["10-16", "녹턴 13번 c단조 Op.48-1", "쇼팽", "독주", "가을", "쇼팽 서거일 전야", "쇼팽이 1841년에 쓴 녹턴으로, 그가 남긴 스물한 곡의 녹턴 가운데 가장 장엄하고 비극적인 곡으로 꼽힙니다. 대부분의 녹턴이 고요하고 서정적인 밤의 노래라면, 이 곡은 깊은 슬픔과 비통함, 그리고 거대한 열정이 담긴 극적인 음악입니다. 곡은 느리고 무거운 화음 위로 오른손이 비통한 선율을 노래하며 시작하는데, 마치 장례 행렬이 천천히 걸어가는 듯한 엄숙함이 느껴집니다. 가운데 부분에서는 분위기가 바뀌어, 장조의 경건하고 고요한 찬송가 같은 화음이 울립니다. 그런데 이 찬송가는 점점 커지고 빨라지더니, 양손이 옥타브를 쉴 새 없이 두드리는 거대한 폭풍으로 변해 몰아칩니다. 그리고 다시 처음의 비통한 선율이 돌아오는데, 이번에는 왼손의 빠르고 불안한 반주가 더해져 슬픔이 더욱 격렬하게 고조됩니다. 마지막에는 모든 것을 내려놓은 듯 고요하게 끝을 맺습니다. 이 곡을 쓸 무렵 쇼팽은 조국 폴란드의 비극적인 운명과 자신의 병든 몸을 생각하며 깊은 고뇌에 빠져 있었을지도 모릅니다. 내일은 쇼팽이 세상을 떠난 날입니다. 그를 기억하며 들어 보세요."], ["10-17", "피아노 소나타 2번 「장송」 Op.35", "쇼팽", "독주", "기념일", "쇼팽 서거일(1849.10.17)", "1849년 10월 17일 파리에서 서른아홉의 나이로 세상을 떠난 쇼팽의 피아노 소나타입니다. 이 소나타의 3악장 「장송 행진곡」은 쇼팽이 먼저 따로 써 두었던 곡으로, 나중에 이를 중심으로 나머지 악장들을 써서 1839년 소나타로 완성했습니다. 1악장은 어둡고 신비로운 서주에 이어 숨 가쁘게 몰아치는 격정적인 음악이고, 2악장은 거칠고 힘찬 스케르초입니다. 3악장 「장송 행진곡」은 왼손이 무겁고 느린 화음을 장례식의 북소리처럼 규칙적으로 울리는 가운데, 오른손이 비통한 선율을 노래하는 곡으로, 세상에서 가장 유명한 장송 음악이 되었습니다. 가운데 부분에서는 하늘나라를 그리는 듯 고요하고 아름다운 선율이 흐르지요. 4악장은 1분 남짓한 아주 짧은 곡인데, 양손이 같은 음을 빠르고 작게 연주하며 마치 무덤 위로 차가운 바람이 휩쓸고 지나가는 듯한 섬뜩하고 신비로운 분위기를 자아냅니다. 쇼팽의 장례식에서는 이 장송 행진곡이 관현악으로 편곡되어 연주되었습니다. 그의 몸은 파리에 묻혔지만, 그의 유언에 따라 심장은 조국 폴란드의 바르샤바로 옮겨졌습니다. 피아노의 시인을 기억하며 들어 보세요."], ["10-18", "로코코 주제에 의한 변주곡 Op.33", "차이콥스키", "협주곡", "일반", "첼로와 관현악", "차이콥스키가 1876년부터 이듬해 사이에 쓴 첼로와 관현악을 위한 작품입니다. 이 곡은 모스크바 음악원의 동료이자 첼리스트인 피첸하겐을 위해 쓰였습니다. 차이콥스키는 평생 모차르트를 깊이 존경했는데, 이 곡에서 모차르트가 살던 18세기의 우아하고 섬세한 '로코코' 양식을 떠올리며 직접 소박하고 단정한 주제를 만들었습니다. 곡은 그 주제와 여러 개의 변주로 이루어져 있습니다. 첼로가 우아하고 사랑스러운 주제를 노래한 뒤, 변주가 거듭될 때마다 화려하고 빠른 기교, 깊고 서정적인 노래, 경쾌하고 장난스러운 춤 등 다양한 모습으로 변신합니다. 특히 느린 변주에서는 첼로가 애틋하고 깊은 러시아적 우수를 담아 노래해 큰 감동을 줍니다. 그런데 이 곡에는 재미있는 사연이 있습니다. 피첸하겐은 초연을 앞두고 차이콥스키의 허락도 없이 변주의 순서를 마음대로 바꾸고 한 변주를 빼 버렸는데, 오랫동안 그 고친 판본이 주로 연주되었습니다. 차이콥스키는 크게 불쾌해했지만 결국 받아들였다고 합니다. 첼로의 아름다운 음색과 화려한 기교를 함께 즐길 수 있는 곡입니다. 가을의 우아함을 느껴 보세요."], ["10-19", "피아노 5중주 E♭장조 Op.44", "슈만", "실내악", "가을", "가을 실내악", "슈만이 1842년에 쓴 피아노 5중주곡입니다. 1840년 오랜 법정 다툼 끝에 클라라와 결혼한 슈만은 그해 수많은 가곡을 쏟아냈고, 이듬해에는 교향곡에 몰두했으며, 1842년에는 실내악에 집중해 여러 걸작을 남겼습니다. 그래서 1842년은 슈만의 '실내악의 해'라고 불립니다. 이 곡은 아내 클라라에게 헌정되었고, 클라라의 피아노로 처음 연주되었습니다. 피아노와 현악 4중주가 함께 연주하는 '피아노 5중주'라는 편성은 이 곡 이후 브람스, 드보르자크 등 많은 작곡가들이 즐겨 쓰는 장르가 되었습니다. 1악장은 다섯 악기가 함께 힘차고 환희에 찬 주제를 터뜨리며 시작하고, 이어 첼로와 비올라가 부드럽고 사랑스러운 선율을 주고받습니다. 2악장은 장송 행진곡 같은 무겁고 쓸쓸한 분위기로 시작해, 중간에 서정적인 노래와 격정적인 폭풍이 차례로 나타납니다. 3악장은 음계를 오르내리는 활기찬 스케르초이고, 4악장은 다양한 주제가 펼쳐지다가 마지막에 1악장의 주제와 4악장의 주제가 동시에 맞물리는 화려한 푸가로 장엄하게 끝납니다. 사랑과 행복이 가득한 시절의 음악을 들어 보세요."], ["10-20", "대답 없는 질문", "아이브스", "관현악", "기념일", "아이브스 탄생일(1874.10.20)", "1874년 10월 20일 미국 코네티컷에서 태어난 찰스 아이브스의 작품입니다. 아이브스는 평생 보험회사를 운영하며 큰 성공을 거둔 사업가였고, 작곡은 주로 밤과 주말에 했습니다. 그의 음악은 당시로서는 너무 실험적이고 대담해서 오랫동안 이해받지 못했지만, 훗날 미국 현대 음악의 선구자로 평가받게 되었습니다. 1906년에 쓴 이 곡에 대해 아이브스는 '우주적인 풍경'이라고 설명했습니다. 곡에서는 세 그룹의 악기가 서로 다른 역할을 맡습니다. 무대 뒤나 멀리 떨어진 곳에 있는 현악기들은 처음부터 끝까지 아주 작고 느린 화음을 고요하게 이어 가는데, 이는 영원히 변하지 않는 우주의 침묵을 나타냅니다. 그 위로 트럼펫이 일곱 번에 걸쳐 짧은 선율을 똑같이 묻습니다. 이것이 바로 '존재에 대한 영원한 질문'입니다. 그때마다 네 대의 플루트가 대답하려 하지만, 그 대답은 점점 혼란스럽고 다급해지다가 마침내 포기하고 맙니다. 그리고 마지막 질문에는 아무도 대답하지 않고, 현악기의 고요한 침묵만이 남습니다. 6분 남짓한 짧은 곡이지만, 깊은 철학적 질문을 던지는 곡입니다. 가을밤 별을 보며 들어 보세요."], ["10-21", "현악4중주 15번 a단조 Op.132", "베토벤", "실내악", "가을", "'감사의 노래' 3악장", "베토벤이 1825년에 쓴 현악 4중주곡으로, 그가 말년에 남긴 '후기 현악 4중주' 가운데 한 곡입니다. 이 무렵 베토벤은 이미 청력을 완전히 잃었고, 세상과 단절된 채 오직 내면의 소리에만 귀 기울이며 작곡했습니다. 그래서 그의 후기 현악 4중주들은 당시 사람들에게 이해하기 어려운 음악이었지만, 지금은 인류가 남긴 가장 깊고 위대한 음악으로 평가받습니다. 이 곡을 쓰던 중 베토벤은 심한 병을 앓아 한 달 넘게 몸져누웠습니다. 병에서 회복된 그는 3악장에 \"병에서 회복된 이가 신께 바치는 거룩한 감사의 노래\"라는 제목을 붙였습니다. 이 악장은 옛 교회 음악에서 쓰던 독특한 음계로 쓰였는데, 네 대의 현악기가 아주 느리고 고요하게 찬송가 같은 화음을 연주하며, 그 사이사이 '새로운 힘을 느끼며'라는 지시가 붙은 생기 있는 부분이 나타납니다. 깊은 고통을 지나 다시 삶을 얻은 이의 감사와 경건함이 담긴 이 악장은 20분 가까이 이어지며, 듣는 이의 마음을 깊은 평화로 이끕니다. 나머지 악장들도 저마다 깊은 개성을 지니고 있습니다. 감사의 마음으로 들어 보세요."], ["10-22", "피아노 소나타 b단조", "리스트", "독주", "기념일", "리스트 탄생일(1811.10.22)", "1811년 10월 22일 헝가리 라이딩에서 태어난 리스트가 1852년부터 이듬해 사이에 쓴 피아노 소나타입니다. 리스트는 이 곡을 슈만에게 헌정했는데, 이는 슈만이 몇 해 전 자신의 피아노 「환상곡」을 리스트에게 헌정한 것에 대한 답례였습니다. 하지만 이 곡이 리스트에게 도착했을 때 슈만은 이미 병으로 정신 요양원에 들어가 있었고, 클라라는 이 곡을 듣고 그저 시끄러운 소음일 뿐이라며 싫어했다고 합니다. 이 소나타는 보통의 소나타처럼 여러 악장으로 나뉘지 않고, 30분 가까이 쉬지 않고 이어지는 하나의 거대한 악장으로 되어 있습니다. 곡은 낮은 음이 조용히 울린 뒤, 내려가는 음계와 날카롭게 도약하는 주제, 그리고 낮은 음역에서 망치로 두드리는 듯한 주제가 차례로 나타납니다. 이 몇 개의 주제가 곡 전체에 걸쳐 끊임없이 모습을 바꾸어, 때로는 악마처럼 거칠게, 때로는 천사처럼 아름답고 고요하게 변신하며 거대한 드라마를 펼쳐 냅니다. 그리고 마지막에는 처음의 조용한 음으로 돌아와 고요하게 사라집니다. 리스트의 가장 위대한 피아노 작품입니다. 그의 생일에 들어 보세요."], ["10-23", "헝가리 광시곡 2번", "리스트", "독주", "기념일", "리스트 탄생 주간", "리스트가 1847년에 쓴 열아홉 곡의 「헝가리 광시곡」 가운데 두 번째 곡으로, 가장 유명한 곡입니다. 2월에 들었던 9번처럼, 이 곡도 헝가리 집시 악단의 음악을 바탕으로 합니다. 곡은 집시 음악의 전형적인 형식을 따라, 느리고 애수 어린 '라수'와 빠르고 열광적인 '프리스카'라는 두 부분으로 이루어져 있습니다. 앞부분 라수는 낮은 음역에서 비장하고 무거운 화음이 울리며 시작해, 집시 바이올린이 즉흥적으로 슬픈 노래를 부르는 듯한 자유롭고 애절한 선율이 펼쳐집니다. 피아노로 집시 악단의 독특한 악기인 침발롬의 떨리는 소리를 흉내 내기도 하지요. 이어지는 뒷부분 프리스카에서는 분위기가 완전히 바뀌어, 경쾌하고 익살스러운 춤곡이 시작됩니다. 리듬은 점점 빨라지고 음악은 점점 격렬해져, 마침내 숨 막힐 듯한 속도로 질주하며 화려한 절정으로 치닫습니다. 이 곡은 애니메이션 「톰과 제리」와 「벅스 버니」에도 쓰여, 고양이 톰이 피아노를 치며 쥐 제리와 다투는 장면으로 아이들에게도 무척 친숙합니다. 피아니스트의 눈부신 기교가 돋보이는 곡입니다. 리스트 탄생 주간, 헝가리의 열정을 느껴 보세요."], ["10-24", "바이올린 협주곡 「오페르토리움」", "구바이둘리나", "협주곡", "기념일", "구바이둘리나 탄생일(1931.10.24)", "1931년 10월 24일 소련의 타타르 공화국에서 태어난 작곡가 소피아 구바이둘리나의 바이올린 협주곡입니다. 구바이둘리나는 소련 시절 종교적이고 실험적인 음악을 쓴다는 이유로 오랫동안 비판을 받았지만, 굴하지 않고 자신만의 음악을 지켜 왔습니다. 그녀는 학생 시절 시험 위원이던 쇼스타코비치로부터 \"당신이 그릇된 길이라고 여겨지는 길을 계속 가라\"는 격려를 들었다고 합니다. 이 협주곡은 1980년 라트비아 출신의 바이올리니스트 기돈 크레머를 위해 쓰였고, 그의 연주로 서방에 소개되면서 구바이둘리나의 이름을 세계에 알렸습니다. '오페르토리움'은 라틴어로 '봉헌', 즉 제단에 바치는 제물이라는 뜻입니다. 곡은 바흐의 「음악의 헌정」에 나오는 유명한 주제로 시작하는데, 변주가 거듭될 때마다 그 주제의 처음과 끝 음이 하나씩 사라져 갑니다. 주제가 스스로를 희생하며 점점 작아지는 것이지요. 그리고 곡의 마지막에는 그 주제가 거꾸로 재구성되어, 고요하고 찬란한 새로운 모습으로 다시 태어납니다. 희생과 부활이라는 깊은 의미가 담긴 곡입니다. 그녀의 생일을 맞아, 현대 음악의 깊은 울림을 만나 보세요."], ["10-25", "예술가의 생애 왈츠 Op.316", "요한 슈트라우스 2세", "관현악", "기념일", "요한 슈트라우스 2세 탄생일(1825.10.25)", "1825년 10월 25일 빈에서 태어난 '왈츠의 왕' 요한 슈트라우스 2세의 왈츠입니다. 1867년 2월, 「아름답고 푸른 도나우」가 합창곡으로 처음 발표되었다가 미지근한 반응을 얻은 지 불과 며칠 뒤, 슈트라우스는 빈 예술가 단체의 사육제 무도회를 위해 이 왈츠를 발표했고 큰 성공을 거두었습니다. 제목 '예술가의 생애'는 이 무도회를 연 예술가들에게 바치는 뜻을 담고 있는데, 예술가로 사는 삶의 기쁨과 낭만, 그리고 그 속에 숨은 쓸쓸함까지 모두 담아낸 듯한 곡입니다. 곡은 조용하고 우아한 서주로 시작해, 차례로 다섯 개의 왈츠가 이어집니다. 첫 왈츠는 따뜻하고 부드러운 선율로 흐르며, 한 번 들으면 쉽게 잊히지 않는 아름다움을 지니고 있습니다. 이어지는 왈츠들은 때로는 화사하고 경쾌하게, 때로는 서정적이고 애틋하게 다양한 표정을 보여 주지요. 마지막에는 앞의 선율들을 회상하는 긴 마무리를 지나 화려하게 끝을 맺습니다. 슈트라우스는 평생 500곡이 넘는 춤곡을 써서 빈 사람들에게 기쁨을 주었습니다. 1월 신년음악회 주간에 만났던 그의 생일을 맞아, 다시 한 번 빈의 왈츠를 즐겨 보세요."], ["10-26", "소나타 d단조 K.141", "스카를라티", "독주", "기념일", "스카를라티 탄생일(1685.10.26)", "1685년 10월 26일 이탈리아 나폴리에서 태어난 도메니코 스카를라티의 건반 소나타입니다. 1685년은 바흐와 헨델이 태어난 해이기도 해서, 같은 해에 바로크 음악의 세 거장이 태어난 셈입니다. 젊은 시절 스카를라티는 로마에서 헨델과 건반 연주 실력을 겨루었다는 이야기가 전해지는데, 하프시코드에서는 막상막하였지만 오르간에서는 헨델이 앞섰다고 합니다. 7월에 들었던 우아한 소나타와 달리, 이 소나타는 무척 빠르고 강렬하며 극적인 곡입니다. 곡에서 가장 눈에 띄는 것은 같은 음을 손가락을 바꾸어 가며 아주 빠르게 반복해서 두드리는 기법입니다. 이는 스페인의 기타나 만돌린을 빠르게 튕기는 소리를 하프시코드로 흉내 낸 것으로, 마치 스페인 거리에서 기타를 든 악사가 정열적으로 연주하는 모습이 떠오릅니다. 그 사이로 날카롭고 거친 화음이 갑자기 터져 나와, 스페인 민속춤의 열정과 긴장감을 생생하게 전하지요. 3분 남짓한 짧은 곡이지만, 피아니스트에게는 엄청난 기교를 요구합니다. 아르헤리치 같은 명피아니스트들이 연주회의 앙코르로 즐겨 연주하는 곡입니다. 스페인의 열정을 느껴 보세요."], ["10-27", "24개의 카프리스 중 24번", "파가니니", "독주", "기념일", "파가니니 탄생일(1782.10.27)", "1782년 10월 27일 이탈리아 제노바에서 태어난 '악마의 바이올리니스트' 니콜로 파가니니의 작품입니다. 파가니니는 무반주 바이올린을 위한 「24개의 카프리스」를 남겼는데, 이 곡들은 당시로서는 상상도 할 수 없을 만큼 어려운 기교를 담고 있어서 바이올린 연주의 한계를 크게 넓혔습니다. 그는 이 곡집에 '모든 예술가들에게'라는 헌사를 적었습니다. 그 마지막 곡인 24번은 짧고 단순한 주제와 열한 개의 변주, 그리고 마무리로 이루어져 있습니다. 주제는 단 몇 마디의 경쾌하고 날카로운 선율이지만, 변주가 거듭될 때마다 빠른 음계, 넓은 도약, 겹음, 하모닉스, 왼손 피치카토 등 바이올린이 낼 수 있는 거의 모든 기교가 쉴 새 없이 펼쳐집니다. 이 주제는 수많은 작곡가들을 사로잡아, 브람스, 리스트, 라흐마니노프, 루토스와프스키 등이 이 주제로 저마다의 변주곡을 썼습니다. 4월에 들었던 라흐마니노프의 「파가니니 주제에 의한 랩소디」도 바로 이 선율에서 출발했지요. 바이올린 하나로 펼치는 눈부신 마법 같은 음악입니다. 파가니니의 생일을 맞아, 악마의 바이올린 소리에 귀 기울여 보세요."], ["10-28", "메피스토 왈츠 1번", "리스트", "독주", "할로윈", "할로윈 주간, 악마의 왈츠", "리스트가 1859년부터 1862년 사이에 쓴 곡으로, 피아노곡과 관현악곡 두 가지 버전이 있습니다. 이 곡은 오스트리아 시인 레나우의 시 「파우스트」의 한 장면을 바탕으로 합니다. 학자 파우스트는 악마 메피스토펠레스와 계약을 맺고, 함께 시골 마을의 주점에 들어섭니다. 그곳에서는 마을 사람들이 결혼식 잔치를 벌이며 춤을 추고 있었지요. 메피스토는 서툰 악사에게서 바이올린을 빼앗아 직접 연주하기 시작하는데, 그 음악이 너무나 황홀하고 유혹적이어서 사람들은 미친 듯이 춤을 추게 됩니다. 그 사이 파우스트는 아름다운 마을 처녀와 춤을 추다가, 함께 문밖으로 빠져나가 숲속으로 사라집니다. 숲에서는 나이팅게일이 노래하지요. 곡은 메피스토가 바이올린을 조율하는 듯 날카롭게 쌓아 올리는 화음으로 시작해, 악마의 강렬하고 유혹적인 왈츠가 휘몰아칩니다. 가운데 부분에서는 파우스트와 처녀의 사랑을 그린 관능적이고 아름다운 선율이 흐르고, 나이팅게일의 지저귐이 들려옵니다. 그리고 다시 악마의 왈츠가 광란의 절정으로 치달으며 끝을 맺습니다. 할로윈 주간, 악마의 춤에 빠져 보세요."], ["10-29", "환상 교향곡 Op.14", "베를리오즈", "관현악", "할로윈", "할로윈 주간(5악장 '마녀의 밤')", "프랑스의 작곡가 베를리오즈가 스물여섯 살이던 1830년에 쓴 교향곡입니다. 베를리오즈는 파리에서 셰익스피어 연극을 공연하던 아일랜드 출신의 배우 해리엇 스미슨에게 첫눈에 반해 열렬히 사랑하게 되었지만, 그녀는 그의 마음을 받아 주지 않았습니다. 그 짝사랑의 고통과 열정을 쏟아부어 쓴 곡이 바로 이 교향곡입니다. 곡에는 '한 예술가의 생애의 에피소드'라는 부제가 붙어 있습니다. 사랑에 절망한 한 젊은 예술가가 독약을 먹고 깊은 잠에 빠져, 기괴하고 환상적인 꿈을 꾸는 이야기이지요. 사랑하는 여인은 곡 전체에 걸쳐 되풀이되는 하나의 선율로 나타나는데, 베를리오즈는 이를 '고정 악상'이라고 불렀습니다. 다섯 악장에서는 몽상과 열정, 화려한 무도회, 고요한 들판, 단두대로 향하는 행진이 차례로 펼쳐지고, 마지막 5악장 「마녀들의 밤의 향연」에서는 마녀와 괴물들이 모인 무시무시한 축제가 벌어집니다. 사랑하던 여인의 선율은 천박하게 일그러지고, 교회 종소리와 장례 성가 「분노의 날」이 뒤섞이며 광란의 절정에 이릅니다. 훗날 베를리오즈는 마침내 스미슨과 결혼했습니다. 할로윈 주간에 들어 보세요."], ["10-30", "교향곡 5번 「종교개혁」 Op.107", "멘델스존", "관현악", "기념일", "종교개혁 기념일(10.31) 전야", "멘델스존이 1830년에 쓴 교향곡입니다. 이 곡은 종교개혁의 중요한 사건인 '아우크스부르크 신앙고백'의 300주년을 기념하기 위해 쓰였습니다. 멘델스존은 유대인 학자 집안에서 태어났지만, 아버지가 개신교로 개종하면서 루터교 신자로 자랐습니다. 하지만 기념행사는 정치적 상황 때문에 제대로 열리지 못했고, 이 곡은 1832년에야 베를린에서 초연되었습니다. 멘델스존은 이 곡에 만족하지 못해 출판하지 않았고, 그가 세상을 떠난 뒤인 1868년에야 출판되면서 실제로는 두 번째로 쓴 교향곡인데도 '5번'이라는 번호가 붙었습니다. 1악장의 느린 서주에서는 현악기가 '드레스덴 아멘'이라 불리는 고요하고 신비로운 화음을 연주하는데, 이 선율은 훗날 바그너도 자신의 작품에 사용했습니다. 이 교향곡의 정점은 4악장입니다. 플루트가 홀로 종교개혁가 마르틴 루터가 지은 찬송가 「내 주는 강한 성이요」의 선율을 조용히 연주하고, 이 선율이 점점 여러 악기로 퍼져 나가 마침내 오케스트라 전체의 장엄하고 웅장한 찬가로 울려 퍼지며 끝을 맺습니다. 내일은 종교개혁 기념일입니다."], ["10-31", "죽음의 무도 Op.40", "생상스", "관현악", "할로윈", "할로윈. 한밤중 해골들의 춤", "프랑스의 작곡가 생상스가 1874년에 쓴 교향시입니다. 이 곡은 프랑스 시인 카잘리스의 시를 바탕으로 합니다. 유럽에는 중세부터 죽음의 신이 모든 사람을 춤추게 하여 무덤으로 데려간다는 '죽음의 무도' 전설이 전해집니다. 곡은 하프가 열두 번 같은 음을 울리며 시작하는데, 이것은 한밤중 자정을 알리는 종소리입니다. 그러자 무덤 위에 죽음의 신이 나타나 바이올린을 조율합니다. 독주 바이올린은 가장 높은 줄을 원래보다 반음 낮게 조율해, 옛날 '악마의 음정'이라 불리던 불길하고 기묘한 화음을 연주하지요. 이어 죽음의 신이 연주하는 으스스한 왈츠에 맞춰 해골들이 무덤에서 일어나 춤을 추기 시작합니다. 실로폰이 '달그락달그락' 해골의 뼈가 부딪치는 소리를 생생하게 그려 내고, 춤은 점점 격렬해지며 광란의 절정으로 치닫습니다. 그러다 갑자기 오보에가 새벽을 알리는 닭 울음소리를 내면, 해골들은 서둘러 무덤 속으로 사라지고 다시 고요가 찾아옵니다. 피겨스케이팅의 김연아 선수가 쇼트 프로그램 음악으로 사용해 우리에게 더욱 친숙해진 곡입니다. 할로윈 밤, 해골들의 춤을 즐겨 보세요."], ["11-1", "죽음의 섬 Op.29", "라흐마니노프", "관현악", "추모", "만성절, 위령의 달 시작", "라흐마니노프가 1909년 독일 드레스덴에 머물던 시기에 쓴 교향시입니다. 그는 스위스 화가 아르놀트 뵈클린의 그림 「죽음의 섬」의 흑백 복제본을 보고 깊은 인상을 받아 이 곡을 썼습니다. 그림에는 어둡고 고요한 바다 위로, 하얀 옷을 입은 사람과 관을 실은 작은 배가 사공의 노 젓는 소리와 함께 깎아지른 바위섬을 향해 다가가는 모습이 그려져 있습니다. 섬에는 검은 사이프러스 나무가 무덤처럼 서 있지요. 훗날 컬러로 된 원화를 본 라흐마니노프는 오히려 실망하며, 원화를 먼저 보았다면 이 곡을 쓰지 않았을 것이라고 말했다고 합니다. 곡은 낮은 현악기가 한 마디에 다섯 박을 세는 독특한 리듬으로 출렁이며 시작하는데, 이는 사공이 천천히 노를 저으며 물결을 가르는 모습입니다. 그 위로 중세의 장례 성가 「분노의 날」의 선율이 불길하게 떠오릅니다. 가운데 부분에서는 지나간 삶의 기쁨과 열정을 회상하는 듯한 따뜻한 선율이 흐르지만, 결국 다시 죽음의 노 젓는 소리가 돌아와 고요하게 끝을 맺습니다. 11월 1일은 모든 성인을 기리는 만성절입니다."], ["11-2", "프리메이슨 장송 음악 K.477", "모차르트", "관현악", "추모", "위령의 날(11.2)", "모차르트가 1785년, 그가 속해 있던 프리메이슨 지부의 두 회원이 세상을 떠났을 때 그들을 추모하는 의식을 위해 쓴 관현악곡입니다. 프리메이슨은 18세기 유럽에서 계몽사상을 바탕으로 인류애와 형제애, 평등을 추구했던 단체로, 모차르트는 1784년에 이 단체에 가입해 여러 의식 음악을 남겼습니다. 오페라 「마술피리」에도 프리메이슨의 상징이 가득 담겨 있지요. 이 곡은 6분 남짓한 짧은 곡이지만, 모차르트의 작품 가운데 가장 장엄하고 엄숙한 곡으로 꼽힙니다. 곡은 관악기의 무겁고 어두운 화음으로 시작하고, 현악기가 한숨처럼 애통한 선율을 이어 갑니다. 이어 오보에와 클라리넷이 옛 교회의 장례 성가 선율을 조용히 노래하는데, 그 주위를 현악기의 슬픈 선율이 감싸며 흐릅니다. 모차르트는 이 곡에 클라리넷과 비슷한 낮고 부드러운 악기인 바셋호른을 사용해, 깊고 그윽한 슬픔을 더했습니다. 마지막에는 어둠 속에서 뜻밖에 밝은 장조의 화음으로 끝나며, 죽음 너머의 희망과 위안을 전합니다. 11월 2일은 세상을 떠난 모든 이를 기억하는 위령의 날입니다. 그리운 이들을 떠올리며 들어 보세요."], ["11-3", "첼로 소나타 1번 e단조 Op.38", "브람스", "실내악", "가을", "늦가을의 브람스", "브람스가 1862년부터 1865년 사이에 쓴 첫 번째 첼로 소나타입니다. 브람스는 이 곡을 첼로를 즐겨 연주하던 친구에게 헌정했습니다. 브람스는 바흐를 비롯한 옛 거장들의 음악을 깊이 연구했는데, 이 소나타에도 그런 옛 음악에 대한 애정이 고스란히 담겨 있습니다. 1악장은 피아노의 조용한 화음 위로 첼로가 가장 낮은 음역에서 깊고 그윽한 선율을 노래하며 시작합니다. 첼로가 마치 사람의 낮은 목소리처럼 쓸쓸하고 애틋하게 노래하는 이 선율에는 늦가을의 차분한 우수가 가득합니다. 2악장은 18세기 궁정의 춤곡인 미뉴에트를 떠올리게 하는, 고풍스럽고 우아하면서도 어딘가 아련한 곡입니다. 3악장은 바흐의 「푸가의 기법」에 나오는 주제를 닮은 선율로, 첼로와 피아노가 같은 주제를 서로 쫓아가며 연주하는 힘차고 장엄한 푸가입니다. 브람스는 이 곡에서 피아노가 너무 크게 연주해 첼로 소리를 덮지 않도록 주의해야 한다고 강조했다고 합니다. 화려함보다는 진지하고 깊은 사색이 돋보이는 곡입니다. 낙엽이 쌓여 가는 늦가을, 첼로의 깊은 목소리에 귀 기울여 보세요."], ["11-4", "교향곡 3번 「스코틀랜드」 Op.56", "멘델스존", "관현악", "기념일", "멘델스존 서거일(1847.11.4)", "1847년 11월 4일, 서른여덟의 젊은 나이로 세상을 떠난 멘델스존의 교향곡입니다. 그해 5월 멘델스존은 가장 사랑하던 누나 파니를 갑자기 잃는 큰 충격을 겪었고, 그 슬픔에서 끝내 헤어나지 못한 채 몇 달 뒤 누나를 따라갔습니다. 이 교향곡의 시작은 그가 스무 살이던 1829년 스코틀랜드 여행으로 거슬러 올라갑니다. 그는 에든버러의 홀리루드 궁전에서, 비극적인 운명을 맞은 스코틀랜드의 메리 여왕이 머물던 폐허가 된 예배당을 보고, 그 자리에서 이 교향곡의 첫 선율을 악보에 적었습니다. 그러나 곡을 완성하기까지는 무려 13년이 걸렸지요. 1악장은 안개 낀 스코틀랜드의 고원처럼 쓸쓸하고 신비로운 서주로 시작합니다. 2악장은 클라리넷이 스코틀랜드 민요풍의 경쾌한 선율을 연주하는 활기찬 스케르초이고, 3악장은 깊고 서정적인 노래입니다. 4악장은 거친 전투처럼 격렬하게 몰아치다가, 마지막에 장엄한 찬가로 바뀌어 웅장하게 끝을 맺습니다. 네 악장은 쉬지 않고 이어서 연주됩니다. 멘델스존이 완성한 마지막 교향곡입니다. 짧았지만 빛났던 그의 삶을 기억하며 들어 보세요."], ["11-5", "피아노 3중주 2번 E♭장조 D.929", "슈베르트", "실내악", "가을", "늦가을 실내악", "슈베르트가 세상을 떠나기 1년 전인 1827년에 쓴 두 번째 피아노 3중주곡입니다. 슈베르트는 생전에 큰 작품을 출판할 기회가 적었는데, 이 곡은 그의 생전에 출판된 몇 안 되는 대작 가운데 하나입니다. 이 곡에서 가장 유명한 것은 2악장입니다. 피아노가 걸어가는 듯한 무거운 화음을 규칙적으로 짚는 가운데, 첼로가 깊고 애틋한 선율을 노래하며 시작하지요. 이 선율은 슈베르트가 친구들의 모임에서 들은 스웨덴 민요 「해가 지네」에서 영감을 받은 것으로 알려져 있습니다. 쓸쓸하면서도 묘하게 마음을 끄는 이 선율은 스탠리 큐브릭 감독의 영화 「배리 린든」에 쓰여 널리 알려졌습니다. 1악장은 힘차고 당당하게 시작해 넓고 웅장하게 펼쳐지고, 3악장은 두 성부가 서로 쫓아가는 돌림노래 형식의 경쾌한 스케르초입니다. 4악장은 밝은 분위기로 진행되다가, 중간에 2악장의 그 애틋한 첼로 선율이 다시 떠올라 곡 전체를 하나로 묶어 줍니다. 슈베르트 특유의 노래하는 선율과 깊은 서정이 가득한 곡입니다. 해가 일찍 저무는 늦가을 저녁, 첼로가 들려주는 노을빛 노래를 들어 보세요."], ["11-6", "교향곡 4번 f단조 Op.36", "차이콥스키", "관현악", "기념일", "차이콥스키 서거일(1893.11.6)", "1893년 11월 6일 상트페테르부르크에서 세상을 떠난 차이콥스키의 네 번째 교향곡입니다. 1877년 차이콥스키는 충동적으로 결혼했다가 몇 주 만에 파경을 맞으며 극심한 고통을 겪었는데, 이 교향곡은 바로 그 시기에 쓰였습니다. 같은 해 그는 철도 재벌의 미망인 폰 메크 부인으로부터 평생 연금을 지원받게 되었는데, 두 사람은 14년 동안 천 통이 넘는 편지를 주고받으면서도 한 번도 직접 만나지 않았습니다. 차이콥스키는 이 교향곡을 그녀에게 헌정하며 \"나의 가장 좋은 친구에게\"라고 적었습니다. 그는 편지에서 1악장 첫머리에 금관악기가 울리는 강렬한 팡파르를 두고, 행복을 가로막는 피할 수 없는 '운명'이라고 설명했습니다. 2악장은 오보에가 쓸쓸하게 노래하는 우수 어린 선율이고, 3악장은 현악기가 활을 쓰지 않고 오직 손가락으로 줄을 튕기는 피치카토로만 연주하는 독특하고 경쾌한 악장입니다. 4악장은 러시아 민요가 등장하는 떠들썩한 민중의 축제로, 다시 운명의 팡파르가 나타나지만 결국 축제의 환희 속에 힘차게 끝을 맺습니다. 차이콥스키를 기억하며 들어 보세요."], ["11-7", "교향곡 2번 D장조 Op.43", "시벨리우스", "관현악", "가을", "북구의 늦가을", "시벨리우스가 1901년부터 이듬해 사이에 쓴 교향곡으로, 그의 일곱 교향곡 가운데 가장 사랑받는 곡입니다. 시벨리우스는 1901년 이탈리아 북부의 바닷가 마을 라팔로에 머물며 이 곡을 구상하기 시작했고, 이듬해 헬싱키에서 직접 지휘해 초연했습니다. 당시 핀란드는 러시아의 지배 아래 있었기에, 많은 핀란드 사람들은 이 교향곡을 러시아의 압제에서 벗어나 자유를 향해 나아가는 핀란드 민족의 이야기로 받아들였습니다. 시벨리우스 자신은 그런 해석을 부인했지만, 이 곡은 지금도 핀란드 사람들의 자부심을 상징하는 곡으로 여겨집니다. 1악장은 현악기가 조용히 세 음을 오르내리는 소박한 동기로 시작해, 북유럽의 자연처럼 맑고 투명하게 펼쳐집니다. 2악장은 낮은 현악기의 피치카토 위로 바순이 쓸쓸한 선율을 노래하며 어둡고 극적으로 전개되고, 3악장은 숨 가쁘게 질주하는 스케르초입니다. 쉬지 않고 이어지는 4악장에서는 웅장하고 장엄한 주제가 점점 고조되어, 마침내 거대한 승리의 찬가처럼 찬란하게 끝을 맺습니다. 북유럽의 늦가을, 차갑고 맑은 공기를 느끼며 들어 보세요."], ["11-8", "교향곡 3번 「라인」 Op.97", "슈만", "관현악", "가을", "라인강의 가을", "슈만이 1850년, 독일 서부 라인강 변의 도시 뒤셀도르프의 음악감독으로 부임한 뒤 쓴 교향곡입니다. 슈만과 클라라는 새로운 도시에서의 생활에 큰 기대를 품었고, 슈만은 라인강 지방의 아름다운 풍경과 사람들의 밝고 활기찬 기질에 깊은 인상을 받아 이 곡을 썼습니다. 그래서 이 교향곡에는 「라인」이라는 별명이 붙었지요. 이 곡은 보통의 교향곡과 달리 다섯 악장으로 이루어져 있습니다. 1악장은 오케스트라 전체가 힘차고 환희에 찬 주제를 터뜨리며 시작하는데, 마치 넓고 웅장한 라인강이 힘차게 흘러가는 듯합니다. 2악장은 라인강을 오가는 배 위의 흥겨운 노래 같은 소박한 춤곡이고, 3악장은 부드럽고 서정적인 간주곡입니다. 4악장은 슈만이 쾰른 대성당에서 열린 장엄한 의식을 보고 영감을 받은 곡으로, 트롬본이 엄숙하고 경건한 화음을 울리며 거대한 고딕 성당의 신비로운 분위기를 그려 냅니다. 5악장은 다시 밝고 활기찬 축제로 마무리됩니다. 그러나 4년 뒤, 정신 질환에 시달리던 슈만은 바로 이 라인강에 몸을 던지고 맙니다. 라인강의 가을 풍경을 떠올리며 들어 보세요."], ["11-9", "피아노 협주곡 5번 「황제」 Op.73", "베토벤", "협주곡", "일반", "피아노 협주곡의 황제", "베토벤이 1809년에 완성한 마지막 피아노 협주곡입니다. 이 곡을 쓰던 1809년 봄, 나폴레옹의 군대가 빈을 포위하고 포격을 퍼부었습니다. 이미 청력이 크게 나빠져 있던 베토벤은 남은 청력마저 잃을까 두려워, 동생 집 지하실에 숨어 베개로 귀를 막고 포격을 견뎠다고 합니다. 「황제」라는 별명은 베토벤이 붙인 것이 아니라, 훗날 영어권의 출판업자가 이 곡의 웅장하고 위엄 있는 성격에 어울리도록 붙인 것으로 알려져 있습니다. 1악장은 오케스트라가 힘찬 화음을 울리자마자 피아노가 화려한 독주를 쏟아 내며 시작합니다. 보통은 오케스트라의 긴 서주 뒤에 피아노가 등장하는데, 베토벤은 처음부터 피아노를 당당하게 내세웠지요. 2악장은 현악기가 경건하고 고요한 찬송가 같은 선율을 연주하고, 피아노가 그 위에서 꿈결처럼 부드러운 노래를 들려줍니다. 그리고 악장의 끝에서 피아노가 다음 악장의 주제를 조용히 예고하더니, 쉬지 않고 이어지는 3악장에서 그 주제가 힘차고 기쁨에 찬 춤곡으로 폭발합니다. 전쟁의 포화 속에서 피어난 웅장한 승리의 음악을 들어 보세요."], ["11-10", "「신비한 바리케이드」", "쿠프랭", "독주", "기념일", "쿠프랭 탄생일(1668.11.10)", "1668년 11월 10일 파리에서 태어난 프랑수아 쿠프랭의 하프시코드 곡입니다. 쿠프랭은 음악가 집안 출신으로, 같은 이름의 다른 음악가들과 구별하기 위해 '대 쿠프랭'이라고 불렸습니다. 그는 루이 14세의 궁정에서 활동하며, 프랑스 바로크 하프시코드 음악의 정수를 보여 주는 수많은 작품을 남겼습니다. 이 곡은 1717년에 출판된 곡집에 실려 있는데, '신비로운 바리케이드'라는 수수께끼 같은 제목이 무엇을 뜻하는지는 지금도 정확히 알려져 있지 않습니다. 여인의 마음을 가로막는 정숙함이라는 해석, 속눈썹이라는 해석, 연극 무대의 가면이라는 해석 등 여러 가지 상상이 이어지고 있지요. 곡은 처음부터 끝까지 여러 성부가 조금씩 엇갈려 늦게 울리며 서로 겹쳐지는 음들로 이루어져 있습니다. 하나의 음이 채 사라지기 전에 다음 음이 울리면서, 마치 잔잔한 물결이 끝없이 이어지듯 신비롭고 몽환적인 울림을 만들어 냅니다. 이 기법은 류트를 연주하는 방식에서 비롯된 것입니다. 2분 남짓한 짧은 곡이지만, 한 번 들으면 그 은은한 울림이 오래 마음에 남습니다. 늦가을의 고요함 속에서 들어 보세요."], ["11-11", "쿠프랭의 무덤", "라벨", "독주", "추모", "1차대전 종전기념일. 각 곡이 전사한 친구들에게 헌정", "라벨이 1914년부터 1917년 사이에 쓴 피아노 모음곡입니다. 1차 세계대전이 일어나자 라벨은 군대에 지원했지만, 몸이 약해 트럭 운전병으로 전선에 나갔습니다. 그는 전쟁터에서 많은 친구들을 잃었고, 1917년에는 가장 사랑하던 어머니마저 세상을 떠나는 큰 슬픔을 겪었습니다. 이 모음곡의 여섯 곡은 각각 전쟁에서 목숨을 잃은 라벨의 친구 한 명씩에게 바쳐졌습니다. '무덤'은 바로크 시대 프랑스에서 세상을 떠난 이를 기리기 위해 쓰던 음악 장르의 이름으로, 라벨은 이 곡을 통해 18세기 프랑스의 위대한 작곡가 쿠프랭과 프랑스의 옛 음악 전통에도 경의를 표했습니다. 그런데 이 곡은 추모곡인데도 어둡거나 비통하지 않고, 오히려 맑고 우아하며 밝은 분위기로 가득합니다. 라벨은 그 이유에 대해, 죽은 이들은 이미 영원한 침묵 속에서 충분히 슬프다는 취지의 말을 남겼다고 합니다. 「전주곡」, 「푸가」, 「포를란」, 「리고동」, 「미뉴에트」, 「토카타」로 이어지는 곡들은 옛 춤곡의 형식에 라벨의 섬세한 감성을 담았습니다. 1차 세계대전이 끝난 날, 평화를 기도하며 들어 보세요."], ["11-12", "중앙아시아의 초원에서", "보로딘", "관현악", "기념일", "보로딘 탄생일(1833.11.12)", "1833년 11월 12일 상트페테르부르크에서 태어난 알렉산드르 보로딘의 교향시입니다. 보로딘은 러시아를 대표하는 작곡가이지만, 본업은 화학자이자 의학 교수였습니다. 그는 평생 연구와 강의로 바빠서 작곡은 주로 아플 때나 쉬는 날에만 할 수 있었기에, 스스로를 '일요일의 작곡가'라고 불렀습니다. 그래서 그의 오페라는 끝내 미완성으로 남았지요. 이 곡은 1880년 러시아 황제의 즉위 25주년을 기념하는 행사를 위해 쓰였습니다. 보로딘은 악보에 이 곡의 내용을 직접 적어 두었습니다. 끝없이 펼쳐진 중앙아시아의 고요한 초원에서 낯익은 러시아 노래가 들려오고, 멀리서 말과 낙타의 발소리와 함께 동양의 구슬픈 선율이 다가옵니다. 러시아 군대의 호위를 받으며 지나가는 상인들의 행렬이 점점 가까워졌다가 다시 멀어져 가는 모습이지요. 곡에서는 클라리넷이 러시아 선율을, 잉글리시 호른이 동양의 선율을 노래하는데, 나중에는 두 선율이 동시에 어우러지며 아름다운 조화를 이룹니다. 서로 다른 두 세계가 하나로 만나는 순간입니다. 그리고 행렬은 초원 저편으로 사라져 갑니다. 보로딘은 이 곡을 리스트에게 헌정했습니다."], ["11-13", "사계 Op.37 중 「11월: 트로이카」", "차이콥스키", "독주", "계절 표제", "표제 자체가 11월", "차이콥스키의 피아노 모음곡 「사계」 가운데 11월의 곡입니다. 러시아의 11월은 첫눈이 내리고 겨울이 시작되는 계절로, 사람들은 세 마리 말이 끄는 썰매 '트로이카'를 타고 눈 덮인 들판을 달렸습니다. 이 곡에는 시인 네크라소프의 시에서 따온, 길을 쓸쓸히 바라보지 말고 트로이카를 뒤쫓아 서둘러 달려가지 말라는 구절이 붙어 있습니다. 곡은 부드럽고 정겨운 선율로 시작하는데, 마치 눈 덮인 넓은 들판 위로 썰매가 미끄러지듯 나아가는 모습 같습니다. 이어 썰매 방울이 딸랑딸랑 울리는 듯한 맑고 경쾌한 음형이 나타나며, 트로이카가 점점 속도를 높여 신나게 달려갑니다. 말발굽 소리와 방울 소리, 차가운 바람을 가르며 달리는 썰매 위의 즐거움이 생생하게 그려지지요. 그리고 다시 처음의 정겨운 선율로 돌아와, 썰매가 멀리 사라져 가듯 방울 소리가 점점 작아지며 끝을 맺습니다. 「사계」 가운데 가장 사랑받는 곡 가운데 하나로, 라흐마니노프가 연주회의 앙코르로 즐겨 연주했습니다. 첫눈을 기다리는 11월, 트로이카를 타고 겨울 속으로 달려가 보세요."], ["11-14", "「로데오」 중 「호다운」", "코플런드", "관현악", "기념일", "코플런드 탄생일(1900.11.14)", "1900년 11월 14일 뉴욕 브루클린에서 태어난 에런 코플런드가 1942년에 쓴 발레 음악 「로데오」의 마지막 곡입니다. 코플런드는 미국의 넓은 대지와 소박한 사람들의 삶을 음악에 담아, '미국 음악의 아버지'로 불립니다. 발레 「로데오」는 미국 서부의 목장을 배경으로, 카우보이들 사이에서 인정받고 싶어 하는 말괄량이 카우걸이 우여곡절 끝에 사랑을 찾는 이야기입니다. '호다운'은 미국 시골에서 사람들이 모여 바이올린 연주에 맞춰 신나게 추는 민속춤 파티를 말합니다. 곡은 오케스트라 전체가 힘차게 화음을 울리며 시작하고, 이어 바이올린이 미국 민요를 바탕으로 한 경쾌한 선율을 신나게 연주합니다. 마치 시골 마을 헛간에 모인 사람들이 장화를 신고 발을 구르며 짝을 바꾸어 가며 춤추는 모습 같지요. 실로폰, 나무 블록, 피아노 같은 타악기가 경쾌한 리듬을 더하고, 축제의 열기는 점점 고조되어 신나는 절정에서 끝을 맺습니다. 4분 남짓한 짧은 곡이지만, 미국 서부의 활기와 흥이 가득합니다. 미국에서는 광고와 방송에 자주 쓰여 누구나 아는 곡입니다. 코플런드의 생일에 들어 보세요."], ["11-15", "피아노 협주곡 1번 d단조 Op.15", "브람스", "협주곡", "가을", "늦가을의 장대한 브람스", "브람스가 1854년부터 1858년 사이에 쓴 첫 번째 피아노 협주곡입니다. 1854년, 브람스를 세상에 알려 준 은인이자 스승인 슈만이 정신 질환으로 라인강에 몸을 던졌다가 구조되어 요양원에 들어갔습니다. 큰 충격을 받은 스물한 살의 브람스는 이 곡을 처음에는 두 대의 피아노를 위한 소나타로 쓰기 시작했다가, 교향곡으로 바꾸려 했고, 마침내 피아노 협주곡으로 완성했습니다. 1859년 초연 당시에는 너무 무겁고 교향곡 같다며 청중의 야유를 받았지만, 지금은 낭만주의 피아노 협주곡의 걸작으로 꼽힙니다. 1악장은 팀파니가 천둥처럼 굉음을 울리는 가운데, 오케스트라가 격렬하고 비극적인 주제를 터뜨리며 시작합니다. 마치 거센 폭풍이 몰아치는 듯한 이 첫머리는 슈만의 비극에 대한 충격과 슬픔을 담고 있다고 여겨집니다. 2악장은 고요하고 경건한 기도 같은 음악으로, 브람스는 클라라에게 보낸 편지에서 이 악장을 '당신의 부드러운 초상화'라고 표현했습니다. 3악장은 힘찬 론도로, 비극을 이겨 내고 당당하게 마무리됩니다. 젊은 브람스의 뜨거운 열정과 깊은 슬픔을 느껴 보세요."], ["11-16", "베버 주제에 의한 교향적 변용", "힌데미트", "관현악", "기념일", "힌데미트 탄생일(1895.11.16)", "1895년 11월 16일 독일 하나우에서 태어난 파울 힌데미트가 1943년, 미국 망명 시절에 쓴 관현악곡입니다. 힌데미트는 나치 정권으로부터 '퇴폐 음악가'로 낙인찍혀 작품 연주를 금지당하자 독일을 떠나 미국으로 건너갔고, 예일 대학교에서 학생들을 가르쳤습니다. 이 곡은 19세기 독일 작곡가 베버가 쓴 피아노 연탄곡과 연극 음악의 주제를 가져와, 20세기의 화려하고 현대적인 관현악으로 새롭게 탈바꿈시킨 작품입니다. '교향적 변용'이라는 제목처럼, 옛 선율이 완전히 새로운 모습으로 변신하지요. 곡은 네 악장으로 이루어져 있습니다. 1악장은 힘차고 박력 넘치게 시작하고, 2악장 「투란도트」는 중국의 공주 투란도트 이야기를 다룬 연극을 위해 베버가 쓴 중국풍 선율을 바탕으로 합니다. 이 선율이 여러 악기로 옮겨 가며 변주되다가, 갑자기 재즈풍의 푸가로 바뀌고, 마지막에는 타악기들이 신나게 활약하며 화려하게 펼쳐집니다. 3악장은 플루트가 아름답게 노래하는 서정적인 악장이고, 4악장은 금관악기가 웅장하게 울리는 행진곡입니다. 옛것과 새것이 만나는 즐거움을 느껴 보세요."], ["11-17", "교향곡 40번 g단조 K.550", "모차르트", "관현악", "가을", "낙엽 지는 가을", "모차르트가 1788년 여름, 불과 6주 남짓한 사이에 완성한 세 교향곡 가운데 두 번째 곡입니다. 모차르트는 마흔한 곡의 교향곡을 남겼는데, 그 가운데 단조로 쓴 곡은 단 두 곡뿐이며, 모두 같은 조성입니다. 이 곡은 그중 하나로, 모차르트의 교향곡 가운데 가장 유명하고 사랑받는 곡입니다. 1악장은 비올라가 잔잔하게 물결치는 반주를 시작하자마자, 바이올린이 한숨을 쉬듯 애틋하고 불안한 선율을 노래하며 시작합니다. 이 첫 선율은 누구나 한 번쯤 들어 보았을 만큼 친숙하지요. 서늘하고 쓸쓸한 기운이 가득한 이 악장은 마치 낙엽이 바람에 흩날리는 늦가을 풍경 같습니다. 2악장은 부드럽고 고요한 느린 악장이고, 3악장은 단조의 힘차고 단호한 미뉴에트입니다. 4악장은 쉴 새 없이 질주하는 격렬하고 긴장감 넘치는 피날레로 마무리됩니다. 이 무렵 모차르트는 생활이 어려워 친구에게 돈을 빌려 달라는 편지를 여러 번 보내기도 했는데, 그런 시기에 이토록 완벽한 교향곡을 썼다는 것이 놀랍습니다. 슈베르트는 이 곡을 두고 천사들이 노래하는 것 같다고 말했다고 합니다. 늦가을의 쓸쓸함을 느껴 보세요."], ["11-18", "무도에의 권유 Op.65", "베버", "독주", "기념일", "베버 탄생일(1786.11.18)", "1786년 11월 18일 독일 오이틴에서 태어난 카를 마리아 폰 베버가 1819년에 쓴 피아노곡입니다. 베버는 독일 낭만주의 오페라의 문을 연 작곡가로, 이 곡을 결혼한 지 얼마 되지 않은 아내에게 헌정했습니다. 이 곡은 무도회에서 한 신사가 숙녀에게 춤을 청하고, 함께 왈츠를 춘 뒤 정중히 인사하고 헤어지는 장면을 그린 곡입니다. 곡은 낮은 음역의 정중한 선율로 시작하는데, 이는 신사가 숙녀에게 다가가 춤을 청하는 모습입니다. 높은 음역의 선율이 수줍게 대답하면, 몇 번의 대화 끝에 숙녀가 마침내 손을 내밀지요. 이어 두 사람은 우아하고 화려한 왈츠를 추며 무도회장을 빙글빙글 돕니다. 왈츠가 끝나면 다시 처음의 낮은 선율이 나타나, 신사가 숙녀에게 감사의 인사를 건네며 조용히 마무리됩니다. 그래서 연주회에서 왈츠가 끝나는 순간 청중이 곡이 끝난 줄 알고 박수를 치는 일이 종종 있습니다. 이 곡은 춤을 추기 위한 음악이 아니라 감상하기 위한 왈츠의 시초로 평가받으며, 훗날 베를리오즈가 관현악으로 편곡해 더욱 유명해졌습니다. 우아한 무도회에 초대받은 기분으로 들어 보세요."], ["11-19", "현악4중주 「죽음과 소녀」 D.810", "슈베르트", "실내악", "기념일", "슈베르트 서거일(1828.11.19)", "1828년 11월 19일, 서른한 살의 젊은 나이로 세상을 떠난 슈베르트가 1824년에 쓴 현악 4중주곡입니다. 이 무렵 슈베르트는 중병에 걸려 건강이 크게 나빠졌고, 친구에게 보낸 편지에서 자신을 \"세상에서 가장 불행하고 비참한 사람\"이라고 표현할 만큼 깊은 절망에 빠져 있었습니다. 이 곡의 2악장은 슈베르트가 젊은 시절 쓴 가곡 「죽음과 소녀」의 선율을 주제로 한 변주곡입니다. 이 가곡은 죽음을 두려워하며 살려 달라고 애원하는 소녀에게, 죽음이 \"두려워 마라, 나는 친구로서 너를 위로하러 왔다\"고 다정하게 속삭이는 내용이지요. 그래서 곡 전체에 죽음에 대한 공포와 체념, 그리고 위안이 함께 깃들어 있습니다. 1악장은 네 대의 현악기가 강렬하고 비극적인 화음을 내리치며 시작해, 격렬한 투쟁을 펼칩니다. 2악장의 주제는 장례 행렬처럼 엄숙하고 고요하며, 변주가 거듭될수록 다양한 감정이 펼쳐집니다. 4악장은 빠르고 격렬한 춤곡으로, 마치 죽음의 춤처럼 숨 가쁘게 질주하며 끝을 맺습니다. 슈베르트는 평생 존경하던 베토벤의 곁에 묻히기를 원했고, 그 바람대로 되었습니다. 그를 기억하며 들어 보세요."], ["11-20", "「로미오와 줄리엣」 모음곡 2번", "프로코피예프", "관현악", "일반", "발레 음악 명곡", "프로코피예프가 1935년부터 이듬해 사이에 쓴 발레 음악 「로미오와 줄리엣」에서 고른 곡들로 엮은 두 번째 관현악 모음곡입니다. 셰익스피어의 비극을 바탕으로 한 이 발레는 처음에 모스크바의 볼쇼이 극장이 의뢰했지만, 무용수들이 음악이 너무 복잡해서 춤을 출 수 없다며 거부했습니다. 그래서 발레는 1938년 체코에서 먼저 초연되었고, 이후 소련에서도 공연되며 20세기 최고의 발레 음악 가운데 하나가 되었습니다. 발레가 무대에 오르지 못하는 동안 프로코피예프는 발레 음악에서 곡들을 골라 관현악 모음곡을 만들어 먼저 발표했습니다. 2번 모음곡의 첫 곡 「몬터규가와 캐퓰릿가」는 원수 사이인 두 가문을 그린 곡으로, 금관악기가 위협적인 불협화음을 터뜨린 뒤, 육중하고 위엄 있는 행진 리듬이 무겁게 이어집니다. 이 선율은 광고와 방송에 자주 쓰여 무척 친숙합니다. 이어 장난기 많고 사랑스러운 소녀 줄리엣, 두 연인의 결혼을 돕는 로렌스 신부, 그리고 줄리엣의 무덤 앞에서 슬퍼하는 로미오의 비통한 음악이 차례로 펼쳐집니다. 비극적인 사랑 이야기를 음악으로 따라가 보세요."], ["11-21", "바이올린 소나타 3번 d단조 Op.108", "브람스", "실내악", "가을", "늦가을의 브람스", "브람스가 1886년부터 1888년 사이, 스위스의 아름다운 툰 호숫가에서 여름을 보내며 쓴 세 번째 바이올린 소나타입니다. 브람스는 이 곡을 지휘자이자 피아니스트로 자신의 음악을 널리 알려 준 친구 뷜로에게 헌정했습니다. 앞의 두 바이올린 소나타가 부드럽고 서정적인 세 악장으로 이루어진 것과 달리, 이 곡은 네 악장으로 되어 있으며, 더 극적이고 열정적인 성격을 지니고 있습니다. 1악장은 피아노의 불안하게 흔들리는 반주 위로 바이올린이 애수 어린 선율을 노래하며 시작합니다. 특히 악장의 중간에서 피아노의 낮은 음이 오랫동안 같은 음을 울리는 가운데 바이올린이 신비롭게 노래하는 부분은 무척 인상적입니다. 2악장 아다지오는 이 곡에서 가장 사랑받는 부분으로, 바이올린이 낮은 음역에서 깊고 따뜻한 노래를 들려주는데, 늦가을의 쓸쓸한 아름다움이 가득합니다. 3악장은 짧고 장난스러운 간주곡이고, 4악장은 폭풍처럼 격렬하고 열정적으로 몰아치며 극적으로 끝을 맺습니다. 원숙한 브람스의 깊은 서정과 열정이 함께 담긴 곡입니다. 늦가을, 브람스의 깊은 노래에 귀 기울여 보세요."], ["11-22", "볼레로", "라벨", "관현악", "기념일", "초연일(1928.11.22). 음악의 수호성인 성 체칠리아 축일", "1928년 11월 22일 파리 오페라 극장에서 초연된 라벨의 발레 음악입니다. 오늘은 음악의 수호성인 성 체칠리아의 축일이기도 합니다. 이 곡은 무용가 이다 루빈시테인의 의뢰로 쓰였는데, 라벨은 이 곡을 두고 '음악이 없는 관현악의 직물'이라고 설명했습니다. 곡은 처음부터 끝까지 작은북이 똑같은 리듬을 백 번이 넘게 반복하는 가운데, 두 개의 선율이 번갈아 가며 열여덟 번이나 되풀이됩니다. 선율 자체는 전혀 바뀌지 않고, 선율을 연주하는 악기만 계속 바뀌지요. 플루트, 클라리넷, 바순, 색소폰, 트럼펫 등 다양한 악기가 차례로 선율을 이어받고, 악기가 하나씩 더해질 때마다 소리는 점점 커지고 풍성해집니다. 아주 작은 소리로 시작한 음악은 15분 동안 끊임없이 커지다가, 마지막 순간 갑자기 조성이 바뀌며 거대한 폭발과 함께 끝을 맺습니다. 초연 때 한 여성 관객이 \"미쳤어!\"라고 외치자, 라벨이 \"그녀는 이 곡을 이해했군\"이라고 말했다는 일화가 전해집니다. 1984년 동계 올림픽에서는 영국의 아이스댄스 선수들이 이 곡에 맞춰 만점 연기를 펼쳐 화제가 되었습니다. 끝없이 커지는 소리의 마법을 느껴 보세요."], ["11-23", "「사랑은 마술사」 중 「불의 춤」", "파야", "관현악", "기념일", "파야 탄생일(1876.11.23)", "1876년 11월 23일 스페인 남부의 항구 도시 카디스에서 태어난 마누엘 데 파야의 작품입니다. 파야는 스페인 남부 안달루시아 지방의 집시 음악과 플라멩코를 클래식 음악에 담아낸 스페인 근대 음악의 대표 작곡가입니다. 이 곡은 1915년에 쓴 발레 음악 「사랑은 마술사」에 나오는 곡으로, 발레는 안달루시아의 집시 마을을 배경으로 합니다. 집시 여인 칸델라스는 새로운 사랑을 시작하려 하지만, 질투심 많던 옛 연인의 유령이 밤마다 나타나 그녀를 괴롭힙니다. 그래서 칸델라스는 유령을 쫓아내기 위해 한밤중 모닥불 주위에서 신비로운 의식의 춤을 추지요. 곡은 낮고 떨리는 트릴로 시작하는데, 마치 어둠 속에서 모닥불이 타오르기 시작하는 듯합니다. 이어 오보에가 집시풍의 주술적인 선율을 노래하고, 강렬하게 반복되는 리듬 위에서 불꽃처럼 타오르는 춤이 점점 격렬해집니다. 그리고 마지막에는 같은 화음이 여러 번 힘차게 반복되며 불길이 하늘로 솟구치듯 끝을 맺습니다. 피아니스트 아르투르 루빈스타인이 피아노로 편곡해 앙코르로 즐겨 연주하면서 피아노곡으로도 유명해졌습니다. 타오르는 불꽃의 춤을 느껴 보세요."], ["11-24", "심플 심포니 Op.4", "브리튼", "관현악", "기념일", "브리튼 탄생 주간(1913.11.22)", "1913년 11월 22일 영국에서 태어난 벤저민 브리튼이 스무 살 무렵인 1933년부터 이듬해 사이에 쓴 현악곡입니다. 브리튼은 어린 시절부터 놀라운 재능을 보였는데, 이 곡은 그가 아홉 살에서 열두 살 사이에 썼던 피아노곡과 노래들의 선율을 다시 가져와 현악 합주곡으로 새롭게 엮은 것입니다. 어린 시절의 자신이 쓴 선율에 어른이 된 자신이 새 옷을 입혀 준 셈이지요. 곡은 네 악장으로 이루어져 있고, 각 악장에는 재미있는 제목이 붙어 있습니다. 1악장 「요란한 부레」는 힘차고 활기찬 옛 춤곡이고, 2악장 「장난스러운 피치카토」는 현악기가 활을 쓰지 않고 손가락으로만 줄을 튕기며 경쾌하고 재치 있게 뛰어노는 곡입니다. 3악장 「감상적인 사라반드」는 깊고 서정적인 선율이 애틋하게 흐르는 느린 춤곡이고, 4악장 「익살스러운 피날레」는 신나게 질주하며 유쾌하게 마무리됩니다. 아이다운 순수함과 젊은 작곡가의 재치가 어우러진 이 곡은 연주하기에도 즐거워, 학교와 청소년 오케스트라에서 즐겨 연주하는 곡입니다. 브리튼의 생일 주간, 소년의 상상력이 담긴 음악을 들어 보세요."], ["11-25", "발라드 4번 f단조 Op.52", "쇼팽", "독주", "가을", "늦가을 쇼팽", "쇼팽이 1842년에 쓴 네 곡의 발라드 가운데 마지막 곡입니다. 많은 음악가들은 이 곡을 쇼팽의 모든 작품 가운데 최고의 걸작으로 꼽습니다. 이 무렵 쇼팽은 연인 조르주 상드의 시골 별장 노앙에서 여름을 보내며, 그의 생애에서 가장 원숙하고 깊이 있는 작품들을 쓰고 있었습니다. 곡은 같은 음이 조용히 반복되는 짧은 서주로 시작하는데, 마치 누군가가 옛이야기를 들려주기 전에 잠시 숨을 고르는 듯합니다. 이어 쓸쓸하고 애틋한 왈츠 리듬의 첫 주제가 나타나는데, 이 주제는 곡 전체에 걸쳐 여러 번 돌아오며, 돌아올 때마다 점점 더 화려하고 깊은 감정을 담아 변주됩니다. 그 사이로 따뜻하고 부드러운 둘째 주제가 나타나, 꿈결 같은 위로와 희망을 전합니다. 그리고 곡의 마지막 부분에서는 고요한 화음이 몇 번 조용히 울린 뒤, 갑자기 폭풍처럼 격렬하고 비극적인 마무리가 휘몰아치며 끝을 맺습니다. 화려한 기교와 깊은 서정, 극적인 서사가 완벽하게 어우러진 곡입니다. 피아니스트들에게 가장 어려운 곡 가운데 하나로 꼽힙니다. 늦가을 밤, 쇼팽이 들려주는 비극의 서사시를 들어 보세요."], ["11-26", "바이올린 소나타 3번 c단조 Op.45", "그리그", "실내악", "가을", "늦가을 실내악", "그리그가 1886년부터 이듬해 사이에 쓴 세 번째이자 마지막 바이올린 소나타입니다. 그리그는 평생 세 곡의 바이올린 소나타를 남겼는데, 그는 첫 번째 곡은 순수하고 꿈이 많으며, 두 번째 곡은 노르웨이의 민족적인 색채가 짙고, 세 번째 곡은 더 넓은 시야를 지니고 있다고 스스로 설명했습니다. 이 곡은 세 곡 가운데 가장 극적이고 열정적이며, 그리그의 실내악 가운데 가장 많이 연주되는 곡입니다. 1악장은 바이올린이 힘차고 격정적인 주제를 터뜨리며 시작하는데, 노르웨이의 거친 바다와 험준한 산처럼 강렬하고 비장한 분위기를 자아냅니다. 2악장 '로망스'는 이 곡에서 가장 아름다운 부분으로, 피아노가 먼저 따뜻하고 서정적인 선율을 노래하고, 바이올린이 이를 받아 깊은 감정을 담아 노래합니다. 가운데 부분에서는 노르웨이 민속춤 같은 경쾌한 리듬이 나타났다가 다시 처음의 고요한 노래로 돌아오지요. 3악장은 다시 열정적이고 힘찬 분위기로 돌아와, 승리의 환희 속에 장엄하게 끝을 맺습니다. 노르웨이의 늦가을, 바람이 거세게 부는 피오르의 풍경을 떠올리며 들어 보세요."], ["11-27", "피아노 3중주 4번 「둠키」 Op.90", "드보르자크", "실내악", "가을", "늦가을 실내악", "드보르자크가 1890년부터 이듬해 사이에 쓴 네 번째 피아노 3중주곡입니다. '둠키'는 슬라브 지방의 민요 형식인 '둠카'의 복수형입니다. 5월에 들었던 드보르자크의 피아노 5중주에도 둠카 악장이 있었지요. 둠카는 슬프고 느린 부분과 빠르고 흥겨운 부분이 갑자기 번갈아 나타나는 것이 특징으로, 슬픔과 기쁨 사이를 순식간에 오가는 슬라브 사람들의 감정을 잘 보여 줍니다. 이 곡은 여섯 악장이 모두 둠카로 이루어져 있어, 보통의 소나타 형식을 완전히 벗어난 독특한 작품입니다. 각 악장은 깊은 슬픔과 그리움의 노래로 시작했다가, 갑자기 분위기가 바뀌어 신나고 흥겨운 춤으로 변하고, 다시 쓸쓸한 노래로 돌아오기를 반복합니다. 첼로가 노래하는 애수 어린 선율, 피아노의 반짝이는 춤곡, 바이올린의 그리움이 가득한 노래가 차례로 펼쳐지며 마치 여섯 편의 짧은 이야기를 듣는 듯합니다. 이 곡은 드보르자크가 미국으로 떠나기 전 고국에서 연 고별 연주 여행에서 수십 번이나 연주되며 큰 사랑을 받았습니다. 슬픔과 기쁨이 함께하는 삶을 노래한 곡입니다. 늦가을 저녁에 들어 보세요."], ["11-28", "교향적 무곡 Op.45", "라흐마니노프", "관현악", "일반", "라흐마니노프의 마지막 작품", "라흐마니노프가 1940년, 미국 뉴욕 롱아일랜드에서 쓴 관현악곡으로, 그가 완성한 마지막 작품입니다. 러시아 혁명 이후 조국을 떠나 미국에서 피아니스트로 활동하던 라흐마니노프는 연주 여행으로 바빠 작곡할 시간이 거의 없었습니다. 그런 그가 생애 마지막으로 남긴 이 곡에는 평생의 기억과 고향을 향한 그리움, 그리고 죽음에 대한 사색이 담겨 있습니다. 곡은 세 악장으로 이루어져 있습니다. 1악장은 힘차고 리드미컬한 행진으로 시작하는데, 가운데 부분에서 알토 색소폰이 러시아의 애틋한 선율을 노래합니다. 그리고 악장의 끝부분에서는 젊은 시절 참담하게 실패했던 교향곡 1번의 주제가 조용히 회상되는데, 이는 라흐마니노프만이 아는 비밀스러운 인사였습니다. 2악장은 어둡고 몽환적인 그림자 같은 왈츠이고, 3악장에서는 중세의 장례 성가 「분노의 날」과 러시아 정교회의 성가가 서로 맞서며 격렬하게 부딪칩니다. 그리고 마침내 정교회의 성가가 승리하며 장엄하게 끝을 맺지요. 라흐마니노프는 악보 마지막에 \"신께 감사드린다\"라고 적었습니다. 3년 뒤 그는 세상을 떠났습니다. 거장의 마지막 춤을 들어 보세요."], ["11-29", "코랄 전주곡 「이제 오소서, 이방인의 구세주여」 BWV 659", "바흐", "독주", "대림·성탄", "대림절 시작 무렵(이동 축일)", "바흐가 라이프치히 시절에 정리한 「18개의 코랄 전주곡」에 실린 오르간곡입니다. '대림절'은 크리스마스를 앞두고 4주 동안 아기 예수의 오심을 기다리며 준비하는 기간으로, 해마다 11월 말이나 12월 초에 시작됩니다. 이 곡의 바탕이 된 찬송가 「이제 오소서, 이방인의 구세주여」는 종교개혁가 마르틴 루터가 옛 라틴어 찬송을 독일어로 옮긴 것으로, 대림절의 첫 주일에 부르는 가장 대표적인 찬송가입니다. 바흐는 이 찬송가를 바탕으로 여러 곡의 오르간곡과 칸타타를 썼는데, 이 곡은 그 가운데 가장 아름다운 곡으로 꼽힙니다. 곡은 발로 연주하는 페달 건반이 한 걸음 한 걸음 천천히 걸어가듯 규칙적으로 낮은 음을 울리는 가운데, 가운데 성부들이 부드러운 화음을 받쳐 줍니다. 그 위로 높은 성부가 찬송가의 선율을 섬세하고 풍부한 꾸밈음으로 장식하며, 마치 간절한 기도처럼 애틋하고 아름답게 노래하지요. 메시아를 기다리는 사람들의 경건하고 간절한 마음이 고스란히 전해집니다. 이 곡은 이탈리아의 피아니스트이자 작곡가 부조니가 피아노곡으로 편곡하면서 더욱 널리 알려졌습니다. 기다림의 계절을 시작하며 들어 보세요."], ["11-30", "연습곡 「겨울바람」 Op.25-11", "쇼팽", "독주", "겨울", "초겨울 찬바람", "쇼팽이 1834년부터 1836년 사이에 쓴 열두 곡의 연습곡 작품 25 가운데 열한 번째 곡입니다. 쇼팽의 연습곡 가운데에서도 가장 어렵고 웅장한 곡으로 꼽히며, 「겨울바람」이라는 별명은 쇼팽이 붙인 것이 아니라 그가 세상을 떠난 뒤에 붙었습니다. 곡은 오른손이 아주 느리고 조용하게 네 마디의 쓸쓸한 선율을 노래하며 시작합니다. 마치 폭풍이 오기 전의 고요한 정적 같지요. 그런데 이 짧은 서주가 끝나자마자, 오른손이 건반 위를 휩쓸며 빠르게 오르내리는 음표들을 폭풍처럼 쏟아 내기 시작합니다. 그 소리는 정말로 매서운 겨울바람이 휘몰아치며 나뭇가지를 흔들고 눈보라를 일으키는 듯합니다. 그 사이 왼손은 서주에서 들었던 쓸쓸한 선율을 힘차고 당당한 행진곡처럼 연주하는데, 마치 거센 바람을 뚫고 굳건히 걸어가는 사람의 모습 같습니다. 오른손의 폭풍과 왼손의 행진이 쉴 새 없이 맞서며 곡은 점점 격렬하게 고조되고, 마지막에는 건반 전체를 휩쓰는 거대한 소리로 장엄하게 끝을 맺습니다. 피아니스트의 손가락에 엄청난 힘과 기교가 필요한 곡입니다. 초겨울의 찬바람이 불기 시작하는 11월의 마지막 날에 들어 보세요."], ["12-1", "사계 Op.37 중 「12월: 크리스마스 주간」", "차이콥스키", "독주", "계절 표제", "표제 자체가 12월·성탄", "차이콥스키의 피아노 모음곡 「사계」의 마지막 곡인 12월의 곡입니다. 러시아에서는 크리스마스부터 주현절까지의 성탄 주간을 '스뱌트키'라고 부르며, 이 기간에 가족과 이웃이 모여 노래하고 춤추며 다양한 놀이를 즐겼습니다. 특히 처녀들은 자신의 미래 신랑을 점치는 풍습이 있었지요. 이 곡에는 시인 주콥스키의 시에서 따온, 주현절 밤에 처녀들이 신발을 벗어 문밖으로 던지며 점을 쳤다는 구절이 붙어 있습니다. 곡은 우아하고 사랑스러운 왈츠로, 크리스마스 저녁 따뜻한 불빛이 비치는 방 안에서 사람들이 모여 춤추는 모습을 떠올리게 합니다. 밝고 경쾌한 왈츠 선율이 빙글빙글 돌며, 성탄을 맞은 사람들의 들뜬 기쁨과 설렘을 전해 주지요. 가운데 부분에서는 조금 더 부드럽고 서정적인 선율이 흐르다가, 다시 처음의 사랑스러운 왈츠로 돌아와 화사하게 마무리됩니다. 1월의 「화롯가에서」부터 시작한 차이콥스키의 열두 달 여행이 이 곡으로 끝을 맺습니다. 크리스마스를 기다리는 12월의 첫날, 한 해 동안 만난 열두 곡을 떠올리며 들어 보세요."], ["12-2", "노엘 10번", "다캥", "독주", "대림·성탄", "성탄 노엘 오르간곡", "프랑스의 오르가니스트이자 작곡가 루이클로드 다캥의 오르간곡입니다. 다캥은 여섯 살 때 루이 14세 앞에서 하프시코드를 연주했을 만큼 뛰어난 신동이었고, 훗날 파리 노트르담 대성당의 오르가니스트로 일하며 당대 최고의 연주자로 이름을 떨쳤습니다. 그는 하프시코드곡 「뻐꾸기」로도 유명합니다. '노엘'은 프랑스의 크리스마스 캐럴을 뜻하는데, 프랑스에서는 오래전부터 크리스마스 자정 미사 때 오르가니스트가 사람들에게 친숙한 캐럴 선율을 바탕으로 즉흥 변주를 연주하는 전통이 있었습니다. 다캥은 이런 노엘 변주곡 열두 곡을 모아 1757년 곡집으로 펴냈고, 이 곡은 그 가운데 열 번째 곡입니다. 곡은 소박하고 정겨운 캐럴 선율로 시작해, 변주가 거듭될 때마다 오르간의 다양한 음색을 바꾸어 가며 선율을 화려하고 경쾌하게 장식합니다. 높은 음역과 낮은 음역이 메아리처럼 서로 주고받기도 하고, 빠르게 반짝이는 음표들이 쏟아지기도 하지요. 성당 가득 울려 퍼지는 오르간 소리 속에서 크리스마스를 맞이하는 사람들의 기쁨이 느껴집니다. 대림절의 시작, 프랑스의 성탄 전통을 만나 보세요."], ["12-3", "「크리스마스 트리」 모음곡", "리스트", "독주", "대림·성탄", "성탄 피아노 모음곡", "리스트가 1874년부터 1876년 사이에 쓴 열두 곡의 피아노 모음곡입니다. 이 곡은 리스트의 손녀 다니엘라를 위해 쓰였는데, 할아버지가 손녀에게 들려주는 크리스마스 선물 같은 곡입니다. 젊은 시절 화려한 기교로 유럽을 열광시켰던 리스트는 말년에 가톨릭 성직자가 되어, 단순하고 소박하면서도 깊은 신앙이 담긴 음악을 썼습니다. 모음곡은 크리스마스의 여러 장면을 차례로 그려 냅니다. 옛 크리스마스 찬송가, 「오 거룩한 밤」, 구유 곁의 목자들, 동방박사들의 행진, 크리스마스트리에 불을 밝히는 순간, 저녁 종소리, 자장가, 옛 프로방스의 노엘 등이 이어지지요. 아이들도 연주할 수 있을 만큼 쉬운 곡도 있고, 깊은 사색이 담긴 곡도 있습니다. 마지막 두 곡은 리스트 자신의 고향 헝가리와, 그가 오랫동안 사랑했던 여인의 고향 폴란드를 그린 곡으로, 크리스마스를 맞아 지난 삶을 돌아보는 노작곡가의 회상이 담겨 있습니다. 화려함 대신 따뜻함과 고요함이 가득한 리스트의 숨은 보석 같은 작품입니다. 크리스마스트리를 장식하며 들어 보세요."], ["12-4", "11개의 코랄 전주곡 Op.122", "브람스", "독주", "대림·성탄", "대림절 오르간 코랄", "브람스가 세상을 떠나기 1년 전인 1896년에 쓴 오르간곡으로, 그가 완성한 마지막 작품입니다. 그해 5월, 40년 넘게 깊은 우정을 나누었던 클라라 슈만이 세상을 떠났습니다. 큰 슬픔에 잠긴 브람스는 자신도 병으로 건강이 나빠지는 가운데, 교회의 찬송가 선율을 바탕으로 한 열한 곡의 코랄 전주곡을 썼습니다. 젊은 시절부터 깊이 존경해 온 바흐의 전통으로 돌아가, 삶과 죽음, 위안과 신앙을 노래한 것이지요. 이 곡들에는 죽음을 받아들이는 고요한 마음과 깊은 위로가 담겨 있습니다. 그 가운데 여덟 번째 곡은 독일의 오래된 크리스마스 찬송가 「한 송이 장미 피었네」를 바탕으로 하는데, 찬송가의 소박하고 따뜻한 선율이 부드러운 화음 속에서 꽃이 피어나듯 은은하게 울려 퍼져 대림절에 특히 잘 어울립니다. 그리고 마지막 열한 번째 곡 「오 세상아, 나는 너를 떠나야 하네」는 세상과의 이별을 노래하는 곡으로, 브람스 자신의 작별 인사처럼 들립니다. 이 곡들은 브람스가 세상을 떠난 뒤에 출판되었습니다. 대림절의 고요함 속에서 거장의 마지막 노래를 들어 보세요."], ["12-5", "클라리넷 협주곡 A장조 K.622", "모차르트", "협주곡", "기념일", "모차르트 서거일(1791.12.5). 마지막 협주곡", "1791년 12월 5일, 서른다섯의 나이로 세상을 떠난 모차르트가 그해 10월에 완성한 클라리넷 협주곡입니다. 이 곡은 그가 완성한 마지막 협주곡이자, 마지막으로 완성한 대작 가운데 하나입니다. 모차르트는 1월에 들었던 클라리넷 5중주의 주인공인 친구 슈타틀러를 위해 이 곡을 썼습니다. 슈타틀러는 일반 클라리넷보다 낮은 음을 더 낼 수 있도록 개량한 특별한 클라리넷을 연주했고, 모차르트는 그 악기의 넓은 음역과 따뜻한 음색을 마음껏 살렸습니다. 1악장은 밝고 우아하며, 클라리넷이 높은 음과 낮은 음을 자유롭게 넘나들며 노래합니다. 이 곡에서 가장 사랑받는 2악장 아다지오는 클라리넷이 고요하고 맑은 선율을 끝없이 이어 가는 곡으로, 슬픔도 기쁨도 모두 초월한 듯 투명하고 평화로운 아름다움이 가득합니다. 영화 「아웃 오브 아프리카」에 쓰여 널리 알려졌지요. 3악장은 경쾌하고 생기 넘치는 론도로 마무리됩니다. 이 무렵 모차르트는 병상에서 「레퀴엠」을 쓰고 있었지만, 끝내 완성하지 못하고 세상을 떠났습니다. 천재의 마지막 협주곡에 담긴 맑은 영혼을 느껴 보세요."], ["12-6", "썰매 타기", "르로이 앤더슨", "관현악", "대림·성탄", "성 니콜라스의 날. 크리스마스 시즌 단골곡", "미국의 작곡가 르로이 앤더슨이 1948년에 완성한 관현악곡으로, 겨울과 크리스마스 시즌에 세계에서 가장 많이 연주되는 곡 가운데 하나입니다. 재미있게도 앤더슨은 이 곡을 1946년 한여름, 무더운 폭염 속에서 쓰기 시작했다고 합니다. 더위 속에서 시원한 겨울을 상상하며 쓴 셈이지요. 이 곡은 크리스마스를 직접 노래하는 곡은 아니지만, 썰매를 타고 눈 덮인 길을 달리는 겨울의 즐거움을 생생하게 그려 내 크리스마스 음악의 대표곡이 되었습니다. 곡은 썰매 방울이 딸랑딸랑 울리는 가운데 경쾌하고 신나는 선율로 시작합니다. 나무 블록이 '따각따각' 말발굽 소리를 내고, 마부가 휘두르는 채찍 소리가 '찰싹' 하고 울리지요. 곡의 마지막에는 트럼펫이 '히히힝' 하고 말 울음소리를 흉내 내어 듣는 이들을 웃음 짓게 합니다. 1950년에는 이 곡에 가사가 붙어 노래로도 큰 인기를 얻었습니다. 오늘 12월 6일은 산타클로스의 기원이 된 성 니콜라스의 축일입니다. 유럽에서는 이날 아이들이 선물을 받지요. 아이들과 함께 썰매를 타는 상상을 하며 신나게 들어 보세요."], ["12-7", "스케르초 1번 b단조 Op.20", "쇼팽", "독주", "대림·성탄", "중간부에 폴란드 캐럴 「잘 자라 아기 예수」 인용", "쇼팽이 1831년부터 이듬해 사이에 쓴 첫 번째 스케르초입니다. 1830년 가을, 쇼팽은 조국 폴란드를 떠나 오스트리아의 빈에 머물렀는데, 그 직후 폴란드에서 러시아의 지배에 맞선 봉기가 일어났다는 소식이 전해졌습니다. 고향의 가족과 친구들을 걱정하며 홀로 낯선 도시에서 불안과 고독에 시달리던 쇼팽은, 그해 크리스마스이브에 빈의 성당을 홀로 찾아가 깊은 외로움에 잠겼다고 편지에 적었습니다. 이 곡은 바로 그 무렵에 쓰였습니다. 곡은 귀를 찌르는 듯한 두 개의 날카로운 화음으로 시작해, 폭풍처럼 격렬하고 불안한 음악이 숨 가쁘게 몰아칩니다. 그런데 곡의 가운데 부분에 이르면 분위기가 완전히 바뀌어, 고요하고 따뜻한 자장가 같은 선율이 흐릅니다. 이 선율은 폴란드의 크리스마스 캐럴 「잘 자라, 아기 예수」에서 가져온 것으로, 쇼팽이 그의 작품에서 폴란드 민요를 그대로 인용한 드문 예입니다. 멀리 떨어진 고향의 크리스마스를 그리워하는 마음이 느껴지지요. 그리고 다시 폭풍 같은 음악이 돌아와 격렬하게 끝을 맺습니다. 고향을 그리는 마음으로 들어 보세요."], ["12-8", "교향곡 5번 E♭장조 Op.82", "시벨리우스", "관현악", "기념일", "시벨리우스 탄생일(1865.12.8)", "1865년 12월 8일 핀란드에서 태어난 시벨리우스가 쉰 번째 생일을 맞은 1915년에 발표한 교향곡입니다. 핀란드 정부는 시벨리우스의 쉰 번째 생일을 국경일로 정해 축하했고, 그날 저녁 헬싱키에서 이 교향곡이 시벨리우스 자신의 지휘로 초연되었습니다. 이후 그는 곡을 두 번이나 고쳐 1919년에 지금의 모습으로 완성했습니다. 이 곡을 쓰던 1915년 봄, 시벨리우스는 숲속 집 근처에서 열여섯 마리의 백조가 하늘을 빙빙 돌다가 햇살 속으로 사라지는 모습을 보았습니다. 그는 일기에 그것이 자신의 생애에서 가장 위대한 경험 가운데 하나였다고 적었지요. 그 장면은 이 교향곡의 마지막 악장에서 호른이 연주하는 장엄하고 넉넉한 '백조의 주제'가 되었습니다. 이 주제는 마치 거대한 백조의 날개가 천천히 하늘을 가르며 퍼덕이는 듯한 리듬으로 반복되며 점점 웅장해집니다. 그리고 곡은 오케스트라 전체가 긴 침묵을 사이에 두고 여섯 개의 거대한 화음을 하나씩 내리치며 장엄하게 끝을 맺습니다. 자연의 신비와 경이로움이 가득한 곡입니다. 시벨리우스의 생일, 하늘을 나는 백조를 떠올리며 들어 보세요."], ["12-9", "크리스마스 협주곡 Op.8-6", "토렐리", "협주곡", "대림·성탄", "성탄 협주곡", "이탈리아 볼로냐에서 활동한 바로크 시대의 작곡가 주세페 토렐리의 협주곡입니다. 토렐리는 볼로냐의 산페트로니오 대성당에서 바이올린과 비올라를 연주하며 작곡을 했는데, 독주 악기와 합주단이 번갈아 연주하는 '협주곡'이라는 형식을 발전시킨 선구자로 평가받습니다. 특히 트럼펫을 위한 협주곡을 많이 써서 성당의 축일을 화려하게 빛냈지요. 이 곡은 그가 세상을 떠난 1709년에 출판된 열두 곡의 협주곡집 가운데 여섯 번째 곡으로, '성탄을 위하여'라는 부제가 붙어 있습니다. 바로크 시대 이탈리아에서는 크리스마스 무렵이면 시골의 목동들이 도시로 내려와 백파이프와 피리를 불며 캐럴을 연주하는 풍습이 있었는데, 작곡가들은 이를 본떠 협주곡의 마지막에 목가적인 '파스토랄레'를 넣곤 했습니다. 이 곡에서도 마지막 부분에서 낮은 음이 백파이프처럼 길게 이어지는 가운데, 바이올린이 부드럽고 평화로운 선율을 6박자의 흔들리는 리듬으로 노래합니다. 마치 베들레헴 들판에서 양 떼를 지키던 목동들이 아기 예수의 탄생 소식을 듣고 기뻐하는 모습 같지요. 이탈리아 바로크의 성탄 전통을 만나 보세요."], ["12-10", "주님의 탄생", "메시앙", "독주", "대림·성탄", "메시앙 탄생일(1908.12.10). 성탄 오르간 대작", "1908년 12월 10일 프랑스 아비뇽에서 태어난 올리비에 메시앙이 1935년에 쓴 오르간곡입니다. 메시앙은 독실한 가톨릭 신자로, 스물두 살부터 60년 넘게 파리 생트트리니테 성당의 오르가니스트로 일했습니다. 그는 평생 새소리를 연구해 음악에 담았고, 인도와 그리스의 리듬, 색깔을 보는 듯한 독특한 화음을 사용해 누구와도 다른 신비로운 음악 세계를 펼쳤습니다. 메시앙은 소리를 들으면 색깔이 보이는 특별한 감각을 지녔다고 합니다. 「주님의 탄생」은 아홉 곡으로 이루어진 오르간 모음곡으로, 아기 예수의 탄생을 깊이 묵상합니다. 성모 마리아와 아기 예수, 들판의 목동들, 하늘의 천사들, 별을 따라 찾아온 동방박사들 등 크리스마스 이야기의 여러 장면이 차례로 펼쳐지지요. 하지만 이 곡은 흔히 듣는 정겨운 캐럴과는 전혀 다릅니다. 오르간의 웅장하고 신비로운 화음, 천사들의 찬란한 날갯짓 같은 빠른 음표, 시간이 멈춘 듯한 깊은 고요함이 어우러져, 신의 탄생이라는 신비 앞에 선 인간의 경외감을 그려 냅니다. 마지막 곡 「하느님이 우리 가운데」는 성당을 뒤흔드는 거대한 환희로 끝을 맺습니다. 메시앙의 생일에 들어 보세요."], ["12-11", "이탈리아의 해럴드 Op.16", "베를리오즈", "협주곡", "기념일", "베를리오즈 탄생일(1803.12.11)", "1803년 12월 11일 프랑스에서 태어난 베를리오즈가 1834년에 쓴 비올라와 관현악을 위한 교향곡입니다. 1833년 '악마의 바이올리니스트' 파가니니가 베를리오즈를 찾아와, 자신이 새로 구한 명품 비올라를 뽐낼 수 있는 곡을 써 달라고 부탁했습니다. 그런데 베를리오즈가 쓴 곡의 앞부분을 본 파가니니는 비올라가 쉬는 부분이 너무 많고 화려한 기교를 보여 줄 곳이 없다며 연주를 거절했습니다. 베를리오즈는 곡을 계속 써서 이 교향곡으로 완성했지요. 몇 년 뒤 이 곡의 연주를 직접 들은 파가니니는 크게 감동해, 무대 위의 베를리오즈 앞에 무릎을 꿇고 손에 입을 맞추었으며, 이후 그에게 큰돈을 선물했다고 합니다. 이 곡은 영국 시인 바이런의 시 「차일드 해럴드의 순례」에서 영감을 받았습니다. 우수에 찬 젊은이 해럴드가 이탈리아의 산과 들을 홀로 떠도는 이야기로, 비올라는 바로 해럴드를 나타내며 곡 전체에 걸쳐 쓸쓸한 선율로 등장합니다. 산속의 해럴드, 저녁 기도를 부르며 지나가는 순례자들의 행렬, 산사람의 사랑 노래, 그리고 산적들의 광란의 잔치가 차례로 펼쳐집니다. 그의 생일에 들어 보세요."], ["12-12", "크리스마스 협주곡 Op.3-12", "만프레디니", "협주곡", "대림·성탄", "성탄 협주곡", "이탈리아 바로크 시대의 작곡가이자 바이올리니스트 프란체스코 만프레디니의 협주곡입니다. 만프레디니는 토렐리에게 바이올린을 배웠다고 전해지며, 이탈리아 중부의 작은 도시 피스토이아의 성당에서 음악감독으로 오랫동안 일했습니다. 그는 오늘날 많이 알려지지 않은 작곡가이지만, 이 한 곡만큼은 크리스마스 시즌마다 세계 곳곳에서 연주되며 사랑받고 있습니다. 이 곡은 1718년에 출판된 열두 곡의 협주곡집 가운데 마지막 곡으로, '성탄을 위한 협주곡'이라는 제목이 붙어 있습니다. 두 대의 독주 바이올린이 합주단과 함께 연주하는 이 곡은 짧고 아름다운 몇 개의 악장으로 이루어져 있습니다. 앞부분은 장중하고 경건한 분위기로 시작해, 두 대의 바이올린이 우아하고 활기찬 대화를 나눕니다. 그리고 곡의 마지막을 장식하는 '파스토랄레'에서는 목동들의 백파이프 소리를 흉내 낸 낮고 긴 음 위로, 두 대의 바이올린이 부드럽게 흔들리는 6박자의 평화로운 선율을 노래합니다. 마치 아기 예수가 잠든 구유 곁에서 목동들이 조용히 부르는 자장가 같지요. 고요하고 따뜻한 성탄의 평화를 느껴 보세요. 크리스마스가 열흘 남짓 남았습니다."], ["12-13", "크리스마스 협주곡 Op.1-8", "로카텔리", "협주곡", "대림·성탄", "성 루치아의 날, 성탄 협주곡", "이탈리아 베르가모에서 태어나 네덜란드 암스테르담에서 활동한 바로크 시대의 바이올리니스트이자 작곡가 피에트로 로카텔리의 협주곡입니다. 로카텔리는 당대 최고의 바이올린 거장 가운데 한 명으로, 바이올린의 기교를 극한까지 끌어올린 작품들을 남겨 '18세기의 파가니니'로 불리기도 합니다. 이 곡은 1721년에 출판된 그의 첫 작품집인 열두 곡의 합주 협주곡 가운데 여덟 번째 곡으로, 코렐리의 크리스마스 협주곡을 본받아 '성탄을 위하여'라는 부제가 붙어 있습니다. 곡은 장엄하고 경건한 느린 서주로 시작해, 독주 악기들과 합주단이 번갈아 가며 활기차고 우아한 음악을 펼칩니다. 그리고 다른 성탄 협주곡들처럼, 마지막에는 목동들의 백파이프를 흉내 낸 '파스토랄레'가 고요하고 평화롭게 흐르며 곡을 마무리합니다. 낮게 이어지는 지속음 위로 현악기들이 부드럽게 흔들리는 선율을 노래하는 이 부분은 크리스마스 밤의 고요함 그 자체입니다. 오늘 12월 13일은 성 루치아의 축일입니다. 스웨덴 등 북유럽에서는 이날 소녀들이 머리에 촛불 화관을 쓰고 행진하며 어둠 속에 빛을 밝히는 축제를 엽니다. 빛을 기다리는 마음으로 들어 보세요."], ["12-14", "「신데렐라」 모음곡", "프로코피예프", "관현악", "겨울", "겨울 동화", "프로코피예프가 1940년부터 1944년 사이, 2차 세계대전의 혼란 속에서 쓴 발레 음악입니다. 그는 전쟁 중에도 이 동화 발레를 계속 썼고, 1945년 모스크바 볼쇼이 극장에서 초연되어 큰 성공을 거두었습니다. 프로코피예프는 이 발레에서 차이콥스키 시대의 고전 발레 전통을 이어받아, 아름다운 왈츠와 춤곡을 통해 신데렐라의 꿈과 사랑을 그리고자 했습니다. 그는 이후 이 발레 음악으로 세 곡의 관현악 모음곡을 만들었습니다. 이야기는 우리가 잘 아는 신데렐라 동화를 따라갑니다. 못된 계모와 의붓언니들에게 구박받던 신데렐라 앞에 요정 대모가 나타나고, 봄·여름·가을·겨울의 요정들이 그녀에게 선물을 줍니다. 신데렐라는 아름다운 드레스를 입고 왕궁의 무도회에 가서 왕자와 사랑에 빠지지요. 이 발레에서 가장 유명한 장면은 자정을 알리는 장면입니다. 시계의 째깍거리는 소리가 타악기와 오케스트라로 점점 크고 긴박하게 울리다가, 열두 번의 종소리가 울려 퍼지면 신데렐라는 서둘러 무도회장을 빠져나갑니다. 화려한 왈츠와 동화의 마법이 가득한 음악입니다. 겨울밤 동화 속으로 들어가 보세요."], ["12-15", "크리스마스 페스티벌", "르로이 앤더슨", "관현악", "대림·성탄", "캐럴 메들리 관현악곡", "미국의 작곡가 르로이 앤더슨이 1950년 보스턴 팝스 오케스트라를 위해 쓴 관현악곡입니다. 이 곡은 누구나 알고 있는 크리스마스 캐럴 아홉 곡을 하나로 엮은 메들리로, 크리스마스 연주회의 단골 레퍼토리입니다. 캐럴을 단순히 이어 붙인 것이 아니라, 앤더슨 특유의 재치 있고 화려한 관현악 편곡으로 각 캐럴이 저마다의 개성을 뽐내며 자연스럽게 다음 곡으로 이어지는 것이 특징입니다. 곡은 「기쁘다 구주 오셨네」가 오케스트라 전체의 웅장하고 힘찬 울림으로 시작하며 크리스마스의 문을 활짝 엽니다. 이어 경쾌하고 흥겨운 영국의 옛 캐럴들과 「천사 찬송하기를」, 「저 들 밖에 한밤중에」가 차례로 펼쳐집니다. 가운데에서는 고요하고 아름다운 「고요한 밤」이 현악기의 부드러운 선율로 흐르며 성탄 밤의 평화를 전하고, 이어 썰매 방울 소리와 함께 신나는 「징글벨」이 울려 퍼집니다. 그리고 마지막에는 「참 반가운 신도여」가 장엄하고 웅장하게 울리며 축제의 절정을 이룹니다. 아는 캐럴을 하나씩 찾아보며 함께 흥얼거려 보세요."], ["12-16", "교향곡 9번 「신세계로부터」 Op.95", "드보르자크", "관현악", "기념일", "초연일(1893.12.16)", "드보르자크가 미국 뉴욕 국립음악원의 원장으로 일하던 1893년에 쓴 교향곡으로, 그해 12월 16일 뉴욕 카네기홀에서 초연되어 큰 성공을 거두었습니다. '신세계'란 바로 아메리카 대륙을 뜻합니다. 드보르자크는 미국에서 들은 흑인 영가와 아메리카 원주민의 음악에서 큰 영감을 받았고, 이 교향곡에는 미국의 광활한 대지에 대한 인상과 함께 멀리 떨어진 고향 보헤미아를 향한 깊은 그리움이 담겨 있습니다. 1악장은 느리고 신비로운 서주를 지나, 호른이 힘차고 당당한 주제를 울리며 활기차게 펼쳐집니다. 이 교향곡에서 가장 유명한 2악장 '라르고'에서는 잉글리시 호른이 고요하고 애틋한 선율을 노래하는데, 훗날 드보르자크의 제자가 이 선율에 가사를 붙여 「고향으로 가는 길」이라는 노래로 만들었고, 우리나라에서도 노래로 불리며 널리 사랑받고 있습니다. 3악장은 힘차고 활기찬 스케르초이고, 4악장은 금관악기가 웅장하고 강렬한 주제를 터뜨리며 시작해 장엄하게 끝을 맺습니다. 1969년 아폴로 11호의 우주인 닐 암스트롱은 달에 갈 때 이 곡의 녹음을 가지고 갔다고 합니다. 새로운 세계를 향한 꿈을 느껴 보세요."], ["12-17", "피아노 소나타 23번 「열정」 Op.57", "베토벤", "독주", "기념일", "베토벤 세례일(1770.12.17)", "1770년 12월 17일 독일 본에서 세례를 받은 베토벤의 피아노 소나타입니다. 베토벤의 정확한 생일은 기록이 남아 있지 않지만, 당시에는 태어난 다음 날 세례를 받는 경우가 많아 12월 16일 무렵에 태어난 것으로 여겨집니다. 이 소나타는 1804년부터 1806년 사이에 쓰였으며, 베토벤이 청력을 잃어 가는 절망 속에서도 운명에 맞서 가장 왕성하게 걸작들을 쏟아 내던 시기의 작품입니다. 「열정」이라는 별명은 베토벤이 세상을 떠난 뒤 출판업자가 붙인 것이지만, 이 곡의 성격을 잘 보여 줍니다. 베토벤 자신도 후기 소나타들을 쓰기 전까지는 이 곡을 자신의 가장 훌륭한 소나타로 여겼다고 합니다. 1악장은 양손이 아주 낮은 음역에서 어둡고 불길한 선율을 조용히 연주하며 시작하는데, 이내 폭풍처럼 격렬하게 터져 나오며 거대한 긴장감을 쌓아 올립니다. 2악장은 경건하고 고요한 찬송가 같은 주제와 변주로, 폭풍 사이의 짧은 평화를 들려줍니다. 그리고 쉬지 않고 이어지는 3악장은 거센 폭풍이 끝없이 몰아치듯 숨 가쁘게 질주하며, 격렬하고 비극적인 결말로 끝을 맺습니다. 베토벤의 생일을 축하하며 들어 보세요."], ["12-18", "부에노스아이레스의 겨울", "피아졸라", "실내악", "계절 표제", "표제가 겨울", "아르헨티나의 작곡가 피아졸라의 「부에노스아이레스의 사계」 가운데 겨울을 노래한 곡입니다. 1970년에 쓴 이 곡으로 네 계절이 모두 완성되었지요. 이 달력에서는 3월에 봄, 6월에 여름, 9월에 가을을 들었고, 이제 마지막으로 겨울을 만납니다. 피아졸라가 그린 겨울은 눈보라가 몰아치는 혹독한 겨울이 아니라, 항구 도시 부에노스아이레스의 쓸쓸하고 서정적인 겨울입니다. 곡은 강렬하고 날카로운 탱고 리듬으로 시작하지만, 곧 피아노나 바이올린이 깊은 그리움과 고독이 담긴 느리고 애틋한 선율을 노래합니다. 마치 차가운 겨울비가 내리는 항구의 카페에 홀로 앉아 지나간 날들을 회상하는 듯한 분위기이지요. 탱고의 열정과 겨울의 쓸쓸함이 교차하며 펼쳐지다가, 마지막에는 따뜻하고 부드러운 화음이 고요하게 울리며 마무리됩니다. 훗날 러시아의 작곡가 데샤트니코프는 이 곡을 바이올린과 현악 합주로 편곡하면서, 비발디의 「사계」 선율을 곳곳에 재치 있게 끼워 넣어 두 「사계」를 하나로 이어 주기도 했습니다. 남반구의 12월은 한여름이지요. 지구 반대편의 겨울을 떠올리며, 비발디의 겨울과 함께 비교해 들어 보세요."], ["12-19", "파스토랄레 F장조 BWV 590", "바흐", "독주", "대림·성탄", "목자들의 성탄 목가", "바흐가 남긴 오르간곡으로, 네 개의 짧은 악장으로 이루어져 있습니다. '파스토랄레'는 '목가', 즉 목동들의 노래를 뜻하는 말입니다. 바로크 시대에는 크리스마스 무렵이면 목동들이 피리를 부는 모습을 본뜬 파스토랄레를 연주하는 전통이 있었습니다. 성경에는 아기 예수가 태어나던 밤, 베들레헴 들판에서 양 떼를 지키던 목동들에게 천사가 나타나 그 기쁜 소식을 전했다는 이야기가 나오는데, 파스토랄레는 바로 그 목동들의 소박하고 평화로운 모습을 그린 음악입니다. 이 곡의 첫 악장에서는 발로 연주하는 페달 건반이 낮은 음을 오랫동안 길게 울리는데, 이는 목동들이 부는 백파이프의 낮고 지속적인 소리를 흉내 낸 것입니다. 그 위로 손으로 연주하는 건반이 부드럽게 흔들리는 6박자의 선율을 노래하며, 고요한 밤 들판의 평화로운 풍경을 그려 냅니다. 이어지는 악장들은 춤곡처럼 경쾌하거나, 깊고 서정적인 노래를 들려주다가, 마지막 악장에서는 활기찬 푸가로 기쁨을 표현하며 마무리됩니다. 바흐의 오르간곡 가운데 드물게 소박하고 정겨운 분위기를 지닌 곡입니다. 크리스마스를 기다리며 들어 보세요."], ["12-20", "악기를 위한 노엘 H.531", "샤르팡티에", "실내악", "대림·성탄", "성탄 노엘", "17세기 프랑스의 작곡가 마르크앙투안 샤르팡티에의 기악곡입니다. 샤르팡티에는 루이 14세 시대에 활동한 작곡가로, 그의 「테 데움」 서곡은 지금도 유럽 방송의 주제 음악으로 널리 쓰여 무척 친숙합니다. 그는 파리의 예수회 교회에서 음악감독으로 일하며 수많은 종교 음악을 남겼습니다. 앞서 다캥의 노엘에서 보았듯이, 프랑스에는 크리스마스 미사 때 사람들에게 친숙한 캐럴 선율인 '노엘'을 악기로 연주하는 오랜 전통이 있었습니다. 샤르팡티에는 이 노엘 선율들을 바탕으로, 플루트와 현악기 같은 여러 악기가 함께 연주하는 짧고 소박한 곡들을 썼습니다. 이 곡들은 크리스마스 자정 미사의 여러 순서 사이사이에 연주되며, 미사에 참석한 사람들이 익숙한 캐럴 선율을 들으며 성탄의 기쁨을 함께 나누도록 했습니다. 곡들은 짧고 단순하지만, 프랑스 민요 특유의 사랑스럽고 우아한 선율이 가득합니다. 플루트의 맑은 소리와 현악기의 부드러운 울림이 어우러지며, 마치 시골 마을 교회에서 이웃들이 모여 조촐하게 크리스마스를 맞이하는 정겨운 풍경을 떠올리게 합니다. 300년 전 프랑스의 성탄 미사에 함께해 보세요."], ["12-21", "「사계」 중 「겨울」", "비발디", "협주곡", "계절 표제", "동지 무렵", "비발디의 「사계」 가운데 마지막 곡인 「겨울」입니다. 3월의 봄, 6월의 여름, 9월의 가을에 이어, 오늘 마침내 겨울을 들으며 비발디의 사계절 여행을 마무리합니다. 곡에 붙은 시에 따르면, 1악장은 얼어붙은 눈 속에서 매서운 바람을 맞으며 덜덜 떠는 사람의 모습으로 시작합니다. 현악기들이 같은 음을 짧게 반복하며 추위에 떠는 모습을 그리고, 독주 바이올린은 휘몰아치는 찬바람을 날카롭게 그려 냅니다. 사람들은 추위를 이기려 발을 동동 구르며 뛰어다니고, 이빨이 딱딱 부딪치지요. 2악장은 따뜻한 난롯가에 앉아 창밖의 비를 바라보는 평화로운 장면입니다. 다른 현악기들이 손가락으로 줄을 튕기며 빗방울 소리를 내는 가운데, 독주 바이올린이 따뜻하고 아름다운 선율을 노래하는데, 이 악장은 「사계」 전체에서 가장 사랑받는 선율 가운데 하나입니다. 3악장에서는 사람들이 얼음 위를 조심조심 걷다가 미끄러져 넘어지고, 얼음이 깨지며, 차가운 바람들이 서로 싸웁니다. 하지만 시는 이것이 바로 겨울이며, 겨울은 그래도 기쁨을 준다고 노래합니다. 오늘은 일 년 중 밤이 가장 긴 동지 무렵입니다."], ["12-22", "교향곡 5번 c단조 「운명」 Op.67", "베토벤", "관현악", "기념일", "초연일(1808.12.22)", "베토벤이 1808년에 완성한 교향곡으로, 그해 12월 22일 빈의 한 극장에서 초연되었습니다. 이날의 연주회는 무려 네 시간 넘게 이어졌는데, 교향곡 5번과 6번 「전원」, 피아노 협주곡 4번 등 베토벤의 새 작품들이 한꺼번에 처음 연주되었습니다. 그런데 한겨울의 극장에 난방이 되지 않아 청중은 추위에 떨어야 했고, 연습이 부족했던 오케스트라는 실수를 연발했다고 합니다. 하지만 이날 초연된 이 교향곡은 이후 세상에서 가장 유명한 교향곡이 되었지요. 곡은 '빠바바밤' 하는 네 개의 음으로 강렬하게 시작합니다. 베토벤의 비서였던 쉰들러는 베토벤이 이 동기를 두고 \"운명은 이렇게 문을 두드린다\"라고 말했다고 전했는데, 그래서 이 곡에는 「운명」이라는 별명이 붙었습니다. 이 짧은 네 음은 곡 전체에 걸쳐 끊임없이 모습을 바꾸어 나타납니다. 어두운 단조로 시작한 교향곡은 운명과 싸우듯 격렬하게 투쟁하다가, 3악장에서 쉬지 않고 4악장으로 넘어가는 순간, 어둠을 뚫고 찬란한 장조의 승리로 폭발합니다. '고난을 넘어 환희로'라는 베토벤의 정신이 가장 잘 드러나는 곡입니다. 한 해를 마무리하며 들어 보세요."], ["12-23", "바이올린 협주곡 D장조 Op.61", "베토벤", "협주곡", "기념일", "초연일(1806.12.23)", "베토벤이 1806년에 쓴 유일한 바이올린 협주곡으로, 그해 12월 23일 빈에서 초연되었습니다. 베토벤은 이 곡을 마지막 순간에야 완성해서, 독주를 맡은 바이올리니스트는 거의 연습할 시간도 없이 악보를 보며 바로 연주해야 했다고 합니다. 그래서인지 초연은 큰 주목을 받지 못했고, 이 곡은 이후 40년 가까이 거의 잊혀 있었습니다. 그러다 1844년, 열세 살의 천재 바이올리니스트 요아힘이 멘델스존의 지휘로 런던에서 이 곡을 연주해 큰 감동을 주면서 다시 빛을 보게 되었고, 지금은 '바이올린 협주곡의 왕'이라 불리며 가장 위대한 바이올린 협주곡으로 꼽힙니다. 곡은 팀파니가 아주 작은 소리로 같은 음을 다섯 번 두드리며 시작하는데, 이 단순한 북소리는 1악장 전체에 걸쳐 중요한 동기가 됩니다. 1악장은 넓고 장대하며 고귀한 아름다움으로 가득하고, 2악장은 고요하고 경건한 기도 같은 노래입니다. 쉬지 않고 이어지는 3악장은 사냥 나팔을 떠올리게 하는 경쾌하고 밝은 론도로, 기쁨에 넘쳐 마무리됩니다. 크리스마스를 이틀 앞두고, 베토벤이 남긴 가장 따뜻하고 평화로운 협주곡을 들어 보세요."], ["12-24", "크리스마스 협주곡 Op.6-8", "코렐리", "협주곡", "대림·성탄", "원제 '성탄 전야를 위하여'", "이탈리아 바로크 시대의 작곡가 코렐리의 합주 협주곡으로, 가장 유명한 크리스마스 협주곡입니다. 2월 17일 생일에 만났던 코렐리는 로마에서 오토보니 추기경의 후원을 받으며 활동했는데, 이 곡은 추기경의 궁에서 열린 크리스마스이브 행사를 위해 쓰였다고 전해집니다. 악보에는 '성탄 전야를 위하여'라는 부제가 적혀 있습니다. 이 곡은 코렐리가 세상을 떠난 이듬해인 1714년에 출판된 열두 곡의 합주 협주곡집 가운데 여덟 번째 곡입니다. 합주 협주곡은 두 대의 바이올린과 첼로로 이루어진 작은 독주 그룹과, 그보다 큰 합주단이 서로 주고받으며 연주하는 형식으로, 코렐리가 이 형식을 완성했습니다. 곡은 장엄하고 경건한 서주로 시작해, 깊은 슬픔이 담긴 느린 부분, 활기찬 춤곡 등 여러 짧은 악장이 이어집니다. 그리고 마지막에 이 곡의 백미인 '파스토랄레'가 흐릅니다. 낮은 음이 목동들의 백파이프처럼 길게 이어지는 가운데, 현악기들이 부드럽게 흔들리는 자장가 같은 선율을 노래하는데, 마치 구유에 잠든 아기 예수를 바라보는 고요하고 평화로운 밤 같습니다. 크리스마스이브, 고요한 밤의 평화를 느껴 보세요."], ["12-25", "「호두까기 인형」 모음곡 Op.71a", "차이콥스키", "관현악", "대림·성탄", "크리스마스 이브가 배경인 발레", "차이콥스키가 1892년에 쓴 발레 음악 「호두까기 인형」에서 여덟 곡을 골라 엮은 관현악 모음곡입니다. 이 모음곡은 발레가 초연되기 몇 달 전에 먼저 공개되어 큰 인기를 얻었습니다. 발레는 크리스마스이브를 배경으로 합니다. 소녀 클라라는 크리스마스 파티에서 호두까기 인형을 선물받는데, 그날 밤 인형이 살아나 생쥐 왕의 군대와 전투를 벌입니다. 클라라의 도움으로 승리한 호두까기 인형은 멋진 왕자로 변해, 클라라를 눈의 나라와 과자의 나라로 데려가지요. 모음곡은 가볍고 사랑스러운 「작은 서곡」으로 시작해, 씩씩한 「행진곡」이 이어집니다. 그리고 「사탕 요정의 춤」에서는 차이콥스키가 파리에서 발견해 몰래 들여온 새로운 악기 첼레스타가 등장하는데, 맑고 영롱한 그 소리는 마치 반짝이는 설탕 구슬이 굴러가는 듯합니다. 이어 과자의 나라에서 각 나라의 과자들이 추는 러시아의 「트레팍」, 아라비아의 커피 춤, 중국의 차 춤, 갈대 피리의 춤이 펼쳐지고, 마지막에는 우아하고 화려한 「꽃의 왈츠」가 크리스마스의 꿈을 찬란하게 마무리합니다. 메리 크리스마스! 온 가족이 함께 들어 보세요."], ["12-26", "「크리스마스 오라토리오」 2부 중 신포니아", "바흐", "관현악", "대림·성탄", "성탄 둘째 날용 2부를 여는 기악곡", "바흐가 1734년 라이프치히에서 쓴 「크리스마스 오라토리오」 제2부의 첫머리를 여는 기악곡입니다. 「크리스마스 오라토리오」는 여섯 부분으로 이루어져 있는데, 각 부분은 크리스마스부터 1월 6일 주현절까지 이어지는 여섯 번의 축일 예배에서 하나씩 나누어 연주되었습니다. 그 가운데 제2부는 크리스마스 다음 날인 12월 26일, 성탄 둘째 날을 위해 쓰였습니다. 제2부는 베들레헴 들판에서 양 떼를 지키던 목동들에게 천사가 나타나 구세주의 탄생을 알리는 이야기를 다루는데, 이 곡은 노래가 시작되기 전에 그 장면을 악기만으로 그려 내는 '신포니아'입니다. 곡은 6박자의 부드럽게 흔들리는 목가풍 선율로 이루어져 있습니다. 이 곡의 아름다움은 두 무리의 악기가 서로 대화를 나눈다는 데 있습니다. 바이올린과 플루트 같은 높은 음의 악기들은 하늘에서 내려온 천사들을, 오보에 계열의 낮고 소박한 목관 악기들은 들판의 목동들이 부는 피리 소리를 나타내지요. 하늘과 땅이 음악으로 주고받는 대화가 따뜻하고 평화롭게 흐릅니다. 성탄의 기쁨이 이어지는 오늘, 천사와 목동의 대화에 귀 기울여 보세요."], ["12-27", "자장가 Op.57", "쇼팽", "독주", "겨울", "포근한 겨울밤", "쇼팽이 1843년부터 이듬해 사이, 연인 조르주 상드의 시골 별장 노앙에서 쓴 피아노곡입니다. 그해 여름 노앙에는 상드의 친구인 유명한 성악가 폴린 비아르도가 어린 딸을 데리고 머물렀는데, 쇼팽은 그 아기를 무척 귀여워했다고 합니다. 이 곡은 그 무렵에 쓰였으며, 처음에는 단순히 '변주곡'이라는 제목이 붙어 있었습니다. 곡의 구조는 아주 단순합니다. 왼손은 처음부터 끝까지 두 개의 화음을 요람을 흔들듯 부드럽게 번갈아 연주하며, 이 반주는 마지막 몇 마디를 빼고는 곡 전체에 걸쳐 한 번도 바뀌지 않습니다. 그 위로 오른손이 소박하고 따뜻한 자장가 선율을 노래한 뒤, 열여섯 번이 넘는 변주를 이어 가며 선율을 점점 더 섬세하고 화려하게 장식해 나갑니다. 오른손의 음표들은 때로는 반짝이는 별빛처럼, 때로는 살랑이는 바람처럼, 때로는 비눗방울처럼 가볍게 떠오르며 아기의 꿈속 세계를 그려 내지요. 그리고 마지막에는 다시 고요한 선율로 돌아와, 아기가 깊이 잠들 듯 조용히 사라집니다. 단순함 속에서 피어난 쇼팽의 섬세한 아름다움이 가득합니다. 포근한 겨울밤, 잠들기 전에 들어 보세요."], ["12-28", "음악의 농담 K.522", "모차르트", "실내악", "연말", "연말 유머", "모차르트가 1787년 6월에 쓴 곡으로, 두 대의 호른과 현악기가 함께 연주합니다. 이 곡은 제목 그대로 음악으로 하는 '농담'입니다. 모차르트는 이 곡에서 서툰 작곡가와 실력 없는 연주자들을 재치 있게 흉내 내며 놀렸습니다. 곡 곳곳에는 일부러 넣은 실수와 엉터리가 가득합니다. 호른 연주자들은 일부러 엉뚱한 음을 불어 귀에 거슬리는 소리를 내고, 같은 선율이 지루할 만큼 계속 반복되며, 서툰 작곡가가 쓴 듯 어색하고 엉성한 화음이 튀어나옵니다. 바이올린 연주자는 실력을 뽐내려고 화려한 독주를 시작하지만, 엉뚱한 음계로 길을 잃고 헤매지요. 그리고 곡의 마지막에는 모든 악기가 서로 다른 조성으로 동시에 화음을 울려, 귀가 아플 만큼 엉망진창인 불협화음으로 끝을 맺습니다. 음악을 잘 아는 사람일수록 더 크게 웃게 되는 곡이지요. 그런데 이 곡을 쓰기 불과 몇 주 전, 모차르트는 평생 자신을 이끌어 준 아버지 레오폴트를 잃었습니다. 깊은 슬픔 속에서 이런 유쾌한 곡을 썼다는 것이 놀랍습니다. 한 해를 마무리하는 연말, 모차르트의 장난에 함께 웃어 보세요."], ["12-29", "새의 노래(카탈루냐 민요)", "카살스", "독주", "기념일", "카살스 탄생일(1876.12.29). 첼로 편곡의 명곡", "1876년 12월 29일 스페인 카탈루냐 지방에서 태어난 위대한 첼리스트 파블로 카살스가 첼로로 편곡해 연주한 곡입니다. 「새의 노래」는 카탈루냐 지방에서 전해 내려오는 크리스마스 민요로, 아기 예수가 태어나자 독수리, 참새, 나이팅게일 등 온갖 새들이 날아와 저마다의 노래로 그 탄생을 축하했다는 내용입니다. 카살스는 3월에 들었던 바흐의 「무반주 첼로 모음곡」을 세상에 알린 사람이기도 합니다. 그는 스페인 내전이 끝나고 독재 정권이 들어서자 이에 항의하며 조국을 떠났고, 프랑스의 작은 국경 마을에 머물며 평생 고향으로 돌아가지 않았습니다. 그리고 그는 연주회 때마다 마지막 앙코르로 이 곡을 연주하며, 잃어버린 고향 카탈루냐와 세계의 평화를 향한 그리움을 노래했습니다. 1971년, 아흔네 살의 카살스는 유엔 본부에서 평화상을 받는 자리에서 \"카탈루냐의 새들은 피스, 피스, 평화를 노래합니다\"라고 말한 뒤 이 곡을 연주해 세상을 감동시켰습니다. 곡은 첼로가 단순하고 소박하면서도 깊은 슬픔이 담긴 선율을 조용히 노래합니다. 한 해의 끝자락에서, 평화를 기원하며 들어 보세요."], ["12-30", "「코메디안」 모음곡 중 「갤럽」", "카발레프스키", "관현악", "기념일", "카발레프스키 탄생일(1904.12.30)", "1904년 12월 30일 상트페테르부르크에서 태어난 러시아의 작곡가 드미트리 카발레프스키의 작품입니다. 카발레프스키는 평생 어린이를 위한 음악 교육에 힘쓴 작곡가이자 교육자로, 어린이들이 연주할 수 있는 피아노곡을 많이 남겼고, 지금도 전 세계 피아노 학습자들이 그의 곡으로 피아노를 배우고 있습니다. 이 곡은 1930년대 말 모스크바의 어린이 극장에서 공연된 연극을 위해 쓴 음악을 모아 만든 관현악 모음곡 「코메디안」에 실린 곡입니다. 연극은 마을과 마을을 돌아다니며 공연하는 떠돌이 희극 배우들의 이야기로, 모음곡은 그들의 우스꽝스럽고 흥겨운 모습을 담은 열 곡의 짧은 곡으로 이루어져 있습니다. 그 가운데 가장 유명한 곡이 바로 이 「갤럽」입니다. 갤럽은 말이 빠르게 달리듯 경쾌하게 뛰어다니며 추는 춤을 말합니다. 곡은 처음부터 숨 가쁘게 질주하는 빠른 리듬 위로, 실로폰이 경쾌하고 신나는 선율을 쏟아 내며 시작합니다. 마치 서커스의 광대들이 우스꽝스럽게 뛰어다니는 모습 같지요. 2분이 채 되지 않는 짧은 곡이지만, 운동회의 달리기 경주에서 자주 들리는 친숙한 곡입니다. 신나게 한 해를 달려온 우리 모두를 응원하며 들어 보세요."], ["12-31", "교향곡 45번 「고별」", "하이든", "관현악", "연말", "연주자들이 하나씩 퇴장하는 곡. 한 해와 작별", "하이든이 1772년, 헝가리의 귀족 에스테르하지 가문의 궁정 악장으로 일하던 시절에 쓴 교향곡입니다. 그해 하이든이 섬기던 니콜라우스 공작은 호숫가에 새로 지은 아름다운 여름 궁전이 무척 마음에 들어, 예정보다 훨씬 오랫동안 그곳에 머물렀습니다. 그런데 궁전이 좁아 악단원들은 가족을 데려올 수 없었고, 몇 달째 가족을 보지 못한 단원들은 하루빨리 집에 돌아가고 싶어 했습니다. 하이든은 이들의 마음을 공작에게 전하기 위해 재치 있는 아이디어를 냈습니다. 이 교향곡의 마지막 악장은 빠르고 격렬하게 시작하다가 갑자기 느린 음악으로 바뀌는데, 이때부터 연주자들이 하나둘씩 자기 몫의 연주를 마치고 악보대의 촛불을 끈 뒤 조용히 무대를 떠납니다. 마지막에는 단 두 대의 바이올린만 남아 쓸쓸하게 음악을 마무리하지요. 하이든의 뜻을 알아챈 공작은 다음 날 단원들이 집에 돌아갈 수 있도록 허락했다고 합니다. 그래서 이 곡에는 「고별」이라는 별명이 붙었습니다. 오늘은 한 해의 마지막 날입니다. 연주자들이 하나씩 촛불을 끄고 떠나듯, 한 해의 기억들을 하나씩 정리하며 들어 보세요. 1년 동안 함께해 주셔서 고맙습니다. 새해에 다시 만나요."]];

    const br=(x,y,a,L,d)=>{ if(d>7||L<u*3) return; const x2=x+Math.cos(a)*L, y2=y+Math.sin(a)*L; c.lineWidth=Math.max(1,(8-d)*u*1.4); c.beginPath(); c.moveTo(x,y); c.lineTo(x2,y2); c.stroke(); const rr=rng(sc.seed+d*13+(x|0)); br(x2,y2,a-.35-rr()*.3,L*.72,d+1); br(x2,y2,a+.3+rr()*.3,L*.7,d+1); };
