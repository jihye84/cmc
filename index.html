<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하루 한 곡 일력</title>
<meta name="theme-color" content="#0e1320">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script>
/* 인앱 브라우저(카카오톡·페이스북·인스타·네이버 등)에서 열면 기본 브라우저로 넘기기 */
(function(){
  var ua = navigator.userAgent || '';
  if (!/KAKAOTALK|FBAN|FBAV|FB_IAB|Instagram|NAVER\(|NAVER|Line\/|DaumApps|everytimeApp|Whale\/.*Inapp/i.test(ua)) return;
  var url; try { url = window.top.location.href; } catch (e) { url = document.referrer || location.href; }
  function go(u){ try { window.top.location.href = u; } catch (e) { location.href = u; } }
  if (/KAKAOTALK/i.test(ua)) { go('kakaotalk://web/openExternal?url=' + encodeURIComponent(url)); }
  else if (/Android/i.test(ua)) { go('intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'); }
  window.__INAPP_URL__ = url;
})();
</script>
<style>
/* 레이아웃: 화면 전체를 그날의 그림이 채우고, 가로 화면은 오른쪽·세로 화면은 아래에 유리판 일력 한 장이 얹힌다. 스크롤 없음. */
:root{
  color-scheme: dark;
  --ink:#0e1320;          /* 밤하늘 바탕 */
  --paper:#f3f1ec;        /* 일력 종이 글자 */
  --paper-dim:#c9c6c0;    /* 보조 글자 */
  --glass:rgba(14,19,32,.58);
  --line:rgba(243,241,236,.16);
  --accent:#ffd27a;       /* 그날 팔레트에서 다시 지정 */
  --serif:'Nanum Myeongjo','Batang','바탕','AppleMyungjo','Noto Serif KR',serif;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#art{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

.shell{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 16px);gap:10px}

/* 큰 날짜 */
.date{display:flex;align-items:flex-end;gap:.35em;line-height:1;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.date .day{font-family:var(--serif);font-weight:800;font-size:clamp(56px,19vmin,200px);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.date .mo{display:grid;gap:.4em;padding-bottom:.55em}
.date .mon{font-family:var(--serif);font-weight:700;font-size:clamp(18px,4.6vmin,40px)}
.date .wd{font-size:clamp(11px,2.2vmin,16px);letter-spacing:.12em;color:var(--paper-dim)}
.today-pill{display:inline-block;margin-left:.5em;padding:.15em .6em;border-radius:99px;background:var(--accent);color:#1a1408;font-size:.78em;letter-spacing:.05em;font-weight:600}

/* 일력 한 장 */
.panel{grid-row:3;display:flex;flex-direction:column;gap:clamp(6px,1.4vh,12px);min-height:0;max-height:62vh;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid var(--line);border-radius:22px;padding:clamp(14px,2.4vh,24px) clamp(16px,4vw,28px) clamp(10px,1.6vh,16px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.listen{flex:none;display:inline-flex;align-items:center;gap:.35em;height:34px;padding:0 14px 0 10px;border-radius:99px;background:var(--accent);color:#1a1408;font-weight:600;font-size:13.5px;letter-spacing:.04em}
.listen svg{width:16px;height:16px;fill:currentColor}
.listen:hover{filter:brightness(1.08)}
.svc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.svc a{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);color:var(--paper);text-decoration:none;font-size:14px}
.svc a:hover,.svc a:focus-visible{background:rgba(255,255,255,.07);outline:none;border-color:var(--accent)}
.svc a.fav{border-color:var(--accent)}
/* 함께 듣기: 화면에 붙는 작은 플레이어 (소개글을 보면서 들을 수 있게) */
.dock{grid-row:1;display:flex;gap:10px;align-items:center;min-height:0;min-width:0;padding:8px;border-radius:18px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line)}
.ytframe{position:relative;flex:none;height:clamp(92px,16vh,190px);aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.ytframe::before{content:'영상 불러오는 중…';position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--paper-dim)}
.ytframe>div,.ytframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.dockbar{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.dockinfo{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--paper-dim);line-height:1.35}
.dockinfo b{display:none;font-family:var(--serif);font-weight:700;font-size:13.5px;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dockinfo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dockbtns{display:grid;grid-template-columns:repeat(2,34px);gap:6px}
.dockbtns .ib{min-width:34px;width:34px;height:34px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--paper);text-decoration:none}
.dockbtns .ib svg{width:18px;height:18px}
body.playing .shell{grid-template-rows:auto auto minmax(0,1fr) auto}
body.playing .date{grid-row:2}
body.playing .panel{grid-row:4}
@media (min-width:430px){ .dockinfo b{display:block} }
.svc i{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;color:#fff}
.svc small{display:block;font-size:11.5px;color:var(--paper-dim)}
.q{font-size:12.5px;color:var(--paper-dim);line-height:1.5;word-break:keep-all}
.q b{color:var(--paper);font-weight:500}
@media (max-width:400px){ .navlabel{display:none} }
.chip{font-size:11.5px;letter-spacing:.06em;padding:.3em .7em;border-radius:99px;border:1px solid var(--line);color:var(--paper-dim);white-space:nowrap}
.chip.theme{border-color:transparent;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
h1{margin:0;font-family:var(--serif);font-weight:800;font-size:clamp(20px,3.4vmin + 6px,40px);line-height:1.22;text-wrap:balance;word-break:keep-all}
.who{font-size:clamp(13px,1.9vmin + 4px,18px);color:var(--paper);font-weight:500}
.who span{color:var(--paper-dim);font-weight:400}
.why{font-family:var(--serif);font-size:clamp(12.5px,1.5vmin + 5px,16px);color:var(--accent);line-height:1.45;word-break:keep-all}
.descBox{flex:1 1 auto;min-height:0;overflow:hidden;border-top:1px solid var(--line);padding-top:clamp(8px,1.4vh,14px)}
.desc{margin:0;font-family:var(--serif);line-height:1.78;color:var(--paper);word-break:keep-all;text-align:justify;font-size:15px}
.readBtn{display:none;align-self:flex-start;font-size:13px;color:var(--accent);padding:.35em 0}
.panel.compact .descBox{display:none}
.panel.compact .readBtn{display:inline-flex;gap:.4em;align-items:center}

/* 하단 넘김 */
.nav{display:flex;align-items:center;justify-content:space-between;gap:4px;border-top:1px solid var(--line);padding-top:clamp(6px,1.2vh,10px)}
.nav .grp{display:flex;align-items:center;gap:2px}
.ib{display:inline-grid;place-items:center;min-width:42px;height:42px;border-radius:12px;color:var(--paper)}
.ib:hover{background:rgba(255,255,255,.08)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb{height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;letter-spacing:.04em}
.tb.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.navlabel{font-size:12px;color:var(--paper-dim);font-variant-numeric:tabular-nums;letter-spacing:.06em}

/* 가로 화면: 왼쪽 그림 + 큰 날짜, 오른쪽 일력 */
@media (min-aspect-ratio:5/4){
  .shell{grid-template-columns:minmax(0,1fr) minmax(0,min(46vw,600px));grid-template-rows:minmax(0,1fr)}
  .date{grid-column:1;grid-row:1;align-self:end}
  .date .day{font-size:clamp(64px,30vh,260px)}
  .date .mon{font-size:clamp(18px,6.4vh,52px)}
  .date .wd{font-size:clamp(11px,2.6vh,17px)}
  .panel{grid-column:2;grid-row:1;max-height:none;height:100%}
  .dock{grid-column:1;grid-row:1;align-self:start;justify-self:start;flex-direction:column;align-items:stretch;width:min(100%,440px,calc(40vh*16/9))}
  .dock .ytframe{width:100%;height:auto}
  .dockbar{flex-direction:row;align-items:center;justify-content:space-between}
  .dockinfo b{display:block}
  .dockbtns{grid-template-columns:repeat(4,34px)}
  body.playing .shell{grid-template-rows:auto minmax(0,1fr)}
  body.playing .date{grid-row:2}
  body.playing .panel{grid-row:1 / span 2}
  h1{font-size:clamp(18px,4.2vh + 4px,40px)}
  .who{font-size:clamp(12.5px,2.2vh + 3px,18px)}
  .why{font-size:clamp(12px,1.9vh + 3px,16px)}
}
@media (min-aspect-ratio:5/4) and (max-height:420px){
  .shell{padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);gap:10px}
  .panel{padding:12px 16px 8px;border-radius:16px;gap:5px}
  .ib{min-width:36px;height:36px}.tb{height:32px;padding:0 11px}
  .nav{padding-top:4px}
}

/* 덮개(날짜 고르기·소개글·메뉴·이미지) */
[hidden]{display:none!important}
.veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(6,9,16,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px)}
.sheet{background:#151b2b;border:1px solid var(--line);border-radius:22px;padding:18px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px;min-height:0;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.sheet h2{margin:0;font-family:var(--serif);font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.months button{height:clamp(34px,6.5vmin,46px);border-radius:12px;border:1px solid var(--line);font-family:var(--serif);font-weight:700;font-size:15px}
.months button.on{background:var(--accent);color:#1a1408;border-color:var(--accent)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{height:clamp(32px,6.2vmin,46px);border-radius:10px;font-variant-numeric:tabular-nums;font-size:14.5px;display:grid;place-items:center;border:1px solid transparent;position:relative}
.cell:hover{background:rgba(255,255,255,.07)}
.cell.on{background:var(--paper);color:var(--ink);font-weight:600}
.cell.tdy::after{content:'';position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cell.leap{color:var(--accent)}
.pickHint{font-size:12px;color:var(--paper-dim);min-height:1.3em}
.readSheet{width:min(720px,100%);height:100%}
.readSheet .rtitle{font-family:var(--serif);font-weight:800;font-size:17px;line-height:1.3;word-break:keep-all}
.readSheet .descBox{border-top:1px solid var(--line)}
.menu{width:min(360px,100%)}
.menu .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);font-size:14.5px;text-align:left;width:100%}
.menu .row small{display:block;color:var(--paper-dim);font-size:12px;margin-top:2px}
.menu .state{font-size:12px;color:var(--accent);white-space:nowrap}
.shot{width:min(560px,100%);height:100%;align-items:center}
.shot img{flex:1 1 auto;min-height:0;max-height:100%;width:auto;max-width:100%;object-fit:contain;border-radius:14px;user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
.shot p{margin:0;font-size:13px;color:var(--paper-dim);text-align:center}

/* 배경화면 모드: 잠금화면·탁상용, 시계 자리(위쪽)를 비워 둔다 */
.wall{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;gap:.6em;
  padding:0 24px calc(env(safe-area-inset-bottom,0px) + 16vh);pointer-events:none;text-shadow:0 2px 20px rgba(0,0,0,.45)}
.wall .wd2{font-size:clamp(12px,2.2vmin,16px);letter-spacing:.2em;color:var(--paper-dim)}
.wall .d2{font-family:var(--serif);font-weight:800;font-size:clamp(28px,7vmin,64px)}
.wall .t2{font-family:var(--serif);font-weight:700;font-size:clamp(17px,3.6vmin,30px);max-width:24em;line-height:1.35;text-wrap:balance;word-break:keep-all}
.wall .c2{font-size:clamp(12px,2.2vmin,17px);color:var(--paper-dim)}
body.wallmode .shell{display:none}
body.wallmode .wall{display:flex}
@media (min-aspect-ratio:5/4){ .wall{justify-content:center;padding-bottom:0} }
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:30;background:rgba(10,13,22,.82);border:1px solid var(--line);
  padding:.6em 1.1em;border-radius:99px;font-size:13px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.inapp{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;background:#1d2436;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center}
.inapp b{color:var(--accent)}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

<canvas id="art" aria-hidden="true"></canvas>

<main class="shell" id="shell">
  <div class="date" id="dateBlock">
    <div class="day" id="dDay">13</div>
    <div class="mo"><div class="mon" id="dMon">10월</div><div class="wd" id="dWd">화요일</div></div>
  </div>

  <section class="dock" id="dock" hidden aria-label="지금 듣는 곡">
    <div class="ytframe"><div id="ytPlayer"></div></div>
    <div class="dockbar">
      <div class="dockinfo"><b id="dockTitle"></b><span id="ytNote">추천 연주 1 / 2</span></div>
      <div class="dockbtns">
        <button class="ib" id="ytAlt" type="button" aria-label="다른 연주로 바꾸기" title="다른 연주"><svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></button>
        <a class="ib" id="ytOpen" target="_blank" rel="noopener" aria-label="유튜브에서 크게 보기" title="유튜브에서 보기"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
        <button class="ib" id="dockSvc" type="button" aria-label="다른 음악 서비스에서 듣기" title="다른 서비스"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></button>
        <button class="ib" id="dockClose" type="button" aria-label="듣기 끄기" title="끄기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
  </section>

  <section class="panel" id="panel" aria-live="polite">
    <div class="toprow"><div class="chips" id="chips"></div><button class="listen" id="listenBtn" type="button" aria-label="이 곡 듣기"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>듣기</button></div>
    <h1 id="title">곡명</h1>
    <div class="who" id="who"></div>
    <div class="why" id="why"></div>
    <div class="descBox" id="descBox"><p class="desc" id="desc"></p></div>
    <button class="readBtn" id="readBtn" type="button">소개글 읽기 <span aria-hidden="true">→</span></button>
    <nav class="nav" aria-label="날짜 넘기기">
      <div class="grp">
        <button class="ib" id="prev" type="button" aria-label="어제"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="tb" id="todayBtn" type="button">오늘</button>
        <button class="ib" id="next" type="button" aria-label="내일"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <span class="navlabel" id="pageNo">286 / 366</span>
      <div class="grp">
        <button class="ib" id="pickBtn" type="button" aria-label="날짜 고르기"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
        <button class="ib" id="wallBtn" type="button" aria-label="배경화면 모드"><svg viewBox="0 0 24 24"><rect x="6" y="2.8" width="12" height="18.4" rx="2.6"/><path d="M9 16.5h6"/></svg></button>
        <button class="ib" id="menuBtn" type="button" aria-label="더 보기"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></svg></button>
      </div>
    </nav>
  </section>
</main>

<div class="wall" id="wall" aria-hidden="true">
  <div class="wd2" id="wWd"></div>
  <div class="d2" id="wDate"></div>
  <div class="t2" id="wTitle"></div>
  <div class="c2" id="wComp"></div>
</div>

<div class="veil" id="pickVeil" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <h2 id="pickTitle"><span>날짜로 건너뛰기</span><button class="ib" type="button" data-close aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    <div class="months" id="months"></div>
    <div class="days" id="days"></div>
    <div class="pickHint" id="pickHint"></div>
  </div>
</div>

<div class="veil" id="readVeil" hidden>
  <div class="sheet readSheet" role="dialog" aria-modal="true" aria-labelledby="rTitle">
    <h2><span class="rtitle" id="rTitle"></span><button class="ib" type="button" data-close aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    <div class="descBox" id="rBox"><p class="desc" id="rDesc"></p></div>
  </div>
</div>

<div class="veil" id="listenVeil" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="listenTitle">
    <h2 id="listenTitle"><span>어디서 들을까요?</span><button class="ib" type="button" data-close aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>

<script>
const D = [["1-1", "아름답고 푸른 도나우 왈츠 Op.314", "요한 슈트라우스 2세", "관현악", "신년음악회", "빈 필 신년음악회의 상징적 앙코르. 새해 첫날의 곡", "'왈츠의 왕' 요한 슈트라우스 2세가 1867년에 발표한 왈츠입니다. 처음에는 빈 남성합창협회를 위한 합창곡으로 쓰였지만 초연의 반응은 미지근했고, 같은 해 파리 만국박람회에서 관현악으로 연주되면서 비로소 세계적인 인기를 얻었습니다. 프로이센과의 전쟁에서 패해 침울해 있던 빈 시민들에게 다시 희망을 불어넣은 곡이라고도 전해집니다. 바이올린의 잔잔한 떨림 위로 호른이 강물 위 물안개처럼 피어오르는 서주가 특히 유명하고, 이어 다섯 개의 왈츠가 꽃다발처럼 엮여 흘러갑니다. 빈 필하모닉 신년음악회에서는 앙코르로 이 곡의 첫 음이 울리면 객석에서 박수가 터지고, 지휘자가 잠시 연주를 멈추고 단원들과 함께 새해 인사를 건네는 것이 오랜 전통입니다. 오스트리아에서는 '제2의 국가'로 불릴 만큼 사랑받으며, 영화 「2001 스페이스 오디세이」에서 우주선이 유유히 떠다니는 장면에 쓰여 더욱 널리 알려졌습니다. 한 해의 첫날, 넉넉히 흐르는 강물처럼 여유로운 마음으로 새해를 맞이해 보세요."], ["1-2", "라데츠키 행진곡 Op.228", "요한 슈트라우스 1세", "관현악", "신년음악회", "신년음악회 마지막 곡, 청중의 박수 행진으로 유명", "요한 슈트라우스 1세가 1848년, 북이탈리아에서 승전한 오스트리아의 노장 요제프 라데츠키 원수를 기리며 작곡한 행진곡입니다. 작곡가는 '왈츠의 왕' 요한 슈트라우스 2세의 아버지로, 아들보다 먼저 빈의 무도회장을 휘어잡은 '왈츠의 아버지'였습니다. 초연 때 이 곡을 들은 장교들이 박자에 맞춰 손뼉을 치고 발을 굴렀다는 이야기가 전해지는데, 그 전통은 오늘날 빈 필하모닉 신년음악회로 이어졌습니다. 신년음악회의 맨 마지막 곡으로 이 행진곡이 시작되면 지휘자는 객석을 향해 돌아서서 청중의 박수를 지휘합니다. 작게, 크게, 잠깐 멈췄다가 다시 힘차게 이어지는 박수는 연주자와 청중이 함께 만드는 새해의 의식입니다. 경쾌한 작은북의 리듬과 귀에 쏙 들어오는 선율 덕분에 운동회나 응원석에서도 자주 들을 수 있지요. 3분 남짓한 짧은 곡이지만, 들썩이는 리듬에 손이 저절로 움직이는 즐거움이 있습니다. 새해 둘째 날, 마음속으로 박수를 치며 힘찬 걸음으로 한 해를 출발해 보세요."], ["1-3", "황제 왈츠 Op.437", "요한 슈트라우스 2세", "관현악", "신년음악회", "신년음악회 단골 레퍼토리", "1889년 오스트리아의 프란츠 요제프 황제와 독일의 빌헬름 2세 황제 사이의 우정을 기념하는 분위기 속에서, 베를린의 새 연주회장 개관을 위해 쓰인 왈츠입니다. 원래 제목은 '손에 손잡고'였으나 출판업자의 제안으로 '황제 왈츠'라는 위엄 있는 이름을 얻었습니다. 다른 왈츠들이 화려한 무도회장의 들뜬 분위기라면, 이 곡은 군대 행진곡 같은 조용한 발걸음으로 시작해 점차 우아하고 장엄한 왈츠로 피어나는 점이 특별합니다. 마치 황제가 천천히 무도회장에 입장하는 장면을 보는 듯하지요. 왈츠가 끝난 뒤 이어지는 긴 마무리에서는 첼로가 아련한 선율을 노래하고, 음악은 지난 시절을 회상하듯 잦아들다가 마지막에 다시 한 번 힘차게 솟아오릅니다. 빈 왈츠 특유의 둘째 박을 살짝 앞당기는 리듬을 느끼며 들어보면 한결 흥겹습니다. 슈트라우스 2세가 60대에 쓴 원숙한 작품으로, 단순한 춤곡을 넘어 작은 교향시처럼 깊이 있는 이야기를 들려줍니다. 새해 사흘째, 품격 있는 왈츠로 마음을 가다듬어 보세요."], ["1-4", "천둥과 번개 폴카 Op.324", "요한 슈트라우스 2세", "관현악", "신년음악회", "신년음악회의 흥겨운 폴카", "요한 슈트라우스 2세가 1868년 빈 예술가 단체의 무도회를 위해 작곡한 빠른 폴카입니다. 폴카는 보헤미아에서 유래한 2박자의 경쾌한 춤곡으로, 19세기 빈에서는 왈츠만큼이나 인기 있었습니다. 제목처럼 큰북이 우르릉 천둥소리를 내고, 심벌즈가 번쩍 번개를 내리치는데, 무섭기보다는 오히려 흥겨운 소동처럼 들리는 것이 이 곡의 매력입니다. 마치 갑작스러운 소나기를 맞고도 깔깔 웃으며 춤추는 사람들을 보는 것 같지요. 3분 남짓한 짧은 곡이지만 숨 돌릴 틈 없이 몰아치는 속도감 덕분에 연주가 끝나면 객석에서 환호가 터져 나옵니다. 신년음악회에서도 자주 연주되는데, 타악기 연주자의 신명 나는 모습이 볼거리입니다. 아이들과 함께 들으며 큰북이 울릴 때마다 손뼉을 치거나, 심벌즈 소리에 맞춰 팔을 번쩍 들어 보는 놀이를 해도 좋습니다. 겨울의 한가운데에서 듣는 천둥과 번개라니, 조금은 엉뚱하지만 그래서 더 즐거운 새해 음악입니다. 오늘 하루, 마음속 묵은 걱정도 천둥소리와 함께 날려 보내세요."], ["1-5", "트리치 트라치 폴카 Op.214", "요한 슈트라우스 2세", "관현악", "신년음악회", "신년음악회 단골, '수다'라는 뜻의 경쾌한 폴카", "'트리치 트라치'는 독일어로 수다, 잡담을 뜻하는 말로, 요한 슈트라우스 2세가 1858년에 발표한 빠른 폴카입니다. 당시 빈에는 같은 이름의 풍자 잡지가 있었고, 사교계의 소문과 험담을 즐기던 빈 사람들의 모습을 유머러스하게 담았다는 해석이 전해집니다. 실제로 음악을 들어보면 짧고 빠른 음표들이 쉴 새 없이 재잘거리고, 여러 악기가 서로 말을 주고받듯 끼어드는 모습이 마치 카페에 모인 사람들의 수다 같습니다. 곡은 2분 30초 정도로 아주 짧아서, 숨 한 번 고르는 사이에 끝나 버릴 만큼 빠르게 지나갑니다. 슈트라우스는 평생 수백 곡의 춤곡을 썼는데, 이 곡은 그중에서도 가장 널리 사랑받는 폴카 가운데 하나로 신년음악회 무대에 자주 오릅니다. 무도회에서 사람들이 신나게 뛰어오르며 추던 춤을 상상하면서 들어보세요. 무거운 의미를 찾기보다는 그저 즐겁게 웃으며 듣기 좋은 곡입니다. 새해 다섯째 날, 반가운 사람과 따뜻한 차 한 잔을 앞에 두고 즐거운 수다를 나눠 보는 건 어떨까요."], ["1-6", "천체의 음악 왈츠 Op.235", "요제프 슈트라우스", "관현악", "신년음악회", "신년음악회 단골. 주현절(별을 따라 온 동방박사)과도 어울림", "요한 슈트라우스 2세의 동생 요제프 슈트라우스가 1868년 빈 의과대학생들의 무도회를 위해 작곡한 왈츠입니다. 요제프는 원래 기술자이자 발명가로 일하던 사람이었는데, 형이 과로로 쓰러지자 대신 악단을 지휘하게 되었고 그렇게 작곡가의 길에 들어섰습니다. 형은 \"요제프가 우리 중에서 가장 재능이 있다\"고 말했다고 전해집니다. 제목의 '천체의 음악'은 고대 그리스의 피타고라스가 말한, 별과 행성이 움직이며 사람의 귀에는 들리지 않는 조화로운 음악을 낸다는 생각에서 왔습니다. 곡은 멀리 우주에서 울려오는 듯 신비롭고 고요한 서주로 시작해, 서정적이고 꿈결 같은 왈츠로 이어집니다. 화려함보다는 사색적이고 섬세한 아름다움이 돋보여 '왈츠 가운데 가장 시적인 곡'으로 꼽히기도 합니다. 1월 6일은 동방박사들이 별을 따라 아기 예수를 찾아왔다는 주현절이기도 합니다. 겨울밤 하늘의 별을 올려다보며, 별들이 들려주는 들리지 않는 음악을 상상해 보세요."], ["1-7", "빈 숲속의 이야기 Op.325", "요한 슈트라우스 2세", "관현악", "신년음악회", "신년음악회 레퍼토리, 치터 독주가 등장하는 왈츠", "요한 슈트라우스 2세가 1868년에 발표한 왈츠로, 빈을 감싸고 있는 숲 '비너발트'의 풍경을 그린 곡입니다. 「아름답고 푸른 도나우」, 「황제 왈츠」와 함께 슈트라우스의 대표 왈츠로 꼽힙니다. 이 곡의 가장 큰 특징은 오스트리아 민속 악기인 치터가 등장한다는 점입니다. 치터는 상자 모양의 몸통에 수십 개의 줄을 걸어 손가락으로 뜯어 연주하는 악기로, 소박하고 맑은 소리가 시골 선술집의 정겨운 분위기를 자아냅니다. 곡은 숲속의 아침을 알리듯 호른과 새소리로 시작하고, 이어 치터가 오스트리아 시골 춤곡인 렌틀러풍의 선율을 들려준 뒤 본격적인 왈츠가 펼쳐집니다. 마지막에도 치터가 다시 등장해 숲속 이야기를 조용히 마무리합니다. 화려한 도시의 왈츠 속에 숨어 있는 시골의 순박함이 이 곡을 더욱 특별하게 만들어 줍니다. 빈 숲은 베토벤과 슈베르트도 즐겨 산책하던 곳이지요. 한겨울이지만 마음만은 초록빛 숲길을 걸으며 새소리를 들어 보세요."], ["1-8", "피치카토 폴카", "요한·요제프 슈트라우스", "관현악", "신년음악회", "신년음악회 단골, 현을 뜯기만 하는 재치 있는 곡", "요한 슈트라우스 2세와 동생 요제프가 함께 작곡한 짧고 재치 있는 폴카입니다. 1869년 러시아 상트페테르부르크 근처 파블롭스크에서 열린 여름 연주회를 위해 만들어졌습니다. 이 곡에서 현악기 연주자들은 활을 전혀 쓰지 않고 오직 손가락으로 줄을 뜯는 '피치카토' 주법으로만 연주합니다. 바이올린, 비올라, 첼로, 더블베이스가 톡톡, 퉁퉁 줄을 튕기며 주고받는 소리는 마치 빗방울이 지붕 위에서 춤추는 것 같기도 하고, 장난꾸러기들이 살금살금 걸어가는 발소리 같기도 합니다. 가운데 부분에서는 맑고 영롱한 글로켄슈필이 더해져 반짝이는 색채를 보탭니다. 소리를 크게 냈다가 작게 줄였다가, 갑자기 멈추는 등 셈여림의 변화가 재미있어서 듣는 사람의 귀를 쫑긋 세우게 만듭니다. 곡 길이는 3분이 채 되지 않지만, 활 하나 없이도 이렇게 다채로운 음악을 만들 수 있다는 것이 놀랍습니다. 신년음악회 주간의 마무리로, 작고 사랑스러운 소리들에 귀 기울여 보세요."], ["1-9", "사계 Op.37 중 「1월: 화롯가에서」", "차이콥스키", "독주", "계절 표제", "표제 자체가 1월", "차이콥스키가 1875년부터 이듬해까지, 상트페테르부르크의 음악 잡지 「누벨리스트」의 의뢰로 매달 한 곡씩 써서 연재한 피아노 모음곡 「사계」의 첫 곡입니다. 잡지 편집장은 열두 달 각각에 어울리는 러시아 시 한 구절을 골라 곡마다 붙였는데, 1월의 곡에는 푸시킨의 시에서 가져온 \"평화로운 행복의 작은 구석, 밤이 어둠으로 덮었네. 벽난로의 불은 사그라들고, 촛불도 꺼져 간다\"는 구절이 함께합니다. 제목 그대로 눈 내리는 겨울밤, 따뜻한 벽난로 앞에 앉아 깜빡깜빡 졸음에 빠지는 아늑한 장면이 떠오릅니다. 부드럽게 흔들리는 듯한 선율은 불꽃이 일렁이는 모습 같고, 가운데 부분에서는 조금 생기가 돌다가 다시 고요한 분위기로 돌아갑니다. 차이콥스키는 이 곡들을 비교적 가볍게 썼다고 하지만, 러시아의 계절 풍경과 사람들의 생활을 담은 소박한 아름다움 덕분에 오늘날까지 사랑받고 있습니다. 이 달력에서는 매달 초에 「사계」의 한 곡씩을 만나게 됩니다. 1월의 저녁, 따뜻한 불빛 아래에서 조용히 들어 보세요."], ["1-10", "스케이터 왈츠 Op.183", "발트토이펠", "관현악", "겨울", "빙판 위 스케이트를 그린 겨울 명곡", "프랑스 알자스 출신의 작곡가 에밀 발트토이펠이 1882년에 발표한 왈츠입니다. 발트토이펠은 나폴레옹 3세의 왕비 외제니의 궁정 피아니스트로 일하며 무도회 음악을 많이 써서 '프랑스의 슈트라우스'라는 별명을 얻었습니다. 이 곡은 당시 파리 사람들 사이에서 크게 유행하던 스케이트 타기, 특히 불로뉴 숲 호숫가의 겨울 풍경에서 영감을 받았다고 합니다. 곡이 시작되면 호른이 고요한 겨울 풍경을 열어 주고, 이어 스케이트 날이 얼음 위를 미끄러지듯 부드럽게 흐르는 왈츠가 펼쳐집니다. 군데군데 울리는 방울 소리는 썰매와 겨울의 반짝임을 떠올리게 하지요. 크게 곡선을 그리며 미끄러지다가, 빙글 돌고, 다시 나란히 달리는 스케이터들의 모습이 음악 속에 고스란히 담겨 있습니다. 우리나라에서도 피겨스케이팅 중계나 겨울 광고에서 자주 들을 수 있어 친숙한 곡입니다. 꽁꽁 언 겨울이지만, 얼음판 위를 시원하게 달리는 상상을 하며 들어 보세요. 추위도 놀이가 되는 겨울의 즐거움이 느껴질 거예요."], ["1-11", "교향곡 1번 「겨울날의 몽상」 Op.13", "차이콥스키", "관현악", "겨울", "부제가 겨울을 직접 언급", "차이콥스키가 스물여섯 살이던 1866년, 모스크바 음악원의 젊은 교수로 일하던 시절에 쓴 첫 교향곡입니다. 작곡 과정은 순탄하지 않아서, 그는 밤잠을 설치며 극심한 신경 쇠약에 시달렸고 여러 번 고쳐 쓴 끝에 작품을 완성했습니다. 「겨울날의 몽상」이라는 부제는 차이콥스키 자신이 붙인 것이며, 1악장에는 '겨울 여행의 몽상', 2악장에는 '음울한 땅, 안개의 땅'이라는 제목이 붙어 있습니다. 1악장에서는 플루트와 바순이 눈 덮인 러시아 벌판을 달리는 썰매 위에서 꿈꾸듯 떠오르는 선율을 노래하고, 2악장에서는 오보에가 안개 낀 들판의 쓸쓸함을 애틋하게 그려 냅니다. 마지막 악장은 러시아 민요를 바탕으로 어둠을 뚫고 밝고 힘찬 결말로 나아갑니다. 훗날의 「비창」 교향곡처럼 깊은 슬픔보다는 젊은 작곡가의 풋풋한 감성과 러시아의 겨울 정취가 가득합니다. 차이콥스키는 훗날에도 이 교향곡에 각별한 애정을 보였다고 합니다. 창밖의 겨울 풍경을 바라보며 눈 덮인 러시아의 들판을 함께 여행해 보세요."], ["1-12", "전주곡집 1권 중 「눈 위의 발자국」", "드뷔시", "독주", "겨울", "눈 덮인 쓸쓸한 풍경을 그린 피아노곡", "드뷔시가 1909년부터 이듬해 사이에 쓴 「전주곡집」 제1권의 여섯 번째 곡입니다. 드뷔시는 전주곡마다 제목을 곡의 첫머리가 아니라 끝에 작게 적어 두었는데, 듣는 사람이 먼저 음악을 느끼고 상상한 뒤에 제목을 확인하길 바랐기 때문이라고 합니다. 이 곡의 악보에는 \"이 리듬은 슬프고 얼어붙은 풍경의 바닥에서 울리는 소리처럼\"이라는 지시가 적혀 있습니다. 왼손이 처음부터 끝까지 두 개의 음을 천천히 번갈아 짚는데, 이것이 바로 눈 위에 한 걸음씩 찍히는 발자국입니다. 그 위로 오른손이 쓸쓸하고 외로운 선율을 띄워 올리며, 사라져 가는 기억이나 떠나간 사람을 그리워하는 듯한 감정을 자아냅니다. 곡은 4분 남짓한 길이로 아주 느리고 조용하게 진행되며, 큰 소리 한 번 없이 고요 속에서 끝을 맺습니다. 화려한 기교 대신 소리와 소리 사이의 침묵이 음악을 만드는 곡입니다. 눈 내린 아침, 아무도 걷지 않은 하얀 길 위에 처음 발자국을 남기는 마음으로 귀 기울여 보세요."], ["1-13", "초절기교 연습곡 12번 「눈보라」", "리스트", "독주", "겨울", "원제 Chasse-neige, 휘몰아치는 눈보라", "리스트의 「초절기교 연습곡」은 이름 그대로 인간의 한계를 넘어서는 기교가 필요한 열두 곡의 피아노 연습곡입니다. 리스트는 열다섯 살 무렵 처음 이 곡들의 초안을 썼고, 이후 두 차례 크게 고쳐 1852년에 지금의 모습으로 출판하면서 스승 카를 체르니에게 헌정했습니다. 마지막 곡인 12번 「눈보라」는 프랑스어로 '휘몰아치는 눈'이라는 뜻입니다. 곡은 고요하게 떨리는 음들로 시작하는데, 바람이 조금씩 불기 시작해 눈송이가 흩날리는 모습 같습니다. 양손이 쉴 새 없이 빠르게 오가는 트레몰로 위로 애절한 선율이 흐르고, 점점 거세지는 바람은 끝내 온 세상을 집어삼킬 듯한 눈보라가 되어 몰아칩니다. 단순히 손가락을 빠르게 움직이는 연습이 아니라 자연의 거대한 힘과 그 앞에 선 인간의 고독을 그린 한 편의 시 같은 곡입니다. 작곡가 부조니는 이 곡을 '연습곡 가운데 가장 아름다운 곡'이라고 평했습니다. 따뜻한 방 안에서 창밖의 눈보라를 상상하며 들어 보세요."], ["1-14", "독일 무곡 K.605 3번 「썰매 타기」", "모차르트", "관현악", "겨울", "썰매 방울 소리를 흉내 낸 곡", "모차르트가 세상을 떠나기 열 달 전인 1791년 2월, 빈 궁정의 사육제 무도회를 위해 쓴 세 곡의 독일 무곡 가운데 마지막 곡입니다. 당시 모차르트는 황제의 궁정 실내작곡가로서 해마다 겨울 무도회 시즌에 춤곡을 써야 했는데, 생활고에 시달리면서도 그 춤곡들에 반짝이는 재치를 담아냈습니다. 이 곡에는 '썰매 타기'라는 제목이 붙어 있는데, 중간 부분에서 서로 다른 높이로 조율된 다섯 개의 썰매 방울이 딸랑딸랑 울리고, 우편 마차의 나팔 소리가 멀리서 들려옵니다. 눈 덮인 빈 교외를 말이 끄는 썰매를 타고 달리는 겨울 나들이 풍경이 눈앞에 그려지는 듯합니다. 곡 길이는 3분 정도로 짧고, 듣는 이를 저절로 미소 짓게 만드는 소박한 즐거움이 가득합니다. 모차르트의 마지막 해는 「마술피리」와 「레퀴엠」 같은 대작으로 기억되지만, 이런 작은 춤곡 속에서도 그의 천진한 유머를 만날 수 있습니다. 겨울의 한가운데, 방울 소리를 따라 썰매 여행을 떠나 보세요."], ["1-15", "발레 「사계」 Op.67 중 「겨울」", "글라주노프", "관현악", "계절 표제", "표제 자체가 계절(겨울)", "러시아 작곡가 글라주노프가 1899년에 작곡한 단막 발레 음악으로, 이듬해 상트페테르부르크 마린스키 극장에서 거장 안무가 마리우스 프티파의 안무로 초연되었습니다. 발레는 겨울로 시작해 봄, 여름을 지나 가을로 끝나는 네 장면으로 이루어져 있으며, 이 달력에서는 계절마다 한 장면씩 만나게 됩니다. 첫 장면 「겨울」에서는 겨울의 신이 서리, 얼음, 우박, 눈이라는 네 정령을 거느리고 등장해 차례로 춤을 춥니다. 서리는 바늘처럼 반짝이고, 얼음은 단단하게 미끄러지며, 우박은 톡톡 튀어 오르고, 눈은 하얗게 흩날리며 내려앉습니다. 글라주노프는 관현악의 다양한 음색을 섬세하게 활용해 각 정령의 성격을 생생하게 그려 냈습니다. 마지막에는 모닥불을 피운 요정들이 등장해 겨울을 몰아내고 다음 계절인 봄을 불러옵니다. 글라주노프는 림스키코르사코프의 제자로, 열여섯 살에 첫 교향곡을 발표한 천재였습니다. 하얀 겨울 왕국의 정령들이 추는 춤을 떠올리며, 반짝이는 소리의 결정들을 감상해 보세요."], ["1-16", "「키제 중위」 모음곡 중 「트로이카」", "프로코피예프", "관현악", "겨울", "러시아 겨울 삼두마차 썰매", "프로코피예프가 1934년 소련 영화 「키제 중위」를 위해 쓴 음악을 모아 만든 관현악 모음곡의 네 번째 곡입니다. 영화는 러시아 황제 시절, 서기의 실수로 문서에 존재하지 않는 장교 '키제 중위'의 이름이 적히면서 벌어지는 풍자 코미디입니다. 아무도 황제에게 실수를 고하지 못해, 가짜 중위는 결혼도 하고 승진도 하고 마침내 장례식까지 치르게 되지요. 「트로이카」는 세 마리 말이 끄는 러시아 전통 썰매를 뜻하며, 이 곡은 키제 중위의 결혼 후 썰매를 타고 달리는 장면에 쓰였습니다. 썰매 방울 소리와 함께 경쾌하게 달리는 리듬, 그리고 술에 취한 듯 흥겨운 선율이 어우러져 러시아 겨울의 활기를 생생하게 전합니다. 오랜 해외 생활 끝에 소련으로 돌아온 프로코피예프가 처음 맡은 영화음악으로, 재치와 서정이 잘 녹아 있습니다. 이 선율은 서양에서 크리스마스 광고와 영화에도 자주 쓰여 겨울을 대표하는 음악이 되었습니다. 눈 덮인 벌판을 가르는 썰매에 올라탄 기분으로 들어 보세요."], ["1-17", "바이올린 협주곡 d단조 Op.47", "시벨리우스", "협주곡", "겨울", "'북구의 얼음 같은' 협주곡으로 입소문 난 한겨울 곡", "핀란드의 국민 작곡가 시벨리우스가 남긴 유일한 협주곡입니다. 시벨리우스는 젊은 시절 바이올리니스트를 꿈꾸었지만 무대 공포증과 늦은 시작 때문에 그 꿈을 접어야 했고, 그 아쉬움과 애정을 이 협주곡에 쏟아부었습니다. 1904년 초연은 독주자의 준비 부족으로 실패했지만, 작곡가가 곡을 크게 고친 뒤 1905년 베를린에서 리하르트 슈트라우스의 지휘로 다시 연주되어 오늘날의 모습이 되었습니다. 곡은 현악기들의 희미한 떨림 위로 바이올린이 홀로 차갑고 쓸쓸한 선율을 노래하며 시작하는데, 마치 얼어붙은 북쪽 호수 위로 안개가 피어오르는 듯합니다. 2악장은 깊고 따뜻한 서정이 흐르고, 3악장은 힘차게 발을 구르는 춤곡으로, 영국의 음악학자 토비는 이를 두고 '북극곰을 위한 폴로네즈'라는 재미있는 별명을 붙였습니다. 바이올린에게 극도의 기교를 요구하면서도 화려함보다는 웅장한 자연의 기운이 느껴집니다. 한겨울, 북유럽의 차갑고 맑은 공기를 마시는 기분으로 들어 보세요."], ["1-18", "현악4중주 「황제」 Op.76-3", "하이든", "실내악", "일반", "2악장 변주곡 주제로 유명한 명곡", "'교향곡의 아버지' 하이든이 1797년에 쓴 현악 4중주곡으로, 모두 여섯 곡으로 된 작품 76의 세 번째 곡입니다. 이 곡이 「황제」라는 별명을 얻은 것은 2악장 때문입니다. 같은 해 하이든은 나폴레옹 군대의 위협 속에 있던 오스트리아를 위해 황제 프란츠 2세에게 바치는 찬가 「신이여 황제 프란츠를 보호하소서」를 작곡했는데, 그 선율을 2악장의 주제로 삼아 네 개의 변주를 펼쳤습니다. 주제 선율은 제1바이올린, 제2바이올린, 첼로, 비올라에게 차례로 넘어가며 다른 악기들이 그 주위를 다채롭게 감쌉니다. 이 선율은 훗날 독일 국가의 선율이 되어 지금도 불리고 있습니다. 하이든은 이 선율을 무척 아꼈는데, 1809년 나폴레옹 군대가 빈을 점령했을 때 병상에서도 하루에 몇 번씩 이 곡을 피아노로 연주했으며, 그것이 그의 마지막 연주였다고 전해집니다. 네 대의 현악기가 나누는 품위 있는 대화를 따라가며, 하나의 선율이 얼마나 다양하게 빛날 수 있는지 느껴 보세요."], ["1-19", "「투오넬라의 백조」 Op.22-2", "시벨리우스", "관현악", "겨울", "잉글리시 호른이 그리는 차가운 북구의 강", "시벨리우스가 핀란드의 민족 서사시 「칼레발라」의 영웅 레민케이넨 이야기를 바탕으로 쓴 네 곡의 교향시 「레민케이넨 모음곡」 가운데 한 곡입니다. 투오넬라는 칼레발라에 등장하는 죽은 자들의 나라로, 그 둘레를 검고 깊은 강이 감싸고 있으며 그 위를 신비로운 백조 한 마리가 노래하며 떠다닌다고 합니다. 레민케이넨은 이 백조를 활로 쏘아 잡으라는 과제를 받고 길을 떠나지요. 곡에서 백조의 노래는 잉글리시 호른이 맡습니다. 오보에보다 낮고 그윽한 이 악기가 처음부터 끝까지 길고 애절한 선율을 노래하고, 여러 갈래로 나뉜 현악기들은 어둡고 고요한 강물을 그려 냅니다. 큰 사건이나 극적인 전개 없이, 마치 시간이 멈춘 듯한 정적과 신비로움이 9분 남짓 이어집니다. 차갑고 투명한 북유럽의 겨울 공기 속에서 들으면 더욱 깊이 다가오는 음악입니다. 시벨리우스는 이 곡을 여러 차례 고쳐 쓰며 지금의 모습으로 다듬었습니다. 고요한 겨울 저녁, 어두운 강 위를 홀로 떠가는 백조의 노래에 귀를 기울여 보세요."], ["1-20", "시곡(Poème) Op.25", "쇼송", "협주곡", "기념일", "쇼송 탄생일(1855.1.20)", "프랑스 작곡가 에르네스트 쇼송이 1896년 벨기에의 명바이올리니스트 외젠 이자이를 위해 쓴 바이올린과 관현악을 위한 작품입니다. 이자이가 협주곡을 부탁하자 쇼송은 \"협주곡은 내게 너무 어렵다\"며 대신 자유로운 형식의 '시'를 써 주었다고 합니다. 이 곡은 러시아 작가 투르게네프의 단편 소설 「승리한 사랑의 노래」에서 영감을 받았는데, 마법 같은 바이올린 선율로 사랑하는 여인의 마음을 사로잡는 이야기입니다. 곡은 어둡고 신비로운 관현악의 서주로 시작하고, 이어 바이올린이 홀로 깊은 그리움이 담긴 선율을 읊조리듯 노래합니다. 그 선율은 점점 뜨겁게 타오르다가 다시 꿈결처럼 사라져 갑니다. 15분 남짓한 길이 안에 사랑, 동경, 슬픔의 감정이 짙게 녹아 있어 바이올리니스트들이 무척 아끼는 레퍼토리입니다. 쇼송은 1855년 오늘 파리에서 태어났으며, 1899년 자전거 사고로 마흔넷의 나이에 세상을 떠났습니다. 짧은 생애가 남긴 가장 아름다운 선물 같은 곡을 감상해 보세요."], ["1-21", "골드베르크 변주곡 BWV 988", "바흐", "독주", "겨울", "불면의 밤을 위해 쓰였다는 일화. 긴 겨울밤에", "바흐가 1741년에 「클라비어 연습곡집」 제4권으로 출판한 건반 음악입니다. 바흐의 첫 전기를 쓴 포르켈에 따르면, 불면증에 시달리던 러시아 대사 카이저링크 백작이 잠 못 드는 밤에 들을 음악을 부탁했고, 백작의 전속 건반 연주자였던 바흐의 어린 제자 골드베르크가 이 곡을 연주했다고 합니다. 그래서 곡의 이름에 제자의 이름이 붙었지요. 다만 이 이야기가 사실인지는 확실하지 않습니다. 곡은 우아하고 고요한 아리아로 시작해 30개의 변주를 거친 뒤, 처음의 아리아로 다시 돌아와 끝납니다. 변주들은 세 곡마다 한 번씩 엄격한 돌림노래 형식인 '카논'이 나오도록 치밀하게 설계되어 있으면서도, 춤곡, 서정적인 노래, 화려한 기교의 곡 등 저마다 다른 표정을 지니고 있습니다. 캐나다 피아니스트 글렌 굴드의 1955년 녹음은 이 곡을 세상에 널리 알린 전설적인 연주로 남아 있습니다. 긴 겨울밤, 쉽게 잠들지 못할 때 바흐가 건네는 이 음악과 함께 천천히 마음을 가라앉혀 보세요."], ["1-22", "「페르 귄트」 모음곡 1번 Op.46", "그리그", "관현악", "겨울", "북유럽 정취(아침의 기분, 산왕의 궁전에서)", "노르웨이의 작곡가 그리그가 극작가 입센의 희곡 「페르 귄트」를 위해 쓴 극음악에서 네 곡을 골라 만든 관현악 모음곡입니다. 희곡은 허황된 꿈을 좇아 세계를 떠도는 몽상가 페르 귄트의 모험담으로, 1876년 크리스티아니아(지금의 오슬로)에서 초연되었습니다. 첫 곡 「아침의 기분」은 플루트와 오보에가 주고받는 맑은 선율로 유명한데, 노르웨이의 아침 같지만 사실은 모로코 사막에서 해가 떠오르는 장면을 위한 음악입니다. 둘째 곡 「오제의 죽음」은 페르의 어머니가 숨을 거두는 장면으로, 현악기만으로 깊은 슬픔을 전합니다. 셋째 곡 「아니트라의 춤」은 아랍 족장의 딸이 페르를 유혹하는 이국적인 춤이고, 마지막 곡 「산왕의 궁전에서」는 트롤들이 사는 산속 궁전에서 낮게 시작한 선율이 점점 빨라지고 커지며 폭발하는 곡입니다. 네 곡 모두 영화와 광고에서 자주 쓰여 누구에게나 친숙합니다. 아침부터 깊은 산속 트롤의 궁전까지, 북유럽 이야기 여행을 떠나 보세요."], ["1-23", "소나티네 Op.36", "클레멘티", "독주", "기념일", "클레멘티 탄생일(1752.1.23)", "이탈리아 로마에서 1752년 오늘 태어난 무치오 클레멘티의 소나티네 모음곡입니다. 클레멘티는 어린 시절 영국 귀족의 후원을 받아 건너간 뒤 평생 런던을 중심으로 활동했으며, 피아니스트이자 작곡가, 교사, 그리고 피아노 제조업자와 악보 출판업자로도 크게 성공했습니다. 1781년 빈에서는 황제 요제프 2세 앞에서 모차르트와 피아노 실력을 겨루는 연주 대결을 벌인 일화도 유명합니다. 이 대결에서 쓴 클레멘티의 선율을 모차르트는 훗날 오페라 「마술피리」 서곡에 빌려 쓰기도 했습니다. 소나티네는 '작은 소나타'라는 뜻으로, 규모가 작고 비교적 쉬운 소나타를 말합니다. 1797년에 출판된 이 여섯 곡은 소나타 형식의 기본을 익히기에 좋아 오늘날까지 전 세계 피아노 학습자들이 반드시 거쳐 가는 교재가 되었습니다. 하지만 단순한 연습곡이 아니라 밝고 단정한 고전주의 음악의 매력이 가득합니다. 어린 시절 피아노 학원에서 들려오던 정겨운 소리를 떠올리며, 맑고 반듯한 선율을 즐겨 보세요."], ["1-24", "샤콘 g단조", "비탈리", "실내악", "일반", "바이올린 레퍼토리의 비극적 명곡", "이탈리아 바로크 시대의 작곡가 토마소 안토니오 비탈리의 작품으로 전해지는 바이올린 곡입니다. 이 곡은 독일 드레스덴 도서관에 보관된 필사본으로만 전해지다가, 1867년 독일의 바이올리니스트 페르디난트 다비트가 편곡해 출판하면서 세상에 알려졌습니다. 그런데 그 화성과 표현이 바로크 시대치고는 지나치게 낭만적이어서, 정말 비탈리가 쓴 곡인지에 대해서는 지금도 의문이 남아 있습니다. 샤콘은 짧은 저음 선율이나 화음 진행을 계속 되풀이하면서 그 위에 다양한 변주를 쌓아 가는 형식입니다. 이 곡은 서서히 내려가는 슬픈 저음 위에서 바이올린이 비통하고 격정적인 감정을 쏟아 내며, 피아노나 오르간이 그 뒤를 무겁게 받쳐 줍니다. 1917년 열여섯 살의 하이페츠는 미국 카네기홀 데뷔 무대의 첫 곡으로 이 곡을 연주해 청중을 사로잡았습니다. 작곡가가 누구든, 이 곡에 담긴 깊은 슬픔과 아름다움은 수많은 연주자와 청중의 마음을 울려 왔습니다. 겨울날 깊은 사색의 시간을 위한 곡입니다."], ["1-25", "관현악을 위한 협주곡", "루토스와프스키", "관현악", "기념일", "루토스와프스키 탄생일(1913.1.25)", "폴란드의 작곡가 비톨트 루토스와프스키가 1950년부터 1954년 사이에 작곡한 관현악곡으로, 바르샤바 필하모닉의 지휘자 로비츠키의 부탁으로 쓰였습니다. '관현악을 위한 협주곡'이라는 이름은 한 명의 독주자가 아니라 오케스트라의 모든 악기가 번갈아 독주자처럼 기량을 뽐낸다는 뜻입니다. 당시 폴란드는 공산 정권 아래에서 작곡가들에게 민중이 이해하기 쉬운 음악을 쓰라고 강요했는데, 루토스와프스키는 폴란드 바르샤바 주변 지방의 민요를 재료로 삼으면서도 그것을 현대적이고 정교한 관현악 언어로 탈바꿈시켰습니다. 곡은 북소리처럼 울리는 저음 위에 쌓여 가는 웅장한 서주로 시작해, 날렵하게 반짝이는 2악장, 그리고 저음이 되풀이되는 '파사칼리아'와 '토카타', '코랄'로 이어지는 장대한 3악장으로 끝납니다. 이 곡으로 루토스와프스키는 폴란드를 대표하는 작곡가로 이름을 알렸습니다. 1913년 오늘 바르샤바에서 태어난 그를 기억하며, 오케스트라의 모든 악기가 저마다 빛나는 순간들을 찾아보세요."], ["1-26", "바이올린 협주곡 1번 g단조 Op.26", "브루흐", "협주곡", "겨울", "겨울밤에 어울리는 낭만 협주곡", "독일의 작곡가 막스 브루흐가 남긴 세 곡의 바이올린 협주곡 가운데 첫 번째로, 1866년 초연된 뒤 명바이올리니스트 요아힘의 조언을 받아 고쳐 1868년 지금의 모습이 되었습니다. 브루흐는 오페라, 합창곡, 교향곡 등 많은 작품을 썼지만, 생전에도 사후에도 이 협주곡이 다른 작품들을 모두 가릴 만큼 인기가 높았습니다. 그는 연주자들이 다른 곡은 거들떠보지 않고 이 곡만 연주한다며 불평했다고 하며, 악보 판권을 헐값에 넘기는 바람에 큰 수익을 얻지도 못했습니다. 곡은 북의 낮은 울림과 목관 악기의 화음 뒤에 바이올린이 홀로 독백처럼 시작하는데, 1악장은 '전주곡'이라는 이름처럼 쉬지 않고 2악장으로 흘러 들어갑니다. 2악장은 이 곡의 중심으로, 깊고 따뜻한 선율이 가슴을 적시며 낭만 협주곡 가운데 가장 아름다운 느린 악장으로 꼽힙니다. 3악장은 헝가리풍의 활기찬 춤곡으로 힘차게 마무리됩니다. 추운 겨울밤, 바이올린이 들려주는 따뜻한 노래에 몸과 마음을 녹여 보세요."], ["1-27", "교향곡 41번 「주피터」 K.551", "모차르트", "관현악", "기념일", "모차르트 탄생일(1756.1.27)", "모차르트가 1788년 여름, 불과 6주 남짓한 기간에 잇달아 완성한 세 개의 교향곡 39번, 40번, 41번 가운데 마지막 곡이자 그의 마지막 교향곡입니다. 「주피터」라는 별명은 모차르트가 붙인 것이 아니라, 로마 신화의 최고신처럼 웅장하고 위엄 있다는 뜻에서 훗날 런던의 공연 기획자 잘로몬이 붙였다고 전해집니다. 1악장은 힘찬 오케스트라 전체의 울림으로 당당하게 시작하고, 2악장은 약음기를 낀 현악기가 고요하고 부드러운 노래를 들려줍니다. 이 교향곡의 정점은 4악장입니다. '도-레-파-미'로 시작하는 단순한 네 음의 주제를 비롯해 다섯 개의 주제가 차례로 나오고, 마지막에는 이 주제들이 동시에 맞물리며 정교한 대위법의 향연을 펼칩니다. 수학적인 완벽함과 생기 넘치는 즐거움이 함께 담긴 이 악장은 교향곡 역사상 가장 위대한 피날레 가운데 하나로 꼽힙니다. 1756년 오늘, 잘츠부르크에서 태어난 천재 모차르트의 생일을 축하하며 그의 마지막 교향곡을 감상해 보세요."], ["1-28", "피아노 협주곡 21번 K.467", "모차르트", "협주곡", "기념일", "잘츠부르크 모차르트 주간(1월 말)", "모차르트가 1785년 3월, 빈에서 스스로 기획한 연주회를 위해 작곡하고 직접 피아노를 연주해 초연한 협주곡입니다. 당시 모차르트는 빈 최고의 피아니스트로 명성이 높아, 한 시즌에 몇 곡씩 새 협주곡을 써서 무대에 올리던 전성기였습니다. 마침 빈을 방문한 아버지 레오폴트는 이 연주를 보고 아들의 성공에 크게 감격했다고 합니다. 1악장은 행진곡 같은 씩씩한 리듬으로 시작해 화사하고 당당하게 펼쳐집니다. 이 곡을 가장 유명하게 만든 것은 2악장 안단테입니다. 약음기를 낀 현악기의 잔잔한 셋잇단음표 반주 위로 피아노가 꿈결같이 아름다운 선율을 노래하는데, 1967년 스웨덴 영화 「엘비라 마디간」에 쓰이면서 이 곡에는 '엘비라 마디간'이라는 별명이 붙었습니다. 3악장은 경쾌하고 재치 넘치는 론도로 마무리됩니다. 1월 말 모차르트의 고향 잘츠부르크에서는 그의 생일을 기념하는 '모차르트 주간' 음악제가 열립니다. 이 달력에서도 며칠 동안 모차르트의 음악을 이어서 들어 보세요."], ["1-29", "클라리넷 5중주 K.581", "모차르트", "실내악", "기념일", "모차르트 주간", "모차르트가 1789년 친구이자 클라리넷 연주자인 안톤 슈타틀러를 위해 쓴 곡으로, 클라리넷과 현악 4중주(바이올린 둘, 비올라, 첼로)를 위한 작품입니다. 그래서 '슈타틀러 5중주'라고도 불립니다. 클라리넷은 모차르트 시대에 막 오케스트라에 자리를 잡기 시작한 새로운 악기였는데, 모차르트는 이 악기의 부드럽고 따뜻한 음색, 높은음부터 낮은음까지 넓은 음역에 큰 매력을 느꼈습니다. 이 곡에서 클라리넷은 현악기 위에서 홀로 뽐내기보다는, 네 대의 현악기와 다정한 대화를 나누듯 어우러집니다. 특히 2악장 라르게토에서는 클라리넷이 마치 사람의 목소리처럼 깊고 서정적인 노래를 들려주어 듣는 이의 마음을 고요하게 감쌉니다. 마지막 악장은 소박한 주제와 여섯 개의 변주로 이루어져 있습니다. 2년 뒤 모차르트는 같은 슈타틀러를 위해 생애 마지막 협주곡인 클라리넷 협주곡을 남기게 됩니다. 실내악의 따뜻한 온기가 가득한 곡이니, 차 한 잔과 함께 편안히 감상해 보세요."], ["1-30", "아이네 클라이네 나흐트무지크 K.525", "모차르트", "관현악", "기념일", "모차르트 주간 마무리", "모차르트가 1787년 8월에 완성한 현악 합주를 위한 세레나데입니다. 제목은 독일어로 '작은 밤 음악'이라는 뜻이며, 모차르트가 직접 자신의 작품 목록에 이렇게 적었습니다. 세레나데는 원래 저녁이나 밤에 야외에서 연주하던 가벼운 음악으로, 귀족들의 파티나 축하 행사에 자주 쓰였습니다. 다만 이 곡을 어떤 계기로, 누구를 위해 썼는지는 전혀 알려져 있지 않습니다. 모차르트의 작품 목록에는 다섯 악장으로 적혀 있지만, 그중 미뉴에트 한 악장은 사라지고 지금은 네 악장만 전해집니다. 1악장은 \"빠밤빠 빠밤빠\" 하고 힘차게 올라가는 첫 소절로 누구나 한 번쯤 들어 보았을 만큼 유명합니다. 2악장 '로망스'는 부드럽고 우아한 노래이고, 3악장은 단정한 미뉴에트, 4악장은 쾌활하게 내달리는 론도입니다. 짧고 간결하면서도 군더더기 하나 없는 완벽한 균형미 덕분에 모차르트 음악의 정수로 꼽힙니다. 모차르트 주간의 마지막 날, 가장 친숙하고 사랑스러운 그의 음악과 함께해 보세요."], ["1-31", "피아노 5중주 「송어」 D.667", "슈베르트", "실내악", "기념일", "슈베르트 탄생일(1797.1.31)", "1797년 오늘 빈에서 태어난 슈베르트가 스물두 살이던 1819년 여름에 쓴 피아노 5중주곡입니다. 슈베르트는 그해 친구와 함께 오스트리아 북부의 아름다운 시골 마을 슈타이어로 여행을 떠났는데, 그곳의 음악 애호가이자 아마추어 첼리스트인 파움가르트너가 그에게 이 곡을 부탁했습니다. 파움가르트너는 슈베르트의 가곡 「송어」를 무척 좋아해서, 그 선율을 넣어 달라고 청했다고 합니다. 그래서 4악장에서는 가곡 「송어」의 선율을 주제로 한 다섯 개의 변주가 펼쳐집니다. 맑은 시냇물 속을 헤엄치는 송어처럼, 피아노의 반짝이는 음형이 물결치듯 흘러갑니다. 편성도 특이해서 일반적인 피아노 5중주와 달리 바이올린, 비올라, 첼로에 더블베이스가 더해져 있어 풍성하고 넉넉한 울림을 줍니다. 곡 전체에 젊은 슈베르트의 밝은 기운과 여름 여행의 즐거움이 가득합니다. 아쉽게도 이 곡은 슈베르트가 세상을 떠난 뒤에야 출판되었습니다. 그의 생일을 축하하며, 맑은 시냇물 같은 음악에 귀 기울여 보세요."], ["2-1", "사계 Op.37 중 「2월: 사육제」", "차이콥스키", "독주", "계절 표제", "표제 자체가 2월·러시아 사육제(마슬레니차)", "차이콥스키의 피아노 모음곡 「사계」 가운데 2월의 곡입니다. 러시아에서 2월 무렵은 '마슬레니차'라고 부르는 사육제 기간으로, 긴 겨울을 떠나보내고 봄을 맞이하는 큰 민속 축제가 열립니다. 사람들은 태양을 닮은 둥글고 노릇한 팬케이크 '블리니'를 구워 먹고, 썰매를 타고, 눈싸움과 가면 놀이를 즐기며, 마지막 날에는 겨울을 상징하는 짚 인형을 불태웁니다. 이 곡에는 시인 뱌젬스키의 시에서 따온, 흥겨운 사육제 잔치가 곧 펼쳐진다는 내용의 구절이 붙어 있습니다. 1월의 곡이 화롯가의 고요한 졸음이었다면, 2월의 곡은 밖으로 뛰쳐나간 사람들의 들뜬 웃음소리입니다. 통통 튀는 리듬과 힘찬 화음이 축제 마당의 북적임을 그려 내고, 가운데 부분에서는 잠시 숨을 고르듯 부드러운 선율이 흐르다가 다시 떠들썩한 잔치로 돌아옵니다. 3분 남짓한 짧은 곡 속에 러시아 민중의 생기가 가득 담겨 있습니다. 겨울의 끝자락을 즐겁게 보내는 마음으로 들어 보세요."], ["2-2", "사랑의 기쁨", "크라이슬러", "독주", "기념일", "크라이슬러 탄생일(1875.2.2)", "1875년 오늘 빈에서 태어난 바이올리니스트이자 작곡가 프리츠 크라이슬러의 대표작입니다. 크라이슬러는 일곱 살에 빈 음악원에 최연소로 입학한 신동으로, 20세기 전반을 대표하는 바이올리니스트였습니다. 그의 따뜻하고 우아한 음색과 자연스러운 비브라토는 지금도 많은 연주자들의 모범이 되고 있습니다. 이 곡은 「사랑의 슬픔」, 「아름다운 로즈마린」과 함께 「옛 빈 무곡」이라는 세 곡의 소품 가운데 하나입니다. 크라이슬러는 처음에 이 곡들을 19세기 빈의 춤곡 작곡가 요제프 라너의 옛 곡을 편곡한 것이라고 소개했는데, 훗날 사실은 모두 자신이 직접 작곡한 곡이라고 밝혀 음악계를 놀라게 했습니다. 「사랑의 기쁨」은 제목처럼 설렘과 즐거움이 넘쳐흐르는 빈풍의 왈츠로, 바이올린이 겹음으로 화음을 울리며 힘차게 시작합니다. 가운데 부분에서는 한결 다정하고 부드러운 노래가 흐릅니다. 라흐마니노프가 피아노 독주곡으로 편곡하기도 했습니다. 크라이슬러의 생일을 맞아, 빈의 사랑스러운 낭만을 느껴 보세요."], ["2-3", "교향곡 4번 「이탈리아」 Op.90", "멘델스존", "관현악", "기념일", "멘델스존 탄생일(1809.2.3)", "1809년 오늘 독일 함부르크에서 태어난 멘델스존의 교향곡입니다. 멘델스존은 부유한 은행가 집안에서 태어나 좋은 교육을 받았고, 스무 살 무렵부터 유럽 각지를 여행하며 견문을 넓혔습니다. 1830년부터 이듬해까지 이탈리아를 여행하며 그곳의 밝은 햇살과 활기찬 사람들, 아름다운 풍경에 깊은 감명을 받았고, 그 인상을 바탕으로 이 교향곡을 썼습니다. 1악장은 반짝이는 목관 악기의 화음 위로 바이올린이 환희에 찬 선율을 터뜨리며 시작하는데, 마치 이탈리아의 눈부신 태양 아래 서 있는 듯합니다. 2악장은 순례자들의 행렬을 떠올리게 하는 조용한 걸음의 음악이고, 3악장은 우아한 춤곡입니다. 4악장에서는 이탈리아 민속춤 '살타렐로'의 빠르고 정열적인 리듬이 숨 가쁘게 몰아칩니다. 1833년 런던에서 초연되었지만, 완벽주의자였던 멘델스존은 이 곡에 끝내 만족하지 못해 생전에 출판하지 않았습니다. 지금은 그의 교향곡 가운데 가장 사랑받는 곡이 되었지요. 겨울 끝자락에 지중해의 햇살을 미리 맛보세요."], ["2-4", "봄의 속삭임 Op.32-3", "신딩", "독주", "봄", "입춘 무렵, 봄을 기다리는 곡", "노르웨이의 작곡가 크리스티안 신딩이 1896년에 작곡한 피아노 소품입니다. 신딩은 교향곡과 협주곡, 오페라 등 여러 작품을 남겼지만, 오늘날 그의 이름은 거의 이 한 곡으로 기억되고 있습니다. 「봄의 속삭임」은 출판되자마자 유럽과 미국의 가정에서 큰 인기를 끌어, 피아노가 있는 집이라면 어디서나 이 곡을 연주했다고 할 정도였습니다. 곡은 처음부터 끝까지 오른손과 왼손이 번갈아 가며 물결처럼 흐르는 빠른 아르페지오로 가득 차 있습니다. 그 사이로 따뜻하고 부드러운 선율이 떠올랐다 사라지기를 거듭하는데, 마치 얼음이 녹아 흐르는 시냇물 소리, 나뭇가지를 스치는 봄바람 소리, 땅 밑에서 새싹이 움트는 기척을 듣는 듯합니다. 겨울이 길고 혹독한 북유럽 사람들에게 봄은 그 어느 곳보다 간절하고 소중한 계절이었겠지요. 오늘은 24절기 가운데 첫 절기인 입춘 무렵입니다. 아직 바람은 차갑지만, 음악 속에서 들려오는 봄의 첫 속삭임에 귀 기울이며 다가올 계절을 반갑게 맞이해 보세요."], ["2-5", "바이올린 협주곡 e단조 Op.64", "멘델스존", "협주곡", "일반", "멘델스존 탄생 주간", "멘델스존이 오랜 친구이자 라이프치히 게반트하우스 관현악단의 악장인 바이올리니스트 페르디난트 다비트를 위해 쓴 협주곡입니다. 1838년 \"내년 겨울에는 자네를 위해 협주곡을 하나 쓰고 싶네\"라는 편지를 보낸 뒤 6년이나 걸려 1844년에 완성했고, 이듬해 다비트의 독주로 초연되었습니다. 이 곡은 당시로서는 새로운 시도가 많았습니다. 보통 협주곡은 오케스트라가 긴 서주를 연주한 뒤 독주자가 등장하지만, 이 곡에서는 시작하자마자 바이올린이 애수 어린 주제를 곧바로 노래합니다. 독주자의 화려한 즉흥 연주 부분인 카덴차도 악장의 끝이 아니라 중간에 배치했고, 세 악장을 쉬지 않고 이어서 연주하도록 했습니다. 1악장의 그리움 가득한 선율, 2악장의 따뜻한 노래, 그리고 요정들이 뛰노는 듯 경쾌한 3악장까지 처음부터 끝까지 아름다운 선율이 흘러넘칩니다. 베토벤, 브람스, 차이콥스키의 협주곡과 함께 '4대 바이올린 협주곡'으로 꼽히는 명곡입니다. 멘델스존 탄생 주간에 그의 가장 사랑받는 협주곡을 들어 보세요."], ["2-6", "녹턴 2번 Op.9-2", "쇼팽", "독주", "일반", "가장 사랑받는 녹턴", "폴란드 출신의 '피아노의 시인' 쇼팽이 스무 살 무렵에 작곡해 1832년에 출판한 세 곡의 녹턴 가운데 두 번째 곡입니다. '녹턴'은 밤의 정취를 담은 서정적인 피아노 소품으로, 아일랜드 작곡가 존 필드가 처음 만든 형식인데 쇼팽이 이를 한층 깊고 아름답게 발전시켰습니다. 쇼팽은 평생 스물한 곡의 녹턴을 남겼고, 그중에서도 이 곡은 가장 널리 사랑받는 곡입니다. 왼손이 부드럽게 출렁이는 반주를 이어 가는 동안, 오른손은 오페라 가수가 아리아를 부르듯 우아하고 감미로운 선율을 노래합니다. 같은 선율이 되풀이될 때마다 쇼팽은 섬세한 꾸밈음을 조금씩 더해 다채로운 표정을 만들어 내는데, 이 장식음들이 마치 밤하늘의 별빛처럼 반짝입니다. 곡의 마지막 부분에서는 짧은 클라이맥스를 지나 꿈결 같은 여운 속에 조용히 마무리됩니다. 영화와 광고, 결혼식 등에서 자주 연주되어 클래식을 잘 모르는 사람도 한 번쯤 들어 보았을 곡입니다. 2월의 고요한 밤, 은은한 불빛 아래에서 감상해 보세요."], ["2-7", "위풍당당 행진곡 1번 Op.39", "엘가", "관현악", "졸업·새학기", "졸업식 단골 음악(2월 졸업 시즌)", "영국의 작곡가 엘가가 1901년에 발표한 행진곡입니다. '위풍당당'이라는 제목은 셰익스피어의 비극 「오셀로」에 나오는 대사 '영광스러운 전쟁의 위풍과 당당함'에서 따왔습니다. 그해 런던에서 이 곡이 연주되자 청중이 열광해 앙코르를 두 번이나 연주해야 했다고 합니다. 힘차고 씩씩한 행진곡 부분을 지나면 가운데 부분에서 넓고 장엄한 선율이 흐르는데, 영국 국왕 에드워드 7세가 이 선율에 감동해 가사를 붙이면 좋겠다고 권했고, 그렇게 탄생한 노래 「희망과 영광의 땅」은 영국의 '제2의 국가'처럼 불리게 되었습니다. 이 곡이 졸업식 음악이 된 데에도 사연이 있습니다. 1905년 엘가가 미국 예일대학교에서 명예 음악박사 학위를 받을 때 이 곡이 연주되었고, 이후 미국의 여러 학교로 퍼져 졸업식의 대표 음악이 되었습니다. 우리나라에서도 졸업식과 입학식, 시상식 같은 자리에서 자주 들을 수 있습니다. 2월 졸업 시즌, 새로운 출발을 앞둔 이들의 앞날을 축복하며 들어 보세요."], ["2-8", "대학 축전 서곡 Op.80", "브람스", "관현악", "졸업·새학기", "대학 명예박사 학위 답례로 작곡. 졸업 시즌", "브람스가 1879년 독일 브레슬라우 대학교(지금의 폴란드 브로츠와프 대학교)에서 명예 철학박사 학위를 받은 것에 대한 답례로 쓴 관현악곡입니다. 대학은 브람스를 \"오늘날 독일 진지한 음악의 일인자\"라고 칭송했는데, 학교 측은 내심 엄숙하고 장중한 축전 음악을 기대했습니다. 하지만 유머 감각이 넘쳤던 브람스는 당시 독일 대학생들이 맥줏집에서 즐겨 부르던 학생 노래 네 곡을 엮어 유쾌한 서곡을 만들었습니다. 브람스 자신도 이 곡을 두고 '학생 노래로 만든 흥겨운 메들리'라며 농담했다고 합니다. 곡은 조용하고 약간 어두운 분위기로 시작해, 점차 학생 노래들이 하나씩 등장하며 밝고 활기차게 펼쳐집니다. 바순 두 대가 익살스럽게 연주하는 부분은 신입생 환영 노래로, 객석에 웃음을 자아냅니다. 마지막에는 대학생들의 축가 「가우데아무스(그러니 우리 즐기자)」가 오케스트라 전체의 웅장한 울림으로 터져 나오며 화려하게 끝납니다. 졸업 시즌, 학창 시절의 추억을 떠올리며 들어 보세요."], ["2-9", "바이올린 협주곡 「어느 천사를 추억하며」", "베르크", "협주곡", "기념일", "베르크 탄생일(1885.2.9)", "1885년 오늘 빈에서 태어난 작곡가 알반 베르크의 마지막 완성 작품입니다. 1935년 미국의 바이올리니스트 루이스 크래스너의 의뢰로 협주곡을 쓰던 중, 베르크는 친구 알마 말러의 딸 마농 그로피우스가 열여덟 살에 소아마비로 세상을 떠났다는 소식을 듣습니다. 베르크는 마농을 친딸처럼 아꼈기에 큰 슬픔에 잠겼고, 이 협주곡을 그녀를 추모하는 곡으로 바꾸어 \"어느 천사를 추억하며\"라는 헌사를 붙였습니다. 곡은 열두 음을 모두 고르게 사용하는 '12음 기법'으로 쓰였지만, 그 음렬을 조성 음악처럼 들리도록 교묘하게 짜서 따뜻하고 서정적인 느낌을 줍니다. 앞부분에서는 소녀의 맑고 생기 있는 모습이 오스트리아 민요 선율과 함께 그려지고, 뒷부분에서는 병마와 죽음의 고통을 지나, 바흐의 코랄 「이제 되었습니다」의 선율이 나타나며 고요한 안식으로 이어집니다. 안타깝게도 베르크는 이 곡을 완성한 몇 달 뒤 세상을 떠나, 이 곡은 그 자신의 진혼곡이 되었습니다. 한 소녀를 향한 깊은 애도를 느껴 보세요."], ["2-10", "유모레스크 Op.101-7", "드보르자크", "독주", "일반", "친숙한 소품", "체코의 작곡가 드보르자크가 미국 뉴욕 국립음악원 원장으로 일하던 1894년, 여름휴가차 고향 보헤미아에 돌아와 쓴 여덟 곡의 피아노 소품집 가운데 일곱 번째 곡입니다. '유모레스크'는 익살스럽고 유쾌한 기분을 담은 자유로운 형식의 곡을 말합니다. 이 곡은 살짝 절뚝이듯 깡충거리는 리듬의 선율로 시작하는데, 이 경쾌한 리듬이 장난스럽고 사랑스러운 분위기를 만들어 냅니다. 가운데 부분에서는 단조로 바뀌어 잠시 애수 어린 표정을 짓다가, 다시 처음의 명랑한 선율로 돌아옵니다. 원래는 피아노곡이지만 크라이슬러가 바이올린과 피아노를 위해 편곡한 뒤로 바이올린 소품으로 더 널리 알려졌으며, 첼로, 관현악, 노래 등 수많은 형태로 편곡되어 사랑받고 있습니다. 「신세계 교향곡」과 「아메리카 4중주」를 쓴 미국 체류 시절, 드보르자크는 고향을 몹시 그리워했다고 합니다. 오랜만에 고향 집에 돌아와 쓴 이 곡에는 그 반가움과 편안함이 묻어나는 듯합니다. 가벼운 발걸음으로 하루를 시작하고 싶은 날 들어 보세요."], ["2-11", "현악 세레나데 C장조 Op.48", "차이콥스키", "관현악", "일반", "현악 합주의 대표곡", "차이콥스키가 1880년에 작곡한 현악 합주곡입니다. 같은 시기에 화려한 축제 음악인 「1812년 서곡」을 의뢰받아 쓰고 있던 그는 후원자 폰 메크 부인에게 \"서곡은 별로 애정 없이 썼지만, 세레나데는 내적인 충동으로 쓴, 진심이 담긴 곡\"이라고 편지를 보냈습니다. 차이콥스키는 평생 모차르트를 존경했는데, 이 곡은 모차르트에 대한 경의를 담아 고전적인 균형과 우아함을 추구했습니다. 1악장은 현악기 전체가 장엄하고 풍성한 화음으로 내려오는 서주로 시작하는데, 이 웅장한 울림은 광고와 방송에도 자주 쓰여 무척 친숙합니다. 2악장은 차이콥스키가 쓴 가장 아름다운 왈츠 가운데 하나로, 우아하고 사랑스러운 선율이 춤추듯 흐릅니다. 3악장 '엘레지'는 깊은 그리움을 담은 느린 노래이고, 4악장은 러시아 민요를 주제로 한 활기찬 피날레입니다. 그리고 곡의 마지막에 1악장의 장엄한 서주가 다시 돌아와 전체를 하나로 묶어 줍니다. 현악기만으로 이렇게 풍부한 색채를 낼 수 있다는 것이 놀라운 곡입니다."], ["2-12", "랩소디 인 블루", "거슈윈", "협주곡", "기념일", "초연일(1924.2.12)", "1924년 오늘 뉴욕 에올리언홀에서 초연된 조지 거슈윈의 대표작입니다. 당시 인기 밴드 리더 폴 화이트먼은 '현대 음악의 실험'이라는 이름으로 재즈와 클래식을 결합한 연주회를 기획했는데, 거슈윈은 신문 기사를 보고서야 자신이 그 연주회를 위해 곡을 쓰기로 되어 있다는 사실을 알았다고 합니다. 그는 불과 몇 주 만에 곡을 완성했고, 초연 무대에서 직접 피아노를 연주했습니다. 곡은 클라리넷이 낮은 트릴에서 시작해 높은음까지 미끄러지듯 울부짖으며 올라가는 유명한 첫 소절로 시작합니다. 원래 악보에는 빠르게 올라가는 음계였는데, 리허설 때 클라리넷 연주자가 장난삼아 미끄러지듯 연주한 것을 거슈윈이 마음에 들어 해 그대로 굳어졌다고 전해집니다. 재즈의 리듬과 블루스의 선율, 그리고 클래식 협주곡의 형식이 어우러진 이 곡은 '미국 음악'의 탄생을 알린 작품으로 평가받습니다. 거슈윈은 기차 안에서 덜컹거리는 소리를 들으며 이 곡을 구상했다고 회상했습니다. 활기찬 대도시 뉴욕의 풍경을 떠올리며 들어 보세요."], ["2-13", "사랑의 슬픔", "크라이슬러", "독주", "밸런타인", "밸런타인데이 전날", "크라이슬러의 「옛 빈 무곡」 세 곡 가운데 하나로, 「사랑의 기쁨」과 짝을 이루는 곡입니다. 두 곡은 흔히 함께 연주되는데, 「사랑의 기쁨」이 설렘과 환희로 가득하다면 「사랑의 슬픔」은 지나간 사랑을 그리워하는 쓸쓸함과 애틋함이 담겨 있습니다. 하지만 그 슬픔은 무겁거나 비통하지 않고, 아련한 미소를 머금은 듯 우아하고 부드럽습니다. 느릿하게 흔들리는 3박자의 왈츠 리듬 위로 바이올린이 한숨처럼 애잔한 선율을 노래하는데, 빈 사람들이 즐겨 말하는 '달콤한 슬픔'이 바로 이런 정서일 것입니다. 가운데 부분에서는 장조로 바뀌어 행복했던 지난날을 회상하듯 따뜻한 선율이 잠시 흐르다가, 다시 처음의 애수 어린 선율로 돌아옵니다. 크라이슬러는 자신의 연주회 앙코르로 이 곡을 즐겨 연주했으며, 그의 친구 라흐마니노프는 이 곡을 피아노 독주곡으로 아름답게 편곡하기도 했습니다. 밸런타인데이 전날, 사랑의 기쁨과 함께 그 뒤편에 숨은 애틋함까지 느껴 보세요. 사랑은 기쁨과 슬픔이 함께할 때 더욱 깊어지는 것이니까요."], ["2-14", "사랑의 인사 Op.12", "엘가", "독주", "밸런타인", "약혼녀에게 바친 곡. 밸런타인데이", "영국의 작곡가 엘가가 1888년, 캐롤라인 앨리스 로버츠와 약혼하면서 그녀에게 선물한 곡입니다. 앨리스는 엘가보다 여덟 살 연상의 시인이자 소설가였고, 엘가에게 피아노를 배우던 제자였습니다. 당시 엘가는 이름 없는 가난한 음악 교사였기에, 군 장성의 딸인 앨리스의 집안은 두 사람의 결혼을 반대했습니다. 그럼에도 앨리스는 엘가의 재능을 믿었고, 평생 그의 곁에서 든든한 버팀목이 되어 주었습니다. 엘가는 독일어에 능숙한 앨리스를 위해 처음에 이 곡에 독일어로 '사랑의 인사'라는 제목을 붙였는데, 출판사가 더 잘 팔리도록 프랑스어 제목으로 바꾸었습니다. 그러나 엘가는 출판사에 이 곡을 헐값에 넘겨, 곡이 큰 인기를 끈 뒤에도 별다른 수익을 얻지 못했다고 합니다. 바이올린이 따뜻하고 다정하게 노래하는 선율은 소박하지만 진심이 가득해, 3분 남짓한 시간 동안 듣는 이의 마음을 사랑으로 물들입니다. 밸런타인데이, 소중한 사람에게 이 곡을 선물해 보세요."], ["2-15", "사랑의 꿈 3번", "리스트", "독주", "밸런타인", "밸런타인 주간", "리스트가 1850년에 출판한 세 곡의 피아노 소품 「사랑의 꿈」 가운데 세 번째 곡입니다. 리스트는 원래 이 곡들을 노래와 피아노를 위한 가곡으로 먼저 썼고, 이를 피아노 독주곡으로 다시 편곡했습니다. 세 번째 곡의 바탕이 된 가곡은 독일 시인 프라일리그라트의 시 「오, 사랑할 수 있는 한 사랑하라」입니다. 이 시는 사랑하는 사람이 곁에 있을 때 마음껏 사랑하라고, 언젠가 무덤 앞에서 슬퍼할 날이 올 테니 그때 후회하지 않도록 하라고 노래합니다. 피아노곡에서는 가곡의 노래 선율이 피아노 음역의 한가운데에서 따뜻하게 울리고, 그 주위를 양손이 나누어 연주하는 물결 같은 반주가 감싸며 흐릅니다. 선율이 되풀이될 때마다 점점 뜨겁고 격정적으로 고조되었다가, 화려한 카덴차를 지나 다시 고요하고 평화로운 마무리로 돌아옵니다. 리스트의 피아노곡 가운데 가장 널리 사랑받는 곡이며, 피아노 학습자들이 동경하는 곡이기도 합니다. 밸런타인 주간을 마무리하며, 곁에 있는 사람을 마음껏 사랑하라는 이 곡의 메시지를 떠올려 보세요."], ["2-16", "사육제 Op.9", "슈만", "독주", "사육제", "사육제 시즌(이동 축일, 보통 2월)", "슈만이 1834년부터 이듬해까지 작곡한 피아노 모음곡으로, '네 개의 음표로 그린 사육제 풍경'이라는 부제가 붙어 있습니다. 사육제는 사순절을 앞두고 고기를 먹고 가면을 쓰고 마음껏 즐기는 유럽의 축제입니다. 당시 슈만은 에르네스티네 폰 프리켄이라는 여인과 약혼한 사이였는데, 그녀의 고향 이름 '아슈(ASCH)'를 독일식 음이름으로 바꾸어 '라-미♭-도-시'라는 네 음을 만들고, 이 음들을 곡 전체의 재료로 삼았습니다. 곡은 21개의 짧은 곡으로 이루어져 있으며, 마치 가면무도회에 모인 사람들을 하나씩 소개하듯 다양한 인물이 등장합니다. 이탈리아 희극의 광대 피에로와 아를레캥, 작곡가 쇼팽과 바이올리니스트 파가니니, 훗날 슈만의 아내가 되는 클라라, 그리고 슈만 자신의 두 가지 성격을 상징하는 차분한 오이제비우스와 열정적인 플로레스탄까지 등장합니다. 마지막 곡은 낡은 예술에 맞서는 젊은 예술가들의 행진입니다. 이 달력에서는 사육제 시즌 동안 여러 사육제 음악을 차례로 만나게 됩니다."], ["2-17", "바이올린 소나타 「라 폴리아」 Op.5-12", "코렐리", "실내악", "기념일", "코렐리 탄생일(1653.2.17)", "1653년 오늘 이탈리아 북부의 작은 마을 푸지냐노에서 태어난 아르칸젤로 코렐리의 바이올린 소나타입니다. 코렐리는 로마에서 활동하며 바이올린 연주와 작곡, 교육 모두에서 큰 명성을 얻었고, 바이올린 음악의 기초를 놓은 사람으로 평가받습니다. 1700년 로마에서 출판된 열두 곡의 바이올린 소나타 작품 5는 유럽 전역에서 큰 인기를 끌어 수없이 다시 출판되었으며, 비발디와 헨델 같은 다음 세대 작곡가들에게 큰 영향을 주었습니다. 그 마지막 곡인 이 작품은 '라 폴리아'라는 유명한 선율을 주제로 한 변주곡입니다. 폴리아는 이베리아반도에서 유래한 춤곡으로, '광기' 또는 '정신 나간 짓'이라는 뜻을 지니고 있습니다. 원래는 시끌벅적하고 떠들썩한 춤이었지만, 바로크 시대에는 장중하고 애수 어린 선율과 화음으로 자리 잡았습니다. 코렐리는 이 짧은 주제를 스물세 번 변주하며, 느리고 서정적인 노래부터 숨 가쁘게 몰아치는 화려한 기교까지 바이올린의 모든 가능성을 펼쳐 보입니다. 바로크 바이올린 음악의 정수를 만나 보세요."], ["2-18", "동물의 사육제", "생상스", "실내악", "사육제", "사육제 시즌의 대표곡", "프랑스의 작곡가 생상스가 1886년 사육제 기간에 지인들과의 사적인 음악회를 위해 장난삼아 쓴 곡입니다. 생상스는 이 곡이 진지한 작곡가로서의 자신의 명성에 해가 될까 걱정해, 생전에는 「백조」 한 곡을 빼고는 출판과 공개 연주를 허락하지 않았습니다. 곡은 그의 유언에 따라 사후인 1922년에야 정식으로 공개되었고, 지금은 그의 작품 가운데 가장 사랑받는 곡이 되었습니다. 두 대의 피아노와 작은 앙상블이 연주하는 14개의 짧은 곡에는 사자, 암탉과 수탉, 거북이, 코끼리, 캥거루, 물고기, 당나귀, 뻐꾸기, 새, 백조 등 다양한 동물이 등장합니다. 느릿느릿 걷는 거북이는 오펜바흐의 신나는 캉캉 선율을 아주 느리게 연주하고, 육중한 코끼리는 더블베이스가 우아한 요정의 춤 선율을 흉내 냅니다. '피아니스트'와 '화석'이라는 곡에는 서툰 피아노 연습생과 낡은 음악을 놀리는 유머가 숨어 있습니다. 가장 유명한 「백조」에서는 첼로가 물 위를 미끄러지는 백조를 우아하게 노래합니다. 아이들과 함께 동물 친구들을 찾아보세요."], ["2-19", "로마의 사육제 서곡 Op.9", "베를리오즈", "관현악", "사육제", "사육제 시즌(독립 연주회용 서곡)", "프랑스 낭만주의 작곡가 베를리오즈가 1844년에 쓴 연주회용 서곡입니다. 베를리오즈는 젊은 시절 프랑스 최고의 작곡상인 '로마 대상'을 받아 2년 가까이 로마에 머물렀는데, 그때 경험한 이탈리아의 사육제 풍경과 활기찬 민중의 모습이 이 곡에 담겨 있습니다. 곡은 화려하게 터져 나오는 짧은 서주로 시작한 뒤, 잉글리시 호른이 부드럽고 애틋한 사랑의 노래를 들려줍니다. 이 선율은 점점 다른 악기들로 퍼져 나가며 풍성해지고, 이어 탬버린과 캐스터네츠가 등장하면서 분위기가 순식간에 바뀝니다. 이탈리아의 빠르고 신나는 춤곡 '살타렐로'의 리듬이 휘몰아치며, 가면을 쓴 사람들이 거리로 쏟아져 나와 밤새 춤추는 사육제의 절정을 그려 냅니다. 베를리오즈는 관현악의 다양한 음색을 누구보다 대담하고 독창적으로 사용한 작곡가였는데, 이 곡은 그런 그의 관현악 솜씨가 유감없이 드러나는 작품입니다. 10분이 채 되지 않는 짧은 곡이지만, 로마의 거리 한복판에 서 있는 듯한 생생함을 느낄 수 있습니다. 축제의 열기를 함께 느껴 보세요."], ["2-20", "사육제 서곡 Op.92", "드보르자크", "관현악", "사육제", "사육제 시즌", "드보르자크가 1891년에 작곡한 연주회용 서곡입니다. 그는 「자연, 삶, 그리고 사랑」이라는 큰 주제 아래 세 곡의 서곡을 연달아 썼는데, 「자연 속에서」가 자연을, 「사육제」가 삶을, 「오셀로」가 사랑을 나타냅니다. 세 곡 가운데 「사육제」는 가장 활기차고 화려해서 단독으로도 자주 연주됩니다. 드보르자크는 이 곡에 대해 \"외로운 여행자가 해 질 녘 사람들이 축제를 벌이는 도시에 도착해, 사방에서 울려 퍼지는 악기 소리와 웃음, 노래에 휩쓸리는 모습\"이라는 설명을 남겼다고 전해집니다. 곡은 탬버린과 심벌즈, 트라이앵글이 요란하게 울리는 가운데 오케스트라 전체가 힘차게 폭발하며 시작합니다. 가운데 부분에서는 잉글리시 호른과 플루트가 조용하고 목가적인 선율을 노래하며 잠시 축제의 소란에서 벗어난 연인들의 모습을 그려 내다가, 다시 흥겨운 축제의 한복판으로 돌아와 열광적으로 끝을 맺습니다. 이듬해 드보르자크는 미국으로 떠나기 전 고국에서 연 작별 연주회에서 이 곡을 초연했습니다. 삶의 기쁨을 마음껏 누려 보세요."], ["2-21", "빈 사육제의 어릿광대 Op.26", "슈만", "독주", "사육제", "사육제 시즌", "슈만이 1839년 빈에 머물던 시기에 쓴 피아노곡으로, '환상적인 그림'이라는 부제가 붙어 있습니다. 당시 슈만은 클라라와의 결혼을 반대하는 클라라의 아버지와 갈등을 겪고 있었고, 새로운 출발을 꿈꾸며 빈으로 이주해 음악 잡지를 낼 계획이었습니다. 그는 빈에서 마침 사육제를 맞아 거리를 가득 메운 가면과 음악, 들뜬 사람들의 모습을 보며 이 곡을 구상했습니다. 다섯 곡으로 이루어진 이 작품의 첫 곡에는 재미있는 비밀이 숨어 있습니다. 당시 오스트리아에서는 혁명의 노래인 프랑스 국가 「라 마르세예즈」의 연주가 금지되어 있었는데, 슈만은 그 선율을 곡 속에 슬쩍 숨겨 넣어 엄격한 검열을 비웃었습니다. 그야말로 가면을 쓴 사육제의 장난이지요. 이어지는 곡들에서는 다정한 로망스, 익살스러운 스케르초, 깊은 감정이 담긴 간주곡이 펼쳐지고, 마지막 곡은 숨 가쁘게 질주하는 화려한 피날레로 끝납니다. 슈만 특유의 환상과 열정, 그리고 장난기가 가득한 곡입니다. 가면 뒤에 숨은 작곡가의 미소를 찾아보세요."], ["2-22", "「베네치아의 사육제」 변주곡 Op.10", "파가니니", "독주", "사육제", "사육제 시즌", "'악마의 바이올리니스트'로 불린 이탈리아의 니콜로 파가니니가 1829년 무렵 작곡한 변주곡입니다. 파가니니는 당시 사람들이 악마에게 영혼을 팔았다고 수군거릴 만큼 놀라운 기교로 유럽 전역을 사로잡았습니다. 이 곡의 주제는 베네치아에서 널리 불리던 민요 「오, 사랑하는 엄마」로, 단순하고 소박한 선율입니다. 베네치아는 화려한 가면 축제로 유명한 도시인데, 파가니니는 이 선율을 '베네치아의 사육제'라고 이름 붙이고, 그 위에 여러 개의 변주를 펼쳐 바이올린으로 할 수 있는 거의 모든 기교를 선보였습니다. 손가락으로 줄을 살짝 건드려 내는 피리 소리 같은 하모닉스, 활을 켜는 동시에 왼손 손가락으로 줄을 뜯는 기술, 높은음과 낮은음을 순식간에 오가는 도약 등이 쉴 새 없이 이어집니다. 원래는 관현악 반주가 붙어 있었지만 오늘날에는 주로 피아노 반주로 연주됩니다. 이 선율은 이후 수많은 작곡가와 연주자들이 저마다의 변주를 붙이며 사육제 음악의 상징이 되었습니다. 가면 뒤에서 펼쳐지는 바이올린의 묘기를 즐겨 보세요."], ["2-23", "하프 협주곡 B♭장조 Op.4-6", "헨델", "협주곡", "기념일", "헨델 탄생일(1685.2.23)", "1685년 오늘 독일 할레에서 태어난 헨델의 협주곡입니다. 헨델은 같은 해에 태어난 바흐와 함께 바로크 음악을 대표하는 작곡가이지만, 고향에 머문 바흐와 달리 이탈리아와 영국을 오가며 국제적인 명성을 쌓았고, 결국 영국에 귀화해 런던에서 생을 마쳤습니다. 헨델은 런던에서 오라토리오를 공연할 때 막간에 자신이 직접 협주곡을 연주해 청중의 큰 인기를 얻었습니다. 이 곡도 1736년 그런 막간 연주를 위해 쓰였는데, 원래는 하프를 위한 협주곡이었습니다. 이후 오르간 협주곡 모음집 작품 4의 여섯 번째 곡으로 출판되면서 오르간으로도 연주되지만, 지금은 하프 협주곡으로 가장 널리 사랑받고 있습니다. 하프의 맑고 영롱한 소리가 현악기와 리코더의 부드러운 반주 위에서 반짝이며, 마치 궁정의 우아한 오후를 보는 듯합니다. 특히 2악장에서는 현악기가 약음기를 끼고 조용히 하프를 감싸는데, 그 고요하고 아름다운 울림이 깊은 여운을 남깁니다. 하프 연주자에게는 꼭 거쳐야 할 대표 레퍼토리입니다. 헨델의 생일을 맞아, 맑은 하프 소리로 하루를 열어 보세요."], ["2-24", "헝가리 광시곡 9번 「페스트의 사육제」", "리스트", "독주", "사육제", "사육제 시즌", "리스트가 고국 헝가리의 집시 음악에서 영감을 받아 쓴 열아홉 곡의 「헝가리 광시곡」 가운데 아홉 번째 곡입니다. 리스트는 헝가리에서 태어났지만 어린 나이에 고향을 떠나 주로 파리와 독일에서 활동했고, 독일어와 프랑스어를 썼습니다. 그럼에도 그는 평생 자신을 헝가리인이라 여겼으며, 어린 시절 들었던 집시 악단의 정열적인 음악을 피아노로 되살리고자 했습니다. 이 곡의 부제 「페스트의 사육제」에서 '페스트'는 도나우강 동쪽에 있는 도시로, 서쪽의 '부다'와 합쳐져 오늘날의 헝가리 수도 부다페스트가 되었습니다. 곡은 사육제를 맞은 페스트 거리의 떠들썩한 풍경을 담고 있습니다. 집시 바이올린이 흥겹게 즉흥 연주를 하듯 선율이 자유롭게 흘러가고, 춤추는 사람들의 발 구르는 소리와 웃음소리가 들려오는 듯한 리듬이 점점 빨라지며 열광적으로 고조됩니다. 화려한 기교가 쉴 새 없이 이어져 피아니스트에게는 큰 도전이 되는 곡입니다. 리스트는 이 곡을 바이올리니스트 에른스트에게 헌정했습니다. 흥겨운 헝가리의 축제 속으로 들어가 보세요."], ["2-25", "「베네치아의 사육제」 변주곡", "아르반", "독주", "사육제", "트럼펫 독주의 사육제 명곡", "프랑스의 코넷 연주자이자 교육자인 장바티스트 아르반이 쓴 변주곡입니다. 19세기 중반 아르반은 당시 새롭게 등장한 금관악기 코넷의 명연주자로 이름을 떨쳤고, 파리 음악원에 코넷 과정을 처음 만들어 많은 제자를 길렀습니다. 그가 1864년에 펴낸 교본은 지금도 전 세계 트럼펫 연주자들 사이에서 '트럼펫의 성경'이라 불리며 필수 교재로 쓰이고 있는데, 이 변주곡도 그 교본의 마지막 부분에 실려 있습니다. 주제는 파가니니의 곡과 같은 베네치아 민요 선율이지만, 아르반은 이를 금관악기에 맞게 새롭게 변주했습니다. 혀를 빠르게 움직여 음을 끊어 내는 텅잉 기술, 높은음과 낮은음을 순식간에 오가며 마치 두 사람이 함께 연주하는 것처럼 들리게 하는 기교 등이 화려하게 펼쳐집니다. 트럼펫이 이렇게 빠르고 섬세하게 움직일 수 있다는 사실에 놀라게 되지요. 트럼펫 연주자들의 실력을 가늠하는 시험곡으로도 자주 쓰이며, 명연주자들의 앙코르 곡으로 사랑받고 있습니다. 바이올린에 이어 트럼펫으로 듣는 베네치아의 사육제를 비교해 보세요."], ["2-26", "사육제 서곡 Op.45", "글라주노프", "관현악", "사육제", "사육제 시즌", "러시아의 작곡가 글라주노프가 1890년대 초에 쓴 연주회용 서곡입니다. 글라주노프는 열여섯 살에 첫 교향곡을 발표해 스승 림스키코르사코프를 놀라게 한 천재 작곡가로, 훗날 상트페테르부르크 음악원 원장을 지내며 쇼스타코비치 같은 제자들을 길러 냈습니다. 그는 스승에게서 물려받은 화려하고 색채감 넘치는 관현악 솜씨로 유명했는데, 이 서곡에도 그 재능이 잘 드러나 있습니다. 곡은 축제의 시작을 알리듯 오케스트라 전체가 힘차게 터져 나오며 시작하고, 이어 관악기와 타악기가 번갈아 흥겨운 선율과 리듬을 주고받습니다. 중간에는 축제의 소란이 잠시 가라앉으며 서정적이고 부드러운 선율이 흐르는데, 마치 떠들썩한 거리 한쪽에서 조용히 사랑을 속삭이는 연인들을 보는 듯합니다. 그리고 다시 축제의 열기가 고조되어 화려하고 웅장한 마무리로 끝을 맺습니다. 베를리오즈나 드보르자크의 사육제 서곡에 비해 덜 알려졌지만, 러시아 관현악의 풍성한 색채를 느낄 수 있는 숨은 보석 같은 곡입니다. 사육제 시즌의 마지막 축제를 즐겨 보세요."], ["2-27", "이탈리아 협주곡 BWV 971", "바흐", "독주", "일반", "건반 독주 협주곡", "바흐가 1735년 「클라비어 연습곡집」 제2권으로 출판한 하프시코드 독주곡입니다. 같은 책에는 프랑스풍의 「프랑스 서곡」도 함께 실려 있어, 당시 유럽 음악을 이끌던 두 나라, 이탈리아와 프랑스의 양식을 나란히 보여 줍니다. 바흐는 평생 독일을 떠난 적이 없지만, 비발디를 비롯한 이탈리아 작곡가들의 협주곡을 악보로 꼼꼼히 연구하고 편곡하며 그 양식을 익혔습니다. 원래 협주곡은 독주 악기와 합주단이 서로 번갈아 연주하며 대비를 이루는 음악인데, 바흐는 이를 한 대의 건반 악기로 혼자 표현해 냈습니다. 당시 두 단의 건반을 가진 하프시코드를 사용해, 한쪽 건반은 크고 화려한 합주를, 다른 쪽 건반은 작고 섬세한 독주를 맡게 했지요. 1악장은 밝고 당당하며, 2악장은 왼손의 잔잔한 반주 위로 오른손이 길고 아름다운 아리아를 노래합니다. 3악장은 숨 가쁘게 내달리는 경쾌한 피날레입니다. 오늘날에는 피아노로도 자주 연주됩니다. 한 대의 악기로 오케스트라를 그려 낸 바흐의 솜씨를 감상해 보세요."], ["2-28", "서정소곡집 중 「봄에」 Op.43-6", "그리그", "독주", "봄", "겨울 끝, 봄을 기다리며", "노르웨이의 작곡가 그리그가 평생에 걸쳐 쓴 피아노 소품집 「서정 소곡집」의 세 번째 권에 실린 마지막 곡입니다. 그리그는 1867년부터 1901년까지 34년 동안 모두 열 권, 66곡의 서정 소곡을 남겼는데, 이 곡들은 그의 일기장처럼 일상의 감정과 노르웨이의 자연 풍경을 소박하게 담고 있습니다. 1886년에 출판된 「봄에」는 그 가운데 가장 사랑받는 곡 가운데 하나로, 그리그 자신도 연주회에서 즐겨 연주했습니다. 겨울이 길고 어두운 노르웨이에서 봄은 오랜 기다림 끝에 찾아오는 귀한 손님입니다. 곡은 조용하고 부드러운 선율로 시작해, 얼어붙은 땅이 녹고 새싹이 움트는 모습을 그려 냅니다. 선율이 되풀이되면서 높은 음역에서 반짝이는 장식음이 더해지는데, 마치 따스한 햇살이 내리쬐고 새들이 지저귀는 듯합니다. 마지막에는 봄을 맞이하는 벅찬 기쁨이 커다랗게 피어올랐다가 고요하게 가라앉습니다. 2월의 마지막 날, 겨울의 끝자락에서 봄을 기다리는 마음으로 들어 보세요. 내일이면 3월입니다."], ["2-29", "현악 소나타 1번 G장조", "로시니", "실내악", "기념일", "2월 29일생 로시니(1792.2.29)가 12세에 쓴 기악곡. 4년에 한 번 생일", "4년에 한 번 찾아오는 2월 29일은 이탈리아의 작곡가 조아키노 로시니의 생일입니다. 1792년 2월 29일에 태어난 로시니는 일흔여섯 살까지 살았지만, 정작 생일을 맞은 것은 열아홉 번뿐이었습니다. 「세비야의 이발사」, 「윌리엄 텔」 같은 오페라로 유명한 그는 서른일곱 살에 돌연 오페라 작곡을 그만두고 남은 40년 가까이를 미식가로 즐기며 살았는데, 그의 이름을 딴 요리 '투르네도 로시니'가 지금도 전해집니다. 이 날을 위해 고른 곡은 로시니가 열두 살이던 1804년에 쓴 여섯 곡의 현악 소나타 가운데 첫 곡입니다. 음악을 사랑하는 더블베이스 애호가 친구의 별장에 머물던 소년 로시니는 단 사흘 만에 이 여섯 곡을 완성했다고 합니다. 편성도 특이해서 바이올린 두 대와 첼로, 더블베이스로 이루어져 있으며 비올라가 없습니다. 로시니는 악보에 스스로 '형편없는 소나타'라고 적었지만, 곡은 밝고 재치 넘치는 선율로 가득합니다. 4년에 한 번 오는 특별한 날, 소년 천재의 선물을 즐겨 보세요."], ["3-1", "피아노 협주곡 2번 f단조 Op.21", "쇼팽", "협주곡", "기념일", "쇼팽 탄생일(1810.3.1 설)", "1810년 3월 1일 폴란드 바르샤바 근교의 젤라조바볼라에서 태어난 쇼팽의 피아노 협주곡입니다. 쇼팽은 두 곡의 피아노 협주곡을 남겼는데, 이 곡은 '2번'이라는 번호가 붙어 있지만 실제로는 1번보다 먼저 작곡되었습니다. 출판 순서가 바뀌면서 번호가 뒤바뀐 것이지요. 열아홉 살의 쇼팽은 이 곡을 쓸 무렵 바르샤바 음악원에서 노래를 공부하던 콘스탄차 그와트코프스카를 남몰래 짝사랑하고 있었습니다. 그는 친구에게 보낸 편지에서 그녀를 생각하며 협주곡의 느린 악장을 썼다고 고백했습니다. 바로 2악장 라르게토로, 피아노가 꿈꾸듯 아름다운 선율을 노래하다가 가운데 부분에서 격정적인 감정이 솟구치는, 젊은 날의 수줍고도 뜨거운 사랑이 가득한 음악입니다. 1악장은 우수와 열정이 교차하고, 3악장은 폴란드 민속춤 마주르카의 리듬이 흥겹게 펼쳐집니다. 1830년 3월 바르샤바에서 쇼팽 자신의 독주로 초연되었습니다. 같은 해 가을 쇼팽은 조국을 떠났고, 다시는 돌아오지 못했습니다. 그의 생일을 축하하며 들어 보세요."], ["3-2", "어린이 정경 Op.15", "슈만", "독주", "졸업·새학기", "입학식·새 학기(트로이메라이 포함)", "슈만이 1838년에 작곡한 피아노 소품집으로, 열세 곡의 짧은 곡으로 이루어져 있습니다. 슈만은 연인 클라라에게 보낸 편지에서, 당신이 언젠가 나를 보고 어린아이 같다고 말한 것이 떠올라 서른 곡 정도의 귀여운 소품을 썼고, 그중 열세 곡을 골라 「어린이 정경」이라 이름 붙였다고 썼습니다. 이 곡들은 어린이가 연주하기 위한 곡이라기보다, 어른이 된 슈만이 어린 시절을 그리워하며 돌아본 추억의 그림책에 가깝습니다. '낯선 나라와 사람들', '술래잡기', '조르는 아이', '목마의 기사', '난롯가에서', '잠든 아이' 같은 제목에서 아이들의 일상이 정겹게 떠오릅니다. 그중 일곱 번째 곡 「트로이메라이(꿈)」는 슈만의 작품 가운데 가장 유명한 곡으로, 고요하고 따뜻한 선율이 한 편의 꿈처럼 흘러갑니다. 마지막 곡 「시인은 말한다」에서는 어른이 된 시인이 아이들의 세계를 조용히 바라보며 이야기를 마무리합니다. 새 학기를 맞아 교실에 들어선 아이들, 그리고 우리 마음속의 어린아이를 위해 들어 보세요."], ["3-3", "장난감 교향곡", "레오폴트 모차르트(전)", "관현악", "졸업·새학기", "새 학기의 즐거움", "장난감 악기들이 오케스트라와 함께 연주하는 사랑스러운 교향곡입니다. 오랫동안 하이든의 작품으로 알려졌다가, 이후 모차르트의 아버지 레오폴트 모차르트의 작품으로 여겨졌고, 최근에는 오스트리아의 수도사 에드문트 앙거러가 썼다는 주장이 나오는 등 작곡가가 확실하지 않은 곡입니다. 하지만 누가 썼든 이 곡의 즐거움은 변하지 않습니다. 현악기와 건반 악기가 소박하고 단정한 선율을 연주하는 동안, 뻐꾸기 피리, 메추라기 피리, 물을 넣어 새소리를 내는 나이팅게일 피리, 딸랑이, 장난감 나팔, 작은 북 같은 장난감 악기들이 끼어들어 웃음을 자아냅니다. 마치 아이들이 어른들의 음악회에 몰래 들어와 장난을 치는 것 같지요. 세 악장으로 이루어져 있으며 전체 길이는 10분 남짓입니다. 이 곡은 교실이나 가정에서 아이들과 함께 장난감 악기로 연주해 보기에도 좋아서, 음악 수업에서 자주 활용됩니다. 새 학기, 새 친구들과 함께하는 교실의 들뜬 분위기를 떠올리며 들어 보세요. 음악이 놀이가 되는 순간의 즐거움을 느낄 수 있을 거예요."], ["3-4", "만돌린 협주곡 C장조 RV 425", "비발디", "협주곡", "기념일", "비발디 탄생일(1678.3.4)", "1678년 3월 4일 베네치아에서 태어난 비발디의 협주곡입니다. 비발디는 가톨릭 사제이면서 바이올리니스트였고, 머리카락이 붉어 '붉은 머리의 사제'라는 별명으로 불렸습니다. 그는 베네치아의 피에타 고아원에서 오랫동안 음악을 가르쳤는데, 이곳의 소녀들로 이루어진 합주단은 유럽 전역에서 찾아올 만큼 뛰어난 실력으로 유명했습니다. 비발디는 이 소녀들을 위해 다양한 악기의 협주곡을 수백 곡이나 썼고, 이 곡도 그중 하나입니다. 만돌린은 류트 계열의 작은 현악기로, 쇠줄을 두 줄씩 짝지어 걸고 작은 채로 튕겨 연주합니다. 소리가 작고 금방 사라지지만 맑고 반짝이는 음색이 매력적이지요. 비발디는 이 악기의 특성을 잘 살려, 경쾌한 1악장과 3악장 사이에 2악장을 넣었는데, 이 악장에서는 현악기들이 활 대신 손가락으로 줄을 뜯어 만돌린의 섬세한 노래를 살며시 받쳐 줍니다. 비발디가 독주 만돌린을 위해 쓴 단 하나의 협주곡으로, 만돌린 연주자들에게는 가장 소중한 레퍼토리입니다. 이른 봄 햇살처럼 반짝이는 소리를 즐겨 보세요."], ["3-5", "브라질풍의 바흐 2번 중 「카이피라의 작은 기차」", "빌라로부스", "관현악", "기념일", "빌라로부스 탄생일(1887.3.5)", "1887년 3월 5일 리우데자네이루에서 태어난 브라질의 작곡가 빌라로부스의 작품입니다. 그는 젊은 시절 브라질 곳곳을 여행하며 민속 음악을 익혔고, 이를 바탕으로 브라질만의 독특한 클래식 음악을 만들어 냈습니다. 빌라로부스는 바흐의 음악이야말로 세계 모든 민속 음악의 근원이라고 믿었고, 바흐의 형식과 브라질 민속 음악을 결합한 아홉 곡의 모음곡 「브라질풍의 바흐」를 썼습니다. 1930년에 쓴 두 번째 모음곡의 마지막 곡 「카이피라의 작은 기차」는 그 가운데 가장 사랑받는 곡입니다. '카이피라'는 브라질 내륙 시골에 사는 소박한 농부들을 말합니다. 곡은 낡은 증기 기관차가 칙칙 소리를 내며 천천히 출발하는 모습으로 시작해, 점점 속도를 높여 들판을 가로질러 달려갑니다. 타악기와 금관악기가 기차 바퀴와 증기 소리를 실감 나게 흉내 내고, 그 위로 정겹고 서정적인 선율이 흐르지요. 마지막에는 기차가 숨을 몰아쉬며 역에 멈추어 섭니다. 아이들과 함께 기차 소리를 찾아보며 들으면 더욱 즐겁습니다."], ["3-6", "사계 Op.37 중 「3월: 종달새의 노래」", "차이콥스키", "독주", "계절 표제", "표제 자체가 3월", "차이콥스키의 피아노 모음곡 「사계」 가운데 3월의 곡입니다. 러시아의 3월은 아직 눈이 채 녹지 않은 이른 봄이지만, 들판 위 하늘 높이 종달새가 날아오르며 봄이 왔음을 알립니다. 이 곡에는 시인 마이코프의 시에서 따온, 꽃이 물결치는 들판과 하늘에서 울려 퍼지는 종달새의 노래를 묘사한 구절이 붙어 있습니다. 하지만 곡은 기쁨에 들뜬 봄노래라기보다, 단조의 차분하고 쓸쓸한 분위기로 시작합니다. 아직 겨울의 기운이 남아 있는 서늘한 이른 봄의 공기, 그리고 긴 겨울을 지나 조심스럽게 깨어나는 자연의 모습이 담겨 있는 듯합니다. 오른손이 들려주는 짧은 트릴과 장식음은 종달새의 지저귐을 떠올리게 하고, 소박하고 애틋한 선율은 넓은 러시아 들판에 홀로 울려 퍼지는 새소리처럼 들립니다. 2분 남짓한 짧은 곡이지만 러시아 사람들이 봄을 맞이하는 섬세한 감정이 고스란히 담겨 있습니다. 창밖에서 들려오는 새소리에 귀를 기울이며, 아직은 조심스러운 봄의 첫 숨결을 느껴 보세요."], ["3-7", "피아노 협주곡 G장조", "라벨", "협주곡", "기념일", "라벨 탄생일(1875.3.7)", "1875년 3월 7일 프랑스 남서부의 시부르에서 태어난 라벨의 피아노 협주곡입니다. 라벨은 1928년 미국 연주 여행 중 재즈에 깊이 매료되었고, 거슈윈과도 만났습니다. 그 경험은 이 협주곡에 고스란히 녹아들었습니다. 곡은 채찍을 내리치는 듯한 날카로운 소리와 함께 시작하고, 피콜로가 경쾌한 선율을 연주하며 유쾌한 1악장을 엽니다. 곳곳에서 재즈의 리듬과 블루스 화음이 튀어나와 듣는 재미를 줍니다. 이 곡의 백미는 2악장입니다. 피아노가 반주 없이 홀로 길고 고요한 선율을 끝없이 이어 가는데, 라벨은 모차르트의 클라리넷 5중주를 생각하며 이 선율을 썼으며 한 마디 한 마디 힘겹게 다듬었다고 고백했습니다. 이윽고 잉글리시 호른이 그 선율을 이어받아 노래하는 부분은 숨이 멎을 만큼 아름답습니다. 3악장은 다시 활기차게 내달리며 짧고 화려하게 끝납니다. 1932년 라벨의 지휘와 피아니스트 마르그리트 롱의 독주로 초연되었습니다. 그의 생일을 맞아 재즈와 프랑스의 우아함이 만난 이 곡을 즐겨 보세요."], ["3-8", "첼로 협주곡 A장조 Wq.172", "C.P.E. 바흐", "협주곡", "기념일", "C.P.E. 바흐 탄생일(1714.3.8)", "요한 제바스티안 바흐의 둘째 아들 카를 필리프 에마누엘 바흐의 첼로 협주곡입니다. 1714년 3월 8일에 태어난 그는 오늘날에는 아버지의 그늘에 가려져 있지만, 당대에는 아버지보다 훨씬 유명한 작곡가였습니다. 모차르트는 그를 두고 \"그는 아버지이고, 우리는 그 자식들\"이라고 말했다고 전해지며, 하이든과 베토벤도 그의 음악을 깊이 연구했습니다. 그는 30년 가까이 프로이센의 프리드리히 대왕 궁정에서 건반 연주자로 일했고, 이후 함부르크의 음악감독으로 활동했습니다. 그의 음악은 감정을 섬세하고 극적으로 표현하는 '다감양식'으로 유명한데, 갑작스러운 분위기 변화와 대담한 화성이 특징입니다. 이 협주곡은 1750년대에 작곡되었으며, 첼로뿐 아니라 플루트와 하프시코드를 위한 버전도 함께 전해집니다. 밝고 생기 넘치는 1악장과 3악장 사이에 놓인 2악장 라르고는 깊은 슬픔과 탄식이 가득한 노래로, 첼로의 따뜻하고 깊은 음색이 마음을 울립니다. 바로크에서 고전주의로 넘어가는 길목에서 피어난 개성 넘치는 음악을 만나 보세요."], ["3-9", "바이올린 협주곡 Op.14", "바버", "협주곡", "기념일", "바버 탄생일(1910.3.9)", "1910년 3월 9일 미국 펜실베이니아에서 태어난 새뮤얼 바버의 바이올린 협주곡입니다. 1939년 필라델피아의 한 사업가가 자신이 후원하던 젊은 바이올리니스트를 위해 바버에게 협주곡을 의뢰하면서 이 곡이 시작되었습니다. 바버는 스위스에 머물며 1악장과 2악장을 먼저 완성했는데, 두 악장 모두 깊고 서정적인 선율로 가득했습니다. 그런데 이를 받아 본 연주자가 독주자의 기교를 보여 줄 곳이 부족하다며 불만을 나타냈다는 이야기가 전해집니다. 그러자 바버는 3악장을 숨 돌릴 틈 없이 몰아치는 빠르고 어려운 '무궁동'으로 썼는데, 이번에는 너무 어렵다는 반응이 나왔다고 하지요. 우여곡절 끝에 이 곡은 1941년 필라델피아 관현악단과 다른 독주자에 의해 초연되었습니다. 1악장은 바이올린이 처음부터 따뜻하고 넉넉한 선율을 노래하고, 2악장은 오보에의 애수 어린 선율로 시작해 바이올린이 깊은 그리움을 이어 갑니다. 「현을 위한 아다지오」와 함께 바버의 가장 사랑받는 작품입니다. 미국 낭만주의의 아름다운 선율에 귀를 기울여 보세요."], ["3-10", "치고이너바이젠 Op.20", "사라사테", "독주", "기념일", "사라사테 탄생일(1844.3.10)", "1844년 3월 10일 스페인 북부 팜플로나에서 태어난 바이올리니스트이자 작곡가 파블로 데 사라사테의 대표작입니다. '치고이너바이젠'은 독일어로 '집시의 노래'라는 뜻입니다. 사라사테는 어려서부터 신동으로 이름을 떨쳤고, 맑고 아름다운 음색과 놀라운 기교로 유럽 전역에서 큰 인기를 누렸습니다. 브람스, 생상스, 브루흐 같은 당대의 작곡가들이 그를 위해 작품을 쓸 정도였지요. 1878년에 작곡한 이 곡은 헝가리 집시 음악의 선율과 분위기를 바탕으로 합니다. 곡은 오케스트라의 무겁고 극적인 서주에 이어, 바이올린이 홀로 깊은 슬픔을 토해 내듯 즉흥적으로 노래하며 시작합니다. 이어지는 느린 부분에서는 약음기를 낀 바이올린이 가슴 아픈 애가를 들려주는데, 이 선율은 헝가리 작곡가의 노래를 빌려 온 것입니다. 그리고 마지막 부분에서는 분위기가 반전되어, 왼손 피치카토와 빠른 음표들이 불꽃처럼 튀는 열광적인 춤곡으로 마무리됩니다. 사라사테 자신의 연주가 녹음으로 남아 있어 지금도 들을 수 있습니다. 집시의 슬픔과 열정을 함께 느껴 보세요."], ["3-11", "리베르탱고", "피아졸라", "실내악", "기념일", "피아졸라 탄생일(1921.3.11)", "1921년 3월 11일 아르헨티나의 항구 도시 마르델플라타에서 태어난 아스토르 피아졸라의 대표곡입니다. 피아졸라는 어린 시절 뉴욕에서 자랐고, 아버지가 선물한 반도네온을 배우며 탱고의 세계에 들어섰습니다. 반도네온은 아코디언과 비슷한 독일의 악기로, 아르헨티나 탱고의 영혼 같은 존재입니다. 피아졸라는 프랑스에서 작곡가 나디아 불랑제에게 클래식 작곡을 배웠는데, 스승은 그의 탱고 연주를 듣고 \"이것이 진짜 피아졸라다. 절대 버리지 말라\"고 격려했습니다. 이후 그는 전통 탱고에 클래식과 재즈를 더한 '탱고 누에보', 즉 새로운 탱고를 만들어 냈지만, 전통을 지키려는 사람들로부터 \"탱고를 죽였다\"는 비난도 받았습니다. 1974년 이탈리아에 머물던 시기에 쓴 「리베르탱고」는 '자유'를 뜻하는 '리베르타드'와 '탱고'를 합친 제목으로, 전통의 틀에서 벗어난 자유로운 탱고를 상징합니다. 반복되는 강렬한 리듬 위에서 선율이 점점 뜨겁게 타오릅니다. 첼로, 피아노, 기타 등 수많은 악기로 편곡되어 사랑받고 있습니다."], ["3-12", "교향곡 1번 「봄」 Op.38", "슈만", "관현악", "봄", "부제가 봄", "슈만이 클라라와 오랜 법정 다툼 끝에 결혼한 다음 해인 1841년, 행복한 신혼 생활 속에서 쓴 첫 교향곡입니다. 슈만은 시인 뵈트거의 시 마지막 구절 \"골짜기에는 봄이 피어난다\"에 영감을 받아, 단 나흘 만에 교향곡 전체의 스케치를 마쳤다고 합니다. 처음에는 각 악장에 '봄의 시작', '저녁', '즐거운 놀이 친구들', '무르익은 봄'이라는 제목을 붙였다가, 듣는 사람의 상상력을 제한하지 않기 위해 나중에 지웠습니다. 곡은 트럼펫과 호른이 봄의 시작을 알리는 힘찬 팡파르로 시작하는데, 이 리듬은 뵈트거의 시 구절의 운율에서 따온 것이라고 합니다. 이어 오케스트라 전체가 깨어나는 자연처럼 생동감 있게 펼쳐집니다. 2악장은 고요하고 따뜻한 봄날 저녁의 노래이고, 3악장은 활기찬 스케르초이며, 4악장은 봄이 무르익어 기쁨이 넘쳐흐르는 피날레입니다. 1841년 3월 라이프치히에서 멘델스존의 지휘로 초연되어 큰 성공을 거두었습니다. 사랑과 봄의 기쁨이 가득한 이 교향곡과 함께 3월의 봄기운을 느껴 보세요."], ["3-13", "현악4중주 14번 「봄」 K.387", "모차르트", "실내악", "봄", "별명이 봄", "모차르트가 1782년 말에 완성한 현악 4중주곡으로, 이후 하이든에게 헌정한 여섯 곡의 「하이든 4중주」 가운데 첫 곡입니다. 모차르트는 현악 4중주의 아버지라 불리는 하이든을 깊이 존경했는데, 하이든의 작품에 자극을 받아 2년 넘게 공을 들여 이 여섯 곡을 썼습니다. 그는 악보를 출판하며 붙인 헌사에서 이 곡들을 \"오랜 노력의 결실\"이라고 표현하며, 자신의 자식들을 하이든에게 맡긴다고 썼습니다. 그만큼 정성을 다한 곡들이지요. 이 곡에 붙은 '봄'이라는 별명은 모차르트가 지은 것은 아니지만, 밝고 생기 넘치는 선율과 싱그러운 분위기에 잘 어울립니다. 1악장은 따뜻하고 우아한 노래로 시작하고, 3악장은 깊고 서정적인 느린 악장입니다. 특히 4악장은 엄격한 대위법의 푸가와 경쾌한 소나타 형식을 절묘하게 결합해, 학문적인 깊이와 활기찬 즐거움을 함께 보여 줍니다. 이 4중주를 들은 하이든은 모차르트의 아버지 레오폴트에게 \"당신의 아들은 내가 아는 가장 위대한 작곡가\"라고 말했다고 전해집니다."], ["3-14", "비올라 협주곡 G장조 TWV 51:G9", "텔레만", "협주곡", "기념일", "텔레만 탄생일(1681.3.14)", "1681년 3월 14일 독일 마그데부르크에서 태어난 게오르크 필리프 텔레만의 협주곡입니다. 텔레만은 음악을 반대한 가족 때문에 거의 독학으로 음악을 익혔지만, 생전에는 바흐와 헨델보다 더 유명하고 인기 있는 작곡가였습니다. 그는 평생 3천 곡이 넘는 작품을 남겨 역사상 가장 많은 곡을 쓴 작곡가 가운데 한 명으로 꼽히며, 함부르크의 음악감독으로 40년 넘게 활동했습니다. 이 곡은 비올라를 독주 악기로 내세운 협주곡 가운데 현재까지 전해지는 가장 오래된 작품으로 알려져 있습니다. 비올라는 바이올린보다 조금 크고 낮은 소리를 내는 악기로, 오케스트라에서 주로 화음의 가운데를 채우는 역할을 맡아 독주 악기로는 잘 주목받지 못했습니다. 텔레만은 이 악기의 부드럽고 그윽한 음색에 주목해, 느리고 빠른 악장이 번갈아 나오는 네 악장의 협주곡을 썼습니다. 특히 1악장은 비올라의 따뜻하고 깊은 노래가 돋보이며, 마지막 악장은 생기 넘치게 마무리됩니다. 지금도 비올라 연주자들이 반드시 익히는 곡입니다. 수줍은 악기가 주인공이 되는 순간을 감상해 보세요."], ["3-15", "바이올린 소나타 5번 「봄」 Op.24", "베토벤", "실내악", "봄", "별명이 봄", "베토벤이 1801년에 완성한 바이올린 소나타로, 그가 남긴 열 곡의 바이올린 소나타 가운데 다섯 번째 곡입니다. '봄'이라는 별명은 베토벤이 직접 붙인 것이 아니라 그의 사후에 붙은 것이지만, 첫 소절부터 따뜻한 봄 햇살 같은 선율이 흘러나와 이보다 더 잘 어울리는 이름은 없을 듯합니다. 베토벤은 이 무렵부터 청력을 잃어 가는 고통을 겪기 시작했지만, 이 곡에는 그런 어둠 대신 밝고 평화로운 기운이 가득합니다. 1악장은 바이올린이 부드럽고 서정적인 선율을 노래하고, 피아노가 다정하게 이를 받으며 시작합니다. 2악장은 고요하고 깊은 사색의 노래이며, 3악장 스케르초는 1분 남짓한 아주 짧은 곡인데, 바이올린이 피아노보다 반 박자씩 늦게 따라가는 듯한 장난스러운 리듬으로 웃음을 자아냅니다. 4악장은 경쾌하고 사랑스러운 론도로 마무리됩니다. 베토벤의 바이올린 소나타 가운데 처음으로 네 악장으로 구성된 작품이기도 합니다. 피아노와 바이올린이 나누는 다정한 봄날의 대화를 들어 보세요."], ["3-16", "무언가 「봄노래」 Op.62-6", "멘델스존", "독주", "봄", "표제가 봄", "멘델스존이 평생에 걸쳐 쓴 피아노 소품집 「무언가」 가운데 가장 널리 알려진 곡입니다. '무언가(無言歌)'는 '말이 없는 노래', 즉 가사 없이 피아노로 부르는 노래라는 뜻입니다. 멘델스존은 이런 소품을 모두 여덟 권, 마흔여덟 곡이나 남겼는데, 이 곡들은 당시 유럽의 중산층 가정에서 피아노를 치는 사람들에게 큰 사랑을 받았습니다. 노래하듯 흐르는 선율과 그것을 받쳐 주는 반주라는 단순한 구조 속에 다양한 감정과 풍경을 담아냈지요. 멘델스존은 대부분의 곡에 제목을 붙이지 않았는데, 그 이유를 묻는 질문에 음악은 말보다 더 분명한 것을 표현하기 때문이라고 답했다고 합니다. 이 곡의 「봄노래」라는 제목도 출판사가 붙인 것입니다. 오른손이 밝고 우아한 선율을 노래하는 동안, 손가락 끝으로 톡톡 끊어 연주하는 아르페지오가 반짝이는 봄 햇살처럼 그 주위를 감쌉니다. 따뜻한 봄바람이 살랑이는 정원을 걷는 듯한 기분이 드는 곡입니다. 2분 남짓한 짧은 곡이니, 바쁜 하루 중 잠시 쉬어 가는 시간에 들어 보세요."], ["3-17", "「봄의 첫 뻐꾸기 소리를 들으며」", "들리어스", "관현악", "봄", "표제가 봄", "영국의 작곡가 프레더릭 들리어스가 1912년에 쓴 작은 관현악곡입니다. 들리어스는 영국 브래드퍼드의 부유한 양모 상인 집안에서 태어났지만, 가업을 잇는 대신 미국 플로리다의 오렌지 농장을 경영하기도 하며 떠돌다가 결국 음악의 길을 택했습니다. 이후 그는 프랑스 파리 근교의 작은 마을 그레쉬르루앵에 정착해, 꽃이 만발한 정원이 딸린 집에서 남은 생애를 보내며 자연을 노래하는 음악을 썼습니다. 이 곡은 노르웨이 민요의 선율을 바탕으로 하고 있는데, 들리어스는 젊은 시절 노르웨이를 자주 여행했고 그리그와도 깊은 우정을 나누었습니다. 곡은 현악기의 부드럽고 몽환적인 화음으로 시작해, 봄날의 따스하고 나른한 숲속 풍경을 그려 냅니다. 그 사이로 클라리넷이 '뻐꾹, 뻐꾹' 하고 뻐꾸기 소리를 들려주는데, 이 소리는 영국에서 봄이 왔음을 알리는 대표적인 신호입니다. 분명한 선율보다 은은한 색채와 분위기가 돋보이는 6분 남짓한 곡입니다. 들리어스의 음악은 '영국 인상주의'라고도 불립니다. 봄 숲의 고요한 공기를 느껴 보세요."], ["3-18", "셰에라자드 Op.35", "림스키코르사코프", "관현악", "기념일", "림스키코르사코프 탄생일(1844.3.18)", "1844년 3월 18일에 태어난 러시아의 작곡가 림스키코르사코프가 1888년에 쓴 관현악 모음곡입니다. 아라비아의 옛이야기 모음집 「천일야화」를 바탕으로 합니다. 이야기 속에서 아내에게 배신당한 샤리아르 왕은 매일 밤 새 신부를 맞이하고 이튿날 아침에 처형하는데, 지혜로운 셰에라자드는 매일 밤 흥미진진한 이야기를 들려주며 이야기가 가장 궁금한 대목에서 멈춥니다. 왕은 다음 이야기가 궁금해 그녀를 살려 두고, 그렇게 천 하루 밤이 지나며 마침내 마음을 돌리게 되지요. 곡에서 무섭고 위압적인 샤리아르 왕은 금관악기의 묵직한 주제로, 이야기를 들려주는 셰에라자드는 하프 반주 위에서 노래하는 바이올린 독주로 나타납니다. 네 악장에서는 바다와 신드바드의 배, 칼렌다르 왕자의 이야기, 젊은 왕자와 공주의 사랑, 바그다드의 축제와 난파선 이야기가 펼쳐집니다. 림스키코르사코프는 젊은 시절 해군 장교로 세계를 항해했던 경험이 있어서, 그가 그린 바다의 풍경은 특히 생생합니다. 오케스트라가 들려주는 마법 같은 이야기에 빠져 보세요."], ["3-19", "교향적 모음곡 「봄」", "드뷔시", "관현악", "봄", "표제가 봄", "드뷔시가 이탈리아 로마에서 유학하던 1887년에 쓴 작품입니다. 드뷔시는 프랑스 최고의 작곡상인 '로마 대상'을 받아 로마의 메디치 빌라에서 지냈는데, 수상자들은 정기적으로 파리의 예술 아카데미에 작품을 보내야 했습니다. 이 곡도 그런 '과제'로 보낸 것으로, 보티첼리의 그림 「봄」에서 영감을 받았다고 합니다. 그런데 보수적인 심사위원들은 이 곡을 두고 형식이 모호하고 '막연한 인상주의'에 빠져 있다고 혹평했는데, 이것이 드뷔시의 음악에 처음으로 '인상주의'라는 말이 쓰인 순간으로 알려져 있습니다. 원래는 합창과 관현악을 위한 곡이었지만, 원본 악보는 제본소의 화재로 사라졌고, 지금은 1912년 드뷔시의 감수 아래 다른 작곡가가 관현악곡으로 편곡한 버전으로 연주됩니다. 곡은 두 부분으로 이루어져 있는데, 앞부분은 겨울잠에서 천천히 깨어나는 자연의 모습을, 뒷부분은 생명이 피어나는 봄의 기쁨을 노래합니다. 몽환적이고 부드러운 관현악의 색채 속에서 훗날의 걸작들을 예고하는 젊은 드뷔시의 감성을 느낄 수 있습니다."], ["3-20", "「사계」 중 「봄」", "비발디", "협주곡", "계절 표제", "춘분 무렵", "비발디가 1725년에 출판한 열두 곡의 바이올린 협주곡집 「화성과 창의의 시도」의 첫 네 곡이 바로 「사계」이며, 이 곡은 그 첫 번째인 「봄」입니다. 비발디는 각 계절의 협주곡마다 짧은 시를 붙이고, 악보 곳곳에 시의 구절을 적어 넣어 음악이 무엇을 묘사하는지 알려 주었습니다. 그래서 「사계」는 음악으로 이야기와 풍경을 그리는 '표제 음악'의 대표적인 초기 작품으로 꼽힙니다. 1악장은 \"봄이 왔다\"는 기쁨의 합주로 시작해, 독주 바이올린들이 새들의 즐거운 노래를 들려주고, 산들바람에 흐르는 시냇물, 갑자기 몰려오는 천둥과 번개, 그리고 다시 찾아온 맑은 하늘과 새소리를 차례로 그립니다. 2악장에서는 꽃이 핀 풀밭에서 잠든 목동을 바이올린이 노래하고, 그 옆에서 충직한 개가 짖는 소리를 비올라가 반복해서 연주합니다. 3악장은 목동의 피리 소리에 맞춰 요정과 목동들이 춤추는 흥겨운 시골 춤곡입니다. 오늘은 낮과 밤의 길이가 같아지는 춘분 무렵입니다. 봄의 한가운데로 들어서는 날, 300년 전의 봄을 함께 느껴 보세요."], ["3-21", "브란덴부르크 협주곡 3번 BWV 1048", "바흐", "관현악", "기념일", "바흐 탄생일(1685.3.21)", "1685년 3월 21일 독일 아이제나흐에서 태어난 '음악의 아버지' 바흐의 협주곡입니다. 바흐는 1721년 브란덴부르크의 변경백 크리스티안 루트비히에게 여섯 곡의 협주곡을 정성껏 정리해 헌정했습니다. 일자리를 구하려는 마음도 있었던 것으로 보이지만, 변경백은 이 곡들을 연주하지 않은 듯하며 악보는 그의 서재에 묻혀 있다가 120여 년이 지난 1849년에야 출판되었습니다. 여섯 곡은 저마다 다른 악기 편성을 가지고 있는데, 3번은 바이올린 세 대, 비올라 세 대, 첼로 세 대와 통주저음으로 이루어져 숫자 3이 반복되는 흥미로운 구조입니다. 1악장은 아홉 대의 현악기가 서로 주제를 주고받으며 힘차고 생기 넘치게 펼쳐집니다. 놀랍게도 2악장에는 단 두 개의 화음만 적혀 있는데, 이는 연주자들이 그 사이에 즉흥 연주를 하도록 비워 둔 것으로 여겨집니다. 3악장은 숨 가쁘게 내달리는 경쾌한 춤곡으로 마무리됩니다. 짧고 간결하면서도 활력이 넘치는 곡이라 브란덴부르크 협주곡 가운데 가장 자주 연주됩니다. 바흐의 생일을 축하하며 들어 보세요."], ["3-22", "전람회의 그림(피아노 원곡)", "무소륵스키", "독주", "기념일", "무소륵스키 탄생 주간(1839.3.21)", "1839년 3월 21일 러시아에서 태어난 무소륵스키가 1874년에 쓴 피아노 모음곡입니다. 그해 무소륵스키의 절친한 친구였던 화가이자 건축가 빅토르 하르트만이 서른아홉의 나이로 갑작스럽게 세상을 떠났고, 이를 추모하는 유작 전시회가 열렸습니다. 무소륵스키는 전시회에 걸린 그림들을 보며 받은 인상을 음악으로 옮겨, 불과 몇 주 만에 이 곡을 완성했습니다. 곡은 전시회장을 천천히 거니는 무소륵스키 자신의 발걸음을 나타내는 「프롬나드(산책)」로 시작하며, 이 선율은 그림과 그림 사이를 오갈 때마다 모습을 바꾸어 되풀이됩니다. 그리고 땅속 요정 「난쟁이」, 「옛 성」, 「소달구지」, 「껍질을 덜 깬 병아리들의 발레」, 「리모주의 시장」, 「카타콤」, 하늘을 날아다니는 마녀의 오두막 「바바야가」를 지나, 웅장한 「키예프의 대문」으로 마무리됩니다. 이 곡은 1922년 라벨이 편곡한 화려한 관현악판으로 더 유명해졌지만, 피아노 원곡에는 투박하면서도 강렬한 무소륵스키만의 힘이 살아 있습니다. 친구를 향한 그리움이 담긴 그림 전시회를 거닐어 보세요."], ["3-23", "부에노스아이레스의 봄", "피아졸라", "실내악", "계절 표제", "표제가 봄", "아르헨티나의 작곡가 피아졸라가 남긴 「부에노스아이레스의 사계」 가운데 봄을 노래한 곡입니다. 이 네 곡은 처음부터 한 세트로 계획된 것이 아니라 1965년부터 1970년 사이에 따로따로 작곡되었는데, 나중에 하나로 묶여 '사계'라는 이름으로 연주되기 시작했습니다. '포르테냐'는 '항구 사람', 즉 항구 도시 부에노스아이레스 사람을 뜻하는 말로, 각 곡은 그 도시의 계절 풍경과 사람들의 삶을 탱고에 담고 있습니다. 「봄」은 바이올린이 홀로 시작하는 빠른 주제가 다른 악기들로 이어지며 돌림노래처럼 쌓여 가는데, 생동감 넘치는 리듬 속에서 도시의 활기가 느껴집니다. 가운데 부분에서는 느리고 애틋한 선율이 흐르며 봄날의 설렘과 그리움을 노래합니다. 원래는 반도네온, 바이올린, 피아노, 기타, 더블베이스로 이루어진 피아졸라의 5중주단을 위한 곡이었지만, 지금은 다양한 편성으로 연주됩니다. 재미있게도 남반구에 있는 아르헨티나는 3월이 가을이지요. 지구 반대편의 계절을 떠올리며, 탱고로 그린 봄을 비발디의 봄과 비교해 들어 보세요."], ["3-24", "봄의 소리 왈츠 Op.410", "요한 슈트라우스 2세", "관현악", "봄", "표제가 봄", "요한 슈트라우스 2세가 1882년에 작곡한 왈츠입니다. 원래는 당시 빈의 인기 소프라노 비앙카 비앙키를 위해 쓴 노래 왈츠였지만, 이후 관현악만으로 연주하는 버전이 더 큰 인기를 얻어 오늘날에는 주로 관현악곡으로 연주됩니다. 대부분의 슈트라우스 왈츠가 무도회에서 춤을 추기 위해 쓰인 것과 달리, 이 곡은 처음부터 연주회에서 감상하기 위한 곡으로 만들어졌습니다. 그래서 일반적인 왈츠처럼 긴 서주 없이 곧바로 밝고 화사한 왈츠 선율로 시작합니다. 마치 창문을 활짝 열자마자 봄 햇살과 꽃향기가 쏟아져 들어오는 것 같지요. 선율은 새가 지저귀듯 높고 가볍게 날아오르고, 맑은 시냇물처럼 굽이치며 흐르다가, 꽃잎이 바람에 흩날리듯 빙글빙글 돌아갑니다. 곡 전체가 기쁨과 생명력으로 가득 차 있어서, 듣고 있으면 저절로 마음이 들뜨고 발걸음이 가벼워집니다. 빈 필하모닉 신년음악회에서도 봄을 미리 맞이하는 곡으로 자주 연주됩니다. 3월 말, 꽃망울이 터지기 시작하는 계절에 봄의 소리에 귀를 기울여 보세요."], ["3-25", "관현악을 위한 협주곡", "바르토크", "관현악", "기념일", "바르토크 탄생일(1881.3.25)", "1881년 3월 25일 헝가리에서 태어난 바르토크가 미국 망명 시절인 1943년에 쓴 작품입니다. 2차 세계대전을 피해 미국으로 건너간 바르토크는 낯선 땅에서 작품을 인정받지 못해 가난에 시달렸고, 백혈병으로 건강마저 크게 나빠졌습니다. 그때 보스턴 교향악단의 지휘자 쿠세비츠키가 병상의 그를 찾아와 새 관현악곡을 의뢰했고, 바르토크는 다시 힘을 내어 이 곡을 완성했습니다. 1944년 보스턴에서 초연된 이 곡은 큰 성공을 거두었고, 그의 생애 마지막 빛나는 작품이 되었습니다. '관현악을 위한 협주곡'이라는 이름처럼, 오케스트라의 여러 악기들이 마치 협주곡의 독주자처럼 차례로 앞에 나서 기량을 뽐냅니다. 2악장에서는 관악기들이 둘씩 짝을 지어 등장하는 '짝들의 놀이'가 펼쳐지고, 4악장에서는 다른 작곡가의 교향곡 선율을 우스꽝스럽게 흉내 내는 풍자가 등장합니다. 마지막 5악장은 헝가리 민속춤의 활기찬 리듬으로 생명력 넘치게 마무리됩니다. 어려움 속에서도 피어난 삶의 의지를 느껴 보세요."], ["3-26", "거울 속의 거울", "패르트", "실내악", "사순절·부활절", "사순절 묵상(부활절 전)", "에스토니아의 작곡가 아르보 패르트가 1978년에 쓴 곡으로, 원래는 바이올린과 피아노를 위한 작품입니다. 패르트는 한때 현대적이고 실험적인 음악을 썼지만, 1970년대 초 오랜 침묵의 시간을 가지며 중세 음악과 성가를 깊이 연구했습니다. 그 끝에 그는 아주 단순한 음들로 깊은 울림을 만들어 내는 자신만의 작곡 기법을 발견하고, 이를 '작은 종'이라는 뜻의 라틴어 '틴티나불리'라고 불렀습니다. 「거울 속의 거울」은 그 기법을 가장 아름답게 보여 주는 곡입니다. 피아노는 처음부터 끝까지 같은 화음을 천천히 분산해 연주하고, 그 위로 바이올린이 한 음씩 조용히 오르내리며 길게 음을 이어 갑니다. 마주 보는 두 거울 속에 끝없이 비치는 모습처럼, 단순한 음들이 반복되며 무한히 이어지는 듯한 느낌을 줍니다. 10분 가까이 아무런 극적인 사건 없이 고요하게 흘러가지만, 그 고요함 속에서 마음이 맑게 가라앉습니다. 사순절은 부활절 전 40일 동안 자신을 돌아보며 기도하는 시기입니다. 조용히 눈을 감고 내면의 소리에 귀 기울여 보세요."], ["3-27", "코랄 전주곡 「오 사람아, 네 큰 죄를 슬퍼하라」 BWV 622", "바흐", "독주", "사순절·부활절", "고난주간 오르간 코랄(이동 축일)", "바흐가 바이마르 궁정의 오르가니스트로 일하던 시절에 쓴 오르간곡으로, 「오르겔뷔힐라인(작은 오르간 책)」이라는 곡집에 실려 있습니다. 바흐는 교회의 한 해 절기에 맞추어 부르는 찬송가, 즉 코랄 선율을 바탕으로 짧은 오르간곡을 쓰려고 이 책을 계획했습니다. 백육십 곡이 넘는 계획을 세웠지만 실제로 완성된 것은 마흔여섯 곡이었습니다. 이 곡들은 신자들이 찬송가를 부르기 전에 연주하던 '코랄 전주곡'으로, 오르간 공부를 하는 사람들의 교본 역할도 했습니다. 「오 사람아, 네 큰 죄를 슬퍼하라」는 그리스도의 고난을 묵상하는 수난절 찬송가로, 바흐는 이 찬송가 선율에 풍부하고 섬세한 장식을 더해 마치 흐느끼며 탄식하는 듯한 노래로 만들었습니다. 낮은 성부들이 조용히 화음을 받쳐 주는 가운데, 높은 성부의 선율은 고통과 슬픔, 그리고 깊은 연민을 담아 천천히 흘러갑니다. 곡의 마지막에는 갑작스럽게 낯선 화음이 나타나 듣는 이의 가슴을 찌르는 듯한 여운을 남깁니다. 사순절의 끝자락, 고난 주간의 묵상을 위해 고요한 마음으로 들어 보세요."], ["3-28", "십자가 위의 일곱 말씀(현악4중주판) Op.51", "하이든", "실내악", "사순절·부활절", "성금요일 전례를 위해 쓰인 기악곡(이동 축일)", "하이든이 1786년 스페인 카디스 대성당의 의뢰로 작곡한 곡입니다. 카디스 대성당에서는 해마다 성금요일, 즉 예수가 십자가에 못 박힌 날에 특별한 예식을 올렸습니다. 성당의 창문과 벽을 검은 천으로 가리고 가운데 매달린 등불 하나만 밝힌 채, 주교가 예수가 십자가 위에서 남긴 일곱 마디 말씀을 하나씩 읽고 묵상한 뒤, 그 사이사이에 음악이 연주되었습니다. 하이든은 처음에 이 곡을 관현악곡으로 썼고, 이듬해에 현악 4중주 버전을 만들었으며, 나중에는 합창이 들어간 오라토리오로도 고쳤습니다. 곡은 장중한 서주에 이어 일곱 말씀에 해당하는 일곱 개의 느린 '소나타'가 이어지고, 마지막에 예수가 숨을 거둔 순간 땅이 흔들렸다는 성경 구절을 그린 격렬한 '지진'으로 끝납니다. 하이든은 느린 곡을 일곱 개나 연달아 쓰면서도 듣는 이가 지루하지 않게 하는 것이 무척 어려운 일이었다고 회고했습니다. 네 대의 현악기만으로 연주하는 이 버전은 더욱 내밀하고 깊은 울림을 줍니다. 부활절을 앞둔 고난 주간, 고요히 묵상하며 들어 보세요."], ["3-29", "프라트레스", "패르트", "실내악", "사순절·부활절", "사순절 묵상", "에스토니아의 작곡가 아르보 패르트가 1977년에 쓴 곡입니다. '프라트레스'는 라틴어로 '형제들'이라는 뜻입니다. 이 곡은 처음에는 특정한 악기를 정하지 않은 채 쓰였고, 이후 패르트 자신이 바이올린과 피아노, 첼로 앙상블, 현악 4중주, 현악 합주와 타악기 등 열 가지가 넘는 편성으로 고쳐 써서 다양한 모습으로 연주되고 있습니다. 곡은 짧은 선율의 덩어리가 조금씩 음높이를 바꾸며 되풀이되는 구조로 이루어져 있고, 각 덩어리 사이마다 둔탁한 북소리나 낮은 울림이 마치 쉼표처럼 들어갑니다. 이런 반복은 마치 수도사들이 줄지어 천천히 걸어가며 기도문을 읊조리는 모습, 혹은 끝없이 이어지는 순례의 발걸음을 떠올리게 합니다. 그 아래에서는 낮은 저음이 처음부터 끝까지 변함없이 길게 울리며 흔들리지 않는 믿음처럼 곡을 받쳐 줍니다. 패르트는 이 곡에서도 '작은 종'이라는 뜻의 '틴티나불리' 기법을 사용해 단순한 음들로 깊은 울림을 만들어 냅니다. 사순절의 끝자락, 형제들의 기도 행렬에 함께 걸어가는 마음으로 들어 보세요."], ["3-30", "무반주 첼로 모음곡 1번 BWV 1007", "바흐", "독주", "일반", "첼로 독주의 고전", "바흐가 독일 쾨텐의 궁정악장으로 일하던 1720년 무렵에 쓴 것으로 여겨지는 여섯 곡의 무반주 첼로 모음곡 가운데 첫 곡입니다. 첼로 한 대로만 연주하는 이 곡들은 오랫동안 단순한 연습곡 정도로 여겨져 거의 잊혀 있었습니다. 그런데 1890년 무렵, 열세 살의 스페인 소년 파블로 카살스가 바르셀로나의 한 헌책방에서 우연히 이 악보를 발견했습니다. 카살스는 이후 12년 동안 이 곡들을 연구한 끝에 비로소 무대에서 연주하기 시작했고, 그의 연주를 통해 이 곡들은 첼로 음악 최고의 걸작으로 다시 태어났습니다. 바흐의 자필 악보는 전해지지 않고, 그의 두 번째 아내 안나 막달레나가 옮겨 적은 필사본 등이 남아 있습니다. 첫 곡의 「전주곡」은 첼로가 화음을 한 음씩 풀어 물결치듯 연주하는 곡으로, 광고와 영화에서 자주 쓰여 누구나 한 번쯤 들어 보았을 것입니다. 이어서 알르망드, 쿠랑트, 사라방드, 미뉴에트, 지그 등 바로크 시대의 다양한 춤곡이 펼쳐집니다. 첼로 한 대가 들려주는 깊고 넓은 세계에 귀 기울여 보세요."], ["3-31", "첼로 협주곡 1번 C장조", "하이든", "협주곡", "기념일", "하이든 탄생일(1732.3.31)", "1732년 3월 31일 오스트리아의 작은 마을 로라우에서 태어난 하이든의 첼로 협주곡입니다. 하이든은 30년 가까이 헝가리의 귀족 에스테르하지 가문의 궁정 악장으로 일하며, 궁정 악단을 위해 수많은 작품을 썼습니다. 이 협주곡은 1760년대에 궁정 악단의 뛰어난 첼리스트를 위해 쓰인 것으로 보입니다. 그런데 이 곡의 악보는 오랫동안 사라져, 하이든의 작품 목록에 제목만 남아 있었습니다. 그러다 무려 200년 가까이 지난 1961년, 체코 프라하의 국립 박물관에서 필사본 악보가 발견되었고, 이듬해 다시 연주되면서 첼로 협주곡의 중요한 레퍼토리로 단숨에 자리 잡았습니다. 1악장은 당당하고 밝은 분위기 속에서 첼로가 우아하게 노래하고, 2악장은 따뜻하고 부드러운 아다지오입니다. 3악장은 첼로가 빠른 음표들을 숨 가쁘게 쏟아 내는 화려한 피날레로, 연주자의 기량이 한껏 드러납니다. 200년 동안 잠들어 있다가 깨어난 이 협주곡은 마치 긴 겨울을 지나 깨어나는 봄의 생명 같습니다. 하이든의 생일을 축하하며 들어 보세요."], ["4-1", "교향곡 94번 「놀람」", "하이든", "관현악", "기념일", "만우절. 갑자기 쾅! 하는 '깜짝' 교향곡", "하이든이 1791년 영국 런던을 방문해 쓴 열두 곡의 '런던 교향곡' 가운데 한 곡입니다. 「놀람」이라는 별명은 2악장에서 나오는 재미있는 장면 때문에 붙었습니다. 2악장은 현악기가 아주 작고 조용한 소리로 단순하고 귀여운 선율을 연주하며 시작합니다. 그 선율이 한 번 더 더 작은 소리로 되풀이되어 청중이 귀를 기울이는 순간, 갑자기 오케스트라 전체가 '쾅!' 하고 큰 화음을 터뜨리고 팀파니가 힘차게 울립니다. 연주회 도중 꾸벅꾸벅 조는 귀부인들을 깨우기 위해 하이든이 장난을 쳤다는 이야기가 널리 퍼졌지만, 하이든 자신은 훗날 청중을 깜짝 놀라게 해 새로운 것을 보여 주고 싶었을 뿐이라고 말했습니다. 이 2악장의 선율은 동요처럼 단순하고 친근해서 한 번 들으면 쉽게 따라 부를 수 있습니다. 1악장은 힘차고 활기차며, 3악장은 시골풍의 흥겨운 미뉴에트, 4악장은 재치 넘치는 피날레입니다. 런던 초연은 대성공을 거두어 하이든은 일약 영국의 스타가 되었습니다. 만우절, 하이든이 준비한 '깜짝 장난'에 함께 놀라 보세요."], ["4-2", "피아노 협주곡 2번 c단조 Op.18", "라흐마니노프", "협주곡", "기념일", "라흐마니노프 탄생일(1873.4.1) 다음 날", "1873년 4월 1일 러시아에서 태어난 라흐마니노프의 대표작입니다. 젊은 라흐마니노프는 1897년 야심 차게 발표한 교향곡 1번이 혹평을 받고 참담하게 실패하자 깊은 우울증에 빠져 3년 가까이 작곡을 하지 못했습니다. 그때 그를 도운 사람이 정신과 의사 니콜라이 달 박사였습니다. 달 박사는 매일 그에게 \"당신은 협주곡을 쓰게 될 것이다. 그 곡은 훌륭할 것이다\"라고 반복해서 들려주며 자신감을 되찾게 해 주었다고 합니다. 마침내 라흐마니노프는 1901년 이 협주곡을 완성해 큰 성공을 거두었고, 감사의 마음을 담아 달 박사에게 헌정했습니다. 곡은 피아노가 홀로 멀리서 들려오는 교회 종소리처럼 점점 커지는 여덟 개의 화음으로 시작하는데, 이 첫머리는 피아노 협주곡 가운데 가장 유명한 시작으로 꼽힙니다. 이어 현악기가 러시아의 넓은 대지처럼 웅장하고 애절한 선율을 노래합니다. 2악장의 꿈결 같은 서정과 3악장의 벅찬 클라이맥스까지, 절망을 이겨 낸 한 사람의 부활이 담긴 곡입니다. 그의 생일 무렵, 희망의 음악을 들어 보세요."], ["4-3", "러시아 부활절 서곡 Op.36", "림스키코르사코프", "관현악", "사순절·부활절", "부활절(이동 축일)", "림스키코르사코프가 「셰에라자드」를 완성한 직후인 1888년에 쓴 관현악곡입니다. 부활절은 십자가에 못 박혀 숨을 거둔 예수가 사흘 만에 다시 살아났음을 기념하는 기독교의 가장 큰 축일로, 해마다 날짜가 바뀌는 이동 축일입니다. 러시아 정교회에서는 부활절 전날 밤 어두운 교회에서 촛불을 들고 기다리다가, 자정이 되면 \"그리스도께서 부활하셨다!\"는 외침과 함께 종이 일제히 울리고 축제가 시작됩니다. 림스키코르사코프는 정교회의 오래된 성가 선율들을 바탕으로 이 신비롭고 장엄한 부활절 밤의 풍경을 그려 냈습니다. 곡은 고요하고 경건한 성가 선율로 시작해, 사제의 기도를 나타내는 트롬본의 낭송과 바이올린 독주가 이어집니다. 그리고 어둠을 뚫고 마침내 부활의 기쁨이 터져 나오면, 교회 종소리와 함께 오케스트라 전체가 환희에 찬 축제를 펼칩니다. 그는 이 곡에서 고대의 이교적인 봄맞이 축제와 기독교의 부활절이 함께 어우러진 러시아 민중의 기쁨을 담고 싶었다고 회고했습니다. 이 곡은 그의 동료 무소륵스키와 보로딘을 추모하며 바쳐졌습니다."], ["4-4", "오르간 교향곡 5번 중 「토카타」", "비도르", "독주", "사순절·부활절", "부활절 아침 예배 후주 전통", "프랑스의 오르가니스트이자 작곡가 샤를마리 비도르가 1879년에 쓴 오르간 교향곡 5번의 마지막 악장입니다. 비도르는 파리의 생쉴피스 성당에서 무려 64년 동안 오르가니스트로 일했는데, 이 성당에는 프랑스 최고의 오르간 제작자 카바이예콜이 만든 거대한 오르간이 있었습니다. '오르간 교향곡'은 오케스트라처럼 다양한 음색을 낼 수 있는 이 웅장한 오르간을 위해 쓴 여러 악장의 대규모 작품을 말합니다. 그 마지막 악장인 「토카타」는 오르간 음악 가운데 가장 유명한 곡 가운데 하나입니다. 손으로 치는 건반에서는 빠른 음표들이 쉴 새 없이 반짝이며 쏟아지고, 그 아래로 발로 연주하는 페달 건반이 웅장하고 장엄한 선율을 울립니다. 성당 전체가 빛과 소리로 가득 차는 듯한 이 곡은 부활절 아침 예배가 끝난 뒤 신자들이 성당을 나설 때 연주하는 '후주'로 널리 쓰이며, 결혼식의 퇴장 음악으로도 사랑받습니다. 비도르의 제자 가운데에는 훗날 아프리카에서 의료 봉사를 한 슈바이처도 있었습니다. 부활의 기쁨이 가득한 소리를 느껴 보세요."], ["4-5", "오르간 협주곡 「뻐꾸기와 나이팅게일」 HWV 295", "헨델", "협주곡", "봄", "봄새 소리", "헨델이 1739년에 쓴 오르간 협주곡입니다. 헨델은 런던에서 오라토리오를 공연할 때 막간마다 직접 오르간 협주곡을 연주해 청중의 큰 사랑을 받았는데, 이 곡도 그런 막간 연주를 위해 쓰였습니다. 헨델은 당대 최고의 오르간 연주자이기도 해서, 그가 즉흥 연주를 펼칠 때면 청중이 숨을 죽이고 귀를 기울였다고 합니다. 이 곡의 별명인 「뻐꾸기와 나이팅게일」은 2악장에서 비롯되었습니다. 이 악장에서 오르간은 '뻐꾹 뻐꾹' 하는 뻐꾸기 소리와 맑고 높게 지저귀는 나이팅게일의 노래를 재치 있게 흉내 냅니다. 오르간과 현악기가 주고받는 새들의 대화를 듣고 있으면 봄날의 숲속에 와 있는 듯한 기분이 듭니다. 여기서 오르간은 성당의 거대한 파이프 오르간이 아니라, 연주회장에 놓을 수 있는 작은 실내 오르간입니다. 그래서 소리가 가볍고 경쾌하며 현악기와 잘 어우러집니다. 밝고 활기찬 1악장과 마지막 악장도 봄날의 생기로 가득합니다. 창밖에서 들려오는 새소리와 함께 이 곡을 들으며, 새들이 노래하는 봄을 맞이해 보세요."], ["4-6", "사계 Op.37 중 「4월: 스노드롭」", "차이콥스키", "독주", "계절 표제", "표제 자체가 4월", "차이콥스키의 피아노 모음곡 「사계」 가운데 4월의 곡입니다. 스노드롭은 이른 봄, 아직 채 녹지 않은 눈을 뚫고 가장 먼저 피어나는 작고 하얀 꽃입니다. 러시아어로는 '눈 밑에서 피는 꽃'이라는 뜻의 이름을 가지고 있지요. 이 곡에는 시인 마이코프의 시에서 따온, 지난 슬픔에 흘린 마지막 눈물과 새로운 행복을 향한 첫 꿈을 노래하는 구절이 붙어 있습니다. 혹독한 겨울을 견디고 피어난 작은 꽃처럼, 이 곡에는 고난 뒤에 찾아오는 희망과 설렘이 담겨 있습니다. 곡은 부드럽게 흔들리는 왈츠풍의 리듬 위로 맑고 사랑스러운 선율이 흐르며 시작합니다. 마치 봄바람에 하늘거리는 작은 꽃송이를 보는 듯하지요. 가운데 부분에서는 조금 더 생기 있고 들뜬 분위기로 바뀌었다가, 다시 처음의 사랑스러운 선율로 돌아와 조용히 마무리됩니다. 「사계」 가운데에서도 특히 사랑받는 곡으로, 짧지만 깊은 서정이 담겨 있습니다. 4월의 어느 아침, 길가에 피어난 작은 봄꽃을 발견하는 마음으로 이 곡을 들어 보세요."], ["4-7", "파가니니 주제에 의한 랩소디 Op.43", "라흐마니노프", "협주곡", "일반", "라흐마니노프 탄생 주간", "라흐마니노프가 1934년 스위스 루체른 호숫가의 별장에서 쓴 피아노와 관현악을 위한 작품입니다. 주제는 '악마의 바이올리니스트' 파가니니가 남긴 「24개의 카프리스」 가운데 마지막 곡의 선율로, 브람스와 리스트 등 수많은 작곡가들이 변주곡의 재료로 사용한 유명한 선율입니다. 라흐마니노프는 이 짧은 주제 위에 스물네 개의 변주를 펼쳐 냈습니다. 곡 곳곳에는 중세의 장례 성가 「분노의 날」 선율이 불길하게 끼어드는데, 이는 악마에게 영혼을 팔았다는 파가니니의 전설을 떠올리게 합니다. 이 곡에서 가장 유명한 부분은 열여덟 번째 변주입니다. 라흐마니노프는 파가니니의 주제를 거꾸로 뒤집고 속도를 느리게 바꾸어, 전혀 다른 느낌의 낭만적이고 아름다운 선율을 만들어 냈습니다. 그는 이 변주에 대해 \"이건 내 매니저를 위한 것\"이라고 농담했다고 하는데, 그만큼 대중에게 사랑받을 것을 알았던 것이지요. 이 선율은 영화 「사랑의 은하수」를 비롯한 여러 영화에 쓰였습니다. 같은 주제가 얼마나 다양하게 변신하는지 따라가며 들어 보세요."], ["4-8", "바이올린 소나타 「악마의 트릴」", "타르티니", "실내악", "기념일", "타르티니 탄생일(1692.4.8)", "1692년 4월 8일 지금의 슬로베니아 해안 마을 피란에서 태어난 이탈리아의 바이올리니스트이자 작곡가 주세페 타르티니의 대표작입니다. 이 곡에는 신비로운 전설이 얽혀 있습니다. 타르티니는 어느 날 밤 꿈속에서 악마와 계약을 맺고 영혼을 넘겨주었는데, 장난삼아 악마에게 바이올린을 건네자 악마는 그가 평생 들어 본 적 없는 황홀하게 아름다운 곡을 연주했다고 합니다. 꿈에서 깨어난 그는 서둘러 바이올린을 잡고 그 음악을 기억해 내려 애썼고, 그렇게 쓴 곡이 바로 이 소나타라는 것입니다. 하지만 타르티니는 자신이 쓴 곡이 꿈속에서 들은 음악에 비하면 형편없다며 아쉬워했다고 전해집니다. 이 이야기는 그가 늘그막에 한 프랑스 천문학자에게 들려준 것으로 기록되어 있습니다. 곡의 3악장에서는 바이올린이 한 손가락으로 빠르게 떨리는 트릴을 이어 가는 동시에 다른 손가락으로 선율을 연주하는 놀라운 기교가 나오는데, 이것이 바로 '악마의 트릴'입니다. 꿈과 전설이 깃든 신비로운 바이올린 음악을 만나 보세요."], ["4-9", "애팔래치아의 봄", "코플런드", "관현악", "봄", "표제가 봄", "미국의 작곡가 에런 코플런드가 1944년 현대무용의 개척자 마사 그레이엄을 위해 쓴 발레 음악입니다. 발레는 19세기 미국 펜실베이니아의 개척 마을에서, 새로 지은 농가에 신혼부부가 첫 봄을 맞이하는 이야기를 그립니다. 원래는 열세 명의 소규모 연주자를 위해 쓰였고, 이후 관현악 모음곡으로 편곡되어 더 널리 알려졌습니다. 재미있게도 코플런드는 작곡할 때 이 곡의 제목을 몰랐습니다. 그레이엄이 미국 시인 하트 크레인의 시에서 '애팔래치아의 봄'이라는 제목을 가져와 붙인 것이지요. 그래서 훗날 코플런드는 사람들이 이 곡을 듣고 애팔래치아산맥의 아름다운 봄 풍경이 느껴진다고 말할 때마다 웃음이 났다고 회고했습니다. 곡의 하이라이트는 셰이커 교도들의 소박한 찬송가 「단순한 선물」을 주제로 한 변주입니다. 단순하고 정겨운 선율이 클라리넷에서 시작해 여러 악기로 이어지며 점점 웅장하게 펼쳐집니다. 이 곡으로 코플런드는 1945년 퓰리처상을 받았습니다. 넓은 들판에 찾아온 맑고 깨끗한 봄을 느껴 보세요."], ["4-10", "「두 개의 슬픈 선율」 중 「지난 봄」 Op.34-2", "그리그", "관현악", "봄", "표제가 봄", "그리그가 1881년에 현악 합주를 위해 편곡한 두 곡의 「슬픈 선율」 가운데 두 번째 곡입니다. 원래 이 곡은 노르웨이의 시인 비녜의 시에 그리그가 곡을 붙인 가곡이었습니다. 시는 죽음을 앞둔 한 사람이 자신의 생애 마지막이 될지도 모르는 봄을 바라보며, 다시 피어나는 꽃과 푸르러지는 들판, 지저귀는 새들의 아름다움을 마음 깊이 새기는 내용입니다. 그리그는 이 가곡을 무척 아꼈고, 노래가 없어도 그 감정을 전할 수 있도록 현악기만을 위한 곡으로 다시 썼습니다. 곡은 현악기들이 조용하고 부드럽게 선율을 노래하며 시작합니다. 같은 선율이 한 번 더 되풀이될 때는 악기들이 더 높은 음역에서 더욱 깊고 풍성한 감정을 담아 노래하다가, 마침내 고요하게 사그라듭니다. 슬프지만 결코 절망적이지 않은, 삶의 아름다움에 대한 깊은 감사와 체념이 담긴 음악입니다. 그리그는 노르웨이의 민속 음악과 자연을 사랑한 작곡가였는데, 이 곡에도 그 소박하고 진실한 마음이 잘 담겨 있습니다. 해마다 찾아오는 봄을 소중히 여기는 마음으로 들어 보세요."], ["4-11", "「에스탄시아」 모음곡 Op.8a", "히나스테라", "관현악", "기념일", "히나스테라 탄생일(1916.4.11)", "1916년 4월 11일 부에노스아이레스에서 태어난 아르헨티나의 작곡가 알베르토 히나스테라의 발레 음악입니다. '에스탄시아'는 아르헨티나의 넓은 초원 '팜파스'에 있는 대규모 목장을 말합니다. 1941년에 쓴 이 발레는 도시에서 온 청년이 목장의 소녀를 사랑하게 되고, 그녀의 마음을 얻기 위해 거칠고 용감한 목동인 '가우초'들과 겨루며 진정한 가우초로 거듭나는 이야기입니다. 히나스테라는 이 발레에서 네 곡을 골라 관현악 모음곡을 만들었습니다. 첫 곡은 목장의 일꾼들이 힘차게 일하는 모습, 둘째 곡은 고요하고 아름다운 밀밭의 풍경, 셋째 곡은 소 떼를 모는 목동들의 모습을 그립니다. 마지막 곡 「말람보」는 가우초 남자들이 서로 발 구르기 실력을 겨루는 전통 춤으로, 강렬하고 원초적인 리듬이 끝없이 반복되며 점점 열광적으로 고조됩니다. 이 곡은 오케스트라의 앙코르 곡으로도 큰 인기를 누리고 있습니다. 히나스테라는 아르헨티나의 민속 음악을 현대적인 관현악 언어로 담아낸 작곡가입니다. 지구 반대편 초원의 뜨거운 열기를 느껴 보세요."], ["4-12", "아라베스크 1번", "드뷔시", "독주", "봄", "봄날처럼 맑은 피아노곡", "드뷔시가 20대 시절인 1888년부터 1891년 사이에 쓴 두 곡의 피아노 소품 「아라베스크」 가운데 첫 곡입니다. '아라베스크'는 원래 이슬람 사원의 벽이나 건축물을 장식하는, 덩굴 식물처럼 구불구불 이어지는 화려한 무늬를 말합니다. 드뷔시는 음악에서도 그런 우아하고 자유로운 곡선의 아름다움을 표현하고자 했습니다. 당시 유럽에서는 자연의 곡선을 닮은 장식 양식인 '아르누보'가 유행하고 있었는데, 이 곡에서도 그런 흐르는 듯한 선의 아름다움이 느껴집니다. 곡은 양손이 번갈아 가며 물결치듯 부드럽게 오르내리는 아르페지오로 시작합니다. 맑고 투명한 소리들이 마치 햇살을 받아 반짝이는 시냇물처럼, 또는 봄바람에 흔들리는 덩굴처럼 굽이굽이 흘러갑니다. 오른손과 왼손이 서로 다른 리듬으로 움직이며 만들어 내는 미묘한 흔들림이 이 곡을 더욱 몽환적으로 만들어 줍니다. 훗날의 대담하고 혁신적인 작품들에 비하면 소박하지만, 젊은 드뷔시의 맑은 감성이 담겨 있어 많은 사랑을 받고 있습니다. 봄날의 맑은 오후에 들어 보세요."], ["4-13", "피아노 협주곡 27번 K.595", "모차르트", "협주곡", "봄", "피날레 주제가 모차르트 가곡 「봄을 기다림」과 같은 선율", "모차르트가 세상을 떠난 해인 1791년 1월에 완성한 그의 마지막 피아노 협주곡입니다. 모차르트는 그해 3월 빈의 한 연주회에서 이 곡을 직접 연주했는데, 이것이 그가 피아니스트로서 대중 앞에 선 마지막 무대였던 것으로 알려져 있습니다. 협주곡을 완성한 직후 모차르트는 어린이를 위한 노래 몇 곡을 썼는데, 그중 하나가
