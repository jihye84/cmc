「봄을 기다림」이라는 가곡입니다. \"오라, 사랑스러운 5월이여, 나무들을 다시 푸르게 해 다오\"라고 노래하는 이 가곡은 우리나라에서도 동요처럼 불립니다. 흥미롭게도 이 가곡의 선율은 협주곡 3악장의 주제와 거의 같습니다. 그래서 이 협주곡의 마지막 악장에는 봄을 기다리는 설렘이 가득합니다. 협주곡 전체는 화려함보다는 맑고 투명하며, 어딘가 모든 것을 내려놓은 듯한 담담한 아름다움을 지니고 있습니다. 특히 2악장 라르게토는 소박하고 순수한 노래로, 모차르트 음악의 가장 깊은 곳에 있는 고요함을 들려줍니다. 생애 마지막 봄을 맞은 모차르트가 남긴 맑은 음악에 귀를 기울여 보세요."], ["4-14", "하프시코드 모음곡 5번 「유쾌한 대장장이」", "헨델", "독주", "기념일", "헨델 서거일(1759.4.14)", "1759년 4월 14일 런던에서 세상을 떠난 헨델의 하프시코드 곡입니다. 헨델은 마지막 무렵 시력을 잃었지만 끝까지 「메시아」 공연을 이끌었고, 세상을 떠나기 8일 전에도 이 곡의 공연에 참석했다고 합니다. 그는 영국 왕과 귀족들이 잠든 웨스트민스터 사원에 묻혔는데, 그 장례식에는 3천 명이 넘는 사람들이 참석했습니다. 이 곡은 1720년에 출판된 하프시코드 모음곡 5번의 마지막 악장으로, 소박한 주제와 다섯 개의 변주로 이루어져 있습니다. 「유쾌한 대장장이」라는 별명은 헨델이 붙인 것이 아니라, 그가 세상을 떠난 뒤 19세기 초 영국의 한 출판업자가 붙인 것입니다. 헨델이 비를 피하려 대장간에 들어갔다가 대장장이가 망치질을 하며 부르는 노래를 듣고 이 곡을 썼다는 이야기가 퍼지기도 했지만, 이는 지어낸 이야기로 밝혀졌습니다. 하지만 변주가 거듭될수록 음표들이 점점 빨라지며 반짝이는 모습은 정말로 쇠를 두드리며 불꽃이 튀는 대장간처럼 들립니다. 위대한 바로크 거장을 기억하며 이 곡을 들어 보세요."], ["4-15", "발레 「사계」 Op.67 중 「봄」", "글라주노프", "관현악", "계절 표제", "표제가 봄", "러시아의 작곡가 글라주노프의 발레 음악 「사계」 가운데 두 번째 장면인 「봄」입니다. 1월에 들었던 「겨울」 장면의 마지막에서 요정들이 피운 모닥불이 겨울을 몰아내고 나면, 이제 봄의 차례가 시작됩니다. 따뜻한 봄바람의 신 '제피로스'가 꽃의 요정들과 함께 등장하고, 새들이 날아와 지저귀며 봄의 도착을 축하합니다. 장미를 비롯한 갖가지 꽃들이 차례로 피어나 춤을 추고, 산들바람이 그 사이를 부드럽게 휘감으며 지나가지요. 글라주노프는 이 장면에서 플루트와 클라리넷 같은 목관 악기로 새들의 노래를 그려 내고, 하프와 현악기의 부드러운 선율로 바람과 꽃의 움직임을 표현했습니다. 겨울 장면이 반짝이고 차가운 소리였다면, 봄 장면은 따뜻하고 부드러우며 생명력으로 가득 차 있습니다. 짧은 장면이지만 관현악의 섬세한 색채가 마치 수채화처럼 펼쳐집니다. 글라주노프는 이 발레를 통해 계절이 순환하며 자연이 깨어나고 무르익는 모습을 그려 냈습니다. 꽃이 만발하는 4월, 꽃의 요정들이 추는 춤을 상상하며 봄의 한가운데를 즐겨 보세요."], ["4-16", "현악 세레나데 e단조 Op.20", "엘가", "관현악", "봄", "봄날 오후에 어울리는 현악곡", "영국의 작곡가 엘가가 1892년에 쓴 현악 합주곡입니다. 당시 엘가는 아직 이름이 알려지지 않은 무명 작곡가로, 생계를 위해 바이올린 레슨을 하며 힘겹게 살고 있었습니다. 이 곡은 그가 아내 앨리스와 결혼한 지 몇 해 지나지 않은 행복한 시기에 쓴 것으로, 엘가는 훗날 이 곡을 자신이 가장 아끼는 작품 가운데 하나로 꼽았다고 합니다. 엘가가 「수수께끼 변주곡」과 「위풍당당 행진곡」으로 명성을 얻게 되는 것은 이로부터 몇 년 뒤의 일입니다. 곡은 세 악장으로 이루어져 있으며, 전체 길이는 12분 남짓입니다. 1악장은 비올라가 연주하는 경쾌하고 부드러운 리듬 위로 바이올린이 우아한 선율을 노래하며 시작합니다. 이 곡의 중심인 2악장 라르게토는 깊고 따뜻한 감정이 담긴 느린 노래로, 엘가 특유의 고귀하고 서정적인 선율이 마음을 촉촉하게 적십니다. 3악장은 다시 밝고 경쾌한 분위기로 돌아와, 1악장의 주제를 회상하며 조용히 마무리됩니다. 현악기만으로 빚어낸 섬세하고 따뜻한 음색이 돋보입니다. 봄날의 나른한 오후에 차 한 잔과 함께 들어 보세요."], ["4-17", "위안 3번", "리스트", "독주", "일반", "잔잔한 피아노 명곡", "리스트가 1849년부터 이듬해 사이에 쓴 여섯 곡의 피아노 소품 「위안」 가운데 세 번째 곡입니다. 제목은 프랑스의 비평가이자 시인 생트뵈브의 시집 「위안」에서 따온 것입니다. 리스트는 젊은 시절 유럽 전역을 돌며 화려한 기교로 청중을 열광시킨 슈퍼스타 피아니스트였지만, 이 무렵에는 연주 여행을 그만두고 독일 바이마르의 궁정 악장으로 자리를 잡아 작곡에 집중하고 있었습니다. 그래서 이 시기의 작품들에는 화려함 대신 깊은 사색과 내면의 고요함이 담겨 있습니다. 「위안」 3번은 그 가운데 가장 유명한 곡입니다. 왼손이 잔잔하게 물결치는 반주를 이어 가는 동안, 오른손이 부드럽고 따뜻한 선율을 노래합니다. 마치 쇼팽의 녹턴을 떠올리게 하는 서정적인 분위기인데, 이 곡이 쓰인 1849년은 리스트의 오랜 친구 쇼팽이 세상을 떠난 해이기도 합니다. 곡은 크게 고조되었다가 다시 고요하게 가라앉으며, 지친 마음을 어루만지듯 조용히 마무리됩니다. 화려함으로만 기억되는 리스트의 또 다른 얼굴을 만날 수 있는 곡입니다. 위로가 필요한 날 들어 보세요."], ["4-18", "플루트 협주곡 「홍방울새」 RV 428", "비발디", "협주곡", "봄", "봄새 소리", "비발디가 1728년 무렵 출판한 여섯 곡의 플루트 협주곡집 가운데 세 번째 곡입니다. 이 협주곡집은 플루트를 독주 악기로 내세운 협주곡을 모아 출판한 최초의 작품집 가운데 하나로 꼽힙니다. 그전까지 플루트는 주로 합주에서 다른 악기를 돕는 역할에 머물렀는데, 비발디는 이 악기의 맑고 경쾌한 음색에 주목해 독주 악기로 당당히 내세웠습니다. 별명 '가르델리노'는 이탈리아어로 노랫소리가 아름다운 작은 새를 말하는데, 우리나라에서는 흔히 「홍방울새」로 번역됩니다. 비발디는 「사계」에서 그랬듯이, 이 곡에서도 플루트로 새의 지저귐을 생생하게 흉내 냈습니다. 1악장과 3악장에서는 플루트가 높은 음역에서 빠른 트릴과 짧은 음표를 쏟아 내며 새가 즐겁게 노래하는 모습을 그려 냅니다. 2악장은 플루트가 부드럽고 서정적인 선율을 노래하는 고요한 쉼의 시간입니다. 비발디가 그린 새는 300년이 지난 지금 들어도 마치 눈앞에서 지저귀는 듯 생생하고 사랑스럽습니다. 봄날 아침, 창밖의 새소리와 비발디의 새소리를 함께 들어 보세요."], ["4-19", "서주와 론도 카프리치오소 Op.28", "생상스", "협주곡", "일반", "바이올린 명곡", "프랑스의 작곡가 생상스가 1863년, 스페인 출신의 젊은 바이올리니스트 사라사테를 위해 쓴 곡입니다. 당시 사라사테는 열아홉 살의 나이로 이미 유럽에서 이름을 떨치던 천재였고, 생상스는 그의 아름다운 음색과 화려한 기교에 깊은 인상을 받아 이 곡을 선물했습니다. 두 사람은 이후에도 오랫동안 우정을 나누었고, 생상스는 그를 위해 바이올린 협주곡 3번도 썼습니다. 곡은 제목처럼 두 부분으로 이루어져 있습니다. 앞부분 '서주'에서는 바이올린이 우수 어린 선율을 천천히 노래하며 깊은 감정을 드러냅니다. 이어지는 '론도 카프리치오소'는 '변덕스러운 론도'라는 뜻으로, 스페인풍의 정열적이고 경쾌한 리듬 위에서 바이올린이 화려한 기교를 마음껏 뽐냅니다. 같은 주제가 여러 번 돌아오는 론도 형식 사이사이에 서정적인 선율과 숨 가쁜 기교가 번갈아 펼쳐지다가, 마지막에는 불꽃처럼 휘몰아치며 화려하게 끝납니다. 프랑스 작곡가가 그린 스페인의 열정이 담긴 이 곡은 지금도 바이올리니스트들이 무척 사랑하는 레퍼토리입니다. 두 음악가의 우정을 떠올리며 들어 보세요."], ["4-20", "현악4중주 「종달새」 Op.64-5", "하이든", "실내악", "봄", "봄새(종달새) 별명", "하이든이 1790년에 쓴 현악 4중주곡입니다. 하이든은 평생 일흔 곡 가까운 현악 4중주를 써서 이 형식을 완성한 '현악 4중주의 아버지'로 불립니다. 이 곡은 하이든이 일하던 에스테르하지 궁정 악단의 바이올리니스트였다가 사업가가 된 요한 토스트에게 헌정한 여섯 곡 가운데 한 곡입니다. 「종달새」라는 별명은 1악장의 첫머리에서 비롯되었습니다. 다른 세 악기가 경쾌하고 가벼운 리듬을 연주하는 동안, 제1바이올린이 높은 음역으로 날아올라 맑고 밝은 선율을 노래하는데, 그 모습이 마치 봄 하늘 높이 날아오르며 지저귀는 종달새 같습니다. 2악장은 따뜻하고 서정적인 아다지오이고, 3악장은 소박하고 정겨운 미뉴에트입니다. 4악장은 네 대의 악기가 쉬지 않고 빠른 음표를 주고받으며 끝까지 내달리는 '무궁동'으로, 듣는 이의 마음을 상쾌하게 만들어 줍니다. 하이든의 현악 4중주 가운데 가장 자주 연주되는 곡 가운데 하나입니다. 봄 하늘 높이 날아오르는 종달새를 떠올리며, 네 대의 현악기가 나누는 즐거운 대화에 귀 기울여 보세요."], ["4-21", "「새」 모음곡", "레스피기", "관현악", "봄", "봄새 소리", "이탈리아의 작곡가 오토리노 레스피기가 1928년에 쓴 소규모 관현악 모음곡입니다. 레스피기는 「로마의 분수」, 「로마의 소나무」 같은 화려한 관현악곡으로 유명하지만, 동시에 옛 음악에 깊은 관심을 가진 학자이기도 했습니다. 그는 17세기와 18세기의 작곡가들이 하프시코드와 류트를 위해 쓴, 새를 주제로 한 다섯 곡을 골라 현대의 관현악으로 새롭게 편곡했습니다. 곡은 화려하고 당당한 「서곡」으로 시작해, 구구거리며 날갯짓하는 「비둘기」, 꼬꼬댁 꼬꼬댁 시끄럽게 울며 돌아다니는 「암탉」, 밤에 아름답고 애절하게 노래하는 「나이팅게일」, 그리고 '뻐꾹 뻐꾹' 소리가 숲속에 울려 퍼지는 「뻐꾸기」로 이어집니다. 레스피기는 오보에, 플루트, 클라리넷 같은 목관 악기와 현악기, 하프의 다채로운 음색을 활용해 새들의 생김새와 움직임, 울음소리를 생생하게 그려 냈습니다. 바로크 시대의 단정하고 우아한 선율에 20세기의 풍성한 색채가 더해져 독특한 매력을 지닌 곡입니다. 아이들과 함께 어떤 새가 나오는지 맞혀 보며 들어도 즐겁습니다. 새들의 합창이 시작되는 4월을 즐겨 보세요."], ["4-22", "플루트와 하프를 위한 협주곡 K.299", "모차르트", "협주곡", "봄", "화사한 봄날의 협주곡", "모차르트가 스물두 살이던 1778년 프랑스 파리에 머물 때 쓴 협주곡입니다. 이 곡은 플루트를 즐겨 연주하던 드 긴 공작과 하프를 잘 타던 그의 딸을 위해 쓰였습니다. 모차르트는 당시 공작의 딸에게 작곡을 가르치기도 했는데, 그는 아버지에게 보낸 편지에서 그녀가 재능은 있지만 생각이 부족하다며 투덜거리기도 했습니다. 게다가 공작은 약속한 수업료의 절반만 주었다고 전해져, 파리 생활은 모차르트에게 그리 즐겁지 않았던 것 같습니다. 하지만 이 협주곡에는 그런 고단함이 조금도 드러나지 않습니다. 플루트와 하프라는 두 악기는 모두 맑고 우아한 소리를 지녔지만, 하나는 숨으로 노래하고 다른 하나는 줄을 튕겨 반짝이는 소리를 내지요. 모차르트는 이 두 악기가 서로 주고받고 어우러지도록 섬세하게 엮어, 궁정의 화사하고 우아한 분위기를 그려 냈습니다. 특히 2악장은 플루트와 하프가 부드럽게 속삭이듯 대화를 나누는 아름다운 노래입니다. 모차르트가 하프를 사용한 작품은 이 곡이 유일합니다. 봄날의 정원처럼 화사한 음악을 즐겨 보세요."], ["4-23", "교향곡 1번 「고전」 Op.25", "프로코피예프", "관현악", "기념일", "프로코피예프 탄생일(1891.4.23)", "1891년 4월 23일 지금의 우크라이나 지역에서 태어난 러시아의 작곡가 프로코피예프의 첫 교향곡입니다. 1916년부터 이듬해까지 쓰인 이 곡에 대해 프로코피예프는 \"만약 하이든이 오늘날 살아 있다면 썼을 법한 교향곡\"을 쓰고 싶었다고 밝혔습니다. 그래서 곡의 규모와 형식, 악기 편성은 하이든 시대의 고전적인 교향곡을 따르면서도, 그 안에 뜻밖의 화음 전환과 재치 있는 유머 같은 20세기의 감각을 담았습니다. 프로코피예프는 그동안 늘 피아노 앞에서 작곡했는데, 이 곡은 피아노 없이 머릿속으로만 작곡하는 연습으로 썼다고 합니다. 전체 길이가 15분 남짓으로 짧고 간결한 이 교향곡은 처음부터 끝까지 경쾌하고 밝습니다. 1악장은 활기차고, 2악장은 높은 음역의 바이올린이 우아하게 노래하며, 3악장 가보트는 익살스럽고 짧은 춤곡입니다. 4악장은 쉴 새 없이 질주하는 빠르고 재치 넘치는 피날레로 마무리됩니다. 1917년 러시아 혁명이 일어난 혼란의 시기에 쓰였지만, 곡에는 맑고 명랑한 기운이 가득합니다. 그의 생일에 고전과 현대가 만나는 즐거움을 느껴 보세요."], ["4-24", "종달새의 비상", "본 윌리엄스", "협주곡", "봄", "봄 하늘로 날아오르는 종달새", "영국의 작곡가 랠프 본 윌리엄스가 쓴 바이올린과 관현악을 위한 작품입니다. 그는 1914년 영국의 시인 조지 메러디스의 시 「종달새의 비상」에서 영감을 받아 이 곡을 쓰기 시작했는데, 그해 여름 1차 세계대전이 일어나 작곡을 잠시 멈추어야 했습니다. 본 윌리엄스는 마흔이 넘은 나이에도 자원입대해 전쟁터로 나갔고, 전쟁이 끝난 뒤 곡을 다듬어 1920년 바이올리니스트 마리 홀의 독주로 초연했습니다. 곡은 현악기의 고요하고 부드러운 화음 위로 독주 바이올린이 홀로 날아오르며 시작합니다. 반주 없이 자유롭게 오르내리는 바이올린의 선율은 마치 들판에서 날아오른 종달새가 하늘 높이 원을 그리며 노래하는 모습을 그대로 옮겨 놓은 듯합니다. 가운데 부분에서는 영국 시골의 민요풍 선율이 소박하고 정겹게 흐르다가, 마지막에는 다시 종달새가 하늘 저 멀리 사라지듯 바이올린의 높은 음이 고요하게 잦아듭니다. 영국에서는 해마다 가장 사랑받는 클래식 음악을 뽑는 조사에서 이 곡이 여러 차례 1위를 차지했습니다. 끝없이 펼쳐진 봄 하늘을 마음에 그려 보세요."], ["4-25", "목신의 오후에의 전주곡", "드뷔시", "관현악", "봄", "나른한 봄날 오후", "드뷔시가 1894년에 발표한 관현악곡으로, 프랑스의 시인 말라르메의 시 「목신의 오후」에서 영감을 받았습니다. 목신은 그리스 신화에 나오는 숲과 들의 신으로, 상반신은 사람이고 하반신과 뿔은 염소의 모습을 하고 있습니다. 시는 어느 나른한 여름날 오후, 숲속에서 잠에서 깬 목신이 물가에서 본 아름다운 요정들의 모습이 꿈이었는지 현실이었는지 아련하게 떠올리다가 다시 잠에 빠져드는 몽환적인 내용입니다. 곡은 플루트가 홀로 천천히 미끄러지듯 내려왔다가 다시 올라가는 신비로운 선율로 시작하는데, 이것은 목신이 부는 피리 소리입니다. 그 뒤로 하프의 영롱한 소리와 호른의 부드러운 울림이 더해지며, 꿈과 현실의 경계가 흐릿해지는 듯한 몽롱한 분위기가 펼쳐집니다. 뚜렷한 박자나 형식에 얽매이지 않고 소리의 색채와 분위기로 그려 낸 이 곡은 음악의 새로운 시대를 연 작품으로 평가받습니다. 훗날 프랑스의 작곡가 불레즈는 현대 음악이 이 곡의 플루트 선율과 함께 깨어났다고 말했습니다. 봄날 오후의 나른함 속에서 목신의 꿈에 함께 빠져 보세요."], ["4-26", "관현악 모음곡 3번 중 「G선상의 아리아」 BWV 1068", "바흐", "관현악", "일반", "가장 사랑받는 바로크 선율", "바흐가 남긴 네 곡의 관현악 모음곡 가운데 세 번째 곡의 두 번째 악장입니다. 원래 제목은 단순히 '에어', 즉 '노래'라는 뜻이었습니다. 이 곡이 「G선상의 아리아」라는 이름을 얻게 된 것은 바흐가 세상을 떠나고 100년도 더 지난 1871년의 일입니다. 독일의 바이올리니스트 아우구스트 빌헬미가 이 곡을 바이올린과 피아노를 위해 편곡하면서, 원래보다 음을 낮추어 바이올린의 가장 낮은 줄인 G선 하나만으로 연주할 수 있게 만들었습니다. 이 편곡이 큰 인기를 끌면서 'G선상의 아리아'라는 별명이 붙게 되었지요. 원곡은 현악 합주와 통주저음으로 연주되는데, 낮은 음역의 악기들이 한 걸음 한 걸음 천천히 걸어가듯 규칙적인 음을 연주하는 동안, 그 위로 바이올린이 길고 고요한 선율을 끝없이 이어 갑니다. 단순하면서도 깊은 이 선율은 마음을 차분하게 가라앉히고 평화로움을 안겨 줍니다. 결혼식, 장례식, 영화와 광고 등 수많은 곳에서 쓰여 바로크 음악 가운데 가장 사랑받는 선율로 꼽힙니다. 하루의 쉼이 필요한 순간에 들어 보세요."], ["4-27", "왕궁의 불꽃놀이 음악 HWV 351", "헨델", "관현악", "기념일", "초연일(1749.4.27, 런던)", "1749년 4월 27일 런던의 그린 파크에서 초연된 헨델의 관현악곡입니다. 영국 국왕 조지 2세는 유럽의 여러 나라가 얽혀 오랫동안 이어진 전쟁이 끝나고 평화 조약이 맺어진 것을 축하하기 위해 성대한 불꽃놀이 축제를 열었고, 헨델에게 그 축제를 위한 음악을 의뢰했습니다. 국왕은 군대 음악처럼 관악기와 타악기만 쓰기를 원해서, 초연 때는 백 명 가까운 연주자가 오보에, 바순, 호른, 트럼펫, 팀파니 등으로 장엄한 소리를 냈습니다. 현악기는 나중에 헨델이 곡을 다시 다듬으면서 추가되었습니다. 본 공연 엿새 전 열린 공개 리허설에는 무려 1만 2천 명이 넘는 사람들이 몰려들어, 런던 다리가 세 시간 동안 마차로 꽉 막혔다고 합니다. 정작 본 공연에서는 불꽃이 잘못 튀어 축제를 위해 세운 거대한 목조 건물에 불이 붙는 소동이 벌어졌지만, 헨델의 음악만은 큰 성공을 거두었습니다. 웅장한 서곡에 이어 평화, 기쁨을 노래하는 짧은 곡들과 미뉴에트가 펼쳐집니다. 밤하늘을 수놓는 불꽃을 떠올리며 들어 보세요."], ["4-28", "즉흥환상곡 Op.66", "쇼팽", "독주", "일반", "쇼팽 명곡", "쇼팽이 1834년에 작곡한 피아노곡입니다. 그런데 쇼팽은 무슨 이유에서인지 이 곡을 생전에 출판하지 않았고, 친구들에게도 출판하지 말라고 당부했다고 합니다. 그 이유에 대해서는 다른 작곡가의 곡과 비슷하다고 생각했기 때문이라는 설 등 여러 이야기가 있지만 정확히 알려져 있지 않습니다. 쇼팽이 세상을 떠난 뒤 그의 친구 폰타나가 이 곡을 출판하면서 '환상'이라는 말을 덧붙여 「즉흥환상곡」이라는 이름이 붙었습니다. 결국 쇼팽의 뜻과 달리 출판된 이 곡은 그의 작품 가운데 가장 사랑받는 곡이 되었지요. 곡은 왼손이 한 박에 셋씩 쪼개진 음표를 물결처럼 연주하는 동안, 오른손이 한 박에 넷씩 쪼개진 음표로 빠르게 휘몰아치며 시작합니다. 서로 다른 리듬이 맞물리며 만들어 내는 긴장감과 소용돌이치는 열정이 이 곡의 매력입니다. 가운데 부분에서는 분위기가 완전히 바뀌어, 느리고 꿈결 같은 아름다운 선율이 흐릅니다. 이 선율은 훗날 미국의 대중가요로도 만들어졌습니다. 쇼팽이 숨겨 두고 싶었던 열정과 꿈을 느껴 보세요."], ["4-29", "피아노 협주곡 1번 b♭단조 Op.23", "차이콥스키", "협주곡", "일반", "가장 유명한 피아노 협주곡 도입부", "차이콥스키가 1874년에 작곡한 첫 번째 피아노 협주곡입니다. 그해 크리스마스이브, 차이콥스키는 존경하던 피아니스트이자 모스크바 음악원 원장인 니콜라이 루빈시테인에게 이 곡을 처음 들려주었습니다. 그런데 루빈시테인은 곡이 형편없고 연주할 수 없다며 혹독하게 비판했고, 큰 상처를 받은 차이콥스키는 한 음도 고치지 않겠다며 곡을 독일의 피아니스트 한스 폰 뷜로에게 헌정했습니다. 이 협주곡은 1875년 미국 보스턴에서 뷜로의 독주로 초연되어 큰 성공을 거두었고, 훗날 루빈시테인도 자신의 잘못을 인정하고 이 곡을 즐겨 연주했다고 합니다. 곡은 호른이 장엄한 선율을 울리고, 피아노가 건반 전체를 울리는 거대한 화음을 내리치며 시작하는데, 이 웅장한 첫머리는 클래식 음악 가운데 가장 유명한 시작으로 꼽힙니다. 1958년 소련에서 열린 제1회 차이콥스키 국제 콩쿠르에서 미국의 청년 반 클라이번이 이 곡을 연주해 우승하면서, 냉전 시대에 음악이 국경을 넘어선 순간으로 기억되기도 합니다. 웅장하고 화려한 러시아 낭만주의를 만끽해 보세요."], ["4-30", "버라이어티 오케스트라 모음곡 중 「왈츠 2번」", "쇼스타코비치", "관현악", "일반", "경쾌한 4월의 마지막 날", "러시아의 작곡가 쇼스타코비치가 남긴 가볍고 대중적인 관현악 소품들을 모은 「버라이어티 오케스트라를 위한 모음곡」 가운데 한 곡입니다. 이 모음곡은 오랫동안 「재즈 모음곡 2번」이라는 잘못된 이름으로 알려지기도 했습니다. 「왈츠 2번」은 원래 1950년대 소련 영화를 위해 쓴 음악으로, 1999년 스탠리 큐브릭 감독의 영화 「아이즈 와이드 셧」에 쓰이면서 전 세계적으로 큰 인기를 얻었습니다. 쇼스타코비치는 교향곡과 현악 4중주 같은 진지하고 무거운 작품으로 유명하며, 소련의 엄혹한 정치 상황 속에서 늘 감시와 비판을 받으며 살았습니다. 하지만 그는 영화와 무대를 위해 이처럼 친근하고 아름다운 음악도 많이 썼습니다. 곡은 둥근 3박자 왈츠 리듬 위로 색소폰이 애수 어린 선율을 노래하며 시작합니다. 그 선율은 바이올린과 트롬본 등 여러 악기로 옮겨 가며 되풀이되는데, 흥겨우면서도 어딘가 쓸쓸하고 향수 어린 분위기가 묘한 여운을 남깁니다. 오케스트라의 신년음악회나 앙코르 곡으로도 자주 연주됩니다. 4월의 마지막 날, 한 바퀴 빙글 도는 왈츠와 함께 봄날을 보내 보세요."], ["5-1", "교향곡 7번 A장조 Op.92", "베토벤", "관현악", "봄", "생동하는 5월. '춤의 신격화'", "베토벤이 1811년부터 이듬해까지 작곡한 교향곡입니다. 1813년 빈에서 나폴레옹 전쟁의 부상병들을 돕기 위한 자선 연주회에서 베토벤 자신의 지휘로 초연되었는데, 청중의 반응이 너무 뜨거워 2악장을 앙코르로 다시 연주해야 했습니다. 훗날 작곡가 바그너는 이 교향곡을 '춤의 신격화'라고 불렀습니다. 그 말처럼 이 곡은 처음부터 끝까지 리듬이 주인공입니다. 1악장은 느린 서주를 지나 깡충깡충 뛰는 듯한 리듬으로 생기 넘치게 펼쳐지고, 2악장 알레그레토는 장례 행렬처럼 무겁고 단순한 리듬이 반복되며 점점 깊어지는데, 이 악장은 영화 「킹스 스피치」에 쓰여 더욱 유명해졌습니다. 3악장은 경쾌하게 질주하는 스케르초이고, 4악장은 마치 축제에서 미친 듯이 춤추는 사람들처럼 거침없는 에너지로 폭발합니다. 이 무렵 베토벤은 청력을 거의 잃어 가고 있었지만, 이 곡에는 절망 대신 생명의 환희가 가득합니다. 5월의 첫날, 연둣빛 새잎이 돋아나는 계절의 생동감을 이 교향곡과 함께 느껴 보세요. 저절로 발걸음이 가벼워질 것입니다."], ["5-2", "「어미 거위」 모음곡", "라벨", "관현악", "어린이날", "어린이날 주간, 동화 모음곡", "라벨이 친구 고뎁스키 부부의 어린 남매 미미와 장을 위해 쓴 피아노 연탄곡으로, 1911년 관현악곡으로 다시 편곡되었습니다. '어미 거위'는 프랑스 작가 샤를 페로의 동화집 「어미 거위 이야기」에서 따온 이름으로, 영어권의 '마더 구스'처럼 옛날이야기를 들려주는 할머니를 뜻합니다. 곡은 다섯 개의 동화 장면으로 이루어져 있습니다. 첫 곡은 잠자는 숲속의 공주를 위한 느리고 고요한 춤이고, 둘째 곡은 숲속에서 길을 잃은 엄지 동자가 빵 부스러기를 뿌리며 걷는 장면입니다. 셋째 곡에서는 도자기 인형의 나라 여왕이 목욕하는 동안 작은 인형들이 동양풍의 악기를 연주합니다. 넷째 곡 「미녀와 야수의 대화」에서는 클라리넷이 우아한 미녀를, 낮고 투박한 콘트라바순이 야수를 맡아 대화를 나누다가, 마침내 야수가 왕자로 변하는 마법 같은 순간이 그려집니다. 마지막 곡 「요정의 정원」은 모든 이야기가 행복하게 끝나는 찬란한 결말입니다. 아이의 눈으로 동화를 바라본 라벨의 섬세한 마음을 느껴 보세요."], ["5-3", "어린이의 놀이 Op.22", "비제", "관현악", "어린이날", "어린이날 주간", "오페라 「카르멘」으로 유명한 프랑스의 작곡가 조르주 비제가 1871년에 쓴 열두 곡의 피아노 연탄곡입니다. 두 사람이 한 대의 피아노에 나란히 앉아 연주하도록 쓴 이 곡들은 아이들의 놀이를 하나씩 음악으로 그린 작은 그림책 같습니다. 그네, 팽이, 인형, 목마, 비눗방울, 숨바꼭질, 술래잡기 같은 놀이가 차례로 등장하지요. 비제는 이 가운데 다섯 곡을 골라 관현악곡으로 편곡해 「작은 모음곡」으로 펴냈습니다. 첫 곡 「행진곡」에서는 트럼펫과 북을 든 아이들이 씩씩하게 행진하고, 둘째 곡 「자장가」에서는 인형을 재우는 아이의 부드러운 노래가 흐릅니다. 셋째 곡 「즉흥곡」에서는 팽이가 빙글빙글 돌고, 넷째 곡 「이중주」에서는 소꿉놀이를 하는 작은 신랑과 신부가 다정하게 이야기를 나눕니다. 마지막 곡 「갤럽」은 아이들이 신나게 뛰어노는 무도회로, 숨 가쁘게 내달리며 끝을 맺습니다. 프랑스 사람들의 우아하고 재치 있는 음악 감각이 잘 드러나는 곡입니다. 어린이날을 앞두고, 아이들과 함께 어떤 놀이가 나오는지 상상하며 들어 보세요."], ["5-4", "어린이 차지", "드뷔시", "독주", "어린이날", "어린이날 주간, 딸을 위해 쓴 곡", "드뷔시가 1906년부터 1908년 사이에 늦둥이 외동딸 클로드엠마를 위해 쓴 여섯 곡의 피아노 모음곡입니다. 드뷔시는 '슈슈'라는 애칭으로 부르던 딸을 무척 아꼈고, 악보에 \"사랑하는 슈슈에게, 이어질 일들에 대해 아버지의 다정한 용서를 구하며\"라는 재치 있는 헌사를 적었습니다. 제목과 곡명이 모두 영어인 것은 딸을 돌보던 영국인 가정교사의 영향이라고 합니다. 첫 곡 「그라두스 아드 파르나숨 박사」는 피아노 연습곡을 억지로 치다가 지루해서 딴짓을 하는 아이의 모습을 유쾌하게 그립니다. 이어서 장난감 코끼리를 재우는 「코끼리의 자장가」, 인형에게 바치는 「인형을 위한 세레나데」, 창밖으로 하얗게 흩날리는 「눈송이는 춤춘다」, 피리를 부는 「작은 목동」이 펼쳐집니다. 마지막 곡 「골리워그의 케이크워크」에서는 흑인 헝겊 인형이 미국에서 유행하던 춤을 추는데, 중간에 바그너의 오페라 선율을 슬쩍 흉내 내며 놀리는 장난이 숨어 있습니다. 아이의 세계를 사랑으로 들여다본 아버지의 따뜻한 시선이 느껴집니다. 어린이날 주간, 동심의 세계로 돌아가 보세요."], ["5-5", "타이프라이터", "르로이 앤더슨", "관현악", "어린이날", "타자기가 악기로 등장하는 유쾌한 곡", "미국의 작곡가 르로이 앤더슨이 1950년에 쓴 관현악곡으로, 타자기가 악기로 등장하는 유쾌한 곡입니다. 앤더슨은 하버드 대학교에서 음악을 공부했고, 보스턴 팝스 오케스트라를 위해 짧고 재치 넘치는 관현악 소품을 많이 썼습니다. 그는 일상의 소리를 음악에 담는 데 뛰어났는데, 이 곡에서는 사무실에서 흔히 듣던 타자기 소리를 오케스트라 속으로 끌어들였습니다. 연주자 한 명이 무대 위에서 실제 타자기를 두드리는데, 자판을 타닥타닥 치는 소리, 한 줄이 끝날 때 울리는 '땡' 하는 종소리, 그리고 종이를 다음 줄로 넘기는 '드르륵' 소리가 오케스트라의 경쾌한 리듬과 절묘하게 어우러집니다. 타자기 연주자는 정확한 박자에 맞춰 빠르게 자판을 두드려야 해서 생각보다 꽤 어렵다고 합니다. 이 곡은 영화와 텔레비전에도 자주 쓰여 큰 인기를 얻었고, 지금도 어린이 음악회의 단골 레퍼토리입니다. 컴퓨터가 등장하며 타자기는 거의 사라졌지만, 이 곡 덕분에 그 정겨운 소리는 여전히 살아 있습니다. 어린이날, 아이들과 함께 박자에 맞춰 책상을 두드려 보세요."], ["5-6", "사계 Op.37 중 「5월: 백야」", "차이콥스키", "독주", "계절 표제", "표제 자체가 5월", "차이콥스키의 피아노 모음곡 「사계」 가운데 5월의 곡입니다. 러시아의 북쪽 도시 상트페테르부르크에서는 5월 말부터 7월 초까지 해가 거의 지지 않아, 한밤중에도 하늘이 희미하게 밝은 '백야'가 이어집니다. 사람들은 이 신비로운 시기를 맞아 밤늦도록 강변을 거닐며 축제를 즐기지요. 이 곡에는 시인 페트의 시에서 따온, \"얼마나 아름다운 밤인가! 얼마나 큰 행복인가!\"로 시작하는 구절이 붙어 있습니다. 곡은 고요하고 꿈결 같은 선율로 시작하는데, 해가 지지 않은 채 은은하게 빛나는 밤하늘 아래, 북쪽의 차고 맑은 공기 속에서 잠 못 이루는 사람의 설레는 마음이 느껴집니다. 가운데 부분에서는 리듬이 빨라지고 분위기가 활기차게 바뀌는데, 마치 백야의 축제를 즐기는 사람들의 들뜬 웃음소리 같습니다. 그리고 다시 처음의 고요하고 몽환적인 선율로 돌아와, 끝나지 않는 밤의 신비 속으로 조용히 사라집니다. 차이콥스키는 상트페테르부르크에서 음악을 공부하며 젊은 시절을 보냈습니다. 5월의 밤, 길어진 해를 바라보며 들어 보세요."], ["5-7", "바이올린 협주곡 D장조 Op.77", "브람스", "협주곡", "기념일", "브람스·차이콥스키 공동 탄생일(5.7)", "오늘은 브람스와 차이콥스키가 함께 태어난 날입니다. 브람스는 1833년 독일 함부르크에서, 차이콥스키는 7년 뒤인 1840년 러시아에서 태어났지요. 두 사람은 서로의 음악을 썩 좋아하지 않았지만, 신기하게도 1878년 같은 해에 같은 D장조로 바이올린 협주곡을 썼습니다. 오늘은 브람스, 내일은 차이콥스키의 협주곡을 들어 봅니다. 브람스는 1878년 여름, 오스트리아의 아름다운 호숫가 휴양지 푀르차흐에서 오랜 친구이자 당대 최고의 바이올리니스트 요아힘을 위해 이 곡을 썼습니다. 요아힘은 작곡 과정에서 바이올린 연주에 관한 조언을 아끼지 않았고, 이듬해 1월 1일 라이프치히에서 브람스의 지휘로 초연했습니다. 1악장은 웅장하고 교향곡처럼 장대하며, 2악장은 오보에가 먼저 아름다운 선율을 노래하고 바이올린이 이를 이어받습니다. 이 때문에 한 유명 바이올리니스트는 오보에가 선율을 다 연주하는 동안 바이올린을 들고 가만히 서 있을 수는 없다며 이 곡을 연주하지 않았다는 일화도 전해집니다. 3악장은 헝가리풍의 힘차고 흥겨운 춤곡입니다."], ["5-8", "바이올린 협주곡 D장조 Op.35", "차이콥스키", "협주곡", "기념일", "브람스와 같은 생일·같은 조성의 협주곡", "차이콥스키가 1878년 봄, 스위스 제네바 호숫가의 마을 클라랑스에서 불과 한 달 만에 완성한 협주곡입니다. 그 전해 차이콥스키는 충동적으로 결혼했다가 몇 주 만에 파경을 맞으며 깊은 정신적 고통에 시달렸고, 요양을 위해 스위스로 떠났습니다. 그곳에서 제자이자 바이올리니스트인 코테크와 함께 지내며 다시 창작의 기쁨을 되찾았지요. 그런데 곡을 헌정받으려던 당대의 명바이올리니스트는 연주할 수 없는 곡이라며 거절했고, 1881년 빈에서 다른 연주자에 의해 초연되었을 때는 빈의 유명 비평가가 이 곡을 두고 귀에 거슬리는 냄새가 나는 음악이라며 혹독하게 비난했습니다. 하지만 이 곡은 곧 전 세계에서 가장 사랑받는 바이올린 협주곡 가운데 하나가 되었습니다. 1악장은 따뜻하고 서정적인 선율과 눈부신 기교가 어우러지고, 2악장 '칸초네타'는 러시아의 애수가 담긴 고요한 노래입니다. 3악장은 러시아 민속춤의 강렬한 리듬으로 숨 가쁘게 질주하며 화려하게 끝납니다. 어제 들은 브람스의 협주곡과 비교하며, 같은 해에 태어난 두 협주곡의 서로 다른 개성을 느껴 보세요."], ["5-9", "피아노 5중주 2번 A장조 Op.81", "드보르자크", "실내악", "봄", "신록의 실내악", "드보르자크가 1887년 보헤미아의 시골 마을 비소카에 있는 여름 별장에서 쓴 피아노 5중주곡입니다. 드보르자크는 이곳에서 정원을 가꾸고 비둘기를 기르며 소박한 시골 생활을 즐겼는데, 그의 평화롭고 행복한 마음이 이 곡에 고스란히 담겨 있습니다. 피아노와 현악 4중주가 함께 연주하는 이 곡은 슈만, 브람스의 피아노 5중주와 함께 이 장르의 최고 걸작으로 꼽힙니다. 1악장은 첼로가 따뜻하고 서정적인 선율을 노래하며 시작해, 밝고 넉넉한 분위기로 펼쳐집니다. 2악장은 '둠카'라는 슬라브 민요 형식을 바탕으로 하는데, 둠카는 슬프고 느린 부분과 빠르고 흥겨운 부분이 번갈아 나타나는 것이 특징입니다. 비올라가 부르는 애수 어린 노래와 갑자기 터져 나오는 활기찬 춤이 교차하며 슬라브 사람들의 깊은 감정을 표현합니다. 3악장은 체코의 민속춤 '푸리안트'의 힘찬 리듬으로 흥겹게 펼쳐지고, 4악장은 축제처럼 밝고 활기차게 마무리됩니다. 초록이 짙어지는 5월, 보헤미아의 시골 풍경을 떠올리며 들어 보세요."], ["5-10", "발라드 1번 g단조 Op.23", "쇼팽", "독주", "일반", "쇼팽 명곡", "쇼팽이 1831년부터 1835년 사이, 조국 폴란드를 떠나 파리에 정착한 무렵 쓴 네 곡의 발라드 가운데 첫 곡입니다. '발라드'는 원래 옛이야기를 노래로 들려주는 서사시를 뜻하는데, 쇼팽은 피아노 음악에 처음으로 이 이름을 붙여 마치 한 편의 극적인 이야기를 들려주듯 음악을 펼쳐 냈습니다. 이 발라드들이 폴란드의 시인 미츠키에비치의 시에서 영감을 받았다는 이야기가 전해지지만, 쇼팽 자신은 구체적인 내용을 밝히지 않았습니다. 곡은 낮은 음에서 천천히 올라가는 신비로운 서주로 시작해, 망설이듯 애수 어린 첫 주제가 흐릅니다. 이어 따뜻하고 꿈결 같은 둘째 주제가 나타나고, 두 주제가 모습을 바꾸어 가며 점점 격정적으로 고조되다가, 마지막에는 폭풍처럼 몰아치는 비극적인 결말로 끝을 맺습니다. 슈만이 쇼팽에게 그의 작품 가운데 이 곡을 가장 좋아한다고 말하자, 쇼팽도 자신 역시 이 곡을 가장 사랑한다고 답했다고 합니다. 영화 「피아니스트」의 중요한 장면에서 연주되어 더욱 유명해졌습니다. 피아노가 들려주는 한 편의 비극적 서사시에 귀 기울여 보세요."], ["5-11", "오보에 협주곡 C장조 K.314", "모차르트", "협주곡", "봄", "맑은 5월의 협주곡", "모차르트가 1777년 고향 잘츠부르크의 궁정 악단에 새로 들어온 이탈리아 출신의 오보에 연주자를 위해 쓴 협주곡입니다. 이듬해 모차르트는 이 곡을 조금 고쳐 플루트 협주곡으로 바꾸었는데, 이후 오보에판 악보는 사라지고 플루트판만 남아 오랫동안 '플루트 협주곡 2번'으로만 알려졌습니다. 그러다 1920년 잘츠부르크에서 오보에판의 옛 필사본이 발견되면서, 이 곡이 원래 오보에를 위한 곡이었다는 사실이 밝혀졌습니다. 오보에는 두 장의 얇은 갈대 조각을 입에 물고 불어 소리를 내는 악기로, 맑고 또렷하면서도 어딘가 애틋한 음색을 지니고 있습니다. 1악장은 밝고 생기 넘치며, 오보에가 경쾌하게 노래합니다. 2악장은 부드럽고 서정적인 선율이 흐르는 아름다운 느린 악장입니다. 3악장의 주제 선율은 모차르트가 무척 마음에 들어 했던지, 훗날 그의 오페라 「후궁 탈출」의 한 아리아에도 다시 쓰였습니다. 오늘날 오보에 연주자들이 오디션에서 반드시 연주하는 가장 중요한 협주곡입니다. 맑은 5월의 하늘처럼 투명한 오보에 소리를 즐겨 보세요."], ["5-12", "「나의 조국」 중 「블타바」", "스메타나", "관현악", "기념일", "스메타나 서거일, 프라하의 봄 음악제 개막일(5.12)", "체코의 작곡가 스메타나가 1874년부터 1879년 사이에 쓴 여섯 곡의 교향시 「나의 조국」 가운데 두 번째 곡입니다. 스메타나는 이 곡들을 쓰기 시작할 무렵 청력을 완전히 잃었지만, 오스트리아의 지배를 받던 조국 체코의 아름다운 자연과 역사를 음악에 담아내기 위해 작곡을 멈추지 않았습니다. 블타바는 체코를 가로질러 수도 프라하를 지나 흐르는 가장 긴 강으로, 독일어로는 '몰다우'라고 부릅니다. 곡은 두 대의 플루트와 클라리넷이 숲속의 작은 두 샘물이 솟아나는 모습을 그리며 시작합니다. 두 샘물은 하나로 합쳐져 넓은 강이 되고, 현악기가 그 유유한 흐름을 아름다운 선율로 노래합니다. 강은 숲속의 사냥 장면과 시골의 흥겨운 결혼식 마당을 지나, 달빛 아래 물의 요정들이 춤추는 밤을 거쳐, 거센 급류를 지나 마침내 프라하의 옛 성 앞을 웅장하게 흘러갑니다. 해마다 스메타나의 기일인 오늘, 프라하에서는 이 곡으로 '프라하의 봄' 국제 음악제의 막이 오릅니다. 강물을 따라 체코를 여행해 보세요."], ["5-13", "파반 Op.50", "포레", "관현악", "기념일", "포레 탄생 주간(1845.5.12)", "1845년 5월 12일 프랑스 남부에서 태어난 가브리엘 포레가 1887년에 쓴 관현악곡입니다. '파반'은 16세기 스페인과 이탈리아의 궁정에서 유행하던 느리고 장중한 춤으로, 귀족들이 화려한 옷을 입고 공작새처럼 우아하게 걸으며 추었다고 합니다. 포레는 이 옛 춤곡의 형식을 빌려, 우아하면서도 어딘가 아련하고 쓸쓸한 분위기의 곡을 썼습니다. 곡은 현악기가 손가락으로 줄을 뜯는 부드러운 피치카토 반주 위로, 플루트가 그윽하고 애틋한 선율을 노래하며 시작합니다. 이 선율은 한 번 들으면 잊히지 않을 만큼 아름다워서, 광고와 영화, 대중음악 등에 수없이 쓰였습니다. 가운데 부분에서는 오케스트라 전체가 조금 더 강렬하고 극적으로 고조되었다가, 다시 처음의 고요한 선율로 돌아와 조용히 마무리됩니다. 포레는 나중에 이 곡에 합창을 덧붙인 판본도 만들었지만, 오늘날에는 관현악만으로 연주되는 경우가 훨씬 많습니다. 포레는 프랑스 음악의 섬세하고 절제된 아름다움을 가장 잘 보여 준 작곡가로 평가받습니다. 옛 궁정의 우아한 춤을 상상하며 들어 보세요."], ["5-14", "바이올린 협주곡 2번 E장조 BWV 1042", "바흐", "협주곡", "일반", "바로크 협주곡", "바흐가 남긴 바이올린 협주곡 가운데 하나로, 독일 쾨텐의 궁정악장으로 일하던 시절에 쓴 것으로 여겨집니다. 바흐는 오르가니스트로 가장 유명하지만, 젊은 시절에는 바이올린 연주자로도 활동했을 만큼 이 악기를 잘 알았습니다. 쾨텐의 영주는 음악을 무척 사랑했고 뛰어난 궁정 악단을 갖추고 있었는데, 이 시기에 바흐는 「브란덴부르크 협주곡」, 「무반주 첼로 모음곡」 등 수많은 기악곡을 남겼습니다. 이 협주곡은 이탈리아의 비발디가 확립한 빠름, 느림, 빠름의 세 악장 형식을 따르고 있습니다. 1악장은 오케스트라 전체가 힘차게 세 번 화음을 울리며 밝고 당당하게 시작합니다. 이 곡의 중심인 2악장 아다지오는 단조로 바뀌어, 낮은 음역의 악기들이 같은 선율을 반복하며 무겁게 받쳐 주는 가운데, 바이올린이 깊은 슬픔과 사색이 담긴 노래를 길게 이어 갑니다. 3악장은 다시 밝고 경쾌한 춤곡으로 돌아와 생기 넘치게 끝을 맺습니다. 바로크 협주곡의 단정한 균형미와 깊은 감정이 함께 담긴 곡입니다. 맑은 아침, 하루를 정돈하는 마음으로 들어 보세요."], ["5-15", "교향곡 8번 「미완성」 D.759", "슈베르트", "관현악", "일반", "스승의 날. 교향곡 명곡", "슈베르트가 1822년에 작곡한 교향곡입니다. 보통 교향곡은 네 악장으로 이루어지는데, 이 곡은 두 악장만 완성되고 셋째 악장은 피아노 스케치와 몇 마디의 관현악 악보만 남아 있습니다. 그래서 「미완성」이라는 이름이 붙었지요. 슈베르트가 왜 이 곡을 끝내지 않았는지는 지금도 수수께끼로 남아 있습니다. 그는 이 곡의 악보를 친구에게 건넸는데, 그 친구는 어떤 이유에서인지 40년 넘게 악보를 서랍 속에 보관해 두었습니다. 그 결과 이 곡은 슈베르트가 세상을 떠나고 37년이 지난 1865년에야 빈에서 처음 연주되었습니다. 1악장은 첼로와 더블베이스가 어둡고 신비로운 선율을 낮게 읊조리며 시작하고, 이어 첼로가 노래하는 따뜻하고 아름다운 둘째 주제는 슈베르트의 선율 가운데 가장 유명한 것으로 꼽힙니다. 2악장은 평화롭고 고요하며, 깊은 위안을 주는 음악입니다. 비록 두 악장뿐이지만, 많은 사람들은 이 곡이 그 자체로 완벽하다고 말합니다. 스승의 날, 우리 곁에서 미완성인 채로도 소중한 것들을 떠올리며 들어 보세요."], ["5-16", "2대의 피아노를 위한 소나타 K.448", "모차르트", "실내악", "일반", "'모차르트 효과'로 유명한 곡", "모차르트가 1781년, 빈에서 가르치던 제자 요제피네 아우른하머와 함께 연주하기 위해 쓴 두 대의 피아노를 위한 소나타입니다. 아우른하머는 뛰어난 피아니스트였고, 두 사람은 함께 연주회를 열기도 했습니다. 이 곡은 두 대의 피아노가 마치 서로 경쟁하듯, 또 다정하게 대화하듯 주고받는 화려하고 밝은 음악입니다. 한 피아노가 선율을 노래하면 다른 피아노가 그것을 받아 이어 가고, 두 피아노가 함께 힘차게 화음을 울리기도 하지요. 1악장은 당당하고 생기 넘치며, 2악장은 우아하고 서정적인 노래이고, 3악장은 경쾌하게 내달리는 즐거운 피날레입니다. 이 곡은 1993년 미국의 한 연구에서 이 곡을 들은 대학생들이 공간 추리 문제를 더 잘 풀었다는 결과가 발표되면서 '모차르트 효과'라는 말과 함께 세계적으로 유명해졌습니다. 이후 아기에게 모차르트를 들려주면 똑똑해진다는 이야기가 퍼졌지만, 그 효과는 잠깐 동안의 기분 좋은 각성 정도라는 반론도 많습니다. 하지만 효과와 상관없이, 이 곡이 주는 기쁨과 활력만큼은 분명합니다. 두 피아노의 즐거운 대화를 들어 보세요."], ["5-17", "짐노페디 1번", "사티", "독주", "기념일", "사티 탄생일(1866.5.17)", "1866년 5월 17일 프랑스 노르망디의 항구 도시 옹플뢰르에서 태어난 에릭 사티가 1888년, 스물두 살에 쓴 세 곡의 피아노곡 가운데 첫 곡입니다. '짐노페디'는 고대 그리스 스파르타에서 젊은이들이 신들을 기리며 춤을 추던 축제의 이름입니다. 사티는 당시 파리 몽마르트르의 카바레에서 피아니스트로 일하며 가난하게 살았는데, 늘 똑같은 회색 양복을 여러 벌 사서 입고 다니는 등 괴짜로 유명했습니다. 그의 곡에는 '치통을 앓는 나이팅게일처럼' 같은 엉뚱한 연주 지시어가 적혀 있기도 했습니다. 하지만 이 곡은 그런 괴짜 같은 모습과 달리 놀랍도록 고요하고 투명합니다. 왼손이 느리고 일정하게 두 화음을 번갈아 짚는 동안, 오른손이 조용하고 쓸쓸한 선율을 한 음 한 음 천천히 띄워 보냅니다. 화려한 기교나 극적인 변화 없이 단순하게 반복되는 음악이지만, 그 단순함 속에 깊은 평화와 우수가 깃들어 있습니다. 친구 드뷔시는 이 곡의 아름다움에 감동해 관현악으로 편곡하기도 했습니다. 바쁜 하루 중 잠시 멈추어 이 고요한 음악에 몸을 맡겨 보세요."], ["5-18", "교향곡 1번 「거인」", "말러", "관현악", "기념일", "말러 서거일(1911.5.18)", "1911년 5월 18일 빈에서 세상을 떠난 구스타프 말러의 첫 교향곡입니다. 말러는 생전에 작곡가보다는 빈 국립 오페라 극장과 뉴욕 필하모닉을 이끈 위대한 지휘자로 더 유명했습니다. 그는 \"언젠가 나의 시대가 올 것이다\"라고 말했는데, 그 말처럼 그의 교향곡들은 세상을 떠나고 반세기가 지나서야 진가를 인정받았습니다. 1889년 부다페스트에서 초연된 이 교향곡은 처음에는 청중의 이해를 얻지 못했습니다. '거인'이라는 별명은 말러가 좋아하던 독일 작가 장 파울의 소설 제목에서 따온 것인데, 말러는 나중에 이 제목을 지워 버렸습니다. 1악장은 현악기가 아주 높고 희미한 음을 길게 이어 가는 가운데 뻐꾸기 소리와 멀리서 들려오는 나팔 소리가 어우러지며, 새벽에 자연이 깨어나는 모습을 그립니다. 3악장에서는 프랑스의 돌림노래 동요 「자크 형제」의 선율이 단조로 바뀌어 기묘한 장송 행진곡으로 등장합니다. 4악장은 폭풍 같은 투쟁을 지나 승리의 환희로 끝납니다. 말러를 기억하며, 자연과 인간의 거대한 이야기에 귀 기울여 보세요."], ["5-19", "트럼펫 협주곡 E♭장조", "하이든", "협주곡", "일반", "트럼펫 협주곡의 대표곡", "하이든이 1796년 빈의 궁정 트럼펫 연주자 안톤 바이딩어를 위해 쓴 협주곡으로, 하이든이 남긴 마지막 협주곡입니다. 당시의 트럼펫은 지금과 달리 밸브가 없어서, 입술의 힘만으로 몇 개의 정해진 음밖에 낼 수 없었습니다. 그래서 트럼펫은 주로 군대의 신호나 축제의 팡파르를 울리는 역할에 머물렀지요. 그런데 바이딩어는 몸통에 구멍을 뚫고 키를 달아, 모든 음을 낼 수 있는 새로운 트럼펫을 만들어 냈습니다. 하이든은 이 새 악기의 가능성을 보여 주기 위해, 트럼펫이 아름다운 선율을 노래하고 낮은 음역에서도 자유롭게 움직이는 협주곡을 썼습니다. 1악장은 당당하고 화려하며, 2악장은 트럼펫이 부드럽고 서정적인 노래를 들려주는 고요한 악장입니다. 3악장은 경쾌하고 재치 넘치는 론도로, 트럼펫의 화려한 기교가 돋보입니다. 하지만 바이딩어의 키 트럼펫은 이후 밸브 트럼펫이 등장하면서 사라졌고, 이 협주곡도 한동안 잊혔다가 20세기에 들어 다시 사랑받게 되었습니다. 지금은 트럼펫 협주곡 가운데 가장 유명한 곡입니다. 5월의 밝은 햇살처럼 빛나는 트럼펫 소리를 즐겨 보세요."], ["5-20", "아름다운 로즈마린", "크라이슬러", "독주", "봄", "장미의 계절", "크라이슬러의 「옛 빈 무곡」 세 곡 가운데 마지막 곡입니다. 2월에 들었던 「사랑의 기쁨」, 「사랑의 슬픔」과 함께 크라이슬러가 처음에는 옛 작곡가의 작품을 편곡한 것이라고 소개했다가, 훗날 자신이 직접 쓴 곡이라고 밝혀 화제가 되었던 곡이지요. '로즈마린'은 향긋한 허브인 로즈메리를 뜻하는 독일어로, 빈에서는 사랑스럽고 싱그러운 아가씨를 부르는 말로도 쓰였다고 합니다. 「사랑의 기쁨」이 가슴 벅찬 설렘이고 「사랑의 슬픔」이 아련한 그리움이라면, 「아름다운 로즈마린」은 수줍고 귀여운 첫사랑의 미소 같은 곡입니다. 2분 남짓한 짧은 곡으로, 바이올린이 경쾌하고 가볍게 통통 튀는 왈츠 리듬 위에서 사랑스럽고 우아한 선율을 노래합니다. 활을 살짝 튕기듯 연주하는 부분과 부드럽게 미끄러지는 부분이 번갈아 나타나며 장난스러운 매력을 더하지요. 크라이슬러는 이 곡을 앙코르로 즐겨 연주했고, 지금도 바이올리니스트들이 연주회를 마무리하는 사랑스러운 앙코르 곡으로 자주 선택합니다. 장미가 피어나기 시작하는 5월, 향긋한 허브 향기를 떠올리며 들어 보세요."], ["5-21", "현악6중주 1번 B♭장조 Op.18", "브람스", "실내악", "봄", "청춘의 실내악", "브람스가 스물일곱 살이던 1860년에 완성한 현악 6중주곡입니다. 바이올린 둘, 비올라 둘, 첼로 둘로 이루어진 6중주는 현악 4중주보다 악기가 많아 소리가 더 풍성하고 따뜻합니다. 젊은 브람스는 베토벤이라는 거대한 산이 버티고 있는 현악 4중주를 쓰는 것을 오랫동안 두려워했는데, 그 대신 베토벤이 남기지 않은 6중주라는 편성으로 먼저 실내악의 길을 열었다고 볼 수 있습니다. 이 곡에는 젊은 브람스의 싱그럽고 넉넉한 서정이 가득합니다. 1악장은 첼로가 따뜻하고 여유로운 선율을 노래하며 시작해, 마치 봄날 들판을 거니는 듯한 평화로움을 줍니다. 이 곡에서 가장 유명한 2악장은 엄숙하고 비장한 주제로 시작하는 변주곡으로, 프랑스 영화 「연인들」에 쓰여 널리 알려졌습니다. 3악장은 활기찬 스케르초이고, 4악장은 우아하고 따뜻한 론도로 마무리됩니다. 브람스는 이 곡의 2악장을 피아노곡으로 편곡해 평생 존경하고 사랑했던 클라라 슈만에게 생일 선물로 보내기도 했습니다. 푸르름이 짙어지는 5월, 젊은 브람스의 풍성한 노래를 들어 보세요."], ["5-22", "지크프리트 목가", "바그너", "관현악", "기념일", "바그너 탄생일(1813.5.22). 아내 생일 선물로 쓴 기악곡", "1813년 5월 22일 독일 라이프치히에서 태어난 리하르트 바그너의 관현악곡입니다. 바그너는 장대한 오페라로 음악사를 바꾼 작곡가인데, 이 곡은 그가 남긴 몇 안 되는 순수 기악곡 가운데 가장 사랑받는 곡입니다. 1869년 바그너와 아내 코지마 사이에 아들 지크프리트가 태어났습니다. 이듬해 크리스마스 아침, 코지마의 생일을 맞아 바그너는 아내 몰래 열다섯 명 남짓의 연주자들을 스위스 루체른 호숫가의 집으로 불러 계단에 세우고, 잠에서 깬 아내에게 이 곡을 깜짝 선물로 들려주었습니다. 코지마는 그 아침을 일기에 감동적으로 기록했습니다. 그래서 이 곡은 원래 '트립셴 목가'라고 불렸는데, 트립셴은 그들이 살던 집이 있던 곳의 이름입니다. 곡은 현악기의 부드럽고 따뜻한 선율로 시작해, 플루트와 클라리넷, 호른이 차례로 더해지며 평화롭고 사랑이 가득한 가정의 풍경을 그려 냅니다. 중간에는 독일의 오래된 자장가 선율도 들립니다. 원래는 가족만을 위한 곡이었지만, 생활고 때문에 결국 출판하게 되었다고 합니다. 사랑하는 가족을 위한 선물 같은 음악을 들어 보세요."], ["5-23", "전설 Op.17", "비에니아프스키", "독주", "일반", "바이올린 낭만 소품", "폴란드의 바이올리니스트이자 작곡가 헨리크 비에니아프스키가 1860년 무렵 쓴 바이올린곡입니다. 비에니아프스키는 여덟 살에 파리 음악원에 입학한 신동으로, 파가니니 이후 가장 뛰어난 바이올리니스트 가운데 한 명으로 꼽혔습니다. 그는 러시아 황제의 궁정 바이올리니스트로 일하기도 했으며, 바이올린의 기교를 한층 발전시킨 작품들을 많이 남겼습니다. 이 곡에는 낭만적인 일화가 전해집니다. 젊은 비에니아프스키는 영국 출신의 이자벨라라는 아가씨와 사랑에 빠졌는데, 그녀의 부모는 떠돌이 음악가에게 딸을 줄 수 없다며 결혼을 반대했습니다. 그때 비에니아프스키가 이 곡을 작곡해 연주하자, 그 아름다움에 감동한 부모가 마침내 결혼을 허락했다는 이야기입니다. 곡은 관현악이나 피아노의 어둡고 신비로운 서주로 시작해, 바이올린이 옛이야기를 들려주듯 애수 어린 선율을 노래합니다. 가운데 부분에서는 격정적인 겹음으로 극적인 감정이 고조되었다가, 다시 처음의 고요한 선율로 돌아와 아련하게 마무리됩니다. 사랑을 이루어 준 전설의 노래를 들어 보세요."], ["5-24", "왈츠 「강아지」 Op.64-1", "쇼팽", "독주", "일반", "자기 꼬리를 쫓는 강아지", "쇼팽이 1846년부터 이듬해 사이에 쓴 왈츠로, 그의 왈츠 가운데 가장 유명한 곡입니다. 영어권에서는 흔히 「1분 왈츠」로 불리는데, 여기서 '미닛'은 '1분'이 아니라 '작은'이라는 뜻입니다. 이 말을 '1분'으로 잘못 이해한 사람들이 1분 안에 이 곡을 치려고 애쓰기도 했지만, 실제 연주 시간은 1분 30초에서 2분 정도입니다. 이 곡에는 「강아지 왈츠」라는 귀여운 별명도 붙어 있습니다. 쇼팽의 연인이었던 작가 조르주 상드가 기르던 강아지가 자기 꼬리를 쫓아 빙글빙글 도는 모습을 보고 쇼팽이 이 곡을 썼다는 이야기가 전해지기 때문입니다. 실제로 오른손이 같은 음형을 빙글빙글 돌며 빠르게 반복하는 모습은 꼬리를 잡으려 제자리를 맴도는 강아지를 떠올리게 합니다. 가운데 부분에서는 속도를 늦추고 부드럽고 우아한 선율이 흐르다가, 다시 처음의 빙글빙글 도는 선율로 돌아와 경쾌하게 끝납니다. 이 무렵 쇼팽은 상드와의 관계가 끝나 가고 건강도 나빠지고 있었지만, 이 곡에는 밝은 장난기가 가득합니다. 강아지의 장난을 상상하며 들어 보세요."], ["5-25", "첼로 협주곡 b단조 Op.104", "드보르자크", "협주곡", "일반", "첼로 협주곡의 왕", "드보르자크가 미국 뉴욕 국립음악원의 원장으로 일하던 1894년부터 이듬해 사이에 쓴 첼로 협주곡입니다. 당시 첼로는 소리가 낮고 둔해서 오케스트라와 맞서는 협주곡의 독주 악기로는 적합하지 않다고 여겨졌는데, 드보르자크는 이 곡으로 그 생각을 완전히 바꾸어 놓았습니다. 이 곡의 악보를 본 브람스는 \"첼로로 이런 협주곡을 쓸 수 있다는 걸 알았더라면 내가 진작 썼을 텐데\"라며 감탄했다고 합니다. 작곡 도중 드보르자크는 젊은 시절 사랑했던 처형 요제피나가 위독하다는 소식을 들었습니다. 그는 2악장에 그녀가 좋아하던 자신의 가곡 선율을 넣었고, 귀국 후 그녀가 세상을 떠나자 마지막 악장의 끝부분을 고쳐, 그 선율을 다시 회상하듯 조용히 떠올리게 했습니다. 1악장은 클라리넷의 어두운 선율로 시작해 첼로가 웅장하고 당당하게 등장하며, 2악장은 고향을 향한 그리움과 애틋함이 가득합니다. 3악장은 보헤미아의 흥겨운 춤곡으로 힘차게 시작해, 깊은 회상을 지나 장엄하게 마무리됩니다. '첼로 협주곡의 왕'이라 불리는 이 곡의 깊은 울림을 느껴 보세요."], ["5-26", "피아노 3중주 「대공」 Op.97", "베토벤", "실내악", "일반", "피아노 3중주의 정점", "베토벤이 1811년에 작곡해, 그의 제자이자 가장 든든한 후원자였던 오스트리아의 루돌프 대공에게 헌정한 피아노 3중주곡입니다. 그래서 「대공」이라는 별명이 붙었지요. 루돌프 대공은 황제의 동생으로, 베토벤에게 평생 연금을 지원하며 그가 빈에 머물 수 있도록 도왔습니다. 피아노, 바이올린, 첼로가 함께 연주하는 이 곡은 피아노 3중주 가운데 최고의 걸작으로 꼽힙니다. 1814년 이 곡이 공개적으로 연주될 때 베토벤이 직접 피아노를 쳤는데, 이것이 그가 피아니스트로서 대중 앞에 선 마지막 무대 가운데 하나였습니다. 그 자리에 있던 한 음악가는 거의 들리지 않는 베토벤이 너무 세게, 또 너무 약하게 연주해 안타까웠다고 기록했습니다. 1악장은 피아노가 넉넉하고 고귀한 선율을 노래하며 시작하고, 2악장은 경쾌한 스케르초입니다. 3악장은 찬송가처럼 경건하고 아름다운 주제와 변주로 이루어진 느린 악장으로, 이 곡의 깊은 중심입니다. 4악장은 쾌활하게 마무리됩니다. 무라카미 하루키의 소설 「해변의 카프카」에도 등장하는 이 곡의 품격 있는 아름다움을 느껴 보세요."], ["5-27", "방랑자 환상곡 D.760", "슈베르트", "독주", "일반", "여행의 계절", "슈베르트가 1822년에 쓴 피아노곡으로, 그가 남긴 피아노 독주곡 가운데 가장 어렵고 규모가 큰 곡입니다. '방랑자'라는 이름은 곡의 두 번째 부분이 슈베르트 자신의 가곡 「방랑자」의 선율을 바탕으로 하고 있어서 붙었습니다. 이 가곡은 고향을 떠나 떠도는 나그네가 \"내가 없는 그곳에 행복이 있다\"며 쓸쓸히 노래하는 곡이지요. 이 곡은 네 부분이 쉬지 않고 이어지는데, 하나의 리듬과 주제가 모습을 바꾸어 가며 곡 전체를 꿰뚫고 있습니다. 첫 부분은 힘차고 당당한 리듬으로 시작하고, 둘째 부분은 가곡의 선율이 깊고 쓸쓸하게 변주되며, 셋째 부분은 경쾌한 춤곡이 되고, 마지막 부분은 그 주제가 장엄한 푸가로 발전해 웅장하게 끝을 맺습니다. 이렇게 하나의 주제를 변형해 전체를 하나로 묶는 방식은 훗날 리스트에게 큰 영향을 주었고, 리스트는 이 곡을 피아노와 관현악을 위해 편곡하기도 했습니다. 슈베르트 자신도 이 곡을 끝까지 연주하지 못하고 \"이런 곡은 악마나 치라지!\"라며 자리에서 일어났다는 이야기가 전해집니다. 길 위의 나그네가 되어 들어 보세요."], ["5-28", "무지카 리체르카타", "리게티", "독주", "기념일", "리게티 탄생일(1923.5.28)", "1923년 5월 28일 지금의 루마니아 트란실바니아 지방에서 태어난 헝가리 출신의 작곡가 죄르지 리게티의 피아노곡입니다. 리게티는 공산 정권 아래의 헝가리에서 새로운 음악을 자유롭게 발표할 수 없었는데, 그런 시절인 1951년부터 1953년 사이에 이 곡을 썼습니다. 열한 곡으로 이루어진 이 작품에는 재미있는 규칙이 숨어 있습니다. 첫 곡은 단 두 개의 음만으로, 둘째 곡은 세 개의 음으로, 셋째 곡은 네 개의 음으로 쓰여, 곡이 하나씩 진행될 때마다 사용하는 음이 하나씩 늘어나고, 마지막 열한 번째 곡에서는 마침내 열두 개의 음을 모두 사용합니다. 이렇게 제한된 재료로 얼마나 다양하고 개성 있는 음악을 만들 수 있는지 탐구한 것이지요. 그중 두 번째 곡은 단 세 음만으로 섬뜩한 긴장감을 자아내는데, 스탠리 큐브릭 감독의 영화 「아이즈 와이드 셧」에 쓰여 널리 알려졌습니다. 리게티는 1956년 헝가리를 탈출해 서유럽에서 활동하며, 영화 「2001 스페이스 오디세이」에 쓰인 신비로운 음악으로도 유명해졌습니다. 적은 음으로 만든 놀라운 세계를 만나 보세요."], ["5-29", "봄의 제전", "스트라빈스키", "관현악", "봄", "초연일(1913.5.29, 파리). 표제가 봄", "1913년 5월 29일 파리의 샹젤리제 극장에서 초연된 스트라빈스키의 발레 음악입니다. 이날의 초연은 음악사에서 가장 유명한 소동으로 기억됩니다. 곡이 시작되자마자 청중석에서는 웃음과 야유, 고함이 터져 나왔고, 찬성하는 사람과 반대하는 사람들이 서로 다투면서 극장은 아수라장이 되었습니다. 그 소란이 너무 커서 무용수들이 음악을 제대로 들을 수 없을 정도였다고 합니다. 「봄의 제전」은 고대 러시아의 이교도 부족이 봄을 맞아 대지의 신에게 제사를 올리고, 마지막에 선택된 한 소녀가 죽을 때까지 춤을 추며 제물이 되는 이야기입니다. 곡은 바순이 아주 높은 음역에서 낯설고 신비로운 선율을 연주하며 시작하는데, 마치 얼어붙은 땅에서 생명이 꿈틀대며 깨어나는 듯합니다. 이후 귀를 때리는 듯한 불협화음과 예측할 수 없이 바뀌는 강렬한 리듬이 쉴 새 없이 몰아치며, 원초적이고 거대한 자연의 힘을 생생하게 드러냅니다. 초연 때의 충격과 달리, 이 곡은 지금은 20세기 음악의 문을 연 최고의 걸작으로 평가받습니다. 봄의 원초적인 생명력을 온몸으로 느껴 보세요."], ["5-30", "아스투리아스(스페인 모음곡 중)", "알베니스", "독주", "기념일", "알베니스 탄생 주간(1860.5.29). 기타 편곡판도 유명", "1860년 5월 29일 스페인 카탈루냐 지방에서 태어난 작곡가이자 피아니스트 이사크 알베니스의 피아노곡입니다. 알베니스는 네 살에 무대에 선 신동이었고, 어린 시절 여러 번 집을 뛰쳐나가 아메리카 대륙까지 떠돌며 연주했다는 모험담으로도 유명합니다. 이 곡은 그가 쓴 「스페인 모음곡」에 실린 곡으로, 원래는 '전설'이라는 제목이었습니다. '아스투리아스'라는 이름은 알베니스가 세상을 떠난 뒤 출판사가 붙인 것인데, 아스투리아스는 스페인 북부 지방의 이름이지만, 정작 음악은 남부 안달루시아 지방의 플라멩코 분위기를 담고 있습니다. 곡은 기타 줄을 빠르게 튕기는 듯한 음이 끊임없이 반복되는 가운데, 낮은 음역에서 강렬하고 열정적인 선율이 울리며 시작합니다. 가운데 부분에서는 플라멩코 가수의 노래처럼 애절하고 자유로운 선율이 흐르다가, 다시 처음의 정열적인 분위기로 돌아옵니다. 이 곡은 스페인의 기타 거장 세고비아 등이 기타로 편곡해 연주하면서, 원래 기타곡이라고 착각할 만큼 기타 음악의 대표곡이 되었습니다. 피아노와 기타로 번갈아 들으며 비교해 보세요."], ["5-31", "교향곡 101번 「시계」", "하이든", "관현악", "기념일", "하이든 서거일(1809.5.31)", "1809년 5월 31일 빈에서 세상을 떠난 하이든이 1794년, 두 번째 런던 방문 때 쓴 교향곡입니다. 「시계」라는 별명은 2악장에서 비롯되었습니다. 2악장에서는 바순과 현악기의 피치카토가 '똑딱똑딱' 하고 규칙적으로 반복되는 반주를 이어 가는데, 그 모습이 마치 시계추가 흔들리는 소리처럼 들립니다. 그 위로 바이올린이 우아하고 사랑스러운 선율을 노래하지요. 이 별명도 하이든이 직접 붙인 것은 아니지만, 한 번 들으면 누구나 고개를 끄덕일 만큼 잘 어울립니다. 1악장은 어둡고 신비로운 서주를 지나 경쾌하고 활기차게 펼쳐지고, 3악장은 당당하고 흥겨운 미뉴에트, 4악장은 재치와 활력이 넘치는 피날레입니다. 하이든이 세상을 떠날 무렵 빈은 나폴레옹의 군대에 점령되어 있었습니다. 그런데 나폴레옹은 존경받는 노작곡가의 집 앞에 경비병을 세워 그를 보호하도록 했고, 한 프랑스 장교는 병상의 하이든을 찾아와 그의 작품 가운데 한 곡을 노래해 위로했다고 합니다. 평생 수많은 교향곡으로 사람들에게 기쁨을 준 하이든을 기억하며, 그의 시계가 들려주는 정겨운 소리에 귀 기울여 보세요."], ["6-1", "홀베르크 모음곡 Op.40", "그리그", "관현악", "여름", "초여름의 상쾌한 현악곡", "그리그가 1884년, 같은 고향 베르겐 출신의 극작가 루드비 홀베르크의 탄생 200주년을 기념해 쓴 모음곡입니다. 홀베르크는 18세기 노르웨이와 덴마크에서 활동하며 '북유럽의 몰리에르'라 불린 희극 작가였습니다. 그리그는 홀베르크가 살았던 바로크 시대의 춤곡 형식을 빌려 이 곡을 썼는데, 그래서 원래 제목도 「홀베르크 시대에서」입니다. 처음에는 피아노곡으로 썼다가 이듬해 현악 합주곡으로 편곡했고, 지금은 현악 합주판이 훨씬 자주 연주됩니다. 곡은 다섯 곡으로 이루어져 있습니다. 첫 곡 「전주곡」은 현악기들이 상쾌하게 물결치는 리듬 위로 첼로와 비올라가 힘찬 선율을 노래하며 시작하는데, 마치 초여름 북유럽의 맑은 바람이 불어오는 듯합니다. 이어서 우아한 「사라반드」, 경쾌한 「가보트」, 깊은 슬픔이 담긴 「아리아」, 그리고 독주 바이올린과 비올라가 흥겹게 대화하는 「리고동」으로 마무리됩니다. 옛 형식에 그리그 특유의 북유럽 서정이 더해진 곡입니다. 6월의 첫날, 상쾌한 바람과 함께 들어 보세요."], ["6-2", "수수께끼 변주곡 Op.36", "엘가", "관현악", "기념일", "엘가 탄생일(1857.6.2)", "1857년 6월 2일 영국에서 태어난 엘가를 일약 영국 최고의 작곡가로 만든 관현악곡입니다. 1898년 어느 저녁, 지친 엘가가 피아노 앞에 앉아 무심코 선율 하나를 치자 아내 앨리스가 \"그 곡 좋네요\"라고 말했습니다. 엘가는 그 선율을 이 친구라면 이렇게 쳤을 것이라며 친구들의 버릇과 성격을 흉내 내어 장난스럽게 변주해 보였고, 그렇게 이 곡이 탄생했습니다. 그래서 열네 개의 변주에는 아내, 친구들, 그리고 엘가 자신이 한 사람씩 담겨 있습니다. 가장 유명한 아홉 번째 변주 「님로드」는 엘가의 출판업자이자 가장 친한 친구였던 예거를 그린 것으로, 깊고 고귀한 선율이 장엄하게 펼쳐집니다. 영국에서는 이 변주를 국가적인 추모식에서 자주 연주합니다. '수수께끼'라는 제목은 엘가가 이 곡의 주제와 함께 울리는 보이지 않는 또 다른 선율이 있다고 말하고는 끝내 정답을 밝히지 않았기 때문에 붙었습니다. 지금도 많은 사람들이 그 수수께끼를 풀려고 애쓰고 있지요. 친구들을 향한 엘가의 따뜻한 마음을 느껴 보세요."], ["6-3", "「아를의 여인」 모음곡 2번", "비제", "관현악", "여름", "남프랑스 프로방스의 여름", "오페라 「카르멘」의 작곡가 비제가 1872년, 프랑스 작가 알퐁스 도데의 연극 「아를의 여인」을 위해 쓴 극음악에서 나온 모음곡입니다. 연극은 남프랑스 프로방스 지방을 배경으로, 아를에서 만난 여인을 사랑하게 된 시골 청년이 결국 비극적인 결말을 맞는 이야기입니다. 연극은 흥행에 실패했지만 비제의 음악은 크게 사랑받았습니다. 비제는 직접 첫 번째 모음곡을 만들었고, 그가 세상을 떠난 뒤 친구 기로가 두 번째 모음곡을 엮었습니다. 2번 모음곡은 네 곡으로 이루어져 있습니다. 「파스토랄」은 프로방스 들판의 목가적인 풍경을, 「간주곡」은 장엄하고 경건한 노래를 들려줍니다. 「미뉴에트」에서는 플루트가 하프의 반주 위에서 맑고 아름다운 선율을 노래하는데, 이 곡은 플루트 독주곡으로도 무척 유명합니다. 마지막 곡 「파랑돌」은 프로방스의 전통 민속춤으로, 장엄한 행진곡 선율과 북소리에 맞춰 빠르게 내달리는 춤 선율이 하나로 어우러지며 열광적으로 끝을 맺습니다. 남프랑스의 뜨거운 햇살과 라벤더 들판을 떠올리며 들어 보세요."], ["6-4", "아르페지오네 소나타 D.821", "슈베르트", "실내악", "일반", "첼로 레퍼토리 명곡", "슈베르트가 1824년에 쓴 곡으로, 지금은 사라진 악기를 위한 소나타입니다. '아르페조네'는 1823년 빈의 악기 제작자가 새로 발명한 악기로, 기타처럼 여섯 줄과 지판의 칸막이를 가지고 있지만 첼로처럼 무릎 사이에 세우고 활로 켜서 연주했습니다. '활로 켜는 기타'라고도 불렸지요. 그러나 이 악기는 큰 인기를 얻지 못하고 불과 몇 년 만에 잊혔고, 슈베르트의 이 소나타만이 그 이름을 오늘날까지 전하고 있습니다. 지금은 주로 첼로나 비올라가 피아노와 함께 이 곡을 연주합니다. 슈베르트는 이 무렵 병으로 건강이 나빠지고 깊은 우울에 빠져 있었는데, 그런 마음 때문인지 곡 전체에 아련한 슬픔과 서정이 흐릅니다. 1악장은 피아노의 쓸쓸한 서주에 이어 첼로가 애수 어린 선율을 노래하며 시작합니다. 2악장은 짧지만 깊은 노래이며, 쉬지 않고 3악장으로 이어져 소박하고 따뜻한 춤곡으로 마무리됩니다. 사라진 악기를 위해 쓰였지만 그 아름다움만은 영원히 남은 곡입니다. 슈베르트의 노래하는 선율에 귀 기울여 보세요."], ["6-5", "녹턴 20번 c#단조(유작)", "쇼팽", "독주", "추모", "현충일 전날, 영화 「피아니스트」의 곡", "쇼팽이 스무 살이던 1830년, 피아노를 공부하던 누나 루드비카를 위해 쓴 녹턴입니다. 원래 제목은 '깊은 표현을 담아 느리게'라는 뜻의 연주 지시어였고, 쇼팽이 세상을 떠나고 26년이 지난 1875년에야 출판되어 '유작'이라는 이름이 붙었습니다. 곡은 조용하고 쓸쓸한 서주에 이어, 오른손이 깊은 슬픔을 머금은 선율을 천천히 노래하며 시작합니다. 가운데 부분에서는 쇼팽 자신의 피아노 협주곡 2번의 선율이 잠시 회상되듯 나타났다가, 다시 처음의 애절한 선율로 돌아와 고요히 사라집니다. 이 곡은 2002년 영화 「피아니스트」의 첫 장면에서 연주되어 널리 알려졌습니다. 영화의 실제 주인공인 폴란드의 피아니스트 슈필만은 1939년 바르샤바 라디오 방송국에서 이 곡을 생방송으로 연주하던 중 독일군의 폭격을 맞았고, 그것이 전쟁 전 폴란드 라디오의 마지막 방송이 되었습니다. 그리고 전쟁이 끝나고 방송이 다시 시작될 때 그가 연주한 첫 곡도 바로 이 곡이었다고 합니다. 현충일을 하루 앞두고, 전쟁의 아픔을 기억하며 들어 보세요."], ["6-6", "현을 위한 아다지오 Op.11", "바버", "관현악", "추모", "현충일 추모곡", "미국의 작곡가 새뮤얼 바버가 1936년에 쓴 현악 4중주곡의 2악장을, 현악 합주를 위해 편곡한 곡입니다. 1938년 지휘자 토스카니니가 이 곡을 라디오 방송으로 초연하면서 단숨에 미국 전역에 알려졌습니다. 곡은 아주 느리고 조용하게, 한 음 한 음 천천히 오르내리는 선율로 시작합니다. 이 선율은 여러 악기로 옮겨 가며 조금씩 높아지고 강해지다가, 마침내 가장 높은 음역에서 가슴을 찢는 듯한 클라이맥스에 이릅니다. 그리고 갑작스러운 침묵 뒤에 다시 처음의 고요한 선율로 돌아와 조용히 사라집니다. 이 곡은 미국의 루스벨트 대통령과 케네디 대통령의 서거 소식을 전하는 방송에서 연주되었고, 2001년 9·11 테러 희생자 추모식에서도 연주되는 등 슬픔과 애도의 순간마다 함께해 왔습니다. 영국의 한 방송사가 실시한 조사에서는 '세상에서 가장 슬픈 클래식 음악' 1위로 뽑히기도 했습니다. 오늘은 나라를 위해 목숨을 바친 이들을 기리는 현충일입니다. 고요한 마음으로 그분들을 추모하며 들어 보세요."], ["6-7", "「가면무도회」 모음곡 중 왈츠", "하차투리안", "관현악", "기념일", "하차투리안 탄생 주간(1903.6.6)", "1903년 6월 6일 조지아의 트빌리시에서 아르메니아계 가정에 태어난 소련의 작곡가 아람 하차투리안의 작품입니다. 하차투리안은 아르메니아와 캅카스 지방의 민속 음악을 바탕으로 강렬하고 화려한 음악을 썼으며, 발레 「가야네」에 나오는 「칼의 춤」으로 특히 유명합니다. 이 곡은 1941년 러시아 시인 레르몬토프의 희곡 「가면무도회」를 무대에 올리기 위해 쓴 극음악에서 나왔습니다. 희곡은 질투에 사로잡힌 남편이 가면무도회에서 아내가 잃어버린 팔찌 때문에 그녀의 부정을 의심하고, 결국 아내를 독살하는 비극입니다. 하차투리안은 이 극음악에서 다섯 곡을 골라 관현악 모음곡을 만들었는데, 그중 첫 곡인 「왈츠」가 가장 사랑받고 있습니다. 화려하게 빙글빙글 돌아가는 왈츠이지만, 그 속에는 어딘가 불길하고 어두운 그림자가 드리워져 있어 다가올 비극을 예고하는 듯합니다. 우아함과 긴장감, 그리고 소용돌이치는 열정이 함께 담긴 이 곡은 피겨스케이팅 선수들의 배경음악으로도 자주 쓰여 많은 사람에게 친숙합니다. 가면 뒤에 숨은 드라마를 상상하며 들어 보세요."], ["6-8", "피아노 협주곡 a단조 Op.54", "슈만", "협주곡", "기념일", "슈만 탄생일(1810.6.8)", "1810년 6월 8일 독일 츠비카우에서 태어난 슈만이 남긴 단 하나의 피아노 협주곡입니다. 슈만은 1841년, 아내 클라라를 위해 먼저 '피아노와 관현악을 위한 환상곡'이라는 한 악장짜리 곡을 썼고, 4년 뒤 두 악장을 더해 지금의 협주곡을 완성했습니다. 클라라는 당대 최고의 피아니스트였고, 이 곡의 초연도 클라라가 맡았습니다. 곡은 오케스트라의 강렬한 화음에 이어 피아노가 힘차게 화음을 쏟아 내며 시작하고, 곧바로 오보에가 애틋하고 부드러운 주제를 노래합니다. 이 주제는 1악장 전체를 이끄는 중심 선율로, 슬픔과 동경, 열정이 교차하며 다양한 모습으로 변신합니다. 2악장은 피아노와 오케스트라가 다정하게 대화를 나누는 짧고 사랑스러운 간주곡이고, 쉬지 않고 이어지는 3악장은 밝고 생기 넘치는 피날레입니다. 이 협주곡은 화려한 기교를 뽐내기보다는 피아노와 오케스트라가 함께 시처럼 노래하는 데 중점을 둔 곡이어서, 낭만주의 협주곡의 새로운 모범이 되었습니다. 훗날 그리그는 이 곡을 본받아 같은 조성으로 자신의 협주곡을 썼습니다. 슈만의 생일, 사랑이 담긴 협주곡을 들어 보세요."], ["6-9", "현을 위한 작은 모음곡 Op.1", "닐센", "관현악", "기념일", "닐센 탄생일(1865.6.9)", "1865년 6월 9일 덴마크 퓐섬의 가난한 시골 마을에서 태어난 카를 닐센의 첫 작품입니다. 닐센은 어린 시절 군악대에서 나팔을 불며 음악을 시작했고, 이후 코펜하겐 음악원에서 공부한 뒤 궁정 관현악단의 바이올리니스트로 일했습니다. 그는 여섯 곡의 교향곡과 오페라, 그리고 덴마크 사람이라면 누구나 아는 수많은 노래를 남겨 덴마크의 국민 작곡가로 사랑받고 있습니다. 이 곡은 닐센이 스물세 살이던 1888년에 코펜하겐의 놀이공원 티볼리 공원의 연주회에서 초연되었는데, 닐센은 자신의 곡이 연주되는 동안 오케스트라의 제2바이올린 자리에 앉아 함께 연주했다고 합니다. 연주가 끝나고 박수가 쏟아지자 동료 연주자들이 그를 앞으로 밀어 인사하게 했다는 이야기도 전해집니다. 곡은 세 악장으로 이루어져 있으며, 차분하고 서정적인 전주곡, 우아하게 흔들리는 왈츠풍의 간주곡, 그리고 활기차고 힘찬 피날레로 이어집니다. 젊은 작곡가의 풋풋함과 북유럽의 서정이 담긴 곡입니다. 닐센의 생일을 축하하며 들어 보세요."], ["6-10", "사계 Op.37 중 「6월: 뱃노래」", "차이콥스키", "독주", "계절 표제", "표제 자체가 6월", "차이콥스키의 피아노 모음곡 「사계」 가운데 6월의 곡입니다. 「사계」에서 가장 유명한 곡 가운데 하나로, 이 곡에는 시인 플레시체예프의 시에서 따온 구절이 붙어 있습니다. 강가로 나가자, 파도가 우리 발을 적시고, 신비로운 슬픔을 머금은 별들이 우리를 비추리라는 내용입니다. 이 곡은 '뱃노래'라는 뜻의 '바르카롤'로, 원래는 이탈리아 베네치아의 곤돌라 사공들이 노를 저으며 부르던 노래에서 유래했습니다. 그래서 배가 물결 위에서 부드럽게 흔들리는 듯한 리듬이 특징입니다. 곡은 단조의 애수 어린 선율로 시작하는데, 초여름 저녁 별빛이 반짝이는 강물 위에 작은 배를 띄우고 천천히 노를 젓는 모습이 그려집니다. 가운데 부분에서는 장조로 바뀌어 조금 더 밝고 생기 있는 분위기로 흐르다가, 다시 처음의 그윽하고 쓸쓸한 선율로 돌아와 조용히 마무리됩니다. 러시아 사람들 특유의 우수와 서정이 이 곡에 가득 담겨 있습니다. 초여름 저녁, 강가에 앉아 물결 소리를 들으며 별을 바라보는 마음으로 이 곡을 들어 보세요."], ["6-11", "교향시 「돈 후안」 Op.20", "R. 슈트라우스", "관현악", "기념일", "R. 슈트라우스 탄생일(1864.6.11)", "1864년 6월 11일 독일 뮌헨에서 태어난 리하르트 슈트라우스가 스물네 살에 쓴 교향시입니다. 1889년 바이마르에서 초연된 이 곡은 큰 성공을 거두어, 젊은 슈트라우스를 단숨에 독일 음악계의 새로운 별로 떠오르게 했습니다. 교향시는 문학이나 그림 같은 음악 밖의 이야기를 한 악장의 관현악곡으로 그려 낸 음악을 말합니다. 이 곡은 오스트리아 시인 레나우가 쓴 시 「돈 후안」을 바탕으로 합니다. 돈 후안은 스페인의 전설 속 인물로, 수많은 여인을 유혹한 바람둥이입니다. 하지만 레나우의 시에서 그는 완벽한 이상형을 찾아 헤매지만 끝내 찾지 못하고 허무에 빠져 결투에서 스스로 죽음을 받아들이는 비극적인 인물입니다. 곡은 현악기가 폭발하듯 솟구치는 힘찬 주제로 시작하며, 이어 여러 여인과의 사랑을 그린 감미로운 장면들이 펼쳐집니다. 특히 오보에가 노래하는 사랑의 장면과, 호른이 웅장하게 울리는 영웅적인 주제가 유명합니다. 그리고 마지막에는 갑작스러운 침묵 뒤에 쓸쓸한 죽음이 찾아옵니다. 젊은 천재가 그린 열정과 허무의 드라마를 느껴 보세요."], ["6-12", "「핑갈의 동굴」(헤브리디스) 서곡 Op.26", "멘델스존", "관현악", "여름", "여름 여행에서 영감 받은 바다 풍경", "멘델스존이 스무 살이던 1829년 여름, 스코틀랜드를 여행한 뒤 쓴 연주회용 서곡입니다. 그는 스코틀랜드 서쪽 바다에 흩어져 있는 헤브리디스 제도를 배를 타고 돌아보았는데, 그중 스태파섬에 있는 거대한 바다 동굴 '핑갈의 동굴'을 보고 깊은 감명을 받았습니다. 이 동굴은 육각형의 검은 현무암 기둥들이 늘어서 있고, 파도가 동굴 안으로 밀려들며 신비로운 소리를 울리는 곳입니다. 멘델스존은 그날 저녁 누나에게 보낸 편지에 \"내가 얼마나 감동했는지 알려 주려고\"라며 이 곡의 첫머리 선율을 악보로 적어 보냈습니다. 정작 그날 그는 심한 배멀미로 고생했다고 합니다. 곡은 낮은 현악기가 일렁이는 파도처럼 물결치는 가운데, 쓸쓸하고 신비로운 선율이 반복되며 시작합니다. 이어 첼로와 파곳이 넓은 바다처럼 넉넉하고 아름다운 선율을 노래하고, 바다는 때로는 잔잔하게, 때로는 거센 폭풍처럼 몰아치며 다양한 얼굴을 보여 줍니다. 바그너는 멘델스존을 두고 '일급 풍경화가'라고 칭찬했는데, 이 곡은 그 말을 가장 잘 보여 줍니다. 여름 바다로 떠나는 여행을 꿈꾸며 들어 보세요."], ["6-13", "교향적 스케치 「바다」", "드뷔시", "관현악", "여름", "여름 바다", "드뷔시가 1903년부터 1905년 사이에 쓴 관현악곡으로, 그의 가장 위대한 관현악 작품으로 꼽힙니다. 드뷔시는 어린 시절 선원이 되기를 꿈꿀 만큼 바다를 사랑했는데, 정작 이 곡의 대부분은 바다에서 멀리 떨어진 프랑스 내륙 부르고뉴 지방에서 썼습니다. 그는 \"바다를 직접 보는 것보다 기억 속의 바다가 더 진실할 때가 있다\"는 취지의 말을 남겼다고 합니다. 이 곡의 악보 초판 표지에는 일본 화가 호쿠사이의 판화 「가나가와 해변의 높은 파도 아래」가 실려 있었습니다. 곡은 세 부분으로 이루어져 있습니다. 첫 곡 「바다의 새벽부터 정오까지」는 어둠 속에서 서서히 깨어나는 바다가 햇살을 받아 눈부시게 빛나기까지의 모습을 그립니다. 둘째 곡 「파도의 유희」는 반짝이며 장난치듯 부서지는 파도를, 셋째 곡 「바람과 바다의 대화」는 거센 바람과 성난 파도가 맞부딪치며 장엄한 클라이맥스로 치닫는 모습을 그려 냅니다. 오케스트라의 다채로운 음색이 바다의 빛과 색깔, 움직임을 생생하게 그려 냅니다. 여름의 문턱에서, 드뷔시가 그린 바다로 떠나 보세요."], ["6-14", "물의 유희", "라벨", "독주", "여름", "물방울과 분수", "라벨이 파리 음악원에 다니던 스물여섯 살, 1901년에 쓴 피아노곡으로 스승 포레에게 헌정되었습니다. 라벨은 리스트의 「에스테 장의 분수」에서 큰 영향을 받아, 분수와 폭포, 시냇물에서 물이 흩어지고 반짝이는 소리를 피아노로 그려 내고자 했습니다. 악보 첫머리에는 프랑스 시인 레니에의 시 구절 \"물에 간지럽혀져 웃는 강의 신\"이 적혀 있습니다. 곡은 피아노의 높은 음역에서 맑고 영롱한 음들이 빠르게 반짝이며 흩어지는 가운데, 물방울이 햇살을 받아 무지갯빛으로 빛나는 모습을 그려 냅니다. 양손이 쉴 새 없이 건반 위를 오가며 만들어 내는 소리의 물결은, 때로는 잔잔하게 솟아오르는 분수 같고 때로는 시원하게 쏟아지는 폭포 같습니다. 이 곡이 발표되었을 때 사람들은 그 새롭고 독특한 소리에 크게 놀랐습니다. 드뷔시의 피아노곡보다 먼저 나온 이 곡은 피아노로 색채와 빛을 그리는 '인상주의 피아노 음악'의 새 길을 연 작품으로 평가받습니다. 더위가 시작되는 6월, 시원한 물소리를 피아노로 들으며 잠시 더위를 식혀 보세요."], ["6-15", "피아노 협주곡 a단조 Op.16", "그리그", "협주곡", "기념일", "그리그 탄생일(1843.6.15)", "1843년 6월 15일 노르웨이 베르겐에서 태어난 그리그가 스물네 살이던 1868년 여름에 쓴, 그가 남긴 단 하나의 협주곡입니다. 그리그는 독일 라이프치히에서 음악을 공부하던 시절 클라라 슈만이 연주하는 슈만의 피아노 협주곡을 듣고 깊은 감명을 받았는데, 그래서인지 이 곡은 슈만의 협주곡과 같은 조성이고 구성도 비슷합니다. 곡은 팀파니의 작은 울림에 이어 피아노가 건반 꼭대기에서 아래로 폭포처럼 쏟아져 내려오는 강렬한 화음으로 시작하는데, 이 첫머리는 피아노 협주곡 가운데 가장 유명한 시작으로 꼽힙니다. 이어 목관 악기가 노르웨이의 민요처럼 소박하고 애틋한 주제를 노래합니다. 2악장은 노르웨이의 고요한 여름밤처럼 아름답고 서정적이며, 3악장은 노르웨이의 민속춤 '할링'의 힘찬 리듬으로 시작해 장엄하게 마무리됩니다. 이 곡의 악보를 처음 본 리스트는 그 자리에서 피아노로 연주해 보이고는 그리그에게 \"계속 이렇게 가라\"고 격려했다고 합니다. 그리그의 생일을 맞아, 노르웨이의 피오르와 산을 떠올리며 들어 보세요."], ["6-16", "바이올린 소나타 A장조", "프랑크", "실내악", "일반", "결혼 선물로 쓰인 소나타. 6월의 신부", "벨기에 태생의 프랑스 작곡가 세자르 프랑크가 1886년, 예순셋의 나이에 쓴 바이올린 소나타입니다. 이 곡은 같은 벨기에 출신의 젊은 바이올리니스트 이자이에게 결혼 선물로 바쳐졌습니다. 이자이는 결혼식 날 피로연에서 피아니스트와 함께 하객들 앞에서 이 곡을 처음 연주했다고 합니다. 이후 이자이는 평생 이 곡을 세계 곳곳에서 연주하며 널리 알렸습니다. 이 곡은 '순환 형식'으로 쓰였는데, 첫 악장에서 나온 주제가 다음 악장들에서도 모습을 바꾸어 계속 등장하며 곡 전체를 하나로 묶어 줍니다. 1악장은 꿈결처럼 부드럽고 몽환적이며, 2악장은 폭풍처럼 격정적으로 몰아칩니다. 3악장은 자유로운 환상곡처럼 깊은 사색에 잠기고, 4악장에서는 피아노와 바이올린이 같은 선율을 앞뒤로 쫓아가며 노래하는 돌림노래 형식으로 행복하고 밝은 결말을 맞습니다. 마치 두 사람이 손을 잡고 함께 걸어가는 듯한 이 마지막 악장은 결혼의 기쁨과 잘 어울립니다. 6월의 신부를 축복하는 마음으로 들어 보세요."], ["6-17", "「불새」 모음곡", "스트라빈스키", "관현악", "기념일", "스트라빈스키 탄생일(1882.6.17)", "1882년 6월 17일 러시아에서 태어난 스트라빈스키를 하루아침에 세계적인 작곡가로 만든 발레 음악입니다. 1910년 러시아 발레단을 이끌던 디아길레프는 파리 공연을 위한 새 발레의 음악을 당시 거의 무명이던 스물여덟 살의 스트라빈스키에게 맡겼고, 파리 초연은 대성공을 거두었습니다. 발레는 러시아의 옛이야기를 바탕으로 합니다. 이반 왕자는 마법의 정원에서 황금빛 날개를 가진 신비로운 불새를 붙잡았다가 놓아주고, 그 대가로 마법의 깃털을 얻습니다. 그리고 사악한 마왕 카셰이에게 붙잡힌 공주들을 구하러 가는데, 위기의 순간 깃털로 불새를 불러내 마왕을 물리칩니다. 스트라빈스키는 이 발레에서 몇 곡을 골라 관현악 모음곡을 만들었습니다. 마왕과 부하들이 불새의 마법에 걸려 미친 듯이 춤추는 「카셰이 일당의 지옥의 춤」은 강렬하고 폭발적이며, 이어지는 「자장가」는 바순이 신비롭고 고요한 노래를 들려줍니다. 마지막에는 호른이 러시아 민요풍의 선율을 고요히 연주하고, 이 선율이 점점 커져 오케스트라 전체의 찬란한 환희로 끝을 맺습니다. 동화 속 마법의 세계로 들어가 보세요."], ["6-18", "뱃노래 Op.60", "쇼팽", "독주", "여름", "여름 물결", "쇼팽이 1845년부터 이듬해 사이, 생애 말년에 쓴 피아노곡입니다. '바르카롤'은 이탈리아 베네치아의 곤돌라 사공들이 노를 저으며 부르던 뱃노래로, 배가 물결 위에서 부드럽게 흔들리는 듯한 리듬이 특징입니다. 쇼팽은 한 번도 베네치아에 가 본 적이 없었지만, 이 곡에서 운하 위를 미끄러지듯 나아가는 곤돌라의 풍경을 꿈처럼 아름답게 그려 냈습니다. 곡은 왼손이 처음부터 끝까지 물결처럼 넘실대는 반주를 이어 가는 가운데, 오른손이 사공의 노래처럼 두 개의 음을 겹쳐 노래하는 감미로운 선율로 펼쳐집니다. 마치 두 사람이 나란히 배에 앉아 사랑의 노래를 함께 부르는 것 같지요. 가운데 부분에서는 분위기가 바뀌어 깊은 사색과 꿈결 같은 몽환에 잠기다가, 다시 처음의 선율이 더욱 화려하고 벅차게 돌아와 찬란한 클라이맥스에 이릅니다. 이 무렵 쇼팽은 병으로 쇠약해지고 연인 조르주 상드와의 관계도 끝나 가고 있었지만, 이 곡에는 고요하면서도 뜨거운 생명의 빛이 담겨 있습니다. 쇼팽 피아노 음악의 정점으로 꼽히는 이 곡을 감상해 보세요."], ["6-19", "교향시 「여름」", "브리지", "관현악", "계절 표제", "표제가 여름", "영국의 작곡가 프랭크 브리지가 1914년부터 이듬해 사이에 쓴 교향시입니다. 브리지는 뛰어난 비올라 연주자이자 지휘자였고, 훗날 영국을 대표하는 작곡가가 되는 벤저민 브리튼의 스승으로도 잘 알려져 있습니다. 이 곡을 쓰던 1914년 여름, 1차 세계대전이 일어나 유럽 전체가 전쟁의 소용돌이에 휩싸였습니다. 전쟁을 깊이 혐오했던 브리지는 큰 충격과 슬픔에 빠졌고, 그런 시기에 쓴 이 곡에는 전쟁 이전의 평화롭고 아름다운 영국 시골의 여름에 대한 그리움이 담겨 있습니다. 곡은 현악기의 고요하고 부드러운 화음 위로 목관 악기들이 나른한 여름 들판의 소리를 들려주며 시작합니다. 따사로운 햇살 아래 바람에 흔들리는 풀잎, 멀리서 들려오는 새소리, 꽃 사이를 날아다니는 벌들의 날갯짓이 은은한 관현악의 색채로 그려집니다. 선율은 점점 따뜻하고 풍성하게 부풀어 오르다가, 다시 고요한 여름 오후의 정적 속으로 스며들 듯 사라집니다. 전쟁의 그림자 속에서 피어난, 잃어버린 평화를 향한 노래입니다. 평화로운 여름날의 소중함을 느끼며 들어 보세요."], ["6-20", "부에노스아이레스의 여름", "피아졸라", "실내악", "계절 표제", "표제가 여름", "아르헨티나의 작곡가 피아졸라의 「부에노스아이레스의 사계」 가운데 여름을 노래한 곡입니다. 1965년 한 연극을 위해 쓴 이 곡이 네 곡 가운데 가장 먼저 탄생했고, 이후 나머지 세 계절의 곡이 차례로 만들어졌습니다. 한여름의 부에노스아이레스는 뜨거운 태양 아래 열기로 가득한 도시입니다. 곡은 강렬하고 끈적한 탱고의 리듬이 처음부터 몰아치며 시작하는데, 마치 땀이 흐르는 무더운 거리에서 사람들이 열정적으로 춤추는 모습 같습니다. 바이올린과 피아노, 반도네온이 날카롭게 부딪치며 거칠고 생동감 넘치는 소리를 만들어 내고, 악기의 몸통을 두드리거나 줄을 긁어 내는 독특한 연주법이 도시의 소음과 열기를 더욱 생생하게 전합니다. 가운데 부분에서는 분위기가 바뀌어, 무더운 여름밤의 나른함과 그리움이 담긴 느리고 서정적인 선율이 흐릅니다. 그리고 다시 뜨거운 리듬으로 돌아와 강렬하게 마무리됩니다. 재미있게도 남반구의 아르헨티나에서는 6월이 겨울의 시작이지요. 지구 반대편의 뜨거운 여름을 상상하며, 탱고의 열정 속으로 빠져 보세요."], ["6-21", "「사계」 중 「여름」", "비발디", "협주곡", "계절 표제", "하지 무렵", "비발디의 「사계」 가운데 두 번째 곡인 「여름」입니다. 「봄」이 밝고 생기 넘치는 계절이었다면, 비발디가 그린 여름은 뜨거운 태양과 갑작스러운 폭풍이 몰아치는 혹독한 계절입니다. 곡에 붙은 시에 따르면, 1악장은 이글거리는 태양 아래 사람도 가축도 지쳐 늘어진 모습으로 시작합니다. 느리고 힘없는 선율이 숨 막히는 더위를 그려 내고, 그 사이로 뻐꾸기와 산비둘기, 방울새의 노랫소리가 들려옵니다. 그러다 갑자기 북쪽에서 거센 바람이 불어오고, 목동은 다가올 폭풍을 두려워하며 흐느낍니다. 2악장에서는 지친 목동이 쉬려 하지만 파리와 모기떼가 윙윙거리며 괴롭히고, 멀리서 천둥이 우르릉 울려 잠을 이루지 못합니다. 바이올린의 애처로운 노래와 오케스트라의 낮고 무서운 떨림이 교차하지요. 3악장에서는 마침내 폭풍이 몰아쳐, 번개가 번쩍이고 우박이 쏟아져 익어 가던 곡식을 쓰러뜨립니다. 바이올린이 쉴 새 없이 빠른 음표를 쏟아 내며 거센 폭풍을 생생하게 그려 냅니다. 오늘은 일 년 중 낮이 가장 긴 하지 무렵입니다. 300년 전 이탈리아의 여름 속으로 들어가 보세요."], ["6-22", "발레 「사계」 Op.67 중 「여름」", "글라주노프", "관현악", "계절 표제", "표제가 여름", "러시아의 작곡가 글라주노프의 발레 음악 「사계」 가운데 세 번째 장면인 「여름」입니다. 겨울을 지나 봄이 무르익고 나면, 이제 들판에는 금빛 곡식과 꽃이 가득한 여름이 찾아옵니다. 여름 장면은 파란 수레국화와 붉은 양귀비가 흐드러지게 핀 넓은 밀밭에서 펼쳐집니다. 뜨거운 한낮의 태양 아래 꽃의 요정들이 나른하게 춤을 추고, 물의 요정들이 시원한 물을 가져와 메마른 들판을 적셔 줍니다. 그러다 숲의 정령 사티로스와 목신이 나타나 요정들을 쫓아다니며 장난을 치고, 산들바람의 신 제피로스가 요정들을 구해 주지요. 이 장면에서 가장 유명한 곡은 「수레국화와 양귀비의 왈츠」로, 부드럽고 우아하게 흔들리는 선율이 바람에 물결치는 꽃밭을 떠올리게 합니다. 이어지는 바르카롤은 잔잔한 물결처럼 흔들리며 여름날의 나른한 평화를 노래합니다. 글라주노프는 풍성한 관현악의 색채로 무르익은 여름 들판의 넉넉함과 생명력을 그려 냈습니다. 하지가 지나고 본격적인 여름이 시작되는 지금, 꽃이 만발한 여름 들판의 춤을 상상하며 들어 보세요."], ["6-23", "민둥산의 하룻밤", "무소륵스키", "관현악", "여름", "표제 배경이 성 요한 전야(6.23)", "러시아의 작곡가 무소륵스키가 쓴 관현악곡입니다. 러시아의 민간 전설에 따르면, 6월 23일 성 요한 축일 전날 밤이면 마녀와 악령들이 키예프 근처의 민둥산에 모여 어둠의 신 체르노보그를 숭배하며 밤새 광란의 잔치를 벌인다고 합니다. 무소륵스키는 1867년 이 전설을 바탕으로 「성 요한 전야의 민둥산」이라는 곡을 썼지만, 스승에게 혹평을 받아 생전에는 연주되지 못했습니다. 지금 우리가 주로 듣는 곡은 그가 세상을 떠난 뒤 친구 림스키코르사코프가 다른 작품의 선율까지 엮어 새롭게 편곡한 판본입니다. 곡은 현악기의 거센 소용돌이와 금관악기의 날카로운 울부짖음으로 시작해, 마녀와 악령들이 떼 지어 몰려들어 미친 듯이 춤추는 광란의 밤을 그려 냅니다. 그러다 멀리서 새벽을 알리는 교회 종소리가 울리면 악령들은 하나둘 흩어지고, 클라리넷과 플루트가 고요하고 평화로운 새벽의 노래를 들려주며 조용히 끝을 맺습니다. 디즈니의 애니메이션 영화 「판타지아」에 쓰여 더욱 유명해졌습니다. 성 요한 축일 전야, 어둠과 빛의 대결을 함께 지켜보세요."], ["6-24", "「한여름 밤의 꿈」 서곡 Op.21", "멘델스존", "관현악", "여름", "한여름 축제(Midsummer, 6.24)", "멘델스존이 열일곱 살이던 1826년에 쓴 연주회용 서곡입니다. 멘델스존은 누나 파니와 함께 셰익스피어의 희극 「한여름 밤의 꿈」을 읽고 깊이 매료되어, 먼저 피아노 연탄곡으로 쓴 뒤 관현악곡으로 완성했습니다. 이 곡은 십 대 소년이 쓴 곡이라고는 믿기 어려울 만큼 완벽하고 독창적이어서, 음악사에서 가장 놀라운 천재의 작품 가운데 하나로 꼽힙니다. 17년 뒤 멘델스존은 프로이센 왕의 의뢰로 이 희곡의 공연을 위한 극음악을 쓰게 되었는데, 그때 유명한 「결혼 행진곡」도 함께 탄생했습니다. 서곡은 목관 악기가 연주하는 네 개의 신비로운 화음으로 시작하는데, 마치 요정의 숲으로 들어가는 마법의 문이 열리는 듯합니다. 이어 바이올린이 아주 작고 빠른 음표들로 숲속을 날아다니는 요정들의 춤을 그려 내고, 사랑에 빠진 연인들의 아름다운 선율, 그리고 마법에 걸려 당나귀 머리가 된 직공을 흉내 낸 우스꽝스러운 울음소리도 들려옵니다. 6월 24일 무렵은 유럽에서 한여름 밤의 축제를 여는 하지 축일입니다. 요정들이 춤추는 신비로운 여름밤을 상상하며 들어 보세요."], ["6-25", "스웨덴 랩소디 1번 「하지 축제의 밤」", "알벤", "관현악", "여름", "스웨덴 하지 축제", "스웨덴의 작곡가 휴고 알벤이 1903년에 쓴 관현악곡입니다. 스웨덴에서 하지 축제 '미드소마르'는 크리스마스와 함께 일 년 중 가장 큰 명절입니다. 길고 어두운 겨울을 보내는 스웨덴 사람들에게 해가 거의 지지 않는 하지는 일 년 중 가장 기쁘고 소중한 날이지요. 사람들은 꽃과 나뭇잎으로 장식한 커다란 기둥을 세우고 그 둘레를 손잡고 돌며 춤을 추며, 머리에는 화관을 쓰고, 청어와 햇감자를 먹으며 밤새 축제를 즐깁니다. 이 곡의 원래 제목도 '하지 축제의 밤샘'이라는 뜻입니다. 곡은 클라리넷이 경쾌하고 장난스러운 민요풍의 선율을 연주하며 시작하는데, 이 선율은 스웨덴 사람이라면 누구나 아는 유명한 멜로디가 되었습니다. 이어 축제가 무르익어 사람들이 흥겹게 춤을 추고, 가운데 부분에서는 하얀 밤의 고요함 속에서 연인들이 사랑을 속삭이는 듯한 서정적인 선율이 흐릅니다. 그리고 다시 축제의 열기가 고조되어, 날이 밝아 오는 줄도 모르고 춤추는 사람들처럼 열광적으로 끝을 맺습니다. 북유럽의 하얀 밤, 꽃과 춤이 가득한 축제에 함께해 보세요."], ["6-26", "여름 정원에서", "들리어스", "관현악", "여름", "표제가 여름", "영국의 작곡가 들리어스가 1908년에 쓴 관현악곡입니다. 들리어스는 아내 옐카와 함께 파리 근교의 작은 마을 그레쉬르루앵에서 살았는데, 화가였던 옐카가 정성껏 가꾼 정원은 강가까지 이어진 아름다운 곳이었습니다. 이 곡은 바로 그 정원에서 보낸 여름날의 풍경과 감정을 담고 있으며, 아내 옐카에게 헌정되었습니다. 악보에는 영국 시인 로세티의 시에서 가져온, 수많은 꽃이 피어난 정원과 그 사이로 흐르는 강물을 노래한 구절이 적혀 있습니다. 곡은 뚜렷한 선율이나 극적인 전개보다는, 은은하게 번지는 수채화처럼 부드러운 관현악의 색채로 여름 정원의 분위기를 그려 냅니다. 햇살을 받아 빛나는 꽃잎, 꽃 사이를 날아다니는 벌과 나비, 나뭇잎 사이로 스며드는 바람, 그리고 정원 끝자락에서 고요히 흐르는 강물이 차례로 떠오릅니다. 들리어스의 음악은 듣는 이를 서두르게 하지 않고, 그저 그 순간의 아름다움에 머물러 있게 해 줍니다. 무더운 여름날, 나무 그늘 아래 앉아 정원을 바라보는 마음으로 천천히 들어 보세요. 고요한 행복이 느껴질 것입니다."], ["6-27", "전주곡 「빗방울」 Op.28-15", "쇼팽", "독주", "장마", "장마 시작", "쇼팽이 1838년부터 이듬해 사이에 완성한 「24개의 전주곡」 가운데 열다섯 번째 곡입니다. 쇼팽은 바흐의 「평균율 클라비어곡집」에 영향을 받아, 모든 장조와 단조를 하나씩 사용한 스물네 곡의 짧은 피아노곡을 썼습니다. 이 곡에 「빗방울」이라는 별명이 붙게 된 데에는 사연이 있습니다. 1838년 겨울, 쇼팽은 연인 조르주 상드와 함께 지중해의 마요르카섬에 머물며 낡은 수도원에서 지냈습니다. 상드의 회고록에 따르면, 어느 날 그녀가 폭우를 뚫고 늦게 돌아오자 쇼팽은 창백한 얼굴로 눈물을 흘리며 피아노를 치고 있었고, 지붕에서 떨어지는 빗방울 소리를 들으며 꿈을 꾸었다고 말했다고 합니다. 곡에서는 처음부터 끝까지 같은 음이 마치 빗방울처럼 규칙적으로 '톡, 톡' 반복됩니다. 앞부분은 부드럽고 평화로운 선율이 흐르고, 가운데 부분은 어둡고 무거운 분위기로 바뀌어 그 반복음이 불길하게 울리다가, 다시 처음의 평화로운 선율로 돌아옵니다. 장마가 시작되는 무렵, 창문을 두드리는 빗소리와 함께 들어 보세요."], ["6-28", "바이올린 소나타 1번 「비의 노래」 Op.78", "브람스", "실내악", "장마", "가곡 「비의 노래」 선율 인용", "브람스가 1878년부터 이듬해 여름까지 오스트리아의 호숫가 휴양지 푀르차흐에서 쓴 첫 번째 바이올린 소나타입니다. 이 곡에 「비의 노래」라는 별명이 붙은 것은 3악장에 브람스 자신의 가곡 「비의 노래」의 선율이 쓰였기 때문입니다. 이 가곡은 비가 내리면 어린 시절 맨발로 빗속을 뛰놀던 추억이 떠오른다는 내용입니다. 곡의 첫머리에도 이 가곡의 리듬이 숨어 있어, 곡 전체에 부드러운 빗방울 소리가 스며 있는 듯합니다. 이 곡에는 가슴 아픈 사연도 있습니다. 1879년 브람스가 평생 존경하고 사랑했던 클라라 슈만의 막내아들 펠릭스가 스물네 살에 병으로 세상을 떠났습니다. 브람스는 슬픔에 잠긴 클라라를 위로하기 위해 이 곡의 2악장 선율 일부를 편지로 보냈고, 곡을 받아 본 클라라는 이 음악을 천국에 가져가고 싶다고 말할 만큼 깊이 감동했다고 합니다. 1악장은 따뜻하고 서정적이며, 2악장은 깊은 슬픔과 위로가 담긴 노래입니다. 3악장은 빗방울처럼 잔잔하게 흐르며 아련한 추억 속에 조용히 마무리됩니다. 비 오는 날 창가에서 들어 보세요."], ["6-29", "판화 중 「비 오는 정원」", "드뷔시", "독주", "장마", "비 내리는 정원", "드뷔시가 1903년에 쓴 세 곡의 피아노 모음곡 「판화」 가운데 마지막 곡입니다. 드뷔시는 이 모음곡에서 동양의 사원을 그린 「탑」, 스페인의 밤을 그린 「그라나다의 저녁」, 그리고 프랑스의 비 오는 정원을 그린 이 곡으로, 세 곳의 풍경을 판화처럼 섬세하게 새겨 냈습니다. 곡은 처음부터 빠르고 가벼운 음표들이 쉴 새 없이 쏟아지며, 정원에 갑자기 몰아치는 소나기를 생생하게 그려 냅니다. 굵은 빗줄기가 나뭇잎을 두드리고, 바람이 불어와 빗방울이 흩날리며, 땅 위에 고인 물웅덩이에 동그란 물결이 번지는 모습이 소리로 펼쳐지지요. 이 빗소리 사이로 프랑스 어린이라면 누구나 아는 두 개의 동요 선율이 살며시 들려옵니다. 하나는 '우리는 더 이상 숲에 가지 않으리'라는 노래이고, 다른 하나는 자장가입니다. 비 때문에 밖에 나가 놀지 못하고 창가에서 정원을 바라보는 아이의 마음이 떠오르는 듯합니다. 그리고 마지막에는 비가 그치고 구름 사이로 햇살이 비치듯, 밝고 찬란한 화음으로 끝을 맺습니다. 장마철, 비 그친 뒤의 맑은 하늘을 기다리며 들어 보세요."], ["6-30", "에스테 장의 분수", "리스트", "독주", "여름", "여름 분수", "리스트가 1877년에 출판한 피아노 모음곡 「순례의 해」 제3권에 실린 곡입니다. 에스테 장은 이탈리아 로마 근교의 티볼리에 있는 르네상스 시대의 별장으로, 수백 개의 분수와 폭포, 연못이 정원 곳곳을 수놓은 아름다운 곳입니다. 리스트는 말년에 가톨릭 성직자가 되어 이 별장에 자주 머물렀고, 이 곳의 분수를 바라보며 이 곡을 썼습니다. 곡은 피아노의 높은 음역에서 맑고 반짝이는 음들이 빠르게 흩어지며 솟아오르는 분수를 그려 냅니다. 햇살을 받아 무지갯빛으로 빛나는 물방울, 물줄기가 하늘로 솟구쳤다가 다시 부서져 내리는 모습이 화려하면서도 섬세한 소리로 표현되지요. 그런데 이 곡은 단순한 풍경 묘사에 그치지 않습니다. 리스트는 악보에 \"내가 주는 물은 그 사람 안에서 영원한 생명의 샘이 되리라\"라는 성경 구절을 적어 넣어, 분수를 영원한 생명과 은총의 상징으로 그려 냈습니다. 이 곡의 새로운 소리는 훗날 라벨의 「물의 유희」와 드뷔시의 피아노 음악에 큰 영향을 주어, 인상주의 피아노 음악의 선구자로 평가받습니다. 6월의 마지막 날, 시원한 분수 소리를 들어 보세요."], ["7-1", "교향곡 6번 「전원」 Op.68", "베토벤", "관현악", "여름", "시골의 여름, 폭풍우와 감사", "베토벤이 1808년에 완성한 여섯 번째 교향곡으로, 그해 12월 교향곡 5번 「운명」과 같은 날 함께 초연되었습니다. 베토벤은 빈 근교의 시골 마을을 산책하며 자연 속에서 위안과 영감을 얻었는데, 이 교향곡에는 그 시골 풍경과 자연을 향한 깊은 사랑이 담겨 있습니다. 그는 악보에 이 곡이 \"그림 같은 묘사라기보다 감정의 표현\"이라고 적었습니다. 다섯 악장마다 베토벤이 직접 붙인 제목이 있습니다. 1악장 '시골에 도착했을 때의 즐거운 감정', 2악장 '시냇가의 정경'에서는 플루트가 나이팅게일을, 오보에가 메추라기를, 클라리넷이 뻐꾸기를 노래합니다. 3악장 '농부들의 즐거운 모임'에서는 흥겨운 시골 춤판이 벌어지다가, 쉬지 않고 이어지는 4악장 '천둥과 폭풍'에서 갑자기 하늘이 어두워지고 거센 폭우가 쏟아집니다. 그리고 폭풍이 지나간 뒤 5악장 '목동의 노래'에서는 무지개가 뜬 하늘 아래 목동이 감사의 노래를 부르며 평화롭게 마무리됩니다. 7월의 첫날, 초록이 짙은 시골 들판으로 떠나는 마음으로 들어 보세요."], ["7-2", "사계 Op.37 중 「7월: 풀 베는 사람의 노래」", "차이콥스키", "독주", "계절 표제", "표제 자체가 7월", "차이콥스키의 피아노 모음곡 「사계」 가운데 7월의 곡입니다. 러시아의 7월은 여름 햇살 아래 풀과 곡식이 무성하게 자라는 계절로, 농부들은 들판에 나가 낫으로 풀을 베어 겨울 동안 가축에게 먹일 건초를 마련합니다. 이 곡에는 시인 콜초프의 시에서 따온, \"어깨를 펴라, 팔을 휘둘러라! 한낮의 바람이 얼굴에 불어온다!\"라는 힘찬 구절이 붙어 있습니다. 곡은 낫을 크게 휘두르는 듯한 힘차고 규칙적인 리듬으로 시작합니다. 농부들이 줄지어 서서 한 걸음씩 나아가며 박자에 맞춰 풀을 베어 나가는 모습이 눈앞에 그려지는 듯하지요. 소박하고 씩씩한 선율에는 땀 흘려 일하는 사람들의 건강한 기운과 노동의 즐거움이 가득합니다. 가운데 부분에서는 잠시 쉬어 가듯 조금 더 부드러운 분위기가 흐르다가, 다시 처음의 힘찬 리듬으로 돌아와 일을 이어 갑니다. 「사계」 가운데에서도 가장 활기차고 건강한 곡 가운데 하나입니다. 무더위가 시작되는 7월, 들판에서 땀 흘려 일하는 농부들의 노래를 들으며 힘을 내 보세요."], ["7-3", "신포니에타", "야나체크", "관현악", "기념일", "야나체크 탄생일(1854.7.3)", "1854년 7월 3일 체코 모라비아 지방에서 태어난 레오시 야나체크가 1926년, 일흔둘의 나이에 쓴 관현악곡입니다. 야나체크는 늦은 나이에 작곡가로 이름을 알렸는데, 말년에 젊은 여인 카밀라를 향한 사랑에 빠지며 놀라운 창작열을 불태워 수많은 걸작을 남겼습니다. 이 곡은 처음에 체코의 체육 단체 '소콜'의 축제를 위해 군악대의 팡파르로 구상되었습니다. 당시 체코는 오랜 오스트리아의 지배에서 벗어나 독립한 지 얼마 되지 않았는데, 야나체크는 이 곡에서 자유로운 조국과 그 국민의 활력, 그리고 그가 사랑한 도시 브르노를 노래했습니다. 곡은 아홉 대의 트럼펫을 비롯한 열세 대의 금관악기와 팀파니가 연주하는 웅장하고 화려한 팡파르로 시작합니다. 이어지는 악장들에서는 브르노의 옛 성, 수도원, 거리, 시청 등을 그린 독특하고 개성 넘치는 음악이 펼쳐지고, 마지막에는 처음의 팡파르가 다시 돌아와 장엄하게 마무리됩니다. 무라카미 하루키의 소설 「1Q84」의 첫 장면에 등장해 우리에게도 널리 알려졌습니다. 그의 생일을 맞아 들어 보세요."], ["7-4", "1812년 서곡 Op.49", "차이콥스키", "관현악", "여름", "미국 독립기념일 불꽃놀이 공연 전통(대포·종)", "차이콥스키가 1880년, 모스크바의 대성당 봉헌과 산업 박람회를 위해 의뢰받아 쓴 관현악곡입니다. 1812년 나폴레옹은 대군을 이끌고 러시아를 침공해 모스크바까지 진격했지만, 혹독한 겨울과 러시아군의 끈질긴 저항에 밀려 결국 처참하게 퇴각했습니다. 이 곡은 그 전쟁을 음악으로 그려 낸 것입니다. 곡은 러시아 정교회의 성가가 엄숙하게 울리며 시작해, 평화를 기도하는 러시아 사람들의 모습을 그립니다. 이어 프랑스 국가 「라 마르세예즈」의 선율이 나폴레옹 군대의 진격을 나타내고, 러시아 민요 선율과 뒤엉켜 치열한 전투가 벌어집니다. 마침내 프랑스 국가가 점점 약해지며 사라지고, 러시아 제국의 국가와 함께 승리의 교회 종소리가 울려 퍼지며 대포 소리가 하늘을 뒤흔듭니다. 실제로 악보에는 대포를 쏘도록 적혀 있어서, 야외 공연에서는 진짜 대포를 쏘기도 합니다. 미국에서는 독립기념일인 7월 4일에 불꽃놀이와 함께 이 곡을 연주하는 전통이 있습니다. 차이콥스키 자신은 이 곡이 시끄럽고 요란하다며 그다지 좋아하지 않았다고 합니다. 웅장한 소리의 향연을 즐겨 보세요."], ["7-5", "파리의 아메리카인", "거슈윈", "관현악", "여름", "여름 여행", "미국의 작곡가 거슈윈이 1928년 파리 여행을 마치고 돌아와 쓴 관현악곡입니다. 거슈윈은 파리에 머물며 라벨, 스트라빈스키 같은 유럽의 거장들을 만났고, 활기찬 파리의 거리와 사람들을 보며 큰 영감을 받았습니다. 그는 파리의 택시 경적 소리에 매료되어 아예 택시 경적을 사 와서 오케스트라에 악기로 넣기도 했습니다. 곡은 미국에서 온 한 여행자가 파리의 거리를 걸어 다니며 느끼는 감정을 그립니다. 처음에는 경쾌한 발걸음으로 샹젤리제 거리를 활보하며, 빵빵거리는 택시 경적과 북적이는 사람들, 화려한 카페 풍경에 들뜬 마음을 드러냅니다. 그러다 트럼펫이 느리고 쓸쓸한 블루스 선율을 연주하는데, 낯선 도시에서 문득 고향을 그리워하는 향수병에 걸린 순간입니다. 하지만 곧 고향 친구를 만나 찰스턴 춤을 추듯 신나는 리듬이 돌아오고, 여행자는 다시 파리의 즐거움에 흠뻑 빠져듭니다. 1951년 이 곡을 바탕으로 만든 진 켈리 주연의 뮤지컬 영화는 아카데미 작품상을 받았습니다. 여름휴가 여행을 떠나는 마음으로 들어 보세요."], ["7-6", "피아노 협주곡 2번 g단조 Op.22", "생상스", "협주곡", "일반", "프랑스 낭만 협주곡", "프랑스의 작곡가 생상스가 1868년 불과 17일 만에 완성한 피아노 협주곡입니다. 생상스는 두 살에 피아노를 치기 시작하고 열 살에 정식으로 연주회를 연 신동이었으며, 리스트가 그를 '세계 최고의 오르가니스트'라고 칭찬할 만큼 뛰어난 연주자였습니다. 이 협주곡도 그 자신의 독주로 파리에서 초연되었습니다. 이 곡은 세 악장이 서로 전혀 다른 분위기를 지니고 있어 무척 독특합니다. 1악장은 피아노가 홀로 바흐의 오르간 즉흥곡처럼 장엄하고 엄숙한 독주로 시작해, 깊고 무거운 분위기로 펼쳐집니다. 2악장은 갑자기 분위기가 바뀌어, 팀파니의 경쾌한 리듬과 함께 장난스럽고 재치 넘치는 스케르초가 펼쳐집니다. 3악장은 이탈리아의 빠르고 열광적인 민속춤 '타란텔라'의 리듬으로 숨 가쁘게 질주하며 화려하게 끝을 맺습니다. 그래서 한 음악가는 이 곡을 두고 \"바흐로 시작해 오펜바흐로 끝난다\"는 재치 있는 평을 남기기도 했습니다. 오펜바흐는 당시 파리에서 큰 인기를 끈 경쾌한 희가극 작곡가였지요. 무거움에서 가벼움으로 바뀌는 놀라운 여정을 즐겨 보세요."], ["7-7", "교향곡 5번", "말러", "관현악", "기념일", "말러 탄생일(1860.7.7)", "1860년 7월 7일 보헤미아의 작은 마을에서 태어난 구스타프 말러가 1901년부터 이듬해 사이에 쓴 교향곡입니다. 말러는 이 곡을 쓰던 중 빈 사교계의 꽃이었던 열아홉 살 연하의 알마를 만나 사랑에 빠졌고, 1902년 결혼했습니다. 곡은 트럼펫이 홀로 울리는 불길한 팡파르로 시작하는 장송 행진곡으로 문을 엽니다. 이어 2악장은 폭풍처럼 격렬하게 몰아치고, 3악장은 호른이 활약하는 거대한 스케르초입니다. 이 교향곡에서 가장 유명한 것은 4악장 '아다지에토'입니다. 오직 현악기와 하프만으로 연주하는 이 짧은 악장은 고요하고 꿈결 같은 선율이 끝없이 이어지는데, 말러가 알마에게 보낸 음악으로 된 사랑의 편지였다는 이야기가 전해집니다. 1971년 비스콘티 감독의 영화 「베니스에서의 죽음」에 쓰이면서 세계적으로 유명해졌지요. 그리고 마지막 5악장은 어둠을 뚫고 나와 밝고 활기찬 환희로 끝을 맺습니다. 죽음에서 사랑을 거쳐 삶의 기쁨으로 나아가는 거대한 여정입니다. 말러의 생일을 맞아, 그가 남긴 사랑의 음악을 들어 보세요."], ["7-8", "수상 음악 「함부르크의 썰물과 밀물」 TWV 55:C3", "텔레만", "관현악", "여름", "바다와 항구의 여름", "1681년에 태어난 독일의 작곡가 텔레만이 1723년, 함부르크 해군 본부의 창설 100주년을 기념하는 축제를 위해 쓴 관현악 모음곡입니다. 함부르크는 엘베강 하구에 자리 잡은 독일 최대의 항구 도시로, 바다와 무역으로 번영을 누렸습니다. 텔레만은 이 도시의 바다와 물을 주제로, 그리스 신화 속 바다의 신들을 등장시킨 재미있는 음악을 썼습니다. 웅장한 서곡에 이어 잠든 바다의 여신 테티스와 잠에서 깨어난 테티스, 사랑에 빠진 바다의 신 넵투누스, 장난치는 물의 요정들, 즐겁게 뛰노는 바다의 신 트리톤, 그리고 거센 바람을 일으키는 바람의 신 아이올로스가 차례로 등장합니다. 특히 「썰물과 밀물」에서는 바닷물이 밀려왔다 빠져나가는 모습을 음악으로 생생하게 그려 내고, 마지막 곡에서는 축제를 즐기는 뱃사람들의 흥겨운 춤이 펼쳐집니다. 그래서 이 곡에는 '함부르크의 썰물과 밀물'이라는 부제가 붙어 있습니다. 헨델의 「수상 음악」과 함께 바로크 시대의 대표적인 물의 음악으로 꼽힙니다. 시원한 바닷바람을 떠올리며 들어 보세요."], ["7-9", "로마의 분수", "레스피기", "관현악", "기념일", "레스피기 탄생일(1879.7.9). 여름 분수", "1879년 7월 9일 이탈리아 볼로냐에서 태어난 오토리노 레스피기가 1916년에 쓴 교향시입니다. 로마를 주제로 한 레스피기의 관현악곡 세 편, 이른바 '로마 3부작' 가운데 첫 작품이지요. 로마는 수많은 분수로 유명한 도시입니다. 레스피기는 그 가운데 네 개의 분수를 골라, 하루의 서로 다른 시간대에 각 분수가 보여 주는 모습을 음악으로 그려 냈습니다. 첫 곡은 새벽녘 목장에 있는 분수로, 안개 낀 들판에서 소 떼가 지나가는 고요한 풍경을 그립니다. 둘째 곡은 아침의 트리톤 분수로, 호른이 힘차게 울리며 바다의 신과 요정들이 물을 뿜으며 즐겁게 뛰노는 모습을 보여 줍니다. 셋째 곡은 정오의 트레비 분수로, 바다의 신 넵투누스가 해마가 끄는 마차를 타고 웅장하게 행진하는 장엄한 장면입니다. 동전을 던지면 다시 로마에 돌아온다는 전설로 유명한 바로 그 분수이지요. 마지막 곡은 해 질 녘 메디치 빌라의 분수로, 종소리와 새소리 속에 하루가 저물어 갑니다. 무더운 여름, 로마의 시원한 분수 여행을 떠나 보세요."], ["7-10", "바이올린 협주곡 2번 d단조 Op.22", "비에니아프스키", "협주곡", "기념일", "비에니아프스키 탄생일(1835.7.10)", "1835년 7월 10일 폴란드 루블린에서 태어난 바이올리니스트이자 작곡가 헨리크 비에니아프스키의 두 번째 바이올린 협주곡입니다. 비에니아프스키는 파가니니 이후 최고의 바이올린 거장 가운데 한 명으로 꼽혔고, 그의 이름을 딴 국제 바이올린 콩쿠르가 지금도 폴란드에서 열리고 있습니다. 이 협주곡은 1862년 무렵 완성되어, 스페인의 젊은 바이올린 거장 사라사테에게 헌정되었습니다. 1악장은 오케스트라의 어둡고 극적인 서주에 이어, 바이올린이 웅장하고 열정적인 선율로 등장합니다. 화려한 기교와 깊은 감정이 교차하며 펼쳐지지요. 쉬지 않고 이어지는 2악장 '로망스'는 이 곡에서 가장 사랑받는 부분으로, 바이올린이 꿈결처럼 부드럽고 아름다운 사랑의 노래를 들려줍니다. 3악장은 집시풍의 활기차고 정열적인 춤곡으로, 바이올린이 눈부신 기교를 쏟아 내며 화려하게 끝을 맺습니다. 차이콥스키, 브람스의 협주곡처럼 자주 연주되지는 않지만, 바이올린의 매력을 아낌없이 보여 주는 낭만 협주곡의 숨은 보석입니다. 그의 생일을 맞아, 폴란드 바이올린 거장의 노래를 들어 보세요."], ["7-11", "피아노 소나타 21번 B♭장조 D.960", "슈베르트", "독주", "일반", "슈베르트 마지막 소나타", "슈베르트가 세상을 떠나기 두 달 전인 1828년 9월에 완성한, 그의 마지막 피아노 소나타입니다. 이 무렵 슈베르트는 병으로 몸이 몹시 약해져 있었지만, 놀랍게도 단 몇 주 사이에 세 곡의 대작 피아노 소나타를 잇달아 완성했습니다. 이 곡은 그 마지막 곡으로, 그가 세상에 남긴 작별 인사처럼 들립니다. 1악장은 고요하고 평화로운 선율로 시작하는데, 곧이어 왼손의 아주 낮은 음역에서 멀리서 들려오는 천둥처럼 신비로운 떨림이 울립니다. 이 낮은 울림은 곡 전체에 걸쳐 여러 번 나타나며, 평화 속에 드리운 죽음의 그림자 같은 묘한 긴장감을 자아냅니다. 2악장은 깊은 고독과 슬픔이 담긴 느린 노래로, 이 곡에서 가장 아름답고 가슴 아픈 부분입니다. 3악장은 가볍고 섬세한 스케르초이고, 4악장은 망설임과 희망이 교차하다가 밝게 마무리됩니다. 이 소나타는 슈베르트가 세상을 떠나고 11년이 지난 1839년에야 출판되었습니다. 40분이 넘는 긴 곡이지만, 천천히 마음을 열고 들으면 깊은 위안을 받을 수 있습니다. 슈베르트의 마지막 노래에 귀 기울여 보세요."], ["7-12", "현악4중주 12번 「아메리카」 Op.96", "드보르자크", "실내악", "여름", "여름휴가(미국 스필빌)에 쓴 곡", "드보르자크가 미국에 머물던 1893년 여름, 아이오와주의 작은 마을 스필빌에서 쓴 현악 4중주곡입니다. 스필빌은 체코 이민자들이 모여 사는 마을이어서, 드보르자크는 고향 사람들 속에서 체코 말을 쓰고 교회에서 오르간을 치며 행복한 여름휴가를 보냈습니다. 그는 이곳에서 단 사흘 만에 이 곡의 초안을 완성하고, 두 주 만에 곡을 마무리했습니다. 곡에는 미국에서 들은 흑인 영가와 아메리카 원주민의 음악, 그리고 고향 보헤미아의 정서가 한데 어우러져 있습니다. 1악장은 비올라가 넓은 들판처럼 소박하고 따뜻한 선율을 노래하며 시작하고, 2악장은 깊은 향수와 그리움이 담긴 아름다운 노래입니다. 3악장에서는 드보르자크가 스필빌에서 들은 새소리가 바이올린의 높은 음으로 등장하는데, 진홍색 깃털을 가진 북미의 새 소리를 옮겨 놓은 것이라고 합니다. 4악장은 기차를 좋아했던 드보르자크답게 기차가 달리는 듯한 경쾌한 리듬으로 활기차게 끝을 맺습니다. 미국의 넓은 대지와 고향을 향한 그리움이 함께 담긴 곡입니다. 여름휴가의 여유로움을 느끼며 들어 보세요."], ["7-13", "피아노 협주곡 2번 F장조 Op.102", "쇼스타코비치", "협주곡", "일반", "아들 생일 선물로 쓴 협주곡", "소련의 작곡가 쇼스타코비치가 1957년, 아들 막심의 열아홉 번째 생일 선물로 쓴 피아노 협주곡입니다. 피아니스트를 꿈꾸던 막심은 모스크바 음악원 졸업 연주회에서 이 곡을 직접 초연했습니다. 쇼스타코비치는 엄혹한 정치 상황 속에서 무겁고 어두운 작품을 많이 썼지만, 이 곡에는 아들을 향한 아버지의 따뜻한 사랑과 밝은 유머가 가득합니다. 1악장은 바순과 목관 악기의 경쾌한 행진 선율로 시작해, 피아노가 장난스럽고 활기차게 뛰어노는 듯한 음악을 펼칩니다. 이 협주곡에서 가장 사랑받는 것은 2악장입니다. 현악기의 부드러운 화음 위로 피아노가 고요하고 아름다운 선율을 노래하는데, 쇼스타코비치의 음악 가운데 가장 서정적이고 따뜻한 곡으로 꼽힙니다. 이 악장은 디즈니의 애니메이션 영화 「판타지아 2000」에도 쓰였습니다. 3악장은 다시 활기를 되찾아, 피아노 학생들이 지겹도록 치는 손가락 연습곡을 장난스럽게 흉내 내며 아들에게 윙크를 보내는 듯한 유머가 숨어 있습니다. 아버지가 아들에게 건넨 사랑의 선물을 들어 보세요. 가족과 함께 들어도 좋은 곡입니다."], ["7-14", "교향곡 C장조", "비제", "관현악", "일반", "프랑스 혁명기념일. 17세 비제의 교향곡", "오페라 「카르멘」으로 유명한 프랑스의 작곡가 비제가 열일곱 살이던 1855년, 파리 음악원에 다니던 시절에 쓴 교향곡입니다. 비제는 스승 구노의 교향곡을 편곡하는 과제를 하다가 영감을 얻어, 불과 한 달 만에 이 곡을 완성했다고 합니다. 그런데 비제는 이 곡을 생전에 한 번도 발표하지 않았고, 악보는 그가 세상을 떠난 뒤 파리 음악원 도서관에 보관된 채 잊혔습니다. 무려 80년 가까이 지난 1933년에야 그 악보가 발견되었고, 1935년 스위스에서 처음 연주되었습니다. 초연 이후 이 곡은 십 대 소년의 작품이라고는 믿기 어려울 만큼 완성도가 높고 매력적이라는 평가를 받으며, 지금은 자주 연주되는 인기 교향곡이 되었습니다. 1악장은 밝고 생기 넘치게 시작하고, 2악장에서는 오보에가 이국적이고 애틋한 선율을 아름답게 노래합니다. 3악장은 흥겨운 춤곡이고, 4악장은 쉴 새 없이 내달리는 경쾌하고 화려한 피날레입니다. 프랑스 특유의 우아함과 청춘의 싱그러움이 가득한 곡입니다. 오늘은 프랑스의 혁명 기념일입니다. 80년 만에 빛을 본 젊은 천재의 선물을 들어 보세요."], ["7-15", "무반주 바이올린 파르티타 2번 중 「샤콘」 BWV 1004", "바흐", "독주", "일반", "무반주 바이올린의 정점", "바흐가 쾨텐 궁정에 있던 1720년 무렵 완성한 무반주 바이올린 파르티타 2번의 마지막 악장입니다. 샤콘은 짧은 저음 선율과 화음 진행을 끝없이 반복하면서 그 위에 다양한 변주를 쌓아 가는 형식입니다. 이 곡은 오직 바이올린 한 대만으로 연주하는데도, 마치 여러 대의 악기가 함께 연주하는 듯한 화음과 대위법이 펼쳐지며, 15분 가까이 이어지는 장대한 음악입니다. 1720년 여름, 바흐가 영주를 따라 여행을 떠난 사이에 사랑하는 첫 아내 마리아 바르바라가 갑자기 세상을 떠났습니다. 돌아와서야 아내의 죽음을 알게 된 바흐가 그녀를 추모하며 이 곡을 썼다는 해석도 있지만, 확실하지는 않습니다. 곡은 장엄하고 비통한 화음으로 시작해, 슬픔과 고뇌, 체념과 위안을 차례로 지나며 거대한 인생의 여정을 그려 냅니다. 브람스는 클라라 슈만에게 보낸 편지에서 이 곡을 두고, 한 사람이 바이올린 하나로 이토록 깊고 위대한 세계를 그려 냈다는 사실에 경탄했습니다. 바이올린 음악의 정점이라 불리는 이 곡을 고요한 마음으로 들어 보세요."], ["7-16", "무반주 바이올린 소나타 2번 Op.27-2", "이자이", "독주", "기념일", "이자이 탄생일(1858.7.16)", "1858년 7월 16일 벨기에 리에주에서 태어난 바이올리니스트이자 작곡가 외젠 이자이의 작품입니다. 이자이는 '바이올린의 왕'으로 불린 당대 최고의 연주자였으며, 프랑크의 바이올린 소나타와 쇼송의 「시곡」 등 많은 명곡이 그에게 헌정되었습니다. 1923년, 바흐의 무반주 바이올린 곡을 연주하는 젊은 바이올리니스트의 연주를 듣고 영감을 받은 이자이는 여섯 곡의 무반주 바이올린 소나타를 썼습니다. 그는 각 곡을 당대의 뛰어난 바이올리니스트 한 명씩에게 헌정하며, 그들의 연주 스타일과 개성을 곡에 담았습니다. 이 2번 소나타는 프랑스의 바이올리니스트 자크 티보에게 헌정되었는데, 티보는 매일 아침 바흐를 연습하는 것으로 유명했습니다. 그래서 곡의 1악장에는 '집착'이라는 제목이 붙어 있고, 바흐의 파르티타 선율이 반복해서 튀어나오다가 중세의 장례 성가 「분노의 날」 선율과 뒤섞입니다. 마치 바흐에 사로잡혀 벗어나지 못하는 연주자를 유머러스하게 그린 듯합니다. 이후 악장들에서도 「분노의 날」이 여러 모습으로 변주됩니다. 바이올린의 왕이 남긴 무반주의 세계를 들어 보세요."], ["7-17", "수상 음악 HWV 348-350", "헨델", "관현악", "기념일", "초연일(1717.7.17, 템스강 뱃놀이)", "1717년 7월 17일, 영국 국왕 조지 1세가 템스강에서 성대한 뱃놀이를 즐길 때 처음 연주된 헨델의 관현악 모음곡입니다. 그날 저녁 왕과 귀족들은 화이트홀에서 배를 타고 강 상류의 첼시까지 거슬러 올라갔는데, 약 50명의 연주자가 탄 커다란 배가 왕의 배 옆을 따라가며 이 곡을 연주했습니다. 왕은 이 음악이 무척 마음에 들어, 오가는 동안 무려 세 번이나 다시 연주하게 했다고 합니다. 이 곡에는 재미있는 일화도 전해집니다. 헨델은 원래 독일 하노버 궁정의 악장이었는데, 휴가를 얻어 영국에 갔다가 돌아가지 않고 런던에 눌러앉았습니다. 그런데 하노버의 영주가 영국 왕 조지 1세가 되어 런던에 오자, 난처해진 헨델이 왕의 마음을 돌리려고 이 곡을 썼다는 것이지요. 하지만 이 이야기는 사실이 아닐 가능성이 높습니다. 곡은 야외의 강 위에서도 소리가 잘 들리도록 호른과 트럼펫 같은 금관악기를 화려하게 사용해, 밝고 당당하며 축제 분위기로 가득합니다. 영국의 흥겨운 춤곡 '혼파이프'도 유명합니다. 시원한 강바람을 맞으며 뱃놀이를 즐기는 기분으로 들어 보세요."], ["7-18", "디베르티멘토 D장조 K.136", "모차르트", "관현악", "여름", "시원한 현악 합주", "모차르트가 열여섯 살이던 1772년 고향 잘츠부르크에서 쓴 세 곡의 디베르티멘토 가운데 첫 곡입니다. '디베르티멘토'는 '기분 전환' 또는 '즐거움'이라는 뜻으로, 귀족들의 식사 자리나 모임에서 분위기를 돋우기 위해 연주하던 가볍고 즐거운 음악을 말합니다. 이 무렵 모차르트는 아버지와 함께 이탈리아를 여러 차례 여행하며 그곳의 밝고 노래하는 듯한 음악을 흡수했는데, 이 곡에도 이탈리아의 맑은 햇살 같은 분위기가 가득합니다. 이 곡은 현악 4중주로 연주할 수도 있고 현악 합주로 연주할 수도 있어서, 실내악과 관현악 무대 모두에서 사랑받고 있습니다. 1악장은 처음부터 밝고 생기 넘치는 선율이 시원하게 쏟아져 나오는데, 마치 여름날 아침 창문을 활짝 열었을 때처럼 상쾌한 기분을 줍니다. 2악장은 부드럽고 우아한 노래가 고요하게 흐르는 느린 악장이고, 3악장은 경쾌하고 재치 있게 질주하는 피날레입니다. 전체 길이가 15분이 채 되지 않는 짧은 곡이지만, 십 대 소년 모차르트의 천재성과 맑은 감성이 가득 담겨 있습니다. 무더운 여름, 시원한 현악기 소리로 더위를 식혀 보세요."], ["7-19", "콜 니드라이 Op.47", "브루흐", "협주곡", "일반", "첼로와 관현악", "독일의 작곡가 막스 브루흐가 1880년 영국 리버풀의 관현악단 지휘자로 일하던 시절에 쓴 첼로와 관현악을 위한 작품입니다. '콜 니드라이'는 유대교의 가장 거룩한 날인 '속죄일' 전날 저녁 예배에서 부르는 기도문의 첫 구절로, '모든 맹세'라는 뜻입니다. 이 기도는 지난 한 해 동안 신 앞에서 지키지 못한 모든 맹세를 용서해 달라고 비는 내용으로, 오랜 세월 유대인들이 애절한 선율로 불러 왔습니다. 브루흐는 리버풀의 유대인 공동체와 친분을 쌓으며 이 선율을 알게 되었고, 여기에 또 다른 유대 성가의 선율을 더해 이 곡을 썼습니다. 곡은 첼로가 사람의 목소리처럼 깊고 비통한 기도를 낮게 읊조리며 시작합니다. 마치 회당에서 기도하는 사람의 간절한 목소리를 듣는 듯하지요. 이어 하프의 반주와 함께 분위기가 밝아지며, 따뜻하고 위로가 담긴 선율이 흐릅니다. 브루흐 자신은 유대인이 아니었지만, 이 곡 때문에 훗날 나치 시대에 그의 작품이 연주 금지를 당하기도 했습니다. 첼로가 들려주는 간절한 기도에 귀 기울여 보세요."], ["7-20", "밤의 가스파르", "라벨", "독주", "여름", "여름밤의 환상(물의 요정)", "라벨이 1908년에 쓴 피아노 모음곡으로, 19세기 프랑스 시인 베르트랑의 산문 시집 「밤의 가스파르」에서 세 편의 시를 골라 음악으로 옮겼습니다. '가스파르'는 시집에 등장하는 신비로운 악마의 이름입니다. 첫 곡 「옹딘」은 물의 요정이 한 남자에게 사랑을 고백하며 호수 속 자신의 궁전으로 함께 가자고 유혹하는 이야기입니다. 남자가 거절하자 요정은 눈물을 흘리다가 깔깔 웃으며 물보라 속으로 사라지지요. 피아노의 높은 음역에서 반짝이는 물결이 끝없이 흐르는 가운데, 요정의 노래가 아름답게 울립니다. 둘째 곡 「교수대」는 해 질 녘 교수대에 매달린 시체와 멀리서 끊임없이 울리는 종소리를 그린 섬뜩하고 고요한 곡으로, 같은 음이 처음부터 끝까지 종소리처럼 반복됩니다. 셋째 곡 「스카르보」는 한밤중에 방 안을 이리저리 뛰어다니며 장난치는 난쟁이 요괴를 그린 곡으로, 순식간에 나타났다 사라지는 모습이 현란하게 펼쳐집니다. 라벨은 이 곡을 세상에서 가장 어려운 피아노곡으로 만들고 싶었다고 말했습니다. 여름밤의 신비로운 환상 속으로 들어가 보세요."], ["7-21", "피렌체의 추억 Op.70", "차이콥스키", "실내악", "여름", "이탈리아 여행의 추억", "차이콥스키가 1890년에 완성한 현악 6중주곡입니다. 그해 봄 차이콥스키는 이탈리아 피렌체에 머물며 오페라 「스페이드의 여왕」을 작곡했는데, 그때 떠오른 선율이 이 곡의 2악장 주제가 되었습니다. 그래서 이 곡에는 「피렌체의 추억」이라는 제목이 붙었지요. 이 곡은 상트페테르부르크 실내악 협회가 차이콥스키를 명예 회원으로 추대한 것에 대한 답례로 쓰였습니다. 바이올린 둘, 비올라 둘, 첼로 둘로 이루어진 여섯 대의 현악기가 함께 연주하는데, 차이콥스키는 동생에게 보낸 편지에서 여섯 개의 독립된 성부를 다루는 것이 무척 어려웠다고 털어놓았습니다. 1악장은 처음부터 힘차고 열정적으로 터져 나오며, 이탈리아의 뜨거운 햇살 같은 생동감을 줍니다. 2악장은 바이올린과 첼로가 서로 대화를 나누는 아름답고 서정적인 세레나데로, 피렌체의 낭만적인 밤을 떠올리게 합니다. 그런데 3악장과 4악장은 이탈리아가 아니라 러시아 민요풍의 선율로 가득해, 여행지의 추억과 고향을 향한 그리움이 함께 담겨 있습니다. 여름 여행의 추억을 떠올리며 들어 보세요."], ["7-22", "교향곡 8번 G장조 Op.88", "드보르자크", "관현악", "여름", "여름 별장에서 쓴 교향곡", "드보르자크가 1889년 여름, 보헤미아의 시골 마을 비소카에 있는 별장에서 두 달 남짓 만에 완성한 교향곡입니다. 드보르자크는 이곳에서 정원을 가꾸고 숲을 산책하며 비둘기를 기르는 소박한 생활을 즐겼는데, 이 교향곡에는 그 행복한 시골 생활의 기쁨과 보헤미아의 아름다운 자연이 가득 담겨 있습니다. 그래서 그의 교향곡 가운데 가장 밝고 서정적인 곡으로 꼽힙니다. 1악장은 첼로가 따뜻하고 서정적인 선율을 노래하며 시작하고, 이어 플루트가 새가 지저귀듯 맑고 경쾌한 주제를 연주합니다. 2악장은 숲속의 고요한 풍경과 새소리, 시골 마을의 소박한 축제가 차례로 그려지는 아름다운 느린 악장입니다. 3악장은 보헤미아의 왈츠처럼 우아하고 애수 어린 춤곡으로, 이 교향곡에서 가장 사랑받는 선율이 흐릅니다. 4악장은 트럼펫의 힘찬 팡파르로 시작해, 첼로가 노래하는 주제가 다양하게 변주되며 축제처럼 흥겹게 마무리됩니다. 드보르자크가 미국으로 떠나기 전, 고향에서 쓴 마지막 교향곡입니다. 한여름 보헤미아의 푸른 들판을 떠올리며 들어 보세요."], ["7-23", "소나타 E장조 K.380", "스카를라티", "독주", "일반", "건반 소나타", "이탈리아 나폴리 출신의 작곡가 도메니코 스카를라티의 건반 소나타입니다. 스카를라티는 포르투갈 궁정에서 공주 마리아 바르바라의 음악 교사로 일했고, 공주가 스페인 왕실로 시집가자 그녀를 따라 스페인으로 건너가 평생 그곳에서 지냈습니다. 그는 공주를 위해 무려 555곡이 넘는 건반 소나타를 썼는데, 대부분 한 악장으로 된 짧은 곡들입니다. 이 곡들은 스페인의 기타와 캐스터네츠, 민속춤의 리듬을 하프시코드로 옮겨 놓은 듯한 독특하고 생기 넘치는 음악으로, 당시로서는 무척 대담하고 혁신적이었습니다. 이 소나타는 그 가운데 가장 사랑받는 곡 가운데 하나입니다. 곡은 우아하고 당당한 선율로 시작하는데, 중간에 트럼펫과 호른의 팡파르를 흉내 낸 듯한 음형이 나타나, 마치 궁정의 화려한 행렬이 천천히 지나가는 모습을 보는 듯합니다. 4분 남짓의 짧은 곡이지만, 바로크 시대 궁정의 품격과 우아함이 가득 담겨 있습니다. 전설적인 피아니스트 호로비츠가 연주회의 앙코르로 즐겨 연주하면서 피아노곡으로도 널리 알려졌습니다. 스페인 궁정의 우아한 오후를 상상하며 들어 보세요."], ["7-24", "플루트 협주곡 「바다의 폭풍」 RV 433", "비발디", "협주곡", "여름", "여름 태풍", "비발디가 1728년 무렵 출판한 여섯 곡의 플루트 협주곡집의 첫 곡입니다. 4월에 들었던 「홍방울새」와 같은 곡집에 실려 있지요. 이 곡의 제목 「바다의 폭풍」은 이탈리아어로 '라 템페스타 디 마레'입니다. 비발디가 살던 베네치아는 바다 위에 세워진 도시로, 사람들은 늘 바다와 함께 살아가며 그 아름다움과 함께 무서움도 잘 알고 있었습니다. 비발디는 같은 제목의 바이올린 협주곡도 썼을 만큼 바다의 폭풍을 음악으로 그려 내는 데 관심이 많았습니다. 1악장은 오케스트라가 거센 파도처럼 오르내리는 빠른 음계를 쉴 새 없이 연주하는 가운데, 플루트가 높은 음역에서 날카롭게 휘몰아치는 바람과 물보라를 그려 냅니다. 2악장은 폭풍이 잠시 잦아든 듯 고요하고 서정적인 노래가 흐르는 짧은 쉼의 시간입니다. 3악장에서는 다시 폭풍이 몰아치며, 플루트가 화려하고 빠른 기교를 쏟아 내면서 거센 파도를 헤치고 나아가는 배를 생생하게 그립니다. 여름은 태풍의 계절이지요. 300년 전 베네치아의 바다에 몰아친 폭풍을 함께 느껴 보세요."], ["7-25", "피아노 소나타 17번 「템페스트」 Op.31-2", "베토벤", "독주", "여름", "여름 폭풍", "베토벤이 1802년에 쓴 피아노 소나타입니다. 이 해에 베토벤은 점점 나빠지는 청력 때문에 깊은 절망에 빠져, 빈 근교의 하일리겐슈타트에서 동생들에게 유서 같은 편지를 남기기도 했습니다. 이 곡에 「템페스트」라는 별명이 붙게 된 데에는 일화가 있습니다. 베토벤의 비서였던 쉰들러가 이 곡의 의미를 묻자, 베토벤이 \"셰익스피어의 「템페스트」를 읽어 보게\"라고 대답했다는 것이지요. 다만 쉰들러의 증언은 믿기 어려운 경우가 많아, 이 이야기도 사실인지는 확실하지 않습니다. 1악장은 느리고 신비로운 화음과 빠르고 격정적인 음표가 번갈아 나타나며 폭풍 전야의 긴장감을 자아냅니다. 중간에는 오페라 가수가 대사를 읊조리듯 피아노가 홀로 쓸쓸하게 노래하는 독특한 부분도 있습니다. 2악장은 깊고 고요한 명상의 음악이고, 3악장은 말발굽 소리처럼 같은 리듬이 끝없이 이어지는 '무궁동'으로, 쉼 없이 몰아치는 바람처럼 휘몰아칩니다. 베토벤의 내면에서 일어난 폭풍과 그것을 견뎌 내는 힘이 담긴 곡입니다. 여름 폭풍이 지나가는 날 들어 보세요."], ["7-26", "녹턴 5번 B♭장조", "필드", "독주", "기념일", "녹턴 창시자 필드 탄생일(1782.7.26)", "1782년 7월 26일 아일랜드 더블린에서 태어난 피아니스트이자 작곡가 존 필드의 녹턴입니다. 필드는 어린 시절 피아노 신동으로 이름을 알렸고, 이탈리아 출신의 피아니스트 클레멘티의 제자가 되어 그의 피아노 가게에서 손님들에게 피아노를 시범 연주하는 일을 하기도 했습니다. 이후 스승을 따라 러시아로 건너간 그는 상트페테르부르크와 모스크바에서 큰 인기를 누리며 평생 그곳에서 활동했습니다. 필드가 음악사에 남긴 가장 큰 업적은 바로 '녹턴'이라는 피아노 장르를 처음 만든 것입니다. 녹턴은 '밤의 노래'라는 뜻으로, 왼손이 부드럽게 펼쳐지는 화음 반주를 이어 가는 동안 오른손이 노래하듯 서정적인 선율을 들려주는 피아노 소품입니다. 필드는 열여덟 곡의 녹턴을 남겼는데, 이 형식은 훗날 쇼팽에게 이어져 더욱 아름답게 꽃피었습니다. 이 녹턴 5번은 그 가운데 가장 사랑받는 곡으로, 고요한 밤하늘 아래 은은하게 흐르는 노래처럼 소박하고 따뜻합니다. 화려함 대신 맑고 순수한 서정이 마음을 편안하게 해 줍니다. 녹턴의 아버지를 기억하며 무더운 여름밤에 들어 보세요."], ["7-27", "스페인 무곡 5번 「안달루사」", "그라나도스", "독주", "기념일", "그라나도스 탄생일(1867.7.27)", "1867년 7월 27일 스페인 카탈루냐 지방의 레리다에서 태어난 엔리케 그라나도스의 피아노곡입니다. 그라나도스는 알베니스, 파야와 함께 스페인 민족 음악을 대표하는 작곡가로, 1890년 무렵 열두 곡의 「스페인 무곡」을 발표해 이름을 알렸습니다. 그 다섯 번째 곡인 「안달루사」는 스페인 남부 안달루시아 지방의 분위기를 담은 곡으로, 그라나도스의 작품 가운데 가장 유명합니다. 곡은 기타를 튕기는 듯한 반주 위로, 플라멩코 가수의 노래처럼 애절하고 정열적인 선율이 흐르며 시작합니다. 가운데 부분에서는 장조로 바뀌어 부드럽고 꿈결 같은 선율이 흐르다가, 다시 처음의 애수 어린 선율로 돌아옵니다. 이 곡은 기타로 편곡되어 연주되는 경우가 많아, 기타 레퍼토리로도 무척 사랑받고 있습니다. 그라나도스는 안타까운 최후를 맞았습니다. 1916년 미국에서 자신의 오페라 초연을 마치고 돌아오던 중, 1차 세계대전 중이던 영국 해협에서 그가 탄 배가 독일 잠수함의 어뢰 공격을 받았습니다. 그는 바다에 빠진 아내를 구하려다 함께 목숨을 잃었습니다. 그의 생일을 맞아 들어 보세요."], ["7-28", "브란덴부르크 협주곡 5번 BWV 1050", "바흐", "관현악", "기념일", "바흐 서거일(1750.7.28)", "1750년 7월 28일 라이프치히에서 세상을 떠난 바흐의 브란덴부르크 협주곡 가운데 다섯 번째 곡입니다. 이 곡에서는 플루트, 바이올린, 하프시코드가 독주 악기로 등장하는데, 특히 하프시코드의 역할이 무척 특별합니다. 당시 하프시코드는 주로 다른 악기들의 뒤에서 화음을 채워 주는 반주 악기였는데, 바흐는 이 곡에서 하프시코드를 당당한 독주 악기로 내세웠습니다. 그래서 이 곡은 훗날 피아노 협주곡으로 이어지는 '건반 협주곡'의 시작으로 평가받습니다. 바흐가 일하던 쾨텐 궁정이 베를린에서 새 하프시코드를 사 들였는데, 바흐가 그 새 악기의 성능을 뽐내기 위해 이 곡을 썼다는 설도 있습니다. 1악장의 끝부분에서는 다른 악기들이 모두 멈추고, 하프시코드가 홀로 3분 가까이 눈부시게 화려한 독주를 펼치는데, 이 대목은 바흐 자신의 뛰어난 연주 실력을 떠올리게 합니다. 2악장은 세 독주 악기만이 나누는 고요하고 섬세한 대화이고, 3악장은 경쾌하고 생기 넘치는 춤곡입니다. '음악의 아버지' 바흐를 기억하며 그의 빛나는 음악을 들어 보세요."], ["7-29", "아랑후에스 협주곡", "로드리고", "협주곡", "여름", "스페인의 여름 정원", "스페인의 작곡가 호아킨 로드리고가 1939년에 쓴 기타 협주곡입니다. 로드리고는 세 살 때 디프테리아를 앓아 시력을 잃었지만, 점자 악보로 음악을 공부해 뛰어난 작곡가가 되었습니다. 아랑후에스는 마드리드 남쪽에 있는 스페인 왕실의 여름 별궁으로, 아름다운 정원과 분수, 강이 어우러진 곳입니다. 로드리고는 이 곳의 정원에 깃든 옛 스페인 궁정의 우아함과 향기를 음악에 담고자 했습니다. 기타는 소리가 작아 큰 오케스트라와 함께 연주하는 협주곡에는 어울리지 않는다고 여겨졌는데, 로드리고는 오케스트라의 편성을 섬세하게 조절해 기타의 소리가 또렷이 들리도록 했습니다. 1악장은 기타의 경쾌하고 정열적인 리듬으로 시작합니다. 이 곡에서 가장 유명한 2악장은 잉글리시 호른이 애절하고 깊은 슬픔이 담긴 선율을 노래하고, 기타가 이를 받아 이어 가는 아름다운 악장입니다. 로드리고의 아내는 훗날 이 악장이 신혼 시절 첫아이를 잃은 슬픔과 그 고통 속에서의 기도를 담고 있다고 밝혔습니다. 3악장은 궁정의 우아한 춤곡으로 밝게 마무리됩니다. 스페인 왕궁의 여름 정원을 거닐어 보세요."], ["7-30", "현악 8중주 E♭장조 Op.20", "멘델스존", "실내악", "일반", "16세 천재의 명작", "멘델스존이 열여섯 살이던 1825년에 쓴 현악 8중주곡입니다. 그는 이 곡을 바이올린 선생님이자 친구였던 에두아르트 리츠의 생일 선물로 썼습니다. 이 곡은 열여섯 살 소년이 썼다고는 믿기 어려울 만큼 완벽하고 독창적이어서, 음악사에서 가장 놀라운 천재의 작품 가운데 하나로 꼽힙니다. 모차르트도 이 나이에 이만한 곡을 쓰지는 못했다는 평가를 받을 정도이지요. 바이올린 넷, 비올라 둘, 첼로 둘로 이루어진 여덟 대의 현악기가 함께 연주하는데, 멘델스존은 악보에 이 곡을 관현악처럼 풍성하고 힘차게 연주해야 한다고 적었습니다. 1악장은 바이올린이 힘차고 열정적으로 솟구치는 선율을 노래하며 시작해, 젊음의 생명력과 환희로 가득 차 있습니다. 2악장은 부드럽고 서정적인 노래이고, 이 곡에서 가장 유명한 3악장 스케르초는 아주 가볍고 빠른 음표들이 속삭이듯 날아다니는 요정의 음악입니다. 멘델스존은 괴테의 「파우스트」에 나오는 요정들이 바람을 타고 날아가는 장면을 떠올리며 이 악장을 썼다고 합니다. 4악장은 여덟 대의 악기가 뒤엉키며 내달리는 화려한 피날레입니다. 천재 소년의 선물을 들어 보세요."], ["7-31", "스페인 기상곡 Op.34", "림스키코르사코프", "관현악", "여름", "남국의 여름 축제", "러시아의 작곡가 림스키코르사코프가 1887년에 쓴 관현악곡입니다. 림스키코르사코프는 젊은 시절 해군 장교로 세계를 항해하며 다양한 나라의 음악을 접했는데, 이 곡에서는 스페인의 민속 선율과 춤곡 리듬을 바탕으로 남국의 뜨거운 열정과 축제 분위기를 화려하게 그려 냈습니다. 곡은 쉬지 않고 이어지는 다섯 부분으로 이루어져 있습니다. 스페인 북부 지방의 흥겨운 춤곡 '알보라다'로 힘차게 시작해, 여러 악기가 차례로 선율을 이어 가는 우아한 변주곡을 지나, 다시 알보라다가 돌아옵니다. 네 번째 부분 '장면과 집시의 노래'에서는 바이올린, 플루트, 클라리넷, 하프가 차례로 홀로 즉흥 연주를 하듯 화려한 독주를 펼친 뒤, 집시의 정열적인 춤이 벌어집니다. 마지막 부분은 스페인 북부의 춤곡 '판당고'로, 캐스터네츠와 탬버린이 요란하게 울리는 가운데 열광적인 절정으로 치닫습니다. 초연 리허설에서 단원들은 곡이 너무 훌륭해 연주 도중 박수를 쳤다고 하며, 림스키코르사코프는 감사의 뜻으로 이 곡을 단원들에게 헌정했습니다. 7월의 마지막 날, 남국의 축제를 즐겨 보세요."], ["8-1", "사계 Op.37 중 「8월: 추수」", "차이콥스키", "독주", "계절 표제", "표제 자체가 8월", "차이콥스키의 피아노 모음곡 「사계」 가운데 8월의 곡입니다. 러시아의 8월은 한 해 동안 땀 흘려 가꾼 곡식을 거두어들이는 수확의 계절입니다. 이 곡에는 7월의 곡과 같은 시인 콜초프의 시에서 따온, 온 가족이 들판에 나가 키 큰 호밀을 베고 단을 묶어 수레에 싣는 모습을 노래한 구절이 붙어 있습니다. 곡은 빠르고 경쾌한 리듬이 쉴 새 없이 이어지며 시작하는데, 마치 수확 철을 맞아 들판 여기저기서 사람들이 바쁘게 움직이는 모습 같습니다. 낫질하는 소리, 곡식 단을 나르는 발걸음, 서로를 부르는 목소리가 피아노의 빠른 음표 속에 활기차게 담겨 있지요. 가운데 부분에서는 속도가 느려지고 부드럽고 서정적인 선율이 흐르는데, 바쁜 일을 잠시 멈추고 들판에 앉아 쉬며 노을을 바라보는 사람들의 모습이 떠오릅니다. 그리고 다시 처음의 분주한 리듬으로 돌아와 경쾌하게 마무리됩니다. 한여름의 무더위 속에서도 곧 다 에서 큰 인기를 끌며 비발디의 이름을 널리 알렸고, 협주곡이라는 형식이 유럽에 퍼지는 데 큰 역할을 했습니다. 이 곡은 네 대의 바이올린과 첼로가 독주를 맡는 독특한 협주곡입니다. 네 대의 바이올린은 서로 주제를 주고받기도 하고, 한꺼번에 함께 노래하기도 하며, 화려하게 경쟁하듯 기교를 뽐내기도 합니다. 1악장은 힘차고 생기 넘치며, 2악장에서는 네 대의 바이올린이 저마다 다른 리듬으로 화음을 잘게 쪼개어 연주하는데, 이 서로 다른 음형들이 겹쳐지며 신비롭게 반짝이는 소리의 물결을 만들어 냅니다. 3악장은 다시 활기찬 춤곡으로 마무리됩니다. 바흐는 이 협주곡집을 깊이 연구했는데, 특히 이 곡을 네 대의 하프시코드를 위한 협주곡으로 편곡하기도 했습니다. 두 곡을 비교해 들어 보는 것도 큰 즐거움입니다. 네 대의 바이올린이 펼치는 생동감 넘치는 대화에 귀 기울여 보세요."], ["8-6", "스케르초 2번 b♭단조 Op.31", "쇼팽", "독주", "일반", "쇼팽 명곡", "쇼팽이 1837년에 쓴 네 곡의 스케르초 가운데 두 번째 곡으로, 가장 사랑받는 곡입니다. '스케르초'는 원래 이탈리아어로 '농담'이라는 뜻으로, 교향곡이나 소나타 속의 빠르고 익살스러운 악장을 말합니다. 그런데 쇼팽은 이 형식을 독립된 피아노곡으로 만들면서, 농담과는 거리가 먼 극적이고 열정적인 음악으로 탈바꿈시켰습니다. 곡은 아주 작은 소리로 속삭이듯 낮은 음역에서 세 음을 연주한 뒤, 갑자기 건반 전체를 울리는 강렬한 화음이 터져 나오며 시작합니다. 쇼팽의 제자는 스승이 이 첫 소절을 마치 질문을 던지듯, 그리고 무언가 망설이듯 연주하라고 가르쳤다고 회고했습니다. 이어 오른손이 넓은 음역을 넘나들며 열정적이고 아름다운 선율을 노래합니다. 가운데 부분에서는 분위기가 바뀌어 꿈결 같은 고요한 선율이 흐르다가, 점점 격렬하게 고조되며 다시 처음의 극적인 분위기로 돌아옵니다. 그리고 마지막에는 눈부신 기교와 함께 찬란하고 화려하게 끝을 맺습니다. 질문과 대답, 고요와 폭풍이 교차하는 이 곡을 들으며 쇼팽의 깊은 열정을 느껴 보세요."], ["8-7", "바이올린 협주곡 3번 b단조 Op.61", "생상스", "협주곡", "일반", "프랑스 낭만 협주곡", "생상스가 1880년, 스페인의 바이올린 거장 사라사테를 위해 쓴 세 번째이자 마지막 바이올린 협주곡입니다. 4월에 들었던 「서주와 론도 카프리치오소」에 이어, 두 사람의 오랜 우정이 낳은 또 하나의 명곡이지요. 생상스는 이 곡에서 사라사테의 맑고 아름다운 음색과 화려한 기교를 마음껏 펼칠 수 있도록 했습니다. 1악장은 바이올린이 낮은 음역에서 힘차고 열정적인 주제를 연주하며 시작해, 비극적이고 극적인 분위기로 펼쳐집니다. 2악장은 이 곡에서 가장 아름다운 부분으로, 6박자의 부드럽게 흔들리는 리듬 위에서 바이올린이 뱃노래처럼 서정적인 선율을 노래합니다. 특히 악장의 마지막 부분에서는 바이올린이 줄을 살짝 건드려 내는 투명하고 신비로운 하모닉스 소리와 클라리넷의 부드러운 소리가 어우러지며 꿈결 같은 여운을 남깁니다. 3악장은 다시 극적인 분위기로 시작하지만, 중간에 금관악기가 찬송가처럼 장엄한 코랄 선율을 울리며 분위기가 밝아지고, 마침내 승리에 찬 화려한 결말로 끝을 맺습니다. 바이올린의 아름다움을 아낌없이 보여 주는 곡입니다."], ["8-8", "헝가리 무곡 5번", "브람스", "관현악", "여름", "한여름 축제 기분", "브람스가 1869년과 1880년 두 차례에 걸쳐 출판한 스물한 곡의 「헝가리 무곡」 가운데 다섯 번째 곡으로, 가장 유명한 곡입니다. 원래는 두 사람이 한 대의 피아노에 나란히 앉아 연주하는 피아노 연탄곡으로 쓰였지만, 지금은 관현악으로 편곡한 버전이 더 자주 연주됩니다. 브람스는 스무 살 무렵 헝가리 출신의 바이올리니스트와 함께 연주 여행을 다니며 헝가리 집시 음악의 정열적인 매력에 푹 빠졌고, 그때 들은 선율들을 바탕으로 이 무곡들을 썼습니다. 그런데 이 다섯 번째 곡의 선율은 사실 헝가리의 한 작곡가가 쓴 곡을 바탕으로 하고 있는데, 브람스는 그것을 민요로 알고 사용했다고 합니다. 곡은 처음부터 정열적이고 애수 어린 선율이 힘차게 터져 나오며 시작합니다. 갑자기 빨라졌다가 느려지고, 크게 터졌다가 작게 속삭이는 등 템포와 셈여림이 자유롭게 변하며 집시 음악 특유의 즉흥적인 열정을 그려 냅니다. 찰리 채플린의 영화 「위대한 독재자」에서는 이발사가 이 곡의 리듬에 맞춰 손님의 면도를 하는 유쾌한 장면으로도 유명합니다. 한여름의 뜨거운 열정을 느껴 보세요."], ["8-9", "건반 모음곡 HWV 437 중 「사라반드」", "헨델", "독주", "일반", "장중한 바로크 선율", "헨델이 남긴 건반 모음곡 가운데 한 곡에 실린 사라반드입니다. 사라반드는 원래 스페인과 라틴아메리카에서 유래한 춤으로, 처음에는 빠르고 정열적인 춤이었지만, 바로크 시대 유럽의 궁정에서는 느리고 장중하며 위엄 있는 춤으로 바뀌었습니다. 보통 3박자로 되어 있으며, 둘째 박에 무게가 실리는 독특한 리듬이 특징입니다. 이 곡은 헨델이 젊은 시절에 썼던 것으로 보이며, 단순하면서도 깊은 비장미를 지닌 화음 진행 위에서 몇 가지 변주가 펼쳐집니다. 그 장엄하고 비극적인 분위기는 세월이 흘러도 사람들의 마음을 강하게 사로잡았습니다. 이 곡은 1975년 스탠리 큐브릭 감독의 영화 「배리 린든」에서 관현악으로 편곡되어 주제 음악으로 쓰이면서 세계적으로 유명해졌습니다. 영화 속에서 팀파니의 낮은 북소리와 함께 반복되는 이 선율은 운명의 무게와 인생의 덧없음을 강렬하게 드러냅니다. 이후 광고와 드라마, 다큐멘터리 등에도 자주 쓰이며 많은 사람에게 친숙해졌지요. 300년 전의 춤곡이 지금 들어도 이토록 깊은 울림을 준다는 것이 놀랍습니다. 고요한 저녁, 장엄한 선율에 마음을 기대어 보세요."], ["8-10", "바이올린 협주곡 a단조 Op.82", "글라주노프", "협주곡", "기념일", "글라주노프 탄생일(1865.8.10)", "1865년 8월 10일 러시아 상트페테르부르크에서 태어난 글라주노프가 1904년에 쓴 바이올린 협주곡입니다. 이 곡은 당시 상트페테르부르크 음악원의 교수이자 러시아 바이올린 음악의 아버지로 불린 레오폴트 아우어에게 헌정되었고, 이듬해 그의 독주로 초연되었습니다. 아우어는 하이페츠와 같은 위대한 바이올리니스트를 길러 낸 스승이기도 합니다. 이 협주곡은 일반적인 협주곡처럼 세 개의 악장으로 나뉘어 있지 않고, 세 부분이 쉬지 않고 하나로 이어지는 독특한 구성을 가지고 있습니다. 곡은 바이올린이 처음부터 따뜻하고 애수 어린 선율을 노래하며 시작하는데, 러시아 특유의 우수와 서정이 가득합니다. 이어 느리고 깊은 노래가 흐르고, 바이올린이 홀로 화려하고 어려운 기교를 펼치는 카덴차를 지나면, 분위기가 완전히 바뀌어 트럼펫의 경쾌한 팡파르와 함께 밝고 흥겨운 피날레가 시작됩니다. 바이올린이 사냥 나팔을 흉내 내기도 하고, 탬버린과 트라이앵글이 울리는 가운데 축제처럼 화려하게 끝을 맺습니다. 20분 남짓한 짧은 협주곡이지만, 아름다운 선율이 가득합니다. 글라주노프의 생일을 맞아 들어 보세요."], ["8-11", "피아노 소나타 11번 「터키 행진곡」 K.331", "모차르트", "독주", "일반", "친숙한 명곡", "모차르트가 1783년 무렵 쓴 피아노 소나타 11번의 마지막 악장으로, 「터키 행진곡」이라는 이름으로 더 유명합니다. 이 소나타는 일반적인 소나타와 달리, 첫 악장이 우아하고 부드러운 주제와 여섯 개의 변주로 이루어져 있고, 둘째 악장은 미뉴에트, 셋째 악장이 바로 '터키풍으로'라는 지시가 붙은 이 론도입니다. 18세기 유럽에서는 오스만 제국 군악대의 음악이 크게 유행했습니다. 오스만 제국은 1683년 빈을 포위했을 만큼 유럽을 위협하는 강대국이었는데, 전쟁이 끝난 뒤에도 그 군악대의 큰북과 심벌즈, 트라이앵글이 울리는 이국적이고 힘찬 소리는 유럽 사람들에게 신기하고 매력적으로 다가왔습니다. 모차르트도 이 유행을 받아들여, 피아노로 터키 군악대의 행진을 재치 있게 흉내 냈습니다. 경쾌한 행진 리듬과 왼손의 힘찬 화음이 마치 큰북과 심벌즈 소리처럼 울려 퍼지지요. 누구나 한 번쯤 들어 보았을 만큼 친숙하고 즐거운 곡입니다. 2014년에는 헝가리에서 이 소나타의 모차르트 자필 악보 일부가 발견되어 화제가 되기도 했습니다. 무더위를 잊게 하는 경쾌한 행진을 즐겨 보세요."], ["8-12", "이탈리아 기상곡 Op.45", "차이콥스키", "관현악", "여름", "이탈리아 여름 축제", "차이콥스키가 1880년, 이탈리아 로마에 머물던 시기에 쓴 관현악곡입니다. 그해 겨울과 봄, 그는 로마에서 사육제 기간을 보내며 이탈리아 사람들의 활기찬 축제와 거리의 음악에 깊은 인상을 받았습니다. 차이콥스키는 숙소 근처의 이탈리아 기병대 막사에서 매일 저녁 들려오는 트럼펫 신호 소리를 들었는데, 그 소리가 바로 이 곡의 첫머리를 여는 팡파르가 되었습니다. 이어 현악기가 무겁고 애수 어린 선율을 노래하는데, 이 무렵 아버지를 잃은 슬픔이 담겨 있다는 해석도 있습니다. 곧이어 분위기가 바뀌어, 그가 거리에서 들은 이탈리아의 민요와 노래들이 차례로 등장하며 점점 밝고 흥겨워집니다. 오보에가 연주하는 사랑스러운 민요 선율은 우아하게 흐르고, 오케스트라 전체가 축제의 행렬처럼 화려하게 펼쳐지지요. 그리고 마지막에는 이탈리아 남부의 빠르고 열광적인 민속춤 '타란텔라'의 리듬이 숨 가쁘게 몰아치며 축제의 절정으로 치닫습니다. 러시아 작곡가의 눈에 비친 이탈리아의 밝은 햇살과 뜨거운 열정이 고스란히 담긴 곡입니다. 한여름 이탈리아의 축제 속으로 떠나 보세요."], ["8-13", "피아노 협주곡 1번 E♭장조", "리스트", "협주곡", "일반", "화려한 낭만 협주곡", "리스트가 1830년대부터 구상해 1849년에 완성하고, 1855년 독일 바이마르에서 자신의 독주와 베를리오즈의 지휘로 초연한 피아노 협주곡입니다. 리스트는 당대 최고의 피아니스트였기에, 이 곡에는 그의 눈부신 기교와 화려한 무대 매너가 고스란히 담겨 있습니다. 이 협주곡은 네 부분으로 나뉘지만 쉬지 않고 하나로 이어지며, 처음에 나온 주제들이 곡 전체에 걸쳐 모습을 바꾸어 다시 등장하는 독특한 구성을 가지고 있습니다. 곡은 현악기의 강렬한 주제와 피아노의 폭발적인 옥타브로 웅장하게 시작합니다. 이어 피아노가 꿈결처럼 서정적인 선율을 노래하는 고요한 부분이 펼쳐지고, 셋째 부분에서는 트라이앵글이 맑고 경쾌하게 울리며 장난스러운 스케르초가 시작됩니다. 당시 빈의 한 비평가는 이 트라이앵글을 두고 이 곡을 '트라이앵글 협주곡'이라고 비꼬기도 했지만, 그 반짝이는 소리는 오히려 이 곡의 매력이 되었습니다. 마지막 부분에서는 앞에서 나온 주제들이 행진곡처럼 당당하게 변신해 찬란하게 마무리됩니다. 20분 남짓한 짧은 협주곡이지만 화려함과 서정이 가득합니다. 피아노의 왕이 펼치는 무대를 즐겨 보세요."], ["8-14", "교향곡 3번 「영웅」 Op.55", "베토벤", "관현악", "기념일", "광복절 전야, 자유와 영웅의 교향곡", "베토벤이 1803년부터 이듬해 사이에 쓴 교향곡입니다. 베토벤은 프랑스 혁명의 자유와 평등 정신을 지지했고, 그 이상을 실현할 영웅으로 나폴레옹을 존경해 이 교향곡을 그에게 바치려 했습니다. 그런데 1804년 나폴레옹이 스스로 황제 자리에 올랐다는 소식을 들은 베토벤은 크게 분노하며 \"그도 결국 평범한 인간일 뿐이구나\"라고 외치고, 악보 표지에 적힌 나폴레옹의 이름을 펜으로 박박 지워 버렸다고 제자가 전합니다. 이후 이 곡에는 '한 영웅의 추억을 기리며'라는 부제가 붙었습니다. 이 교향곡은 당시까지의 교향곡보다 훨씬 길고 웅장해서, 교향곡의 역사를 새로 쓴 작품으로 평가받습니다. 1악장은 오케스트라 전체가 두 번의 힘찬 화음을 내리치며 시작해, 영웅의 투쟁과 승리를 장대하게 그려 냅니다. 2악장은 영웅의 죽음을 애도하는 장송 행진곡으로, 깊은 슬픔과 장엄함이 가득합니다. 3악장은 활기찬 스케르초이고, 4악장은 하나의 주제가 다양하게 변주되며 환희에 차 마무리됩니다. 광복절 전날, 자유를 위해 싸운 이들을 기억하며 들어 보세요."], ["8-15", "핀란디아 Op.26", "시벨리우스", "관현악", "기념일", "광복절. 핀란드 독립의 상징이 된 곡", "핀란드의 작곡가 시벨리우스가 1899년에 쓴 교향시입니다. 당시 핀란드는 러시아 제국의 지배를 받고 있었는데, 러시아는 핀란드의 언론과 문화를 억압하며 자치권을 빼앗으려 했습니다. 이에 맞서 핀란드 사람들은 언론의 자유를 지키기 위한 행사를 열었고, 시벨리우스는 그 행사를 위해 핀란드의 역사를 그린 음악을 썼습니다. 그 마지막 곡을 고쳐 만든 것이 바로 「핀란디아」입니다. 이 곡이 핀란드 사람들의 민족의식을 크게 일깨우자 러시아는 연주를 금지했고, 핀란드 사람들은 다른 제목을 붙여 몰래 연주하며 이 곡을 지켜 냈습니다. 곡은 금관악기의 어둡고 무거운 화음으로 시작하는데, 억압받는 민족의 고통과 울분이 느껴집니다. 이어 투쟁의 리듬이 힘차게 몰아치다가, 곡의 중간에 목관 악기와 현악기가 고요하고 숭고한 찬송가 같은 선율을 노래합니다. 이 선율은 훗날 가사가 붙어 「핀란디아 찬가」가 되었고, 핀란드의 '제2의 국가'로 불리고 있습니다. 그리고 마지막에는 승리의 환희로 장엄하게 끝을 맺습니다. 1917년 핀란드는 마침내 독립했습니다. 광복절, 자유의 소중함을 되새기며 들어 보세요."], ["8-16", "현악 5중주 C장조 D.956", "슈베르트", "실내악", "일반", "실내악의 걸작", "슈베르트가 세상을 떠나기 두 달 전인 1828년 9월에 완성한 현악 5중주곡입니다. 일반적인 현악 5중주는 현악 4중주에 비올라를 한 대 더하는 경우가 많은데, 슈베르트는 첼로를 한 대 더해 낮은 음역이 한층 깊고 풍성해지도록 했습니다. 그래서 이 곡은 두 대의 첼로가 만들어 내는 따뜻하고 묵직한 울림이 특징입니다. 슈베르트는 이 곡을 출판사에 보냈지만 출판을 거절당했고, 결국 그가 세상을 떠나고 20년이 넘게 지난 뒤에야 초연되고 출판되었습니다. 지금은 실내악 역사상 가장 위대한 걸작 가운데 하나로 꼽힙니다. 1악장은 장대하고 서정적이며, 두 대의 첼로가 함께 부르는 둘째 주제는 슈베르트의 선율 가운데 가장 아름다운 것으로 꼽힙니다. 2악장 아다지오는 이 곡의 중심으로, 시간이 멈춘 듯 고요하고 깊은 명상의 음악이 흐르다가 가운데 부분에서 격렬한 고통이 터져 나온 뒤 다시 고요한 평화로 돌아옵니다. 많은 음악가들이 이 악장을 세상에서 가장 아름다운 음악 가운데 하나로 꼽습니다. 3악장과 4악장은 활기찬 춤곡입니다. 슈베르트의 마지막 숨결을 느껴 보세요."], ["8-17", "차르다시", "몬티", "독주", "여름", "뜨거운 집시 선율", "이탈리아 나폴리 출신의 작곡가이자 바이올리니스트 비토리오 몬티가 1904년에 쓴 곡입니다. 몬티는 파리에서 오케스트라의 지휘자로 일하며 여러 작품을 남겼지만, 오늘날 그의 이름은 거의 이 한 곡으로 기억되고 있습니다. '차르다시'는 헝가리의 대표적인 민속춤으로, 느리고 애수 어린 부분과 빠르고 열광적인 부분이 이어지는 것이 특징입니다. 헝가리 집시 악단들이 술집이나 잔치에서 즐겨 연주하던 춤곡이지요. 이탈리아 사람이 쓴 헝가리풍의 곡이라는 점이 재미있습니다. 곡은 바이올린이 깊은 슬픔을 토해 내듯 느리고 자유로운 선율을 노래하며 시작합니다. 이어 갑자기 빨라지면서 활기차고 정열적인 춤이 펼쳐지고, 중간에는 바이올린이 줄을 살짝 건드려 내는 투명하고 신비로운 하모닉스로 꿈결 같은 선율을 들려주는 부분도 있습니다. 그리고 다시 속도를 높여, 숨 막힐 만큼 빠르고 화려한 기교로 절정에 이르며 끝을 맺습니다. 원래는 바이올린이나 만돌린과 피아노를 위한 곡이었지만, 지금은 수많은 악기로 편곡되어 연주회의 앙코르 곡으로 큰 사랑을 받고 있습니다. 뜨거운 집시의 열정을 느껴 보세요."], ["8-18", "첼로 소나타 3번 A장조 Op.69", "베토벤", "실내악", "일반", "첼로 소나타 명곡", "베토벤이 1807년부터 이듬해 사이에 쓴 첼로 소나타로, 그가 남긴 다섯 곡의 첼로 소나타 가운데 가장 사랑받는 곡입니다. 베토벤 이전의 첼로 소나타에서는 피아노가 주인공이고 첼로는 주로 낮은 음을 받쳐 주는 반주 역할에 머물렀습니다. 그런데 베토벤은 이 곡에서 첼로와 피아노를 완전히 대등한 동반자로 만들었습니다. 곡의 첫머리에서 첼로가 홀로 따뜻하고 넉넉한 선율을 노래하며 시작하는 것도 그런 변화를 잘 보여 줍니다. 베토벤은 이 곡을 친구 글라이헨슈타인 남작에게 헌정했는데, 친구에게 준 악보에 라틴어로 \"눈물과 슬픔 속에서\"라는 의미심장한 구절을 적어 넣었습니다. 이 무렵 베토벤은 청력이 더욱 나빠지고 있었고, 빈은 나폴레옹 전쟁의 혼란 속에 있었지요. 하지만 곡 자체는 슬픔보다 밝고 따뜻한 기운이 가득합니다. 1악장은 넓고 서정적이며, 2악장은 엇박자의 리듬이 재미있는 스케르초입니다. 3악장은 짧고 고요한 아다지오로 시작해 곧바로 밝고 활기찬 마지막 부분으로 이어집니다. 첼로와 피아노가 나누는 깊고 따뜻한 대화에 귀 기울여 보세요."], ["8-19", "루마니아 랩소디 1번 Op.11", "에네스쿠", "관현악", "기념일", "에네스쿠 탄생일(1881.8.19)", "1881년 8월 19일 루마니아에서 태어난 작곡가이자 바이올리니스트 조르제 에네스쿠의 관현악곡입니다. 에네스쿠는 루마니아가 낳은 가장 위대한 음악가로, 일곱 살에 빈 음악원에 입학한 신동이었으며, 바이올리니스트 메뉴인의 스승으로도 유명합니다. 그는 열아홉 살이던 1901년, 어린 시절 고향에서 들었던 루마니아의 민요와 시골 악단의 춤곡을 엮어 이 곡을 썼습니다. 곡은 클라리넷과 오보에가 소박하고 정겨운 루마니아 민요를 주고받으며 시작합니다. 시골 주점에서 술 한 잔을 앞에 두고 흥얼거리는 노래 같은 이 선율은 루마니아 사람이라면 누구나 아는 노래입니다. 이어 다양한 민요와 춤곡이 차례로 등장하며 점점 빨라지고, 오케스트라 전체가 흥겨운 시골 잔치처럼 열광적으로 고조됩니다. 바이올린이 집시 악단처럼 신나게 활을 켜고, 심벌즈와 북이 요란하게 울리는 가운데 축제는 숨 가쁜 절정에 이르지요. 이 곡은 큰 인기를 얻었지만, 에네스쿠 자신은 다른 진지한 작품들이 이 곡에 가려지는 것을 아쉬워했다고 합니다. 그의 생일을 맞아 루마니아의 흥겨운 잔치에 함께해 보세요."], ["8-20", "바이올린 협주곡 5번 「터키풍」 K.219", "모차르트", "협주곡", "일반", "모차르트 협주곡", "모차르트가 열아홉 살이던 1775년, 고향 잘츠부르크에서 쓴 바이올린 협주곡입니다. 놀랍게도 모차르트는 그해 몇 달 사이에 다섯 곡의 바이올린 협주곡을 잇달아 썼는데, 이 곡은 그 마지막 곡이자 가장 완성도 높은 작품으로 꼽힙니다. 당시 모차르트는 잘츠부르크 궁정 악단의 악장으로 일하며 직접 바이올린을 연주하기도 했습니다. 1악장은 오케스트라의 밝은 서주에 이어 바이올린이 뜻밖에도 느리고 꿈결 같은 선율로 조용히 등장했다가, 곧 활기찬 주제로 바뀌며 시작하는 재미있는 구성을 가지고 있습니다. 2악장은 우아하고 서정적인 노래가 고요하게 흐르는 아름다운 느린 악장입니다. 「터키풍」이라는 별명은 3악장 때문에 붙었습니다. 3악장은 우아하고 단정한 미뉴에트로 시작하는데, 중간에 갑자기 분위기가 확 바뀌어 단조의 거칠고 이국적인 '터키풍' 행진이 펼쳐집니다. 이때 첼로와 더블베이스 연주자들은 활의 나무 부분으로 줄을 두드려 북소리 같은 효과를 내지요. 그리고 다시 우아한 미뉴에트로 돌아와 조용히 끝납니다. 젊은 모차르트의 재치와 우아함이 가득한 곡입니다."], ["8-21", "2대의 바이올린을 위한 협주곡 BWV 1043", "바흐", "협주곡", "일반", "바로크 협주곡", "바흐가 두 대의 바이올린과 현악 합주를 위해 쓴 협주곡으로, 흔히 「두 대의 바이올린을 위한 협주곡」 또는 '더블 협주곡'이라고 불립니다. 바흐는 라이프치히에서 대학생과 음악가들로 이루어진 합주단을 이끌며 커피하우스에서 정기적으로 연주회를 열었는데, 이 곡도 그런 연주회에서 연주되었을 것으로 여겨집니다. 이 곡에서 두 대의 바이올린은 누가 주인공이고 누가 반주자인지 구분할 수 없을 만큼 완전히 대등하게 활약합니다. 1악장은 두 대의 바이올린이 같은 주제를 앞뒤로 쫓아가며 연주하는 생기 넘치고 힘찬 음악입니다. 이 곡에서 가장 아름다운 부분은 2악장 라르고입니다. 현악 합주의 부드러운 반주 위에서 두 대의 바이올린이 서로 선율을 주고받으며 노래하는데, 한 바이올린이 선율을 시작하면 다른 바이올린이 이를 이어받아 따라가며, 두 선율이 서로 얽히고 감싸 안으며 흘러갑니다. 마치 다정한 두 친구가 깊은 마음을 나누는 대화 같지요. 3악장은 다시 힘차고 활기찬 분위기로 돌아와 두 바이올린이 열정적으로 경쟁하듯 마무리됩니다. 소중한 친구와 함께 들어 보세요."], ["8-22", "베르가마스크 모음곡 중 「달빛」", "드뷔시", "독주", "기념일", "드뷔시 탄생일(1862.8.22). 다가오는 한가위 달", "1862년 8월 22일 파리 근교의 생제르맹앙레에서 태어난 드뷔시의 피아노곡입니다. 이 곡은 1890년 무렵 처음 쓰였다가 1905년에 고쳐 출판된 네 곡의 피아노 모음곡 「베르가마스크 모음곡」의 세 번째 곡입니다. '베르가마스크'는 이탈리아 베르가모 지방의 소박한 춤을 말하는데, 프랑스 시인 베를렌의 시 「달빛」에 '가면을 쓰고 베르가마스크 춤을 추는 사람들'이라는 구절이 나옵니다. 드뷔시는 이 시의 몽환적이고 아련한 분위기에서 영감을 받아 이 곡을 썼습니다. 곡은 아주 작고 고요한 소리로, 부드럽게 흔들리는 화음이 천천히 내려오며 시작합니다. 마치 구름 사이로 은은한 달빛이 살며시 비추는 듯하지요. 가운데 부분에서는 왼손이 물결처럼 흐르는 반주를 연주하는 가운데, 오른손이 꿈결 같은 선율을 노래하며 달빛이 호수 위에 반짝이는 모습을 그려 냅니다. 그리고 다시 처음의 고요한 선율로 돌아와, 달빛이 서서히 사라지듯 조용히 끝을 맺습니다. 영화와 광고에 수없이 쓰인, 드뷔시의 가장 사랑받는 곡입니다. 다가오는 한가위 보름달을 기다리며 들어 보세요."], ["8-23", "피아노 협주곡 2번 B♭장조 Op.83", "브람스", "협주곡", "가을", "늦여름, 가을을 예고하는 브람스", "브람스가 1878년과 1881년 사이에 쓴 두 번째 피아노 협주곡입니다. 첫 번째 협주곡을 쓴 지 무려 22년 만이었지요. 브람스는 1878년 처음으로 이탈리아를 여행하며 그곳의 아름다운 풍경과 예술에 깊이 감동했는데, 그 여행 직후 이 곡을 구상하기 시작했습니다. 일반적인 협주곡은 세 악장으로 이루어지지만, 이 곡은 교향곡처럼 네 악장으로 되어 있고 50분 가까이 이어지는 거대한 작품입니다. 그런데도 브람스는 친구에게 보낸 편지에서 이 곡을 두고 \"아주 작은 스케르초가 들어간 아주 작은 피아노 협주곡\"이라고 농담했습니다. 곡은 호른이 홀로 부드럽고 따뜻한 선율을 노래하고, 피아노가 이를 조용히 받으며 시작합니다. 마치 넓은 들판에 아침 해가 떠오르는 듯한 장엄한 시작이지요. 2악장은 격정적인 스케르초이고, 3악장은 첼로가 홀로 깊고 아름다운 선율을 노래하는 고요한 악장으로, 이 곡에서 가장 사랑받는 부분입니다. 4악장은 밝고 우아한 분위기로 마무리됩니다. 원숙한 브람스의 넉넉함이 담긴 곡으로, 늦여름에서 가을로 넘어가는 길목에 잘 어울립니다."], ["8-24", "치간느", "라벨", "독주", "일반", "집시풍 바이올린 랩소디", "라벨이 1924년에 쓴 바이올린곡입니다. '치간느'는 프랑스어로 '집시'라는 뜻입니다. 라벨은 런던에서 열린 한 음악회에서 헝가리 출신의 젊은 바이올리니스트 옐리 다라니를 만났는데, 연주회가 끝난 뒤 그녀에게 헝가리 집시 음악을 들려 달라고 부탁했습니다. 다라니는 그날 밤 늦게까지, 라벨의 계속되는 요청에 따라 수많은 집시 선율을 연주해 주었다고 합니다. 그 경험에서 영감을 받은 라벨은 다라니를 위해 이 곡을 썼고, 그해 런던에서 그녀의 연주로 초연되었습니다. 곡은 바이올린이 반주 없이 홀로 4분 가까이 연주하는 긴 독백으로 시작합니다. 낮은 음역에서 깊고 쓸쓸하게 울리는 선율은 마치 집시 악사가 홀로 자신의 슬픈 인생 이야기를 들려주는 듯하지요. 이어 피아노나 관현악이 하프 소리 같은 신비로운 반주로 등장하고, 곡은 점점 빨라지며 집시 음악 특유의 열정적이고 화려한 춤으로 바뀝니다. 바이올린이 할 수 있는 거의 모든 어려운 기교가 쉴 새 없이 쏟아지다가, 숨 막히는 절정에서 끝을 맺습니다. 프랑스 작곡가가 그린 집시의 영혼을 느껴 보세요."], ["8-25", "「웨스트 사이드 스토리」 심포닉 댄스", "번스타인", "관현악", "기념일", "번스타인 탄생일(1918.8.25)", "1918년 8월 25일 미국 매사추세츠에서 태어난 레너드 번스타인의 작품입니다. 번스타인은 뉴욕 필하모닉의 음악감독을 지낸 위대한 지휘자이자 작곡가였고, 어린이를 위한 「청소년 음악회」로 텔레비전을 통해 수많은 사람에게 클래식의 즐거움을 전한 교육자이기도 했습니다. 1957년 그는 셰익스피어의 「로미오와 줄리엣」을 뉴욕의 뒷골목으로 옮겨 온 뮤지컬 「웨스트 사이드 스토리」를 작곡했습니다. 뮤지컬은 서로 원수처럼 싸우는 두 거리 패거리 사이에서 피어난 토니와 마리아의 비극적인 사랑 이야기입니다. 번스타인은 1961년 이 뮤지컬의 음악 가운데 아홉 곡을 골라 관현악곡으로 엮었는데, 그것이 바로 「심포닉 댄스」입니다. 곡은 두 패거리가 서로 신경전을 벌이는 긴장감 넘치는 장면으로 시작해, 꿈결 같은 사랑의 노래, 강렬한 라틴 리듬의 「맘보」, 차가운 재즈풍의 「쿨」, 그리고 두 패거리의 비극적인 결투로 이어집니다. 「맘보」에서는 연주자들이 다 함께 \"맘보!\"라고 외치는 신나는 장면도 있습니다. 마지막에는 비극 속에서 화해를 염원하며 조용히 끝을 맺습니다. 그의 생일을 맞아 들어 보세요."], ["8-26", "폴로네즈 6번 「영웅」 Op.53", "쇼팽", "독주", "일반", "쇼팽 명곡", "쇼팽이 1842년, 연인 조르주 상드의 시골 별장 노앙에서 쓴 폴로네즈입니다. '폴로네즈'는 폴란드의 귀족들이 위엄 있게 행진하듯 추던 3박자의 춤곡으로, 폴란드 민족의 자부심과 위엄을 상징합니다. 쇼팽은 1830년 조국을 떠난 뒤 러시아에 맞선 폴란드의 봉기가 실패로 끝나는 것을 멀리서 지켜보아야 했고, 평생 돌아가지 못한 조국을 그리워했습니다. 그는 폴로네즈에 그 조국을 향한 사랑과 자부심을 담았는데, 「영웅」이라는 별명이 붙은 이 곡은 그 가운데서도 가장 당당하고 웅장한 곡입니다. 곡은 반음씩 올라가는 화음이 긴장감을 쌓아 올리는 서주로 시작해, 힘차고 위엄 있는 폴로네즈 주제가 웅장하게 울려 퍼집니다. 가운데 부분에서는 왼손이 쉴 새 없이 옥타브를 빠르게 연주하는데, 마치 기병대가 말을 달려 전진하는 말발굽 소리처럼 들립니다. 이 부분은 피아니스트에게 큰 체력과 기교를 요구하는 대목으로 유명하지요. 그리고 다시 처음의 당당한 주제로 돌아와, 승리의 환호처럼 장엄하게 끝을 맺습니다. 조국을 향한 쇼팽의 뜨거운 마음을 느껴 보세요."], ["8-27", "현악4중주 1번 중 「안단테 칸타빌레」", "차이콥스키", "실내악", "일반", "톨스토이를 울린 선율", "차이콥스키가 1871년에 쓴 첫 번째 현악 4중주곡의 2악장입니다. 차이콥스키는 우크라이나에 있는 누이의 집에 머물던 어느 여름날, 창밖에서 일하던 한 일꾼이 부르는 민요를 들었습니다. 그는 그 소박하고 애틋한 선율에 깊이 감동해 악보에 적어 두었고, 그 선율을 바탕으로 이 악장을 썼습니다. 악장은 약음기를 낀 네 대의 현악기가 그 민요 선율을 조용하고 부드럽게 노래하며 시작합니다. 단순하고 소박하지만, 들으면 들을수록 가슴 깊은 곳을 울리는 애수가 담겨 있습니다. 가운데 부분에서는 차이콥스키가 직접 만든 또 다른 아름다운 선율이 흐르는데, 첼로의 낮은 반주 위에서 바이올린이 서정적인 노래를 들려줍니다. 그리고 다시 처음의 민요 선율로 돌아와 고요하게 사라집니다. 1876년 모스크바에서 이 곡이 연주되었을 때, 러시아의 대문호 톨스토이가 차이콥스키의 옆자리에 앉아 이 악장을 듣다가 눈물을 흘렸습니다. 차이콥스키는 그 순간이 작곡가로서 가장 자랑스러운 순간이었다고 일기에 적었습니다. 이 악장은 지금도 현악 합주곡이나 첼로곡으로 편곡되어 사랑받고 있습니다. 문호를 울린 선율에 귀 기울여 보세요."], ["8-28", "2대의 바이올린을 위한 협주곡 a단조 RV 522", "비발디", "협주곡", "일반", "「조화의 영감」 중
